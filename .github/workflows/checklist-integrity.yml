name: Checklist Integrity

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checklist-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - run: npm test
      - name: Verify checklist modules compile
        run: |
          node --check src/services/checklistValidation.js
          node --check src/services/staffOperationsService.js
          node --check test/staffOperationsService.test.js
