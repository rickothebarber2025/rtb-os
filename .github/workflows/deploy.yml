name: Validate RTB OS

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build production site
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Verify Operations Cleaning template is bundled
        run: grep -R "Operations Cleaning" dist >/dev/null

      - name: Upload validated build artifact
        uses: actions/upload-artifact@v5
        with:
          name: rtb-os-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
