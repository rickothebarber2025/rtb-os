name: Validate RTB OS

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'services/textnow-github-worker/**'
      - '.github/workflows/textnow-sync.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build production site
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Verify Operations Cleaning template is bundled
        run: grep -R "Operations Cleaning" dist >/dev/null
