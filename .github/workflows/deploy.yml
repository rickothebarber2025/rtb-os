name: Deploy RTB OS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Write deployment version marker
        run: |
          mkdir -p public
          printf '{"commit":"%s","built_at":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/version.json

      - name: Build production site
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Verify role template is in production bundle
        run: grep -R "Operations Cleaning" dist >/dev/null

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtb-os-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  deploy-hostinger:
    runs-on: ubuntu-latest
    needs: build-and-package
    env:
      HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
      HOSTINGER_FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
      HOSTINGER_FTP_SERVER_DIR: ${{ secrets.HOSTINGER_FTP_SERVER_DIR }}
      HOSTINGER_FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}

    steps:
      - name: Require production deployment credentials
        run: |
          test -n "$HOSTINGER_FTP_SERVER" || { echo "HOSTINGER_FTP_SERVER is missing"; exit 1; }
          test -n "$HOSTINGER_FTP_USERNAME" || { echo "HOSTINGER_FTP_USERNAME is missing"; exit 1; }
          test -n "$HOSTINGER_FTP_PASSWORD" || { echo "HOSTINGER_FTP_PASSWORD is missing"; exit 1; }

      - name: Download production build artifact
        uses: actions/download-artifact@v4
        with:
          name: rtb-os-dist-${{ github.sha }}
          path: dist

      - name: Deploy production build to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          local-dir: dist/
          password: ${{ env.HOSTINGER_FTP_PASSWORD }}
          server: ${{ env.HOSTINGER_FTP_SERVER }}
          server-dir: ${{ env.HOSTINGER_FTP_SERVER_DIR || '/public_html/' }}
          username: ${{ env.HOSTINGER_FTP_USERNAME }}

      - name: Verify live deployment commit
        run: |
          for attempt in 1 2 3 4 5 6; do
            response="$(curl --fail --silent --show-error --max-time 20 "https://rtbheadquaters.com/version.json?attempt=$attempt" || true)"
            echo "$response"
            if echo "$response" | grep -q "$GITHUB_SHA"; then
              echo "Production is serving $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "Production did not publish commit $GITHUB_SHA"
          exit 1
