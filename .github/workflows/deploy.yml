name: Deploy RTB OS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-build
  cancel-in-progress: false

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtb-os-dist
          path: dist
          if-no-files-found: error

  deploy-hostinger:
    runs-on: ubuntu-latest
    needs: build-and-package
    env:
      HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
      HOSTINGER_FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
      HOSTINGER_FTP_SERVER_DIR: ${{ secrets.HOSTINGER_FTP_SERVER_DIR }}
      HOSTINGER_FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}

    steps:
      - name: Check Hostinger deployment credentials
        if: ${{ env.HOSTINGER_FTP_SERVER == '' || env.HOSTINGER_FTP_USERNAME == '' || env.HOSTINGER_FTP_PASSWORD == '' }}
        run: echo "Hostinger FTP secrets are not configured. Build artifact was created, but live deployment was skipped."

      - name: Download production build artifact
        if: ${{ env.HOSTINGER_FTP_SERVER != '' && env.HOSTINGER_FTP_USERNAME != '' && env.HOSTINGER_FTP_PASSWORD != '' }}
        uses: actions/download-artifact@v4
        with:
          name: rtb-os-dist
          path: dist

      - name: Deploy production build to Hostinger
        if: ${{ env.HOSTINGER_FTP_SERVER != '' && env.HOSTINGER_FTP_USERNAME != '' && env.HOSTINGER_FTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          local-dir: dist/
          password: ${{ env.HOSTINGER_FTP_PASSWORD }}
          server: ${{ env.HOSTINGER_FTP_SERVER }}
          server-dir: ${{ env.HOSTINGER_FTP_SERVER_DIR || '/public_html/' }}
          username: ${{ env.HOSTINGER_FTP_USERNAME }}
