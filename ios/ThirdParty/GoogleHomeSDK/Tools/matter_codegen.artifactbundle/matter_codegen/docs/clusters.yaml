OperationalState:
  description: "This trait supports remote monitoring and allows the operational state of
    any device to be changed provided that a state machine is part of the operation."

  # OperationalState attributes
  attributes:
  - name: countdownTime
    description: "The estimated time, in seconds, before the operation completes."
  - name: currentPhase
    description: "The current phase of operation being performed by the server."
  - name: operationalError
    description: "The details of any current error condition being experienced by the device when
      the [operationalState][OperationalStateTrait.Attributes.operationalState]
      attribute is Error."
  - name: operationalState
    description: "The current operational state of the device."
  - name: operationalStateList
    description: "The set of possible operational states that the device exposes."
  - name: phaseList
    description: "The set of phases that the device can go through for the selected function or
      mode. The list may not be in sequence order. These phases are manufacturer-specific and may
      change when a different function or mode is selected."

  # OperationalState commands
  commands:
  - name: Pause
    description:
    - "Pause the device if possible, based on the current operation underway."
    response:
      description: "The result of the completed `Pause` command."
      param:
      - name: commandResponseState
        description: "The return status of the `Pause` command."
  - name: Resume
    description:
    - "Resume operation if the device is in a state where it can be resumed."
    response:
      description: "The result of the completed `Resume` command."
      param:
      - name: commandResponseState
        description: "The return status of the `Resume` command."

  - name: Start
    description:
    - "Start the device if the device is in a state where it can be started."
    response:
      description: "The result of the completed `Start` command."
      param:
      - name: commandResponseState
        description: "The return status of the `Start` command."
  - name: Stop
    description:
    - "Stop the device if possible, based on the current operation underway."
    response:
      description: "The result of the completed `Stop` command."
      param:
      - name: commandResponseState
        description: "The return status of the `Stop` command."

  # OperationalState enums
  enums:
  - name: ErrorStateEnum
    description: "The error states."
    value:
    - name: kCommandInvalidInState
      description: "The device cannot process the command in its current state."
    - name: kNoError
      description: "The device is not in an error state."
    - name: kUnableToCompleteOperation
      description: "The device was unable to complete the current operation."
    - name: kUnableToStartOrResume
      description: "The device is unable to start or resume operation."
  - name: OperationalStateEnum
    description: "The operational states."
    value:
    - name: kError
      description: "The device is in an error state."
    - name: kPaused
      description: "The device has paused during an operation."
    - name: kRunning
      description: "The device is operating."
    - name: kStopped
      description: "The device is stopped."

  # OperationalState events
  events:
  - name: OperationCompletion
    description: "This event is generated when the overall operation ends, successfully or
      otherwise."
    value:
    - name: completionErrorCode
      description: "Provides an indication of the state at the end of the operation."
    - name: totalOperationalTime
      description: "The total operational time, in seconds, from when the operation was started
        until the operation completed, including any time spent while paused."
    - name: pausedTime
      description: "The total time spent in the paused state, in seconds."
  - name: OperationalError
    description: "This event is generated when a reportable error condition is detected."
    value:
    - name: errorState
      description: "Indicates the type of error, if any, that has occurred."

  # OperationalState structs
  structs:
  - name: ErrorStateStruct
    description: "Used to indicate the error state of the device when the
      [operationalState][OperationalStateTrait.Attributes.operationalState] attribute is
      Error."
    value:
    - name: errorStateDetails
      description: "Details about the error condition."
    - name: errorStateId
      description: "Present only when populated with a vendor-specific error ID."
    - name: errorStateLabel
      description: "Present only when `errorStateId` is populated with a vendor-specific error ID."
  - name: OperationalStateStruct
    description: "Used to indicate a possible state of the device."
    value:
    - name: operationalStateId
      description: "The operational state, which populates with a value from
        [OperationalStateEnum][OperationalStateTrait.OperationalStateEnum]."
    - name: operationalStateLabel
      description: "A human-readable description of the operational state. Only present when the
        `operationalStateId` is vendor-specific."

OtaSoftwareUpdateRequestor:
  description: "This trait provides an interface to a device that is capable of receiving an OTA
    software update."

  # OtaSoftwareUpdateRequestor attributes
  attributes:
  - name: defaultOtaProviders
    description: "A list of available OTA providers."
  - name: updatePossible
    description: "`true` indicates that the OTA requestor can be updated."
  - name: updateState
    description: "The current state of the OTA requestor with regard to obtaining software
      updates."
  - name: updateStateProgress
    description: "The progress of the update as a percentage."

  # OtaSoftwareUpdateRequestor commands
  commands:
  - name: AnnounceOtaProvider
    description:
    - "Announce the presence of a particular OTA provider."
    param:
    - name: announcementReason
      description: "The reason for the announcement."
    - name: endpoint
      description: "The endpoint ID of the node that implements the OTA Provider
        cluster."
    - name: metadataForNode
      description: "A top-level anonymous list, where each list element contains a profile-specific
        tag encoded in fully-qualified form, and a manufacturer-specific payload."
    - name: providerNodeId
      description: "The ID of a node implementing the OTA Provider cluster."
    - name: vendorId
      description: "The assigned Vendor ID of the node invoking this command."

  # OtaSoftwareUpdateRequestor enums
  enums:
  - name: AnnouncementReasonEnum
    description: "The reason for an announcement."
    value:
    - name: kSimpleAnnouncement
      description: "An OTA provider is announcing its presence."
    - name: kUpdateAvailable
      description: "An OTA provider is announcing that a new software image may be available that
        needs to be applied."
    - name: kUrgentUpdateAvailable
      description: "An OTA provider is announcing that a new software image may be available that
        needs to be applied urgently."
  - name: ChangeReasonEnum
    description: "The reason for an OTA change."
    value:
    - name: kUnknown
      description: "An unknown reason."
    - name: kSuccess
      description: "A prior operation succeeded."
    - name: kFailure
      description: "A prior operation failed."
    - name: kTimeOut
      description: "A timeout occurred."
    - name: kDelayByProvider
      description: "The OTA provider requests the client to wait."
  - name: UpdateStateEnum
    description: "The state of an OTA update."
    value:
    - name: kUnknown
      description: "The current state is unknown."
    - name: kIdle
      description: "The node is not yet in the process of software update."
    - name: kQuerying
      description: "The node is in the process of querying an OTA provider."
    - name: kDelayedOnQuery
      description: "The node is waiting after a Busy response."
    - name: kDownloading
      description: "The node is in the process of downloading a software update."
    - name: kApplying
      description: "The node is in the process of verifying and applying a software update."
    - name: kDelayedOnApply
      description: "The node is waiting due to an `AwaitNextAction` response."
    - name: kRollingBack
      description: "The node is recovering to a previous version."
    - name: kDelayedOnUserConsent
      description: "The node is waiting on user consent."

  # OtaSoftwareUpdateRequestor structs
  structs:
  - name: ProviderLocation
    description: "A fabric-scoped location of an OTA provider on a given fabric."
    value:
    - name: endpoint
      description: "The endpoint ID for the provider node that implements the OTA Provider
        cluster."
    - name: fabricIndex
      description: "The identifier for the fabric where the OTA provider is located."
    - name: providerNodeId
      description: "The node ID of the OTA provider to contact within the fabric identified by
        `fabricIndex`."

