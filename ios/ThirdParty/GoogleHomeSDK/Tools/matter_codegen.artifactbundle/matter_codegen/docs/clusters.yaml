  - name: FoodPreset
    description: "Internal name of the food preset. This name can be non-user-friendly, and is
      shared across all languages."
    value:
    - name: foodPresetName
      description: "Synonyms for the preset, which should include both singular and plural forms,
        if applicable."
    - name: supportedUnits
      description: "Contains all of the units supported by the device for a specific food."
    - name: foodSynonyms
      description: "Food name synonyms for the preset in each supported language."

ContentLauncher:
  description: "This trait provides an interface for launching content on a video player device such
    as a streaming media player, smart TV, or smart screen."

  # ContentLauncher attributes
  attributes:
  - name: acceptHeader
    description: "A list of content types supported by the video player or content app in the form
      of a list of one or more MIME types. For example, <code>&#34;application/dash+xml&#34;,
      &#34;application/vnd.apple.mpegurl&#34;</code>."
  - name: supportedStreamingProtocols
    description: "Information about supported streaming protocols. Valid values are defined in
      [SupportedProtocolsBitmap]."

  # ContentLauncher commands
  commands:
  - name: LaunchContent
    description:
    - "Launch the specified content."
    param:
    - name: autoPlay
      description: "Set to `true` to have the matching content play automatically."
    - name: data
      description: "Optional app-specific data."
    - name: playbackPreferences
      description: "The user's preferred Text/AudioTracks and playbackPosition."
    - name: search
      description: "The content to launch."
    - name: useCurrentContext
      description: "Whether to consider the context of current ongoing activity."
    response:
      description: "The outcome of the `LaunchContent` command."
      param:
      - name: data
        description: "Optional app-specific data."
      - name: status
        description: "The status of the `LaunchContent` command."
  - name: LaunchUrl
    description:
    - "Launch content from the specified URL."
    param:
    - name: brandingInformation
      description: "The branding information that is displayed when playing back the content."
    - name: contentUrl
      description: "The URL of the content to launch."
    - name: displayString
      description: "A string that describes the content being accessed at the given URL."
    response:
      description: "The outcome of the `LaunchUrl` command."
      param:
      - name: data
        description: "Optional app-specific data."
      - name: status
        description: "The status of the `LaunchUrl` command."

  # ContentLauncher bitmaps
  bitmaps:
  - name: Feature
    description: "ContentLauncher cluster FeatureMap."
    value:
    - name: kContentSearch
      description: "Device supports content search."
    - name: kUrlPlayback
      description: "Device supports basic URL-based file playback."
    - name: kAdvancedSeek
      description: "Enables clients to implement more advanced media seeking behavior."
    - name: kTextTracks
      description: "Device or app supports Text Tracks."
    - name: kAudioTracks
      description: "Device or app supports Audio Tracks."
  - name: SupportedProtocolsBitmap
    description: "Supported streaming protocols."
    value:
    - name: kDASH
      description: "Device supports Dynamic Adaptive Streaming over HTTP (DASH)."
    - name: kHLS
      description: "Device supports HTTP Live Streaming (HLS)."

  # ContentLauncher enums
  enums:
  - name: StatusEnum
    description: "Launch statuses."
    value:
    - name: kAuthFailed
      description: "Requested URL returned 401 error code."
    - name: kSuccess
      description: "The command succeeded."
    - name: kUrlNotAvailable
      description: "Requested URL could not be reached by device."
    - name: kTextTrackNotAvailable
      description: "Requested Text Track not available."
    - name: kAudioTrackNotAvailable
      description: "Requested Audio Track not available."
  - name: MetricTypeEnum
    description: "Indicates how a set of dimensions are defined."
    value:
    - name: kPercentage
      description: "Indicates that dimensions are defined in terms of a percentage of the overall
        display dimensions. For example, if using a Percentage Metric type for a Width measurement
        of 50.0 against a display width of 1920 pixels, the resulting width measurement would be 960
        pixels (50.0% of 1920)."
    - name: kPixels
      description: "Indicates that dimensions are defined in terms of pixels."
  - name: ParameterEnum
    description: "Content data elements that may be searched on."
    value:
    - name: kActor
      description: "An actor credited in video media content."
    - name: kChannel
      description: "The identifying data for a television channel, for example,
        'PBS'."
    - name: kCharacter
      description: "A character represented in video media content."
    - name: kDirector
      description: "A director of the video media content."
    - name: kEvent
      description: "An event is a reference to a type of event. Examples include sports,
        music, or other types of events. For example, searching for 'Football games' would search
        for a 'game' event entity and a 'football' sport entity."
    - name: kFranchise
      description: "A video entity which can represent a number of video entities,
        like movies or TV shows. For example, the fictional franchise 'Intergalactic Wars',
        which represents a collection of movie trilogies, as well as animated and live action TV
        shows. This entity can account for requests such as 'Find Intergalactic Wars movies', which
        would search for all 'Intergalactic Wars' programs of the `Movie` `MediaType`, rather than
        attempting to match to a single title."
    - name: kGenre
      description: "The genre of video media content such as action, drama or
        comedy."
    - name: kLeague
      description: "The categorical information for a sporting league."
    - name: kPopularity
      description: "Indicates whether the user is requesting popular content."
    - name: kProvider
      description: "The media provider that the user wants this media to be played on."
    - name: kSport
      description: "The categorical information of a sport, for example, football."
    - name: kSportsTeam
      description: "The categorical information of a professional sports team."
    - name: kType
      description: "The type of content requested. Supported types are `Movie`, `MovieSeries`,
        `TVSeries`, `TVSeason`, `TVEpisode`, `SportsEvent`, and `Video`."
    - name: kVideo
      description: "The identifying data for a specific piece of video content."
    - name: kSeason
      description: "The specific season number within a TV series."
    - name: kEpisode
      description: "A specific episode number within a Season in a TV series."
    - name: kAny
      description: "Represents a search text input across many parameter types."
  - name: CharacteristicEnum
    description: "Track characteristics."
    value:
    - name: kForcedSubtitles
      description: "Textual information meant for display when no other text representation is
        selected."
    - name: kDescribesVideo
      description: "Textual or audio media component containing a textual description (intended for
        audio synthesis) or an audio description describing a visual component."
    - name: kEasyToRead
      description: "Simplified or reduced captions as specified in
        United States Code Title 47 CFR 79.103(c)(9)."
    - name: kFrameBased
      description: "A media characteristic that indicates that a track selection option includes
        frame-based content."
    - name: kMainProgram
      description: "Main media component(s) which is/are intended for presentation if no other
        information is provided."
    - name: kOriginalContent
      description: "A media characteristic that indicates that a track or media selection option
        contains original content."
    - name: kVoiceOverTranslation
      description: "A media characteristic that indicates that a track or media selection option
        contains a language translation and verbal interpretation of spoken dialog."
    - name: kCaption
      description: "Textual media component containing transcriptions of spoken dialog and auditory
        cues such as sound effects and music for the hearing impaired."
    - name: kSubtitle
      description: "Textual transcriptions of spoken dialog."
    - name: kAlternate
      description: "Textual media component containing transcriptions of spoken dialog and auditory
        cues such as sound effects and music for the hearing impaired."
    - name: kSupplementary
      description: "Media content component that is supplementary to a media content component of
        a different media component type."
    - name: kCommentary
      description: "Experience that contains a commentary (e.g. director’s commentary) (typically
        audio)."
    - name: kDubbedTranslation
      description: "Experience that contains an element that is presented in a different language
        from the original (e.g. dubbed audio, translated captions)."
    - name: kDescription
      description: "Textual or audio media component containing a textual description (intended for
        audio synthesis) or an audio description describing a visual component."
    - name: kMetadata
      description: "Media component containing information intended to be processed by application
        specific elements."
    - name: kEnhancedAudioIntelligibility
      description: "Experience containing an element for improved intelligibility of the dialogue."
    - name: kEmergency
      description: "Experience that provides information, about a current emergency, that is
        intended to enable the protection of life, health, safety, and property, and may also
        include critical details regarding the emergency and how to respond to the emergency."
    - name: kKaraoke
      description: "Textual representation of a songs’ lyrics, usually in the same language as the
        associated song as specified in SMPTE ST 2067-2."

  # ContentLauncher structs
  structs:
  - name: AdditionalInfoStruct
    description: "Additional name-value pairs that can be used to identify content."
    value:
    - name: name
      description: "The name of the external ID."
    - name: value
      description: "The value of the external ID."
  - name: BrandingInformationStruct
    description: "Branding information that customizes the video player skin."
    value:
    - name: background
      description: "Background of the video player while it is processing a content launch request."
    - name: logo
      description: "The logo shown when the video player is launching, and when it is idle and
        the `splash` field isn't defined."
    - name: progressBar
      description: "The style of progress bar for media playback."
    - name: providerName
      description: "The name of the content provider."
    - name: splash
      description: "The screen shown when the video player is in an idle state."
    - name: waterMark
      description: "The watermark shown when the media is playing."
  - name: ContentSearchStruct
    description: "Inputs to a search for content for display or playback."
    value:
    - name: parameterList
      description: "A list of parameters comprising the search."
  - name: DimensionStruct
    description: "A set of dimensions for a background image."
    value:
    - name: height
      description: "The height, using the metric specified by the `metric` field."
    - name: metric
      description: "The unit of measurement used for defining the dimensions. If the metric is
        [MetricTypeEnum.Percentage][ContentLauncherTrait.MetricTypeEnum.Percentage], the
        dimensions are expressed in terms of a percentage of the overall display dimensions. For
        example, a percentage width measurement of 50.0 against a display width of 1920 pixels would
        mean that the width in pixels is 960, which is 50.0% of 1920."
    - name: width
      description: "The width, using the metric specified by the `metric` field."
  - name: ParameterStruct
    description: "Inputs to a search for content for display or playback."
    value:
    - name: externalIdList
      description: "The list of additional external content identifiers."
    - name: type
      description: "The entity type."
    - name: value
      description: "The entity value."
  - name: StyleInformationStruct
    description: "Style information which can be used to change the media player's visual style."
    value:
    - name: color
      description: "The color used for styling the video player."
    - name: imageUrl
      description: "The URL of the image used for styling the video player."
    - name: size
      description: "The size of the image used for styling various video player areas such as the
        logo, watermark, and so forth."
  - name: PlaybackPreferencesStruct
    description: "Preferences sent by the client to the receiver."
    value:
    - name: playbackPosition
      description: "The preferred position in the media to launch playback from."
    - name: textTrack
      description: "The user’s preferred Text Track."
    - name: audioTracks
      description: "The list of the user’s preferred Audio Tracks."
  - name: TrackPreferenceStruct
    description: "Defines Text/Audio Track preferences."
    value:
    - name: languageCode
      description: "Identifies the primary language used in the Track."
    - name: characteristics
      description: "Indicate a purpose, trait or feature associated with the Track."
    - name: audioOutputIndex
      description: "Indicates which audio output the Audio Track should be played on."

Descriptor:
  description: "This trait provides an interface for describing the device's capabilities and
    configuration."

  # Descriptor attributes
  attributes:
  - name: deviceTypeList
    description: "A list of device types and revisions to declare endpoint conformance."
  - name: serverList
    description: "A list of cluster IDs for the server clusters present on the endpoint."
  - name: clientList
    description: "A list of cluster IDs for the client clusters present on the endpoint."
  - name: partsList
    description: "The composition of the device type instance, including the endpoints in this
      list."
  - name: tagList
    description: "A list of tags used for disambiguating and providing information about endpoints."

  # Descriptor bitmaps
  bitmaps:
  - name: Feature
    description: "Descriptor cluster FeatureMap."
    value:
    - name: kTagList
      description: "Supports semantic tags used for providing information about endpoints."

  # Descriptor structs
  structs:
  - name: DeviceTypeStruct
    description: "An object describing endpoint conformance to a release of a device type
      definition."
    value:
    - name: deviceType
      description: "The device type definition."
    - name: revision
      description: "The implemented revision of the device type definition."
  - name: SemanticTagStruct
    description: "An object describing an endpoint label specific to a manufacturer."
    value:
    - name: mfgCode
      description: "The manufacturer ID."
    - name: namespaceId
      description: "The namespace ID defined by the manufacturer."
    - name: tag
      description: "The semantic tag ID located within the namespace."
    - name: label
      description: "The human-readable text suitable for display on a client."

DeviceEnergyManagement:
  description: "This trait provides an interface for managing the energy consumption of
    an energy smart appliance (ESA)."

  # DeviceEnergyManagement attributes
  attributes:
  - name: absMaxPower
    description: "The maximum electrical power, in milliwatts, that the ESA
      can consume when it's on. The following condition must be true:
      `AbsMaxPower` is greater than or equal to `AbsMinPower`. For a generator ESA that can
      discharge a battery to loads in the home, the `AbsMaxPower` is a positive number that
      represents the maximum power at which the ESA can discharge its
      internal battery. For example, for a battery storage inverter that can discharge the
      battery at a maximum power of 3000000mW, the `AbsMaxPower` is 3000000."
  - name: absMinPower
    description: "The minimum electrical power, in milliwatts, that the ESA
      can consume when it's on. This does not include when the ESA is in power save
      or standby mode. For a generator ESA that can charge an internal battery, the `AbsMinPower`
      is a negative number that represents the maximum power to which the ESA can charge its
      internal battery. For example, for a battery storage inverter that can charge its battery
      at a maximum power of 2000000mW, the `AbsMinPower` is -2000000."
  - name: ESACanGenerate
    description: "Indicates whether the ESA is classified as a generator or a load. This allows an
      energy management system (EMS) to determine whether any power values reported by the ESA
      need to have their signs (for positive or negative values) inverted
      to make proper forecasts and adjustments.
      For example, a home battery storage system that charges its battery and then
      discharges to the home loads is classified as a generator, and the value of the
      `ESACanGenerate` attribute is `true`. The ESA power value is a positive
      numerical value when indicating that it is discharging to the loads in the home,
      and a negative numerical value when indicating it is charging its internal battery."
  - name: ESAState
    description: "The current state of the ESA. If the ESA is in the `Offline` or `Fault` state,
      it cannot be controlled by an EMS and may not be able to report its forecast information."
  - name: ESAType
    description: "The type of the ESA, which enables an EMS to determine how the ESA
      consumes, generates, and stores the energy."
  - name: forecast
    description: "Allows an ESA to share its intended forecast with a client,
      such as an EMS. A null value indicates that there is no
      forecast currently available."
  - name: optOutState
    description: "Indicates whether the ESA has opted out of energy management.
      If the ESA has opted out, it will not be controlled by an EMS. The ESA
      can opt out of energy management by setting this attribute
      to `true`."
  - name: powerAdjustmentCapability
    description: "Indicates how the ESA can be adjusted at the current time. For example,
      a battery storage inverter may need to regulate its internal temperature or the charging
      rate of the battery may be limited due to cold temperatures. An empty list
      indicates that no power adjustment is currently available, and multiple entries
      indicate that various permutations of scenarios may be possible. Refer also to
      [PowerAdjustStruct][DeviceEnergyManagementTrait.PowerAdjustStruct]
      for available charging and discharging power adjustments."

  # DeviceEnergyManagement bitmaps
  bitmaps:
  - name: Feature
    description: "DeviceEnergyManagement trait FeatureMap."
    value:
    - name: kConstraintBasedAdjustment
      description: "Allows an EMS to request constraints to an ESA's planned operation."
    - name: kForecastAdjustment
      description: "Allows an EMS to adjust an ESA's planned operation."
    - name: kPausable
      description: "Allows an EMS to pause an ESA's planned operation."
    - name: kPowerAdjustment
      description: "Allows an EMS to make a temporary power adjustment within the limits
        offered by the ESA."
    - name: kPowerForecastReporting
      description: "Allows an ESA to advertise its indicative future power consumption vs time."
    - name: kStartTimeAdjustment
      description: "Allows an EMS to delay an ESA's planned operation."
    - name: kStateForecastReporting
      description: "Allows an ESA to advertise its indicative future state vs time."

  # DeviceEnergyManagement commands
  commands:
  - name: CancelPowerAdjustRequest
    description:
    - "Allows a client, such as an EMS, to cancel an ongoing power adjustment request.
       The ESA should return to its normal power consumption state after the request is canceled."
  - name: CancelRequest
    description:
    - "Allows an EMS to request cancellation of a previous adjustment request made in
       a `StartTimeAdjustRequest`, `ModifyForecastRequest`, or `RequestConstraintBasedForecast`
      command."
  - name: ModifyForecastRequest
    description:
    - "Allows an EMS to modify a forecast within the limits allowed by the ESA."
    param:
    - name: forecastId
      description: "The ID of the forecast to modify."
    - name: slotAdjustments
      description: "A list of `slotAdjustment` parameters that should be modified in
        the corresponding forecast."
    - name: cause
      description: "The cause of the request from the EMS."
  - name: PauseRequest
    description:
    - "Allows a client to temporarily pause an operation and reduce the energy demand on the ESA."
    param:
    - name: duration
      description: "The duration, in seconds, for which the ESA should pause its operation."
    - name: cause
      description: "The cause of the request from the EMS."
  - name: PowerAdjustRequest
    description:
    - "Allows a client, such as an EMS, to request an adjustment in the power consumption of
       an ESA for a specified duration."
    param:
    - name: power
      description: "The power, in milliwatts, that the ESA can use during the adjustment period.
        This value must be within the range of `MinPower` and `MaxPower` in the
        [PowerAdjustStruct][DeviceEnergyManagementTrait.PowerAdjustStruct]."
    - name: duration
      description: "The duration, in seconds, for which the ESA can adjust its power consumption.
        This value must be within the range of `MinDuration` and `MaxDuration` in the
        [PowerAdjustStruct][DeviceEnergyManagementTrait.PowerAdjustStruct]."
    - name: cause
      description: "The cause of the request from the EMS."
  - name: ResumeRequest
    description:
    - "Allows a client to cancel the `PauseRequest` command and enable the
      resumption of the previous operation."
  - name: RequestConstraintBasedForecast
    description:
    - "Allows an EMS to request the ESA to recompute its forecast based on power and
       time constraints."
    param:
    - name: constraints
      description: "A series of turn-up or turn-down power constraints
        that the EMS is asking the ESA to adhere to in its forecast. For example, if a grid event
        requires devices to reduce power (turn down) between 4 p.m. and
        6 p.m., and there is excess power on the grid overnight, this may cause an EMS to request
        that an ESA increase its power demand (turn up) between midnight and 6 a.m."
    - name: cause
      description: "The cause of the request from the EMS."
  - name: StartTimeAdjustRequest
    description:
    - "Allows a client to adjust the start time of a forecast sequence that has not yet
       started operation."
    param:
    - name: requestedStartTime
      description: "The start time, in UTC, that the EMS requests the
        ESA to change its forecast sequence to. This value must be in the future."
    - name: cause
      description: "The cause of the request from the EMS."

  # DeviceEnergyManagement enums
  enums:
  - name: AdjustmentCauseEnum
    description: "The cause of the adjustment request from the EMS."
    value:
    - name: kGridOptimization
      description: "The adjustment is to optimize the grid energy usage."
    - name: kLocalOptimization
      description: "The adjustment is to optimize the local energy usage."
  - name: CauseEnum
    description: "The cause of the request from the EMS."
    value:
    - name: kCancelled
      description: "The adjustment was cancelled by the EMS."
    - name: kFault
      description: "The ESA has developed a fault and could not complete the adjustment."
    - name: kNormalCompletion
      description: "The ESA completed the power adjustment as requested."
    - name: kOffline
      description: "The ESA was set to `offline`."
    - name: kUserOptOut
      description: "The user has disabled the ESA's flexibility capability."
  - name: CostTypeEnum
    description: "The different types of costs."
    value:
    - name: kComfort
      description: "Consumer comfort-impact cost."
    - name: kFinancial
      description: "Financial cost."
    - name: kGHGEmissions
      description: "Grid CO2e grams cost."
    - name: kTemperature
      description: "Temperature-impact cost."
  - name: ESAStateEnum
    description: "The state of the ESA."
    value:
    - name: kOffline
      description: "The ESA is not available."
    - name: kOnline
      description: "The ESA is working normally and can be controlled by the EMS."
    - name: kFault
      description: "The ESA is in a fault state and cannot provide service."
    - name: kPowerAdjustActive
      description: "The ESA is actively adjusting its power consumption."
    - name: kPaused
      description: "The ESA is currently paused as the result of
        a client running the `PauseRequest` command."
  - name: ESATypeEnum
    description: "The type of the ESA."
    value:
    - name: kBatteryStorage
      description: "Battery electric storage system."
    - name: kCooking
      description: "Cooking appliance."
    - name: kDishwasher
      description: "Dishwasher"
    - name: kEVSE
      description: "EV supply equipment."
    - name: kFridgeFreezer
      description: "Refrigerator or freezer."
    - name: kHomeWaterPump
      description: "Home water pump."
    - name: kIrrigationWaterPump
      description: "Irrigation water pump."
    - name: kOther
      description: "Other appliance type."
    - name: kPoolPump
      description: "Pool pump."
    - name: kSolarPV
      description: "Solar PV inverter."
    - name: kSpaceCooling
      description: "Space cooling appliance"
    - name: kSpaceHeating
      description: "Space heating appliance."
    - name: kSpaceHeatingCooling
      description: "Space heating and cooling appliance."
    - name: kWashingMachine
      description: "Washing machine."
    - name: kWaterHeating
      description: "Water heating appliance."
  - name: ForecastUpdateReasonEnum
    description: "The reason for updating the forecast."
    value:
    - name: kGridOptimization
      description: "The update was due to grid optimization."
    - name: kInternalOptimization
      description: "The update was due to internal ESA device optimization."
    - name: kLocalOptimization
      description: "The update was due to local `EMSoptimization`."
  - name: OptOutStateEnum
    description: "The opt-out state of the ESA."
    value:
    - name: kGridOptOut
      description: "The user has opted out of grid EMS optimizations only."
    - name: kLocalOptOut
      description: "The user has opted out of local EMS optimizations only."
    - name: kNoOptOut
      description: "The user has not opted out of either local or grid optimizations."
    - name: kOptOut
      description: "The user has opted out of all external optimizations."
  - name: PowerAdjustReasonEnum
    description: "The reason for the power adjustment."
    value:
    - name: kNoAdjustment
      description: "There is no Power Adjustment active."
    - name: kLocalOptimizationAdjustment
      description: "There is a Power Adjustment active due to local EMS optimization."
    - name: kGridOptimizationAdjustment
      description: "There is a Power Adjustment active due to grid optimization."

  # DeviceEnergyManagement events
  events:
  - name: Paused
    description: "Indicates that the ESA has paused its operation."
  - name: Resumed
    description: "Indicates that the ESA has resumed its operation."
    value:
    - name: cause
      description: "The reason that the pause ended."
  - name: PowerAdjustStart
    description: "Indicates that the ESA has started the power adjustment session."
  - name: PowerAdjustEnd
    description: "Indicates that the ESA has ended the power adjustment session."
    value:
    - name: cause
      description: "The cause of the end of the power adjustment session."
    - name: duration
      description: "The duration, in seconds, of the power adjustment session."
    - name: energyUse
      description: "The amount of energy, in megawatt hours, that the ESA used during the power
        adjustment session."

  # DeviceEnergyManagement structs
  structs:
  - name: ConstraintsStruct
    description: "Allows a client such as an EMS to inform an ESA about a constraint period."
    value:
    - name: duration
      description: "The duration, in seconds, of the constraint period."
    - name: loadControl
      description: "Indicates the turn-up or turn-down value
        for the ESA during the constraint period. This is expressed as a signed value between
        -100 and +100. A negative
        value indicates a request to use less energy, and a positive value indicates a request
        to use more energy. A value of 0 is neutral."
    - name: maximumEnergy
      description: "The maximum amount of energy, in megawatt hours, that the ESA can use during
        the constraint period. This is a signed value and can be used to indicate charging
        or discharging."
    - name: nominalPower
      description: "The nominal power, in milliwatts, at which the EMS requests the ESA to operate
        during the constrained period."
    - name: startTime
      description: "The start time, in UTC, of the constraint period."
  - name: CostStruct
    description: "Indicates a generic mechanism for expressing the cost to run an appliance."
    value:
    - name: costType
      description: "The type of cost being represented."
    - name: currency
      description: "Indicates the currency for the value in the [Value] field.
        The value of the `currency` field must match the values defined by ISO 4217."
    - name: decimalPoints
      description: "The number of digits to the right of the decimal point in the [Value] field.
        For example, if the value is `102` and `DecimalPoints`is `2`,
        this would represent a cost of `1.02`."
    - name: value
      description: "The value of the cost. A positive number indicates a cost, and a negative
        number indicates a free benefit."
  - name: ForecastStruct
    description: "Indicates a list of `slots` to describe the overall timing of the ESA's planned
      energy and power usage, with different power and energy demands for each slot.
      For example, slots might be used to describe the distinct stages of a washing machine cycle."
    value:
    - name: activeSlotNumber
      description: "Indicates which element of the `Slots` list is currently active in the forecast
        sequence. A null value indicates that the sequence has not yet started."
    - name: earliestStartTime
      description: "The earliest time, in UTC, that the ESA can start the forecast sequence."
    - name: endTime
      description: "The planned end time, in UTC, for the entire forecast."
    - name: forecastId
      description: "The sequence number for the current forecast. If the ESA updates a forecast,
        it shall monotonically increase this value. The value is allowed to wrap."
    - name: forecastUpdateReason
      description: "The reason for updating the forecast."
    - name: isPausable
      description: "Indicates that some part of the forecast can be paused."
    - name: latestEndTime
      description: "The latest end time, in UTC, for the entire forecast."
    - name: slots
      description: "A list of `SlotStructs` where the list must contain at least one entry but
        no more than 10."
    - name: startTime
      description: "The planned start time, in UTC, for the entire forecast."
  - name: PowerAdjustStruct
    description: "The amount and duration of a power adjustment."
    value:
    - name: maxDuration
      description: "The maximum duration, in seconds, that a controller can invoke an ESA
        adjustment."
    - name: maxPower
      description: "The maximum power, in milliwatts, that the ESA can have its
        power adjusted to. A negative value indicates that the power
        flows away from loads, as in charging a battery inverter."
    - name: minDuration
      description: "The minimum duration, in seconds, that a controller can invoke an ESA
        adjustment."
    - name: minPower
      description: "The minimum power, in milliwatts, to which the ESA can have its
        power adjusted. A negative value indicates that the power
        flows away from loads, as in charging a battery inverter."
  - name: SlotAdjustmentStruct
    description: "Indicates requested power and duration adjustments for a specific slot."
    value:
    - name: duration
      description: "The new amount of time, in seconds, to which the ESA is extending or
        shortening its duration."
    - name: nominalPower
      description: "The power, in milliwatts, at which the ESA is being requested
        to operate."
    - name: slotIndex
      description: "The index into the
        [slots list][DeviceEnergyManagementTrait.ForecastStruct.slots] within the forecast
        to be modified."
  - name: SlotStruct
    description: "Indicates a specific stage of an ESA's operation."
    value:
    - name: costs
      description: "The current estimated cost of operating the appliance."
    - name: elapsedSlotTime
      description: "The time, in seconds, that has already elapsed
        with the appliance in its slot."
    - name: defaultDuration
      description: "The time, in seconds, that the appliance is expected to be in its slot."
    - name: manufacturerESAState
      description: "Provides a manufacturer-defined value that indicates the state of the ESA."
    - name: maxDuration
      description: "The maximum time, in seconds, that the appliance is expected to be in its slot."
    - name: maxDurationAdjustment
      description: "The maximum duration, in seconds, to which the slot's usage can be extended."
    - name: maxPower
      description: "The highest power, in milliwatts, that the appliance is expected to use in its
        current slot. Some appliances, such as battery inverters that can charge and discharge,
        might have a negative value for this field."
    - name: maxPowerAdjustment
      description: "The maximum power adjustment, in milliwatts, that the ESA can be requested
          to use."
    - name: minDuration
      description: "The minimum time, in seconds, that the appliance is expected to be in its slot."
    - name: minDurationAdjustment
      description: "The minimum time, in seconds, to which the slot's usage can be shortened."
    - name: minPower
      description: "The lowest power, in milliwatts, that the appliance is expected to use in its
        current slot. Some appliances, such as battery inverters that can charge and discharge,
        might have a negative value for this field."
    - name: minPowerAdjustment
      description: "The minimum power adjustment, in milliwatts, that the ESA can be requested
        to use."
    - name: maxPauseDuration
      description: "The maximum amount of time, in seconds, that the slot can be paused."
    - name: minPauseDuration
      description: "The shortest amount of time, in seconds, that the slot can be paused."
    - name: nominalPower
      description: "The expected power that the appliance will use in its current slot."
    - name: nominalEnergy
      description: "The amount of energy that the appliance is expected to use or produce in its
        current slot."
    - name: remainingSlotTime
      description: "The remaining time, in seconds, that the appliance is expected
        to be in its slot."
    - name: slotIsPausable
      description: "Indicates whether this slot can be paused."

  - name: PowerAdjustCapabilityStruct
    description: "Represents the power adjustment capability of the ESA."
    value:
    - name: powerAdjustCapability
      description: "Indicates how the ESA can be adjusted at the current time."
    - name: cause
      description: "The cause of the adjustment capability."

DeviceEnergyManagementMode:
  description: "Defines additional mode tags and namespaced enumerated values for device energy
    management devices."

  # DeviceEnergyManagementMode attributes
  attributes:
  - name: supportedModes
    description: "The modes supported by the device energy management device."
  - name: currentMode
    description: "The current mode of the device energy management device."
  - name: startUpMode
    description: "The desired startup mode for the device energy management device when it is
      supplied with power."
  - name: onMode
    description: "The value of the [currentMode] that depends on the state of an [OnOff] cluster on
      the same device energy management endpoint."

  # DeviceEnergyManagementMode bitmaps
  bitmaps:
  - name: Feature
    description: "DeviceEnergyManagementMode cluster FeatureMap."
    value:
    - name: kOnOff
      description: "The device energy management device can be turned on and off. There is a
        dependency on the [OnOff] cluster."

  # DeviceEnergyManagementMode commands
  commands:
  - name: ChangeToMode
    description:
    - "Change device modes."
    param:
    - name: newMode
      description: "The mode to change to. This must be one of the
        [supportedModes][DeviceEnergyManagementModeTrait.Attributes.supportedModes]."
    response:
      description: "The result of the completed `ChangeToMode` command."
      param:
      - name: status
        description: "The status of the `ChangeToMode` command. Valid values are defined by the
          device manufacturer."
      - name: statusText
        description: "Text describing the status of the `ChangeToMode` command."

  # DeviceEnergyManagementMode enums
  enums:
  - name: ModeTag
    description: "Descriptive names of device energy management modes."
    value:
    - name: kAuto
      description: "Decides which options, features, and setting values to use."
    - name: kQuick
      description: "Optimizes for faster completion."
    - name: kQuiet
      description: "Operates silently or barely audibly."
    - name: kLowNoise
      description: "Optimizes for low noise operation."
    - name: kLowEnergy
      description: "Optimizes for lower energy usage."
    - name: kVacation
      description: "Provides a mode suitable for use during vacations or other extended absences."
    - name: kMin
      description: "Uses the lowest available setting value."
    - name: kMax
      description: "Uses the highest available setting value."
    - name: kNight
      description: "Provides a mode suitable for use during night time."
    - name: kDay
      description: "Provides a mode suitable for use during day time."
    - name: kNoOptimization
      description: "No optimization mode."
    - name: kDeviceOptimization
      description: "Device optimization mode."
    - name: kLocalOptimization
      description: "Local optimization mode."
    - name: kGridOptimization
      description: "Grid optimization mode."

  # DeviceEnergyManagementMode structs
  structs:
  - name: ModeTagStruct
    description: "Describes a mode tag. The same manufacturer code and mode tag value in separate
      cluster instances are part of the same namespace and have the same meaning."
    value:
    - name: mfgCode
      description: "The manufacturer's vendor ID."
    - name: value
      description: "The mode tag within a mode tag namespace. If the `mfgCode` field exists, this
        is set to a manufacturer-defined value, otherwise, it's set to a standard value."
  - name: ModeOptionStruct
    description: "Represents the possible mode of the `DeviceEnergyManagement` instance."
    value:
    - name: label
      description: "Readable text that describes the mode option for the user."
    - name: mode
      description: "Identifies the mode option for the
          [supportedModes][DeviceEnergyManagementModeTrait.Attributes.supportedModes] attribute."
    - name: modeTags
      description: "A list of tags that are associated with the mode option, which may be used by a
        device to determine the semantics of a certain mode."

DishwasherAlarm:
  description: "This trait provides an interface for dishwasher alarms."

  # DishwasherAlarm attributes
  attributes:
  - name: mask
    description: "A bitmap indicating an enabled alarm. Valid values are defined in
      [AlarmBitmap]."
  - name: latch
    description: "Indicates which alarms remain active until explicitly reset."
  - name: state
    description: "The alarm's current status."
  - name: supported
    description: "The available alarms."

  # DishwasherAlarm bitmaps
  bitmaps:
  - name: Feature
    description: "DishwasherAlarm cluster FeatureMap."
    value:
    - name: kReset
      description: "Dishwasher alarm supports reset."
  - name: AlarmBitmap
    description: "Bitmap indicating which alarms are supported."
    value:
    - name: kInflowError
      description: "Water inflow is abnormal."
    - name: kDrainError
      description: "Water draining is abnormal."
    - name: kDoorError
      description: "Door or door lock is abnormal."
    - name: kTempTooLow
      description: "Temperature is too low."
    - name: kTempTooHigh
      description: "Temperature is too high."
    - name: kWaterLevelError
      description: "Water level is abnormal."

  # DishwasherAlarm commands
  commands:
  - name: Reset
    description:
    - "The details of a request to reset active and, if possible, latched alarms."
    param:
    - name: alarms
      description: "A bitmap indicating an alarm that will be reset unless manual intervention is
        required. Valid values are defined in [AlarmBitmap][DishwasherAlarmTrait.AlarmBitmap]."
  - name: ModifyEnabledAlarms
    description:
    - "The details of a request to modify an enabled alarm."
    param:
    - name: mask
      description: "A bitmap indicating an alarm that should be enabled or suppressed. Valid values
        are defined in [AlarmBitmap][DishwasherAlarmTrait.AlarmBitmap]."

  # DishwasherAlarm events
  events:
  - name: Notify
    description: "Generated when one or more alarms change state."
    value:
    - name: active
      description: "Alarms that have become active. Valid values are defined in [AlarmBitmap]."
    - name: inactive
      description: "Alarms that have become inactive. Valid values are defined in [AlarmBitmap]."
    - name: state
      description: "A copy of [state][DishwasherAlarmTrait.Attributes.state] when this event was
        generated."
    - name: mask
      description: "A copy of [mask][DishwasherAlarmTrait.Attributes.mask] when this event was
        generated."

DishwasherMode:
  description: "This trait provides an interface for dishwasher devices."

  # DishwasherMode attributes
  attributes:
  - name: supportedModes
    description: "The list of supported modes for the dishwasher."
  - name: currentMode
    description: "The current mode of the dishwasher. This must be one of the values in
      [supportedModes]."
  - name: startupMode
    description: "The desired startup mode for the dishwasher when it is supplied with power."
  - name: onMode
    description: "The value of the [currentMode] that depends on the state of an [OnOff] cluster on
      the same endpoint."

  # DishwasherMode bitmaps
  bitmaps:
  - name: Feature
    description: "DishwasherMode cluster FeatureMap."
    value:
    - name: kOnOff
      description: "Dishwasher supports on and off."

  # DishwasherMode commands
  commands:
  - name: ChangeToMode
    description:
    - "Change dishwasher mode."
    param:
    - name: newMode
      description: "The mode to switch to."
    response:
      description: "The response of the `ChangeToMode` command."
      param:
      - name: status
        description: "The status of the `ChangeToMode` command."
      - name: statusText
        description: "Additional, human-readable information about the results of the `ChangeToMode`
          command."

  # DishwasherMode enums
  enums:
  - name: ModeTag
    description: "The mode of operation."
    value:
    - name: kAuto
      description: "Decides which options, features, and setting values to use."
    - name: kQuick
      description: "Optimizes for faster completion."
    - name: kQuiet
      description: "Operates silently or barely audibly."
    - name: kLowNoise
      description: "Optimizes for low noise operation."
    - name: kLowEnergy
      description: "Optimizes for lower energy usage."
    - name: kVacation
      description: "Provides a mode suitable for use during vacations or other extended absences."
    - name: kMin
      description: "Uses the lowest available setting value."
    - name: kMax
      description: "Uses the highest available setting value."
    - name: kNight
      description: "Provides a mode suitable for use during night time."
    - name: kDay
      description: "Provides a mode suitable for use during day time."
    - name: kNormal
      description: "The normal range of operation."
    - name: kHeavy
      description: "Optimized for heavily-soiled dishes."
    - name: kLight
      description: "Optimized for light washing."

  # DishwasherMode structs
  structs:
  - name: ModeTagStruct
    description: "Describes a mode tag. The same manufacturer code and mode tag value in
        separate cluster instances are part of the same namespace and have the same meaning. For
        example, a manufacturer tag meaning \"pinch\" can be used both in a cluster whose purpose is
        to choose the amount of sugar, or in a cluster whose purpose is to choose the amount of
        salt."
    value:
    - name: mfgCode
      description: "The manufacturer's vendor ID."
    - name: value
      description: "The mode tag within a mode tag namespace. If the `mfgCode` field exists, this is
        set to a manufacturer-defined value, otherwise, it's set to a standard value."
  - name: ModeOptionStruct
    description: "Describes a mode that may be selected on the device."
    value:
    - name: label
      description: "Text that describes the `mode` option and is meant to be read and understood by
        the user."
    - name: mode
      description: "A unique identifier for the `mode` option."
    - name: modeTags
      description: "A list of tags that are associated with the `mode` option, which may be used by
        a device to determine the semantics of a certain mode."

Dispense:
  description: "This trait supports devices dispensing a specified amount of one or more physical
    items."

  # Dispense attributes
  attributes:
  - name: supportedDispenseItems
    description: "Contains information on all the items that the device can dispense."
  - name: supportedDispensePresets
    description: "Presets supported by the device."
  - name: dispenseItems
    description: "States of the items that the device can dispense. Valid values are defined in
      [supportedDispenseItems]."

  # Dispense commands
  commands:
  - name: Dispense
    description:
    - "Start or stop dispensing."
    param:
    - name: item
      description: "Name of the item to dispense."
    - name: amount
      description: "Amount to dispense."
    - name: unit
      description: "Unit for the amount."
    - name: presetName
      description: "Name of the preset to dispense."

  # Dispense enums
  enums:
  - name: Unit
    description: "The available units."
    value:
    - name: kUnspecified
      description: "Unspecified."
    - name: kCentimeters
      description: "Centimeters."
    - name: kCups
      description: "Cups."
    - name: kDeciliters
      description: "Deciliters."
    - name: kFluid_ounces
      description: "Fluid ounces."
    - name: kGallons
      description: "Gallons."
    - name: kGrams
      description: "Grams."
    - name: kKilograms
      description: "Kilograms."
    - name: kLiters
      description: "Liters."
    - name: kMilligrams
      description: "Milligrams."
    - name: kMilliliters
      description: "Milliliters."
    - name: kMillimeters
      description: "Millimeters."
    - name: kNo_units
      description: "No units."
    - name: kOunces
      description: "Ounces."
    - name: kPinch
      description: "Pinch."
    - name: kPints
      description: "Pints."
    - name: kPortion
      description: "Portion."
    - name: kPounds
      description: "Pounds."
    - name: kQuarts
      description: "Quarts."
    - name: kTablespoons
      description: "Tablespoons."
    - name: kTeaspoons
      description: "Teaspoons."

  # Dispense structs
  structs:
  - name: ItemNameSynonym
    description: "Synonym names for the dispensed item in a given language."
    value:
    - name: synonyms
      description: "Synonyms for the dispensed item, which should include both singular and plural
        forms if applicable."
    - name: lang
      description: "ISO 639-1 language code, for example, `en` for English."
  - name: Portion
    description: "The available portions for the dispensed item."
    value:
    - name: amount
      description: "The dispensed amount."
    - name: unit
      description: "The dispensed unit."
  - name: DispensableItem
    description: "The available dispensible items."
    value:
    - name: itemName
      description: "Internal name for the dispensed item. This can be non-user-friendly, and is
        shared across all languages."
    - name: itemNameSynonyms
      description: "Synonym names for the dispensed item in each supported language."
    - name: supportedUnits
      description: "Set of units the device supports for that item."
    - name: defaultPortion
      description: "Typical amount of the item that may be dispensed."
  - name: PresetNameSynonym
    description: "Synonym names for the preset in a given language."
    value:
    - name: synonyms
      description: "Synonym names for the preset. The synonyms should include both singular and
        plural forms, if applicable."
    - name: lang
      description: "ISO 639-1 language code, for example, `en` for English."
  - name: Preset
    description: "The supported dispensible item presets."
    value:
    - name: presetName
      description: "Internal name for the preset. This can be non-user-friendly, and is
        shared across all languages."
    - name: presetNameSynonyms
      description: "Synonym names for the preset in each supported language."
  - name: Amount
    description: "The available dispensible item amounts."
    value:
    - name: amount
      description: "Amount of specified unit."
    - name: unit
      description: "Unit for the amount. Valid values are defined in [Unit][DispenseTrait.Unit]."
  - name: DispenseItem
    description: "The state of a given disensible item."
    value:
    - name: itemName
      description: "Name of the item."
    - name: amountRemaining
      description: "Amount of that item remaining in the device. If the device is currently
        dispensing, this reports the remaining amount or what the amount will be once the device
        finishes dispensing."
    - name: amountLastDispensed
      description: "Amount of that item that the device most recently dispensed. If the device is
        currently dispensing, this should report the amount it dispensed prior to the current
        dispensing amount."
    - name: isCurrentlyDispensing
      description: "Indicates if the device is currently dispensing this item."

Dock:
  description: "This trait is designed for self-mobile devices, such as robotic vacuum cleaners,
    that can be commanded to return for charging."

  # Dock attributes
  attributes:
  - name: isDocked
    description: "Indicates if the device is connected to the docking station."

  # Dock commands
  commands:
  - name: Dock
    description:
    - "Docks the device."

DoorbellPress:
  description: "This trait represents the press of a doorbell."

  # DoorbellPress events
  events:
  - name: DoorbellPressed
    description: "Data about the pressing of a doorbell."
    value:
    - name: priority
      description: "The priority of the `DoorbellPressed` event."
    - name: doorbellPressTimeSeconds
      description: "The length of time the doorbell was pressed."
    - name: complementaryToneId
      description: "The identifier for the selected ringtone."

DoorLock:
  description: "This trait provides an interface to a generic way to secure a door."

  # DoorLock Attributes
  attributes:
  - name: LedSettings
    description: "The settings for the LED support three different modes.
    <ul><li><code>0</code> - Never use LED for signalling events.</li>
    <li><code>1</code> - Use LED to signal all but access-allowed events.</li>
    <li><code>2</code> - Use LED to signal all events.</li>
    </ul>"
  - name: actuatorEnabled
    description: "Indicates whether the lock is able to process remote Lock, Unlock, or Unlock with
      Timeout commands."
  - name: autoRelockTime
    description: "The number of seconds to wait after unlocking a lock before it automatically locks
      again. `0` = disabled."
  - name: credentialRulesSupport
    description: "Bitmap which indicates which credential rules are supported by the door lock.
      Valid values are defined by [DlCredentialRuleMask][DoorLockTrait.DlCredentialRuleMask]."
  - name: defaultConfigurationRegister
    description: "The default settings for the door lock device. Valid values are defined by
      [DlDefaultConfigurationRegister][DoorLockTrait.DlDefaultConfigurationRegister]."
  - name: doorClosedEvents
    description: "The number of door closed events that have occurred since it was last zeroed."
  - name: doorOpenEvents
    description: "The number of door opened events that have occurred since it was last zeroed."
  - name: doorState
    description: "The current door state as defined in
      [DoorStateEnum][DoorLockTrait.DoorStateEnum]."
  - name: enableInsideStatusLed
    description: "Enables or disables an inside LED that allows the user to see at a glance if the
      door is locked."
  - name: enableLocalProgramming
    description: "Enable or disable local programming of certain features, as enumerated in the
      [localProgrammingFeatures][DoorLockTrait.Attributes.localProgrammingFeatures] attribute.
      When set to `true`, local programming is enabled on the door lock for all features. Otherwise,
      local programming is disabled for those features whose bit is set to `0` in the
      [localProgrammingFeatures][DoorLockTrait.Attributes.localProgrammingFeatures] attribute."
  - name: enableOneTouchLocking
    description: "Enables or disables the ability to lock the door lock with a single touch on the
      door lock."
  - name: enablePrivacyModeButton
    description: "Enable or disable a button inside the door that is used to put the lock into
      privacy mode. When the lock is in privacy mode it cannot be manipulated from the outside."
  - name: expiringUserTimeout
    description: "The number of minutes a PIN, RFID, fingerprint, or other credential associated
      with a user of type `ExpiringUser` remains valid after its first use before expiring."
  - name: language
    description: "The language used for the user interface."
  - name: localProgrammingFeatures
    description: "The local programming features that are disabled when the
      [enableLocalProgramming][DoorLockTrait.Attributes.enableLocalProgramming] attribute is set
      to `false`. Valid values are defined by
      [DlLocalProgrammingFeatures][DoorLockTrait.DlLocalProgrammingFeatures]."
  - name: lockState
    description: "Indicates the current state of the lock. Valid values are defined by
      [DlLockState][DoorLockTrait.DlLockState]."
  - name: lockType
    description: "The type of lock. Valid values are defined by
      [DlLockType][DoorLockTrait.DlLockType]."
  - name: maxPinCodeLength
    description: "The maximum length in bytes of a PIN Code on this device."
  - name: maxRfidCodeLength
    description: "The maximum length in bytes of a RFID Code on this device."
  - name: minPinCodeLength
    description: "The minimum length in bytes of a PIN Code on this device."
  - name: minRfidCodeLength
    description: "The minimum length in bytes of a RFID Code on this device."
  - name: numberOfCredentialsSupportedPerUser
    description: "The number of credentials that could be assigned for each user."
  - name: numberOfHolidaySchedulesSupported
    description: "The number of holiday schedules supported for the door lock device."
  - name: numberOfPinUsersSupported
    description: "The number of PIN users supported."
  - name: numberOfRfidUsersSupported
    description: "The number of RFID users supported."
  - name: numberOfTotalUsersSupported
    description: "Number of total users supported by the lock."
  - name: numberOfWeekDaySchedulesSupportedPerUser
    description: "The number of configurable week day schedules supported per user. Week day
      schedules are used to restrict access to a specified time window on certain days of
      the week. The schedule is repeated each week."
  - name: numberOfYearDaySchedulesSupportedPerUser
    description: "The number of configurable year day schedules supported per user. Year day
      schedules are used to restrict access to a specified date and time window."
  - name: openPeriod
    description: "This attribute holds the number of minutes the door has been open since the last
      time it transitioned from closed to open."
  - name: operatingMode
    description: "The current operating mode of the lock. Valid values are defined by
      [OperatingModeEnum][DoorLockTrait.OperatingModeEnum]."
  - name: requirePinforRemoteOperation
    description: "`true` if the door lock server requires that an optional PINs be included in the
      payload of remote lock operation events like Lock, Unlock, Unlock with Timeout and Toggle in
      order to function."
  - name: sendPinOverTheAir
    description: "`true` if it is ok for the door lock to send PINs over the air."
  - name: soundVolume
    description: "Has one of four possible settings:
      <ul>
        <li><code>0</code> - Silent Mode</li>
        <li><code>1</code> - Low Volume</li>
        <li><code>2</code> - High Volume</li>
        <li><code>3</code> - Medium Volume</li>
      </ul>"
  - name: supportedOperatingModes
    description: "Indicates which operating modes are supported by the lock. Valid values are
      defined by [DlSupportedOperatingModes][DoorLockTrait.DlSupportedOperatingModes]."
  - name: userCodeTemporaryDisableTime
    description: "The number of seconds that the lock shuts down following wrong code entry. The
      valid range is 1-255."
  - name: wrongCodeEntryLimit
    description: "The number of incorrect credential attempts allowed before the lock enters the
      lockout state. The valid range is 1-255."

  # DoorLock commands
  commands:
  - name: ClearCredential
    description:
    - "Clear a single credential, one type of credential, or all credentials except `ProgrammingPIN`
      credentials."
    param:
    - name: credential
      description: "The credential to be cleared."
  - name: ClearHolidaySchedule
    description:
    - "Clear the specified holiday schedule, or all holiday schedules."
    param:
    - name: holidayIndex
      description: "The unique identifier for the holiday schedule to clear. `0xFE` clears all
        holiday schedules."
  - name: ClearUser
    description:
    - "Clear the specified user."
    param:
    - name: userIndex
      description: "The unique identifier for the user to clear. `0xFFFE` clears all users."
  - name: ClearWeekDaySchedule
    description:
    - "Clear the specified week day schedule or all week day schedules for the specific user."
    - "Week day schedules are used to restrict access to a specified time window on certain days of
       the week. The schedule is repeated each week."
    param:
    - name: weekDayIndex
      description: "The unique identifier for the week day schedule to clear. `0xFE` clears all week
        day schedules for the specified user. "
    - name: userIndex
      description: "The unique identifier for the user whose schedule is to be cleared."
  - name: ClearYearDaySchedule
    description:
    - "Clear the specified year day schedule, or all year day schedules for the specific user."
    - "Year day schedules are used to restrict access to a specified date and time window."
    param:
    - name: yearDayIndex
      description: "The unique identifier for the year day schedule to clear. `0xFE` clears all year
        day schedules for the specified user."
    - name: userIndex
      description: "The unique identifier for the user whose year day schedule is to be cleared."
  - name: GetCredentialStatus
    description:
    - "Retrieve the status of the specified credential."
    param:
    - name: credential
      description: "The credential whose status is to be retrieved."
    response:
      description: "Returns the status for the specified credential."
      param:
      - name: creatorFabricIndex
        description: "The credential's creator fabric index."
      - name: credentialExists
        description: "A boolean value indicating the requested credential type and index exists and
          is populated for a given user index."
      - name: lastModifiedFabricIndex
        description: "The credential's last modifier fabric index."
      - name: nextCredentialIndex
        description: "The next occupied index in the database for the credential type requested,
          which is useful for quickly identifying occupied credential slots in the database."
      - name: userIndex
        description: "The credential's corresponding user index value if the credential exists."
  - name: GetHolidaySchedule
    description:
    - "Get the holiday schedule for the specified holiday index."
    param:
    - name: holidayIndex
      description: "The unique identifier for the holiday schedule to retrieve."
    response:
      description: "Returns the holiday schedule entry for the specified holiday ID."
      param:
      - name: holidayIndex
        description: "The index of the holiday."
      - name: localEndTime
        description: "The ending time for the holiday schedule in Epoch Time in seconds with local
          time offset based on the local timezone and DST offset on the day represented by the
          value."
      - name: localStartTime
        description: "The starting time for the holiday schedule in Epoch Time in seconds with local
          time offset based on the local timezone and DST offset on the day represented by the
          value."
      - name: operatingMode
        description: "The operating mode to use during this holiday schedule start/end time. "
      - name: status
        description: "The status of the `GetHolidaySchedule` command."
  - name: GetUser
    description:
    - "Retrieve the user type for a specific user."
    param:
    - name: userIndex
      description: "The unique identifier for the user whose type is to be retrieved."
    response:
      description: "Returns the user for the specified `userIndex`."
      param:
      - name: creatorFabricIndex
        description: "The user's creator fabric index."
      - name: credentialRule
        description: "The credential rule that can be applied to the user."
      - name: credentials
        description: "The user's credentials."
      - name: lastModifiedFabricIndex
        description: "The user's last modifier fabric index."
      - name: nextUserIndex
        description: "The next occupied user index in the database, which is useful for quickly
          identifying occupied user slots in the database."
      - name: userIndex
        description: "The unique identifier for the user."
      - name: userName
        description: "The user's name."
      - name: userStatus
        description: "The status of the user."
      - name: userType
        description: "The type of the user."
      - name: userUniqueId
        description: "The unique user id of the user."
  - name: GetWeekDaySchedule
    description:
    - "Retrieve the weekly schedule for the specified user."
    - "Week day schedules are used to restrict access to a specified time window on certain days of
       the week. The schedule is repeated each week."
    param:
    - name: weekDayIndex
      description: "The unique identifier for the week day schedule to retrieve."
    - name: userIndex
      description: "The unique identifier for the user whose week day schedule is to be retrieved."
    response:
      description: "Returns the weekly repeating schedule data for the specified schedule index."
      param:
      - name: daysMask
        description: "The days of the week in the week day schedule."
      - name: endHour
        description: "This indicates the ending hour for the week day schedule."
      - name: endMinute
        description: "The ending minute for the week day schedule."
      - name: startHour
        description: "The starting hour for the week day schedule."
      - name: startMinute
        description: "The starting minute for the week day schedule."
      - name: status
        description: "The status of the `GetWeekDaySchedule` command."
      - name: userIndex
        description: "The unique identifier for the user whose week day schedule is to be
          retrieved."
      - name: weekDayIndex
        description: "The unique identifier for the week day schedule being retrieved."
  - name: GetYearDaySchedule
    description:
    - "Retrieve the specified year day schedule for the specified user."
    - "Year day schedules are used to restrict access to a specified date and time window."
    param:
    - name: yearDayIndex
      description: "The unique identifier for the year day schedule to be retrieved."
    - name: userIndex
      description: "The unique identifier for the user whose year day schedule is to be retrieved."
    response:
      description: "Returns the year day schedule data for the specified schedule and user indexes."
      param:
      - name: localEndTime
        description: "The ending time for the year day schedule in Epoch Time in seconds with local
          time offset based on the local timezone and DST offset on the day represented by the
          value."
      - name: localStartTime
        description: "The starting time for the year day schedule in Epoch Time in seconds with
          local time offset based on the local timezone and DST offset on the day represented by the
          value."
      - name: status
        description: "The status of the `GetYearDaySchedule` command."
      - name: userIndex
        description: "The user index for the schedule."
      - name: yearDayIndex
        description: "The unique identifier for the year day schedule being retrieved."
  - name: LockDoor
    description:
    - "Lock the door."
    param:
    - name: PinCode
      description: "The PIN code."
  - name: SetCredential
    description:
    - "Set a credential into the lock for a new or existing user, or for a programming user."
    param:
    - name: operationType
      description: "The operation to be performed."
    - name: credential
      description: "The credential to be set."
    - name: credentialData
      description: "The credential data to set for the credential being added or modified."
    - name: userIndex
      description: "The unique identifier for the user record that corresponds to the credential
        being added or modified."
    - name: userStatus
      description: "The user status to use in the new user record if a new user is being created.
        Valid values are defined by [UserStatusEnum][DoorLockTrait.UserStatusEnum]."
    - name: userType
      description: "The user type to use in the new user record if a new user is being created.
        Valid values are defined by [UserTypeEnum][DoorLockTrait.UserTypeEnum]."
    response:
      description: "The status for setting the specified credential."
      param:
      - name: nextCredentialIndex
        description: "The next available index in the database for the credential type set, which is
          useful for quickly identifying available credential slots in the database."
      - name: status
        description: "The status of the `SetCredential` command."
      - name: userIndex
        description: "The user index that was created with the new credential."
  - name: SetHolidaySchedule
    description:
    - "Set the holiday schedule by specifying the local start and end time with respect to a
        specific lock operating mode."
    param:
    - name: holidayIndex
      description: "The unique identifier for the holiday whose schedule is to be set."
    - name: localStartTime
      description: "The starting time for the holiday schedule in Epoch Time in seconds with local
        time offset based on the local timezone and DST offset on the day represented by the value."
    - name: localEndTime
      description: "The ending time for the holiday schedule in Epoch Time in seconds with local
        time offset based on the local timezone and DST offset on the day represented by the value."
    - name: operatingMode
      description: "The operating mode to use for the specified holiday schedule start and end time.
        Valid values are defined by [OperatingModeEnum][DoorLockTrait.OperatingModeEnum]."
  - name: SetUser
    description:
    - "Set the user on the lock."
    param:
    - name: operationType
      description: "The operation to perform. Valid values are defined by
        [DataOperationTypeEnum][DoorLockTrait.DataOperationTypeEnum]."
    - name: userIndex
      description: "The unique identifier for the user to set on the lock."
    - name: userName
      description: "The user name of the user to set on the lock."
    - name: userUniqueId
      description: "The unique user id of the user to set on the lock."
    - name: userStatus
      description: "The status of the user to set on the lock. Valid values are defined by
        [UserStatusEnum][DoorLockTrait.UserStatusEnum]."
    - name: userType
      description: "The type of the user. Valid values are defined by
        [UserTypeEnum][DoorLockTrait.UserTypeEnum]."
    - name: credentialRule
      description: "The credential rule. Valid values are defined by
        [CredentialRuleEnum][DoorLockTrait.CredentialRuleEnum]."
  - name: SetWeekDaySchedule
    description:
    - "Set a weekly repeating schedule for the specified user."
    param:
    - name: weekDayIndex
      description: "The unique identifier for the week day."
    - name: userIndex
      description: "The unique identifier for the user for whom the repeating schedule is being
        set."
    - name: daysMask
      description: "The days that constitute the repeating schedule. Valid values are defined by
        [DaysMaskMap][DoorLockTrait.DaysMaskMap]."
    - name: startHour
      description: "The start hour of the repeating event."
    - name: startMinute
      description: "The start minute of the repeating event."
    - name: endHour
      description: "The end hour of the repeating event."
    - name: endMinute
      description: "The end minute of the repeating event."
  - name: SetYearDaySchedule
    description:
    - "Set a time-specific schedule ID for a specified user."
    param:
    - name: yearDayIndex
      description: "The unique identifier for the year day schedule."
    - name: userIndex
      description: "The unique identifier for the user for whom the repeating schedule is being
        set."
    - name: localStartTime
      description: "The starting time for the year day schedule in Epoch Time in seconds with local
        time offset based on the local timezone and DST offset on the day represented by the value."
    - name: localEndTime
      description: "The ending time for the year day schedule in Epoch Time in seconds with local
        time offset based on the local timezone and DST offset on the day represented by the value."
  - name: UnboltDoor
    description:
    - "Disengage the deadbolt."
    param:
    - name: PinCode
      description: "The PIN code."
  - name: UnlockDoor
    description:
    - "Unlock the door."
    param:
    - name: PinCode
      description: "The PIN code."
  - name: UnlockWithTimeout
    description:
    - "Unlock the door with a timeout parameter. After the timeout, the door automatically relocks."
    param:
    - name: timeout
      description: "The number of seconds to wait before relocking the door lock."
    - name: PinCode
      description: "The PIN code."

