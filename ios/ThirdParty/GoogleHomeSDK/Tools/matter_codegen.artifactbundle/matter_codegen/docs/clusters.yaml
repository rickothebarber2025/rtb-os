    - name: credentials
      description: "The credentials used in performing the user data change."

ElectricalEnergyMeasurement:
  description: "This trait provides a mechanism for querying data about electrical energy imported
    or provided by the server."

  # ElectricalEnergyMeasurement attributes
  attributes:
  - name: accuracy
    description: "The accuracy of energy measurement by this server."
  - name: cumulativeEnergyExported
    description: "The most recent measurement of cumulative energy exported by the
      server over the lifetime of the device, and the timestamp of when the measurement
      was recorded."
  - name: cumulativeEnergyImported
    description: "The most recent measurement of cumulative energy imported by the
      server over the lifetime of the device, and the timestamp of when the measurement
      was recorded."
  - name: cumulativeEnergyReset
    description: "Indicates when cumulative measurements were most recently zero."
  - name: periodicEnergyExported
    description: "The most recent measurement of periodic energy exported by the
      server and the period during which it was measured."
  - name: periodicEnergyImported
    description: "The most recent measurement of periodic energy imported by the
      server and the period during which it was measured."

  # ElectricalEnergyMeasurement bitmaps
  bitmaps:
  - name: Feature
    description: "ElectricalEnergyMeasurement Trait FeatureMap."
    value:
    - name: kApparentEnergy
      description: "Measurements report apparent energy."
    - name: kReactiveEnergy
      description: "Measurements report reactive energy."
    - name: kExportedEnergy
      description: "Supports the measurement of energy provided by the server."
    - name: kImportedEnergy
      description: "Supports the measurement of energy imported by the server."
    - name: kCumulativeEnergy
      description: "The measurements are cumulative."
    - name: kPeriodicEnergy
      description: "The measurements are periodic."

  # ElectricalEnergyMeasurement enums
  enums:
  - name: MeasurementTypeEnum
    description: "The type of measurement."
    value:
    - name: kReactiveEnergy
      description: "Reactive energy in millivolt-amp-hours reactive (mVARh)."
    - name: kApparentEnergy
      description: "Apparent energy in millivolt-amp-hours (mVAh)."
    - name: kActiveCurrent
      description: "Active current in milliamps (mA)."
    - name: kActivePower
      description: "Active power in milliwatts (mW)."
    - name: kApparentCurrent
      description: "Apparent current in milliamps (mA)."
    - name: kApparentPower
      description: "Apparent power in millivolt-amps (mVA)."
    - name: kElectricalEnergy
      description: "Electrical energy in milliwatt-hours (mWh)."
    - name: kFrequency
      description: "AC frequency in millihertz (mHz)."
    - name: kNeutralCurrent
      description: "AC neutral current in milliamps (mA)."
    - name: kPowerFactor
      description: "Power factor ratio in +/- 1/100ths of a percent."
    - name: kReactiveCurrent
      description: "Reactive current in milliamps (mA)."
    - name: kReactivePower
      description: "Reactive power in millivolt-amps reactive (mVAR)."
    - name: kRMSCurrent
      description: "RMS current in milliamps (mA)."
    - name: kRMSPower
      description: "RMS power in milliwatts (mW)."
    - name: kRMSVoltage
      description: "RMS voltage in millivolts (mV)."
    - name: kUnspecified
      description: "Unspecified."
    - name: kVoltage
      description: "Voltage in millivolts (mV)."

  # ElectricalEnergyMeasurement events
  events:
  - name: CumulativeEnergyMeasured
    description: "This event gets generated when the server takes a snapshot of
      the cumulative energy imported or exported from the server."
    value:
    - name: energyExported
      description: "The most recent measurement of cumulative energy exported by the
        server, and the timestamp of when the measurement was recorded."
    - name: energyImported
      description: "The most recent measurement of cumulative energy imported by the
        server, and the timestamp of when the measurement was recorded."
  - name: PeriodicEnergyMeasured
    description: "This event gets generated when the server reaches the end of
      a reporting period for imported or exported energy."
    value:
    - name: energyExported
      description: "The most recent measurement of periodic energy exported by the
        server and the period during which it was measured."
    - name: energyImported
      description: "The most recent measurement of periodic energy imported by the
        server and the period during which it was measured."

  # ElectricalEnergyMeasurement structs
  structs:
  - name: CumulativeEnergyResetStruct
    description: "Indicates when cumulative measurements were most recently zero."
    value:
    - name: exportedResetSystime
      description: "The time, in milliseconds, since boot when cumulative exported energy was
        most recently zero."
    - name: exportedResetTimestamp
      description: "The timestamp in UTC of when cumulative exported energy was most recently zero."
    - name: importedResetSystime
      description: "The time, in milliseconds, since boot when cumulative imported energy was
        most recently zero."
    - name: importedResetTimestamp
      description: "The timestamp in UTC of when cumulative imported energy was most recently zero."
  - name: EnergyMeasurementStruct
    description: "Indicates the amount of energy measured during a given measurement period."
    value:
    - name: apparentEnergy
      description: "The reported apparent energy."
    - name: reactiveEnergy
      description: "The reported reactive energy."
    - name: endSystime
      description: "The time, in milliseconds, since boot at the end of the measurement period."
    - name: energy
      description: "The reported energy."
    - name: endTimestamp
      description: "The timestamp in UTC of the end of the measurement period."
    - name: startTimestamp
      description: "The timestamp in UTC of the start of the measurement period."
    - name: startSystime
      description: "The time, in milliseconds, since boot at the start of the measurement period."
  - name: MeasurementAccuracyRangeStruct
    description: "The accuracy of a measurement for a range of measurement values, shown as
      a maximum +/- percentage of the true value, a maximum +/- fixed value of
      the true value, or both."
    value:
    - name: fixedMax
      description: "The maximum +/- fixed accuracy for the associated measurement, in the
        unit indicated by
        [measurementType][ElectricalEnergyMeasurementTrait.MeasurementAccuracyStruct.measurementType]."
    - name: fixedMin
      description: "The minimum +/- fixed accuracy for the associated measurement, in the
        unit indicated by
        [measurementType][ElectricalEnergyMeasurementTrait.MeasurementAccuracyStruct.measurementType]."
    - name: fixedTypical
      description: "The typical +/- fixed accuracy for the associated measurement, in the
        unit indicated by
        [measurementType][ElectricalEnergyMeasurementTrait.MeasurementAccuracyStruct.measurementType]."
    - name: percentMax
      description: "The maximum +/- percentage accuracy for the associated measurement."
    - name: percentMin
      description: "The minimum +/- percentage accuracy for the associated measurement."
    - name: percentTypical
      description: "The typical +/- percentage accuracy for the associated measurement."
    - name: rangeMax
      description: "The maximum measurement value for the specified level of accuracy.
        The value of this field is greater than the value of the [rangeMin] field
        and greater than or equal to the value of
        [minMeasuredValue][ElectricalEnergyMeasurementTrait.MeasurementAccuracyStruct.minMeasuredValue].
        The value of this field is less than or equal to the value of
        [maxMeasuredValue][ElectricalEnergyMeasurementTrait.MeasurementAccuracyStruct.maxMeasuredValue]."
    - name: rangeMin
      description: "The minimum measurement value for the specified level of accuracy.
        The value of this field is greater than or equal to the value of
        [minMeasuredValue][ElectricalEnergyMeasurementTrait.MeasurementAccuracyStruct.minMeasuredValue].
        The value of this field is less than or equal to the value of
        [maxMeasuredValue][ElectricalEnergyMeasurementTrait.MeasurementAccuracyStruct.maxMeasuredValue]."
  - name: MeasurementAccuracyStruct
    description: "The set of accuracy ranges for a given measurement, the maximum and minimum
      values for the measurement, and whether the measurement is directly measured or
      only estimated from other existing information."
    value:
    - name: accuracyRanges
      description: "A list of measurement ranges and their associated accuracies."
    - name: maxMeasuredValue
      description: "The maximum possible value of the measured value."
    - name: measured
      description: "Whether the associated measurement was directly measured. If this field
        is not set to `true`, then the associated measurement was estimated."
    - name: minMeasuredValue
      description: "The minimum possible value of the measured value."
    - name: measurementType
      description: "The measurement type for the accuracy provided."

ElectricalGridConditions:
  description: "Provides a mechanism for communicating electricity grid carbon intensity to
    devices."

  # ElectricalGridConditions attributes
  attributes:
  - name: localGenerationAvailable
    description: "Indicates whether local generation is available."
  - name: currentConditions
    description: "Indicates the current grid conditions."
  - name: forecastConditions
    description: "A list of forecast grid conditions."

  # ElectricalGridConditions bitmaps
  bitmaps:
  - name: Feature
    description: "ElectricalGridConditions cluster FeatureMap."
    value:
    - name: kForecasting
      description: "Indicates if the server is capable of providing a forecase of grid and local
        conditions."

  # ElectricalGridConditions enums
  enums:
  - name: ThreeLevelEnum
    description: "Indicates a level (Low, Medium, or High)."
    value:
    - name: kLow
      description: "Indicates a low level."
    - name: kMedium
      description: "Indicates a medium level."
    - name: kHigh
      description: "Indicates a high level."

  # ElectricalGridConditions structs
  structs:
  - name: ElectricalGridConditionsStruct
    description: "Represents grid conditions for a specific period."
    value:
    - name: periodStart
      description: "The start time of the period."
    - name: periodEnd
      description: "The end time of the period."
    - name: gridCarbonIntensity
      description: "The estimated carbon intensity in grams of CO2 equivalent per kWh of the grid.
        This is not impacted by any local generation."
    - name: gridCarbonLevel
      description: "The relative level of carbon intensity of the grid."
    - name: localCarbonIntensity
      description: "The estimated carbon intensity in grams of CO2 equivalent per kWh of the
        premises mains supply, taking into account local generation."
    - name: localCarbonLevel
      description: "The local carbon level."

  # ElectricalGridConditions events
  events:
  - name: CurrentConditionsChanged
    description: "Generated when the current grid conditions change."
    value:
    - name: currentConditions
      description: "The new current grid conditions."

ElectricalPowerMeasurement:
  description: "This trait provides a mechanism for querying data about electrical power as
    measured by the server."

  # ElectricalPowerMeasurement attributes
  attributes:
  - name: accuracy
    description: "List of accuracy specifications for the measurement types supported by the
      server."
  - name: activeCurrent
    description: "The most recent current reading in milliamps (mA). A positive value
      means that current is flowing into the server, and a negative value means that current
      is flowing out of the server."
  - name: activePower
    description: "The most recent power reading in milliwatts (mW). A positive value
      means that power is being imported, and a negative value means that power is being
      exported."
  - name: apparentCurrent
    description: "The most recent `apparentCurrent` (square root sum of the squares of active
      and reactive currents) reading in milliamps (mA)."
  - name: apparentPower
    description: "The most recent `apparentPower` reading in millivolt-amps (mVA).
      A positive value denotes power imported, and a negative value denotes power exported."
  - name: frequency
    description: "The most recent frequency reading in millihertz (mHz)."
  - name: harmonicCurrents
    description: "A list of
     [HarmonicMeasurementStruct][ElectricalPowerMeasurementTrait.HarmonicMeasurementStruct]
     values, where each value represents the harmonic current reading for
     the harmonic order as specified by
     [order][ElectricalPowerMeasurementTrait.HarmonicMeasurementStruct.order]."
  - name: harmonicPhases
    description: "A list of
     [HarmonicMeasurementStruct][ElectricalPowerMeasurementTrait.HarmonicMeasurementStruct]
     values, where each value represents the harmonic phase reading for
     the harmonic order as specified by
     [order][ElectricalPowerMeasurementTrait.HarmonicMeasurementStruct.order]."
  - name: neutralCurrent
    description: "The most recent `neutralCurrent` reading in milliamps (mA). Typically, this is
      the magnitude of the vector sum of the phase currents. A positive value represents
      an imbalance between the phase currents when power is imported. A negative value represents
      an imbalance between the phase currents when power is exported."
  - name: numberOfMeasurementTypes
    description: "Maximum number of measurement types the server is capable of reporting."
  - name: powerFactor
    description: "The power factor ratio in +/- 1/100ths of a percent."
  - name: powerMode
    description: "The current mode of the server."
  - name: ranges
    description: "The measured ranges for different measurement types. Each
      measurement type is limited to one entry in this list, which represents the range
      of measurements in the most recent measurement period."
  - name: reactiveCurrent
    description: "The most recent `reactiveCurrent` reading in milliamps (mA). A positive value
      means that current is flowing into the server, and a negative value means that current
      is flowing out of the server."
  - name: reactivePower
    description: "The most recent `reactivePower` reading in millivolt-amps reactive (mVAR).
      A positive value denotes power imported, and a negative value denotes power exported."
  - name: RMSCurrent
    description: "Root mean squared current in milliamps (mA). A positive value
      means that current is flowing into the server, and a negative value means that current
      is flowing out of the server."
  - name: RMSPower
    description: "Root mean squared power in milliwatts (mW). A positive value
      means that power is being imported, and a negative value means that power is being
      exported."
  - name: RMSVoltage
    description: "Root mean squared voltage in millivolts (mV)."
  - name: voltage
    description: "Voltage in millivolts (mV)."

  # ElectricalPowerMeasurement bitmaps
  bitmaps:
  - name: Feature
    description: "ElectricalPowerMeasurement Trait FeatureMap."
    value:
    - name: kAlternatingCurrent
      description: "Supports the measurement of an alternating current."
    - name: kDirectCurrent
      description: "Supports the measurement of a direct current."
    - name: kHarmonics
      description: "Supports the measurement of the harmonics of an alternating current."
    - name: kPolyphasePower
      description: "Supports the measurement of polyphase power."
    - name: kPowerQuality
      description: "Supports the measurement of the harmonic phases of an alternating current."

  # ElectricalPowerMeasurement enums
  enums:
  - name: MeasurementTypeEnum
    description: "The type of measurement."
    value:
    - name: kReactiveEnergy
      description: "Reactive energy in millivolt-amp-hours reactive (mVARh)."
    - name: kApparentEnergy
      description: "Apparent energy in millivolt-amp-hours (mVAh)."
    - name: kActiveCurrent
      description: "Active current in milliamps (mA)."
    - name: kActivePower
      description: "Active power in milliwatts (mW)."
    - name: kApparentCurrent
      description: "Apparent current in milliamps (mA)."
    - name: kApparentPower
      description: "Apparent power in millivolt-amps (mVA)."
    - name: kElectricalEnergy
      description: "Electrical energy in milliwatt-hours (mWh)."
    - name: kFrequency
      description: "AC frequency in millihertz (mHz)."
    - name: kNeutralCurrent
      description: "AC neutral current in milliamps (mA)."
    - name: kPowerFactor
      description: "Power factor ratio in +/- 1/100ths of a percent."
    - name: kReactiveCurrent
      description: "Reactive current in milliamps (mA)."
    - name: kReactivePower
      description: "Reactive power in millivolt-amps reactive (mVAR)."
    - name: kRMSCurrent
      description: "RMS current in milliamps (mA)."
    - name: kRMSPower
      description: "RMS power in milliwatts (mW)."
    - name: kRMSVoltage
      description: "RMS voltage in millivolts (mV)."
    - name: kUnspecified
      description: "Unspecified."
    - name: kVoltage
      description: "Voltage in millivolts (mV)."
  - name: PowerModeEnum
    description: "The type of current."
    value:
    - name: kAC
      description: "Alternating current, either single-phase or polyphase."
    - name: kDC
      description: "Direct current."
    - name: kUnknown
      description: "Unknown."

  # ElectricalPowerMeasurement events
  events:
  - name: MeasurementPeriodRanges
    description: "The start and end times for measurement periods as determined by the server."
    value:
    - name: ranges
      description: "The value of the [ranges][ElectricalPowerMeasurementTrait.Attributes.ranges]
        attribute at the time of event generation."

  # ElectricalPowerMeasurement structs
  structs:
  - name: HarmonicMeasurementStruct
    description: "Measurements of various harmonics."
    value:
    - name: measurement
      description: "The measured value for the given harmonic order."
    - name: order
      description: "The order of the harmonic being measured, which is typically an odd number
        unless the server is set up to report even harmonics."
  - name: MeasurementAccuracyRangeStruct
    description: "The accuracy of a measurement for a range of measurement values, shown as
      a maximum +/- percentage of the true value, a maximum +/- fixed value of
      the true value, or both."
    value:
    - name: fixedMax
      description: "The maximum +/- fixed accuracy for the associated measurement, in the
        unit indicated by
        [measurementType][ElectricalPowerMeasurementTrait.MeasurementRangeStruct.measurementType]."
    - name: fixedMin
      description: "The minimum +/- fixed accuracy for the associated measurement, in the
        unit indicated by
        [measurementType][ElectricalPowerMeasurementTrait.MeasurementRangeStruct.measurementType]."
    - name: fixedTypical
      description: "The typical +/- fixed accuracy for the associated measurement, in the
        unit indicated by
        [measurementType][ElectricalPowerMeasurementTrait.MeasurementRangeStruct.measurementType]."
    - name: percentMax
      description: "The maximum +/- percentage accuracy for the associated measurement."
    - name: percentMin
      description: "The minimum +/- percentage accuracy for the associated measurement."
    - name: percentTypical
      description: "The typical +/- percentage accuracy for the associated measurement."
    - name: rangeMax
      description: "The maximum measurement value for the specified level of accuracy.
        The value of this field is greater than the value of the [rangeMin] field
        and greater than or equal to the value of
        [minMeasuredValue][ElectricalPowerMeasurementTrait.MeasurementAccuracyStruct.minMeasuredValue].
        The value of this field is less than or equal to the value of
        [maxMeasuredValue][ElectricalPowerMeasurementTrait.MeasurementAccuracyStruct.maxMeasuredValue]."
    - name: rangeMin
      description: "The minimum measurement value for the specified level of accuracy.
        The value of this field is greater than or equal to the value of
        [minMeasuredValue][ElectricalPowerMeasurementTrait.MeasurementAccuracyStruct.minMeasuredValue].
        The value of this field is less than or equal to the value of
        [maxMeasuredValue][ElectricalPowerMeasurementTrait.MeasurementAccuracyStruct.maxMeasuredValue]."
  - name: MeasurementAccuracyStruct
    description: "The set of accuracy ranges for a given measurement, the maximum and minimum
      values for the measurement, and whether the measurement is directly measured or
      only estimated from other existing information."
    value:
    - name: accuracyRanges
      description: "A list of measurement ranges and their associated accuracies."
    - name: maxMeasuredValue
      description: "The maximum possible value of the measured value."
    - name: measured
      description: "Whether the associated measurement was directly measured. If this field
        is not set to `true`, then the associated measurement was estimated."
    - name: minMeasuredValue
      description: "The minimum possible value of the measured value."
    - name: measurementType
      description: "The measurement type for the accuracy provided."
  - name: MeasurementRangeStruct
    description: "The maximum and minimum values of a given measurement type during
      a measurement period, along with the observation times of these values."
    value:
    - name: endTimestamp
      description: "The timestamp in UTC of the end of the measurement period."
    - name: endSystime
      description: "The time, in milliseconds, since boot at the end of the measurement period."
    - name: max
      description: "The largest measured value for the associated
        measurement over the period between either [startTimestamp] and [endTimestamp] or
        the period between [startSystime] and [endSystime], or both."
    - name: maxSystime
      description: "The measurement time, in milliseconds, since boot of the value in the
        [max] field. The value is greater than or equal to the value of the [startSystime] field and
        less than or equal to the value of the [endSystime] field."
    - name: maxTimestamp
      description: "The most recent timestamp in UTC of the value in the [max] field.
        The value is greater than or equal to the value of the [startTimestamp] field, and less than
        or equal to the value of the [endTimestamp] field."
    - name: measurementType
      description: "The measurement type for the range provided."
    - name: min
      description: "The smallest measured value for the associated
        measurement over the period between either [startTimestamp] and [endTimestamp] or
        the period between [startSystime] and [endSystime], or both."
    - name: minSystime
      description: "The measurement time, in milliseconds, since boot of the value in the
        [min] field. The value is greater than or equal to the value of the [startSystime] field
        andless than or equal to the value of the [endSystime] field."
    - name: minTimestamp
      description: "The most recent timestamp in UTC of the value in the [min] field.
        greater than or equal to the value of the [startTimestamp] field, and less than
        or equal to the value of the [endTimestamp] field."
    - name: startSystime
      description: "The time since boot at the start of the measurement period."
    - name: startTimestamp
      description: "The timestamp in UTC of the start of the measurement period."

ElevatorControl:
  description: "This trait is designed for calling an elevator to a floor."

  # ElevatorControl attributes
  attributes:
  - name: supportedElevatorFloors
    description: "Contains information on the various floors this elevator supports."

  # ElevatorControl bitmaps
  bitmaps:
  - name: ElevatorControlFeature
    description: "Contains specific capabilities related to elevator controls."
    value:
    - name: kSupportsDefaultElevatorFloor
      description: "Indicates whether this device supports calling the elevator without specifying
        a floor."

  # ElevatorControl commands
  commands:
  - name: CallElevator
    description:
    - "Call the elevator."
    param:
    - name: floorName
      description: "The floor name of where to send the elevator."

  # ElevatorControl structs
  structs:
  - name: FloorNameSynonym
    description: "Synonyms for this floor in a given language."
    value:
    - name: lang
      description: "ISO 639-1 language code, for example, `en` for English."
    - name: synonyms
      description: "Synonyms for this floor. The first string in this list is used as the default
        name of the floor in this language."
  - name: ElevatorFloor
    description: "An elevator floor."
    value:
    - name: floorName
      description: "The internal name of the elevator floor which is used in commands. This name is
        shared across all languages. This name must also be included in the synonyms list if it is
        a valid name for the floor."
    - name: floorNameSynonyms
      description: "Synonyms for this floor in each supported language."

EnergyPreference:
  description: "This trait provides an interface to specify preferences for how devices should
    consume energy."

  # EnergyPreference attributes
  attributes:
  - name: currentEnergyBalance
    description: "The current preference of the user for balancing different priorities
      during device use. The value of this attribute is the 0-based index into the
      [energyBalances] attribute for the currently selected balance."
  - name: currentLowPowerModeSensitivity
    description: "The current preference of the user for how quickly a device should enter
      low power mode. The value of this attribute is the 0-based index into the
      [lowPowerModeSensitivities] attribute for the currently selected sensitivity."
  - name: energyBalances
    description: "A list of at least two [BalanceStructs][EnergyPreferenceTrait.BalanceStruct],
      each representing a step along a linear scale of relative priorities."
  - name: energyPriorities
    description: "Two extremes for interpreting the values in the [energyBalances] attribute.
      These two priorities are in opposition to each other, for example
      `Comfort` versus `Efficiency` or `Speed` versus `WaterConsumption`."
  - name: lowPowerModeSensitivities
    description: "A list of at least two [BalanceStructs][EnergyPreferenceTrait.BalanceStruct],
      each representing a condition or set of conditions for the device to enter low-power mode."

  # EnergyPreference bitmaps
  bitmaps:
  - name: Feature
    description: "EnergyPreference trait FeatureMap."
    value:
    - name: kEnergyBalance
      description: "Allows a user to balance energy consumption versus another priority
        for a device."
    - name: kLowPowerModeSensitivity
      description: "Allows the user to select a condition or set of conditions to
        cause a device to switch to a mode that uses less power than the current mode.
        For example, a device might provide a scale of durations that must elapse
        without user interaction before the device enters sleep mode."

  # EnergyPreference enums
  enums:
  - name: EnergyPriorityEnum
    description: "Categories to prioritize for energy consumption."
    value:
    - name: kComfort
      description: "Emphasizes user comfort, such as the local temperature for a thermostat."
    - name: kEfficiency
      description: "Emphasizes how much energy a device uses, such as electricity usage for a pump."
    - name: kSpeed
      description: "Emphasizes how quickly a device accomplishes its targeted use,
        such as the time it takes for a robot vacuum to complete its cleaning cycle."
    - name: kWaterConsumption
      description: "Emphasizes how much water is consumed during device usage,
        such as the amount of water a dishwasher uses during a cleaning cycle."

  # EnergyPreference structs
  structs:
  - name: BalanceStruct
    description: "Represents a step along a scale of preferences."
    value:
    - name: step
      description: "The relative value, in percentage, along a scale of preferences.
        Supported values:
        <ul>
        <li>`0`: The device
        entirely favors the priority specified by the first
        element in the `energyPriorities` attribute.</li>
        <li>`50`: The device splits its energy consumption between the two
        priorities in the `energyPriorities` attribute.</li>
        <li>`100`: The device entirely favors the priority specified by the
        second element in the `energyPriorities` attribute.</li>
        </ul>"
    - name: label
      description: "An optional string explaining which actions a device might take at the
        given `step` value."

EnergyEvse:
  description: "This trait is for devices that provide electric vehicle supply equipment (EVSE)
    functionality."

  # EnergyEvse attributes
  attributes:
  - name: approximateEVEfficiency
    description: "The vehicle efficiency rating for a connected vehicle. This value is stored
      in kilometers per killowatt hours multiplied by a scaling factor of 1000. This can be used
      to help indicate to the user approximately how many miles or kilometers of range will be
      added. A null value indicates that the EV efficiency is unknown and the
      [nextChargeRequiredEnergy]
      attribute cannot be converted from megawatt hours to miles or kilometers."
  - name: batteryCapacity
    description: "The capacity of the electric vehicle battery in milliwatt hours."
  - name: chargingEnabledUntil
    description: "The time, in UTC, when the EVSE automatically stops current flow to
      the electric vehicle. If the value is null, charging is permanently enabled.
      If the value is in the past, charging is disabled.
      This attribute is set only as part of the payload of the
      [EnableCharging][EnergyEvseTrait.EnableChargingCommand] command.
      This attribute is persisted, for example a temporary power failure should not stop
      the vehicle from charging."
  - name: circuitCapacity
    description: "The capacity that the EVSE circuit can provide."
  - name: dischargingEnabledUntil
    description: "The time, in UTC, when the EVSE automatically stops current flow from
      the electric vehicle. If the value is null, discharging is permanently enabled.
      If the value is in the past or 0x0, discharging is disabled.
      This attribute is set only as part of the payload of the `EnableDischarging` command.
      This attribute is persisted, for example a temporary power failure should not stop
      the vehicle from discharging."
  - name: faultState
    description: "The type of fault detected by the EVSE. When the
      [supplyState] attribute is `DisabledError`,
      the `faultState` attribute is one of the values
      listed in [FaultStateEnum][EnergyEvseTrait.FaultStateEnum], except for `NoError`.
      For all values of the [supplyState] attribute other than `DisabledError`,
      the `faultState` attribute is `noError`."
  - name: maximumChargeCurrent
    description: "The maximum current, in milliamps, that the EVSE can deliver
      to the electric vehicle. The attribute can be initially set using the
      [EnableCharging][EnergyEvseTrait.EnableChargingCommand] command or by adjusting the
      [userMaximumChargeCurrent] attribute.
      The value of the `maximumChargeCurrent` attribute is the minimum of:
      `CircuitCapacity` (the electrician’s installation setting),
      `CableAssemblyCurrentLimit` (detected by the EVSE when the cable is plugged in), the
      `MaximumChargeCurrent` field in the
      [EnableCharging][EnergyEvseTrait.EnableChargingCommand] command,
      and the [userMaximumChargeCurrent] attribute."
  - name: maximumDischargeCurrent
    description: "The maximum current, in milliamps, that the EVSE can receive
      from the electric vehicle. The attribute can be set using the
      [EnableDischarging][EnergyEvseTrait.EnableDischargingCommand] command.
      The value of the `maximumDischargeCurrent` attribute is the minimum of:
      `CircuitCapacity` (the electrician’s installation setting),
      `CableAssemblyCurrentLimit` (detected by the EVSE when the cable is plugged in), and the
      `MaximumDischargeCurrent` field in the
      [EnableDischarging][EnergyEvseTrait.EnableDischargingCommand] command."
  - name:  minimumChargeCurrent
    description: "The minimum current, in milliamps, that the EVSE can deliver
      to the electric vehicle. The attribute can be set using the
      [EnableCharging][EnergyEvseTrait.EnableChargingCommand] command."
  - name: nextChargeRequiredEnergy
    description: "The amount of energy, in megawatt hours, that the EVSE will attempt to add to the
      vehicle in the next charging target. A null indicates that
      there is no scheduled charging or that the EVSE is using the target state of charge method
      to charge the vehicle."
  - name: nextChargeStartTime
    description: "The time, in UTC, when the EVSE is scheduled to start the next
      charge based on the charging preferences. A null value indicates that
      there is no scheduled charging or that the vehicle is not plugged in."
  - name: nextChargeTargetSoC
    description: "The target state of charge (SoC), in percent, that the EVSE will
      attempt to reach when the vehicle
      is next charged. A null value indicates that there is no scheduled charging
      or that the EVSE cannot obtain the current SoC from the vehicle.
      If the SoC feature is not supported, only the values `null` and `100` are supported."
  - name: nextChargeTargetTime
    description: "The time, in UTC, when the EVSE should complete the next scheduled charge
      based on the charging preferences. A null value indicates that
      there is no scheduled charging or that the vehicle is not plugged in."
  - name:  randomizationDelayWindow
    description: "The time of a random window, in seconds, over which the EVSE randomizes
      the start of a charging session. For example, if the `randomizationDelayWindow`
      is 600 seconds and there is an energy rate starting at 00:30,
      then the EVSE must compute a random delay between 0-599 seconds and add
      this to its initial planned start time."
  - name: sessionDuration
    description: "The duration, in seconds, for the current or most recent charging session. A
      default value of null indicates that no sessions have occurred. A charging
      session begins when the vehicle is plugged in and ends when the vehicle is unplugged."
  - name: sessionEnergyCharged
    description: "The energy, in milliwatt hours, delivered by the EVSE to the electric vehicle
      for the current or most recent charging session. A default value of null indicates that
      no sessions have occurred."
  - name: sessionEnergyDischarged
    description: "The energy, in milliwatt hours, received by the EVSE from the electric vehicle
      for the current or most recent charging session. A default value of null indicates
      that no sessions have occurred."
  - name: sessionID
    description: "A unique identifier for the current or most recent session. A default value of
      null indicates that no sessions have occurred. The `sessionId` gets incremented
      each time a plugin is detected. A session begins when the vehicle is plugged in and ends
      when the vehicle is unplugged."
  - name: state
    description: "The current status of the EVSE."
  - name: stateOfCharge
    description: "The state of charge (SOC) of the electric vehicle battery in one-percent
      increments. The values are in the range of 0-100%. This attribute is available only on EVSEs
      that can read the SoC from the vehicle and that support the SoC feature. If the SoC cannot be
      read from the vehicle, the value of the attribute is null."
  - name: supplyState
    description: "Indicates whether the electric vehicle is currently allowed to charge from
      the EVSE or discharge to the EVSE."
  - name: userMaximumChargeCurrent
    description: "The maximum current, in milliamps, that the consumer can set as
      a preference to further reduce the charging rate."
  - name: vehicleID
    description: "The vehicle ID read by the EVSE via ISO-15118 using the Plug & Charge (PnC)
      feature, if the EVSE supports this capability. The field may be based on the
      e-Mobility Account Identifier (EMAID). A null value indicates that the ID is unknown."

  # EnergyEvse bitmaps
  bitmaps:
    - name: Feature
      description: "EnergyEvse cluster FeatureMap."
      value:
      - name: kChargingPreferences
        description: "The EVSE supports storing user charging preferences."
      - name: kPlugAndCharge
        description: "The EVSE supports Plug & Charge (PnC) functionality."
      - name: kRfid
        description: "The EVSE is fitted with an RFID reader."
      - name: kSoCReporting
        description: "The EVSE supports reporting of the vehicle's State of Charge (SoC)."
      - name: kV2X
        description: "The EVSE supports bidirectional charging and discharging."
    - name: TargetDayOfWeekBitmap
      description: "The day of the week."
      value:
      - name: kMonday
        description: "Monday."
      - name: kTuesday
        description: "Tuesday."
      - name: kWednesday
        description: "Wednesday."
      - name: kThursday
        description: "Thursday."
      - name: kFriday
        description: "Friday."
      - name: kSaturday
        description: "Saturday."
      - name: kSunday
        description: "Sunday."

  # EnergyEvse commands
  commands:
  - name: ClearTargets
    description:
    - "Allows a client to clear all stored charging targets."
  - name: EnableDischarging
    description:
    - "Enables the EVSE to discharge an electric vehicle."
    param:
    - name: dischargingEnabledUntil
      description: "The time, in UTC, when discharging becomes disabled.
        If the value is in the past, discharging is disabled. If the value is null, discharging is
        permanently enabled."
    - name: maximumDischargeCurrent
      description: "The maximum current, in milliamps, that the EVSE can receive
        from the electric vehicle."
  - name: Disable
    description:
    - "Disables the EVSE from charging and discharging."
  - name: EnableCharging
    description:
    - "Enables the EVSE to charge an electric vehicle."
    param:
    - name: chargingEnabledUntil
      description: "The time, in UTC, when charging becomes disabled.
        If the value is in the past, charging is disabled. If the value is null, charging is
        permanently enabled."
    - name: maximumChargeCurrent
      description: "The maximum current, in milliamps, that the EVSE can deliver
        to the electric vehicle."
    - name: minimumChargeCurrent
      description: "The minimum current, in milliamps, that the EVSE can deliver
        to the electric vehicle."
  - name: GetTargets
    description:
    - "Allows a client to retrieve the current set of charging targets."
    response:
      description: "The result of the `GetTargets` command."
      param:
      - name: chargingTargetSchedules
        description: "A list of up to seven sets of daily charging targets and their associated
        days of the week."
  - name: SetTargets
    description:
    - "Allows a client to set user-specified charging targets."
    param:
    - name: chargingTargetSchedules
      description: "A list of up to seven sets of daily charging targets and their associated
        days of the week. Each day of the week can
        be included in only a single `chargingTargetSchedule` in this field."
  - name: StartDiagnostics
    description:
    - "Puts the EVSE into self-diagnostics mode as long as the
       [supplyState][EnergyEvseTrait.Attributes.supplyState] attribute is in the `Disabled` state
         when the command is sent."

  # EnergyEVSE events
  events:
  - name: EnergyTransferStarted
    description: "Notification that the electric vehicle has started charging or discharging."
    value:
    - name: maximumDischargeCurrent
      description: "Indicates the value of the maximum discharging current at the time the event
        was generated."
    - name: maximumCurrent
      description: "The value of the maximum charging or discharging current in milliamps
        at the time the event was generated. This field is signed. A positive value indicates
        charging, and a negative value indicates discharging."
    - name: sessionID
      description: "The value of the [sessionId][EnergyEvseTrait.Attributes.sessionId] attribute
        at the time the event was generated."
    - name: state
      description: "The value of the [state][EnergyEvseTrait.Attributes.state] attribute
        at the time the event was generated."
  - name: EnergyTransferStopped
    description: "Notification that the electric vehicle has stopped charging or discharging."
    value:
    - name: energyDischarged
      description: "Indicates the amount of energy transferred from the EV to the EVSE since the
        previous `EnergyTransferStarted` event, in mWh."
    - name: energyTransferred
      description: "The amount of energy transferred between the electric vehicle and the EVSE
        since the previous `EnergyTransferStarted` event.
        This is a signed value in milliwatt hours. A positive value indicates the
        amount of energy transferred to the vehicle, and a negative value indicates energy
        transferred from the vehicle."
    - name: reason
      description: "The reason for stopping the energy transfer."
    - name: sessionID
      description: "The value of the [sessionId][EnergyEvseTrait.Attributes.sessionId]
        attribute prior to the energy transfer stopping."
    - name: state
      description: "The value of the [state][EnergyEvseTrait.Attributes.state]
        attribute prior to the energy transfer stopping."
  - name: EVConnected
    description: "Notification that the electric vehicle has connected to the EVSE."
    value:
    - name: sessionID
      description: "The new session ID created after the vehicle is plugged in."
  - name: EVNotDetected
    description: "Notification that the electric vehicle has been removed from the EVSE."
    value:
    - name: sessionDuration
      description: "The total duration of the session, from when the
        electric vehicle was plugged in until it was unplugged."
    - name: sessionEnergyCharged
      description: "The total amount of energy transferred from the EVSE to the electric vehicle
        during the session. This value is always a positive number."
    - name: sessionEnergyDischarged
      description: "The total amount of energy transferred from the electric vehicle to the EVSE
        during the session. This value is always a positive number."
    - name: sessionID
      description: "The current value of the [sessionId][EnergyEvseTrait.Attributes.sessionId]
        attribute."
    - name: state
      description: "The value of the [state][EnergyEvseTrait.Attributes.state] attribute prior to
        the electric vehicle not being detected."
  - name: Fault
    description: "Notification of a fault in the EVSE. The
      [supplyState][EnergyEvseTrait.Attributes.supplyState] attribute gets set
      to `DisabledError` and the type of fault detected by the EVSE is stored in the
      [faultState][EnergyEvseTrait.Attributes.faultState] attribute."
    value:
    - name: faultStateCurrentState
      description: "The current value of the [faultState][EnergyEvseTrait.Attributes.faultState]
        attribute."
    - name: faultStatePreviousState
      description: "The value of the [faultState][EnergyEvseTrait.Attributes.faultState]
        attribute prior to the fault state being changed."
    - name: sessionID
      description: "The value of the [sessionId][EnergyEvseTrait.Attributes.sessionId]
        attribute prior to
        the fault state being changed. A value of null indicates that no session occurred
        before the fault occurred."
    - name: state
      description: "The value of the [state][EnergyEvseTrait.Attributes.state]
        attribute prior to the fault state being changed."
  - name: Rfid
    description: "Notification that a radio frequency identification card (RFID) has been read.
      This allows a controller to register the card ID and use the ID to authenticate
      the user and start the charging session."
    value:
    - name: uid
      description: "The UID field (ISO 14443A UID), which is either 4, 7, or 10 bytes."

  # EnergyEvse enums
  enums:
  - name: EnergyTransferStoppedReasonEnum
    description: "The reason for stopping the energy transfer."
    value:
    - name: kEVSEStopped
      description: "The EVSE stopped the energy transfer."
    - name: kEVStopped
      description: "The electric vehicle stopped the energy transfer."
    - name: kOther
      description: "The energy transfer was stopped for an unknown reason."
  - name: FaultStateEnum
    description: "The fault state of the EVSE."
    value:
    - name: kContactDryFailure
      description: "The EVSE detected the absence of voltage after enabling the contactor."
    - name: kContactWetFailure
      description: "The EVSE detected voltage on charging pins when the contactor was open."
    - name: kEmergencyStop
      description: "The emergency stop button was pressed."
    - name: kEVDisconnected
      description: "The EVSE detected that the cable has been disconnected."
    - name: kGroundFault
      description: "The EVSE has an unbalanced current supply."
    - name: kLiveNeutralSwap
      description: "The EVSE detected a swap of the live and neutral wires."
    - name: kMeterFailure
      description: "The EVSE is unable to obtain electrical measurements."
    - name: kNoError
      description: "The EVSE is not in an error state."
    - name: kOther
      description: "The EVSE has detected an unknown fault."
    - name: kOverCurrent
      description: "The EVSE detected charging current higher than allowed by the charger."
    - name: kOverTemperature
      description: "The EVSE internal temperature is too high."
    - name: kOverVoltage
      description: "The EVSE input voltage level is too high."
    - name: kPilotShortCircuit
      description: "The EVSE pilot-signal amplitude short circuited to ground."
    - name: kPowerLoss
      description: "The EVSE has detected a loss in power."
    - name: kPowerQuality
      description: "The EVSE has detected a power-quality issue."
    - name: kUnderVoltage
      description: "The EVSE input voltage level is too low."
    - name: kWrongPowerSupply
      description: "The EVSE could not determine the proper power supply level."
  - name: StateEnum
    description: "The state of the electric vehicle."
    value:
    - name: kFault
      description: "The EVSE has detected a fault.
        See the [faultState][EnergyEvseTrait.Attributes.faultState] attribute for more information."
    - name: kNotPluggedIn
      description: "The electric vehicle is not plugged in."
    - name: kPluggedInCharging
      description: "The electric vehicle is plugged in, charging is in progress,
        and current is flowing."
    - name: kPluggedInDemand
      description: "The electric vehicle is plugged in and is demanding current,
        but the EVSE is not allowing current to flow."
    - name: kPluggedInNoDemand
      description: "The electric vehicle is plugged in and is not demanding current."
    - name: kPluggedInDischarging
      description: "The electric vehicle is plugged in, discharging is in progress,
        and current is flowing."
    - name: kSessionEnding
      description: "The electric vehicle is transitioning from any plugged-in state
        to `NotPluggedIn`."
  - name: SupplyStateEnum
    description: "Whether the electric vehicle is allowed to charge or disharge."
    value:
    - name: kEnabled
      description: "The electric vehicle is allowed to charge and discharge."
    - name: kChargingEnabled
      description: "The electric vehicle is allowed to charge."
    - name: kDisabled
      description: "The electric vehicle is not allowed to charge or discharge."
    - name: kDisabledDiagnostics
      description: "The electric vehicle is not allowed to charge or discharge due to being in
        a diagnostics mode."
    - name: kDisabledError
      description: "The electric vehicle is not allowed to charge or discharge due to an error."
    - name: kDischargingEnabled
      description: "The electric vehicle is allowed to discharge."

  # EnergyEvse structs
  structs:
  - name: ChargingTargetScheduleStruct
    description: "A set of user-specified charging targets for an electric vehicle
      for a set of specified days."
    value:
    - name: chargingTargets
      description: "A list of up to 10 charging targets for each of the associated days of the
        week."
    - name: dayOfWeekForSequence
      description: "The days of the week to which the charging targets
        should be associated. This field is a bitmap, which allows the associated targets
        to be applied to multiple days."
  - name: ChargingTargetStruct
    description: "A single user-specified charging target for an electric vehicle."
    value:
    - name: addedEnergy
      description: "The amount of energy, in milliwatt hours, that the user would like
        to have added to the vehicle before the [targetTimeMinutesPastMidnight] is reached."
    - name: targetTimeMinutesPastMidnight
      description: "The desired charging completion time of the associated day, where the time is
        represented by a 16-bit unsigned integer to designate the minutes past midnight.
        For example, 6 a.m. is represented by 360 minutes past midnight."
    - name: targetSoC
      description: "The target SoC, in percentage, that the vehicle should be charged to
        before the [targetTimeMinutesPastMidnight] is reached."

EnergyEvseMode:
  description: "Defines additional mode tags and namespaced enumerated values for electric vehicle
    supply equipment (EVSE) devices."

  # EnergyEvseMode attributes
  attributes:
  - name: supportedModes
    description: "The modes supported by the EVSE device."
  - name: currentMode
    description: "The current mode of the EVSE device."
  - name: startUpMode
    description: "The desired startup mode for the EVSE device when it is supplied with power."
  - name: onMode
    description: "The value of the [currentMode] that depends on the state of an [OnOff] cluster on
      the same EVSE endpoint."

  # EnergyEvseMode bitmaps
  bitmaps:
  - name: Feature
    description: "EnergyEvseMode cluster FeatureMap."
    value:
    - name: kOnOff
      description: "The EVSE device can be turned on and off. There is a dependency on the [OnOff]
        cluster."

  # EnergyEvseMode commands
  commands:
  - name: ChangeToMode
    description:
    - "Change device modes."
    param:
    - name: newMode
      description: "The mode to change to. This must be one of the
        [supportedModes][EnergyEvseModeTrait.Attributes.supportedModes]."
    response:
      description: "The result of the completed `ChangeToMode` command."
      param:
      - name: status
        description: "The status of the `ChangeToMode` command. Valid values are defined by the
          device manufacturer."
      - name: statusText
        description: "Text describing the status of the `ChangeToMode` command."

  # EnergyEvseMode enums
  enums:
  - name: ModeTag
    description: "Descriptive names of EVSE modes."
    value:
    - name: kAuto
      description: "Decides which options, features, and setting values to use."
    - name: kQuick
      description: "Optimizes for faster completion."
    - name: kQuiet
      description: "Operates silently or barely audibly."
    - name: kLowNoise
      description: "Optimizes for low noise operation."
    - name: kLowEnergy
      description: "Optimizes for lower energy usage."
    - name: kVacation
      description: "Provides a mode suitable for use during vacations or other extended absences."
    - name: kMin
      description: "Uses the lowest available setting value."
    - name: kMax
      description: "Uses the highest available setting value."
    - name: kNight
      description: "Provides a mode suitable for use during night time."
    - name: kDay
      description: "Provides a mode suitable for use during day time."
    - name: kV2X
      description: "Permits discharging based on the EV charge state and energy management control
        when enabled."
    - name: kManual
      description: "Manual mode"
    - name: kTimeOfUse
      description: "Time of use mode."
    - name: kSolarCharging
      description: "Solar charging mode."

  # EnergyEvseMode structs:
  structs:
  - name: ModeTagStruct
    description: "Describes a mode tag. The same manufacturer code and mode tag value in separate
      cluster instances are part of the same namespace and have the same meaning."
    value:
    - name: mfgCode
      description: "The manufacturer's vendor ID."
    - name: value
      description: "The mode tag within a mode tag namespace. If the `mfgCode` field exists, this
        is set to a manufacturer-defined value, otherwise, it's set to a standard value."
  - name: ModeOptionStruct
    description: "Represents the possible mode of the `EnergyEvse` instance."
    value:
    - name: label
      description: "Readable text that describes the mode option for the user."
    - name: mode
      description: "Identifies the mode option for the
          [supportedModes][EnergyEvseModeTrait.Attributes.supportedModes] attribute."
    - name: modeTags
      description: "A list of tags that are associated with the mode option, which may be used by a
        device to determine the semantics of a certain mode."

ExtendedAirQuality:
  description: "This trait supports devices which provide an interface to air quality measurement
    and classification, with optional destinction between indoor and outdoor measurements."

  # ExtendedAirQuality attributes
  attributes:
  - name: measuredValue
    description: "Currently measured AQI as a numeric value."
  - name: indoorMeasuredValue
    description: "Currently measured AQI as a numeric value (indoor)."
  - name: outdoorMeasuredValue
    description: "Currently measured AQI as a numeric value (outdoor)."
  - name: indoorAirQuality
    description: "Current descriptive air quality measured indoor. Valid qualities are defined in
      [AirQualityLevel][ExtendedAirQualityTrait.AirQualityLevel]."
  - name: outdoorAirQuality
    description: "Current descriptive air quality measured indoor. Valid qualities are defined in
      [AirQualityLevel][ExtendedAirQualityTrait.AirQualityLevel]."
  - name: minMeasuredValue
    description: "The minimum possible value of the measured value."
  - name: maxMeasuredValue
    description: "The maximum possible value of the measured value."
  - name: tolerance
    description: "Tolerance of the measured value."

  # ExtendedAirQuality bitmaps
  bitmaps:
  - name: AirQualityFeature
    description: "ExtendedAirQuality trait feature map."
    value:
    - name: kIndoorFair
      description: "The device supports the Fair descriptive air quality level for indoor
        measurement."
    - name: kIndoorModerate
      description: "The device supports the Moderate descriptive air quality level for indoor
        measurement."
    - name: kIndoorVeryPoor
      description: "The device supports the Very Poor descriptive air quality level for indoor
        measurement."
    - name: kIndoorExtremelyPoor
      description: "The device supports the Extremely Poor descriptive air quality level for indoor
        measurement."
    - name: kOutdoorFair
      description: "The device supports the Fair descriptive air quality level for outdoor
        measurement."
    - name: kOutdoorModerate
      description: "The device supports the Moderate descriptive air quality level for outdoor
        measurement."
    - name: kOutdoorVeryPoor
      description: "The device supports the Very Poor descriptive air quality level for outdoor
        measurement."
    - name: kOutdoorExtremelyPoor
      description: "The device supports the Extremely Poor descriptive air quality level for
        outdoor measurement."
    - name: kNumeric
      description: "The device supports AQI numeric value."
    - name: kIndoorNumeric
      description: "The device supports AQI numeric value for indoor measurement."
    - name: kOutdoorNumeric
      description: "The device supports AQI numeric value for outdoor measurement."

  # ExtendedAirQuality enums
  enums:
  - name: AirQualityLevel
    description: "The air quality level."
    value:
    - name: kUnspecified
      description: "The air quality is unknown."
    - name: kGood
      description: "The air quality is good."
    - name: kFair
      description: "The air quality is fair."
    - name: kModerate
      description: "The air quality is moderate."
    - name: kPoor
      description: "The air quality is poor."
    - name: kVeryPoor
      description: "The air quality is very poor."
    - name: kExtremelyPoor
      description: "The air quality is extremely poor."
  - name: MeasurementLocation
    description: "The location of the measurement."
    value:
    - name: kUnspecified
      description: "Measurement location is unspecified."
    - name: kIndoor
      description: "Measurement location is indoors."
    - name: kOutdoor
      description: "Measurement location is outdoors."

  # ExtendedAirQuality events
  events:
  - name: AirQuality
    description: "Notification of the current air quality level."
    value:
    - name: priority
      description: "Represents the notification level. The currently supported value is 0, which
        indicates that the notification should be spoken aloud."
    - name: triggeredDeviceId
      description: "The ID of the device that triggered the event, which may be different than the
        device transmitting the notification."
    - name: levelValue
      description: "Descriptive air quality level value. Valid qualities are defined in
        [AirQualityLevel][ExtendedAirQualityTrait.AirQualityLevel]."
    - name: location
      description: "The location where air quality is measured."
  - name: AirQualitySensorError
    description: "Notification of an error with the air quality sensor."
    value:
    - name: priority
      description: "Represents the notification level. The currently supported value is 0, which
        indicates that the notification should be spoken aloud."
    - name: errorCode
      description: "The air quality sensor's error code."

ExtendedApplicationLauncher:
  description: "This trait supports devices which are able to switch between applications."

  # ExtendedApplicationLauncher attributes
  attributes:
  - name: availableApplications
    description: "A list of applications. Each application has one or more synonyms in each
      supported language. The first synonym is used in the response."
  - name: currentApplicationKey
    description: "Key value of the current application that is active in the foreground."
  - name: useGlobalApplicationCatalog
    description: "Use global application catalog."
  - name: type
    description: "Launcher application's type."

  # ExtendedApplicationLauncher commands
  commands:
  - name: InstallApp
    description:
    - "Install the given application."
    param:
    - name: newApplicationName
      description: "Name of the application to install."
    - name: newApplication
      description: "Key of the application to install."
  - name: SearchApp
    description:
    - "Search for the given application."
    param:
    - name: newApplicationName
      description: "Name of the application to search for."
    - name: newApplication
      description: "Key of the application to search for."
  - name: LaunchApp
    description:
    - "Launch the given application."
    param:
    - name: newApplicationName
      description: "Name of the application to launch."
    - name: newApplication
      description: "Key of the application to launch."

  # ExtendedApplicationLauncher enums
  enums:
  - name: ApplicationType
    description: "The type of an application."
    value:
    - name: kUnspecified
      description: "Unspecified."
    - name: kApplication
      description: "A generic application."
    - name: kGame
      description: "Application is a game."

  # ExtendedApplicationLauncher structs
  structs:
  - name: ApplicationNames
    description: "Application names and language-specific synonyms."
    value:
    - name: language
      description: "The language code, for example, `en` for English."
    - name: nameSynonym
      description: "User-friendly synonyms for the application name for a given language. The first
        synonym is used in the response."
  - name: AvailableApplication
    description: "Represents an application that users of this device can interact with."
    value:
    - name: key
      description: "Unique key for the application which is not exposed to users in speech or
        response."
    - name: names
      description: "Application's names and language-specific synonyms."

ExtendedBasicInformation:
  description: "This trait is used to display basic information about a device, and is an extension
    of the Matter standard trait, `BasicInformation`."

  # ExtendedBasicInformation commands
  commands:
  - name: GetSerialNumber
    description:
    - "Gets the serial number of the device."
    response:
      description: "The result of the `GetSerialNumber` command."
      param:
      - name: serialNumber
        description: "The serial number of the device."

ExtendedChannel:
  description: "This trait supports devices that support TV channels on a media device."

  # ExtendedChannel attributes
  attributes:
  - name: extendedChannelList
    description: "List of objects describing available media channels for this particular device.
      Each item describes a channel the user can select on this device."
  - name: channelCatalog
    description: "An identifier of a catalog with channels information."

  # ExtendedChannel commands
  commands:
  - name: ReturnChannel
    description:
    - "Return to the last/previous channel the user was on."

  # ExtendedChannel structs
  structs:
  - name: ExtendedMediaChannel
    description: "Media channel description."
    value:
    - name: number
      description: "Optional numeric identifier for this channel, for example `256` or `13.1`."
    - name: key
      description: "Unique identifier for this channel. Not exposed to users."
    - name: names
      description: "List of user-visible names for this channel."

ExtendedColorControl:
  description: "This trait provides additional features related to color control and is
    an extension of the Matter standard trait, `ColorControl`."

  # ExtendedColorControl attributes
  attributes:
  - name: colorLoopEndTimestampSeconds
    description: "Unix timestamp when the color loop effect is expected to end."
  - name: currentBlue
    description: "The current color of blue in RGB semantics, with a range of 0 to 255."
  - name: currentGreen
    description: "The current color of green in RGB semantics, with a range of 0 to 255."
  - name: currentRed
    description: "The current color of red in RGB semantics, with a range of 0 to 255."
  - name: currentHue
    description: "The current hue in HSV semantics, with a range of 0 to 360."
  - name: currentName
    description: "Name of the current color."
  - name: currentSaturation
    description: "The current saturation in HSV semantics, with a range of 0 to 1."
  - name: currentValue
    description: "The current value in HSV semantics, with a range of 0 to 1."

  # ExtendedColorControl commands
  commands:
  - name: MoveToColorHSV
    description:
    - "Moves a device to the color specified in HSV semantics."
    param:
    - name: hue
      description: "Moves a device to the provided hue, whose range is 0 to 360."
    - name: saturation
      description: "Moves a device to the provided saturation, whose range is 0 to 1."
    - name: value
      description: "Moves a device to the provided value, whose range is 0 to 1."
  - name: MoveToColorName
    description:
    - "Moves the device to the color named."
    param:
    - name: colorName
      description: "Name of the color."
  - name: MoveToColorRGB
    description:
    - "Moves a device to the color specified in RGB semantics. The device may move to a color
      that approximates the requested color, depending on the capabilities of the device."
    param:
    - name: blue
      description: "Moves a device to the provided color of blue, whose range is 0 to 155."
    - name: green
      description: "Moves a device to the provided color of green, whose range is 0 to 155."
    - name: red
      description: "Moves a device to the provided color of red, whose range is 0 to 155."

ExtendedDoorLock:
  description: "This trait is for devices with extended door lock functionality."

  # ExtendedDoorLock attributes
  attributes:
  - name: enableLockHomeAwayAssist
    description: "Whether the device is enabled for home-away assist lock setting."
  - name: ignoreAutoRelockOnStructureMode
    description: "Structure modes for which the device should ignore auto relock settings."

  # ExtendedDoorLock enums
  enums:
  - name: LockOperationSourceEnum
    description: "The source of the lock operation."
    value:
    - name: kAliro
      description: "Aliro."
    - name: kAuto
      description: "Auto."
    - name: kBiometric
      description: "Biometric."
    - name: kButton
      description: "Button."
    - name: kKeypad
      description: "Keypad."
    - name: kManual
      description: "Manual."
    - name: kProprietaryRemote
      description: "Proprietary remote."
    - name: kRemote
      description: "Remote."
    - name: kRfid
      description: "RFID."
    - name: kSchedule
      description: "Schedule."
    - name: kUnspecified
      description: "Unspecified."
  - name: LockOperationTypeEnum
    description: "The operation type of the lock."
    value:
    - name: kForcedUserEvent
      description: "A forced user event occurred."
    - name: kLock
      description: "The lock is in the locked state."
    - name: kNonAccessUserEvent
      description: "A non-access user event occurred."
    - name: kUnlatch
      description: "The lock is in the unlatched state."
    - name: kUnlock
      description: "The lock is in the unlocked state."
    - name: kUnspecified
      description: "Unspecified."
  - name: PrivacyModeActorMethodEnum
    description: "The method of the privacy mode actor for changing a lock-related state."
    value:
    - name: kOther
      description: "Change produced by an unspecified entity that doesn't fall into one of
        the defined categories."
    - name: kPhysical
      description: "The change was caused by the actor's physical interaction with the lock."
    - name: kRemoteDelegate
      description: "The change was produced by a remote service with no user intent."
    - name: kRemoteReminderExplicit
      description: "The change was produced explicitly by a remote service that was confirmed
        by a user."
    - name: kRemoteReminderImplicit
      description: "The change was produced implicitly by a remote service
        that was confirmed by a user."
    - name: kRemoteUserExplicit
      description: "The change was produced by an actor using the app."
    - name: kRemoteUserImplicit
      description: "The change was produced by an actor with implicit intent."
    - name: kRemoteUserOther
      description: "The change was produced by a user that does not fit in one of the other app
        remote categories."
    - name: kUnspecified
      description: "Unspecified."
  - name: StructureMode
    description: "The structure mode."
    value:
    - name: kStructureModeHome
      description: "Home mode - users are home."
    - name: kStructureModeAway
      description: "Away mode - users are away."
    - name: kStructureModeSleep
      description: "Sleep mode - users are sleeping."
    - name: kStructureModeVacation
      description: "Vacation mode - users are on vacation."
    - name: kStructureModeUnspecified
      description: "Unspecified."

  # ExtendedDoorLock events
  events:
  - name: LockStateChange
    description: "Event to indicate lock and unlock actions."
    value:
    - name: actor_name
      description: "The name of the actor who took the action."
    - name: fabric_index
      description: "The field to store the fabric index."
    - name: lock_operation_type
      description: "The operation type of the lock."
    - name: lock_operation_source
      description: "The source of the lock operation."
    - name: priority
      description: "The notification level, whose currently supported value is 0, which
        indicates that the notification should be spoken."
    - name: timeStampSeconds
      description: "The timestamp of the event in seconds."
    - name: user_index
      description: "The field to store the user index."
    - name: user_id
      description: "The field to store the user ID."
  - name: PrivacyModeStateChange
    description: "Event to indicate privacy mode change."
    value:
    - name: privacy_mode_on
      description: "The current state for privacy mode on the device."
    - name: privacy_mode_actor
      description: "Describes who and what last caused the privacy mode state to change."

  # ExtendedDoorLock structs
  structs:
  - name: PrivacyModeActor
    description: "Describes who and what last caused the privacy mode state to change."
    value:
    - name: actor_name
      description: "The name of the actor who took the action."
    - name: privacy_mode_actor_method
      description: "The method of the privacy mode actor for changing a lock-related state."
    - name: timeStampSeconds
      description: "The timestamp of the event in seconds."
    - name: user_id
      description: "The user ID of the actor who took the action."

ExtendedFanControl:
  description: "This trait is for devices with extended fan controls."

  # ExtendedFanControl attributes
  attributes:
  - name: customFanMode
    description: "The currently selected custom speed setting."
  - name: customFanModes
    description: "The custom speed settings supported by this device."

  # ExtendedFanControl bitmaps
  bitmaps:
  - name: FanControlFeature
    description: "ExtendedFanControl trait feature map."
    value:
    - name: kSupportsFanSpeedPercent
      description: "Whether this device accepts commands for adjusting the speed using a percentage
        from 0.0 to 100.0."

  # ExtendedFanControl commands
  commands:
  - name: ExtendedStep
    description:
    - "Set the relative speed."
    param:
    - name: fanSpeedRelativeWeight
      description: "The relative amount of the speed change. The absolute value indicates the scaled
        amount while the numerical sign indicates the direction of the change."
    - name: direction
      description: "The direction in which the speed should change."
  - name: ToggleAirflowDirection
    description:
    - "Reverse the current direction of the airflow."

  # ExtendedFanControl enums
  enums:
  - name: StepMode
    description: "Whether the speed should increase or decrease."
    value:
    - name: kUnspecified
      description: "Unspecified direction."
    - name: kIncrease
      description: "Increase speed."
    - name: kDecrease
      description: "Decrease speed."

  # ExtendedFanControl structs
  structs:
  - name: SpeedValues
    description: "Synonyms for the speed setting in each supported language."
    value:
    - name: lang
      description: "ISO 639-1 language code, for example, `en` for English."
    - name: speedSynonym
      description: "The descriptive name of the speed setting."
  - name: Speed
    description: "A named speed setting."
    value:
    - name: speedName
      description: "The name of the speed setting."
    - name: speedValues
      description: "Synonyms for the speed setting in each supported language."
  - name: AvailableFanSpeeds
    description: "The speed settings supported by the device."
    value:
    - name: ordered
      description: "Indicates that the `speeds` list is in ascending speed order."
    - name: speeds
      description: "List of speed settings."

ExtendedGeneralDiagnostics:
  description: "This trait is for devices that support extended general diagnostics."

  # ExtendedGeneralDiagnostics attributes
  attributes:
  - name: analyticsEnabled
    description: "Specifies whether analytics is enabled. Setting this to `true` also enables log
      upload."
  - name: extendedActiveHardwareFaults
    description: "Not supported."
  - name: lastContactTimestamp
    description: "The last time the device had contact with the cloud."
  - name: logUploadEnabled
    description: "Specifies whether log files will be uploaded to the cloud."
  - name: sensorFaults
    description: "Not supported."

  # ExtendedGeneralDiagnostics enums
  enums:
  - name: ExtendedHardwareFault
    description: "ExtendedHardwareFault"
    value:
    - name: kAudioOutputFault
      description: "Fault with the audio output."
    - name: kPiezoFault
      description: "Fault with the piezo buzzer."
    - name: kStandard
      description: "Fault with the standard cluster."
    - name: kUnknownValue
      description: "Unknown value."
  - name: SensorFaultType
    description: "SensorFaultType"
    value:
    - name: kUnknown
      description: "Unknown sensor fault."
    - name: kCO
      description: "CO sensor fault."
    - name: kLed
      description: "LED sensor fault."
    - name: kSmoke
      description: "Smoke sensor fault."
    - name: kUnknownValue
      description: "Unknown value."
    - name: kUnspecified
      description: "Unspecified sensor fault."

  # ExtendedGeneralDiagnostics events
  events:
  - name: ExtendedHardwareFaultChangeEvent
    description: "ExtendedHardwareFaultChangeEvent"
    value:
    - name: current
      description: "The current hardware fault types."
    - name: currentSensorFaults
      description: "The current sensor fault types"
    - name: previous
      description: "A list of the previous hardware faults that were present the last time the
        device had a hardware fault."
    - name: previousSensorFaults
      description: "A list of the previous sensor fault types that were present the last time the
        device had a sensor fault."
    - name: priority
      description: "Represents the notification level. The sole supported value is 0, which
        indicates that the notification should be spoken aloud."

  # ExtendedGeneralDiagnostics structs
  structs:
  - name: ExtendedHardwareFaultChange
    description: "ExtendedHardwareFaultChange"
    value:
    - name: current
      description: "The current hardware fault types."
    - name: currentSensorFaults
      description: "The current sensor fault types."
    - name: previous
      description: "A list of the previous hardware faults that were present the last time the
        device had a hardware fault."
    - name: previousSensorFaults
      description: "A list of the previous sensor fault types that were present the last time the
        device had a sensor fault."
    - name: priority
      description: "Represents the notification level. The sole supported value is 0, which
        indicates that the notification should be spoken aloud."

ExtendedLevelControl:
  description: "This trait belongs to devices which have a volume control."

  # ExtendedLevelControl attributes
  attributes:
  - name: defaultStepSize
    description: "The default step size for relative volume queries."

ExtendedMediaInput:
  description: "This trait is an extension of the Matter standard trait, `MediaInput`, and is used
    by devices that can switch inputs."

  # ExtendedMediaInput attributes
  attributes:
  - name: currentCustomInput
    description: "Key of the input currently in use."
  - name: customInputsList
    description: "List of objects representing input audio or video feeds. Feeds can be hardwired
      or networked, and each feed should be named and be reasonably persistent."
  - name: customInputsOrdered
    description: "This is `true` if the list of outputs is ordered, and also indicates
      that the next and previous functionality is available."

  # ExtendedMediaInput commands
  commands:
  - name: SelectCustomInput
    description:
    - "Set the media input."
    param:
    - name: newInput
      description: "Key of the new input."
  - name: NextInput
    description:
    - "Select the next input. Applicable only when the
      [customInputsOrdered][ExtendedMediaInputTrait.Attributes.customInputsOrdered] attribute
      is set to `true`."
  - name: PreviousInput
    description:
    - "Select the previous input. Applicable only when the
      [customInputsOrdered][ExtendedMediaInputTrait.Attributes.customInputsOrdered] attribute
      is set to `true`."

  # ExtendedMediaInput structs
  structs:
  - name: AvailableInput
    description: "Available-input definitions."
    value:
    - name: key
      description: "Unique key for the input. The key should not be exposed to users in speech or
        response."
    - name: names
      description: "List of names for the input for all available languages."
  - name: InputNames
    description: "Input names for a given available language."
    value:
    - name: lang
      description: "Language code."
    - name: nameSynonym
      description: "User-friendly names for the input, in a given language. The first synonym
        is used in Google Assistant's response to the user."

ExtendedPowerSource:
  description: "This trait belongs to devices which have a power source."

  # ExtendedPowerSource attributes
  attributes:
  - name: powerSource
    description: "The current power source."
  - name: energyStorageDistanceUnitForUX
    description: "The energy storage distance unit visible to the user."
  - name: descriptiveCapacityRemaining
    description: "The description of the remaining capacity."
  - name: capacityRemaining
    description: "The remaining capacity."
  - name: capacityUntilFull
    description: "The remaining capacity until full."
  - name: isPluggedIn
    description: "Indicates whether the device is plugged in."
  - name: chargeSpeed
    description: "The charge speed."
  - name: batterySaverEnabled
    description: "Indicates whether battery saver mode is enabled."
  - name: energySource
    description: "The energy source."
  - name: usingBackupEnergySource
    description: "Indicates whether the device is using backup energy source."

  # ExtendedPowerSource commands
  commands:
  - name: StartChargingCommand
    description:
    - "Start charging."
  - name: StopChargingCommand
    description:
    - "Stop charging."

  # ExtendedPowerSource enums
  enums:
  - name: DescriptiveCapacityRemaining
    description: "The description of the remaining capacity."
    value:
    - name: kUnspecified
      description: "Unspecified."
    - name: kEmpty
      description: "Empty."
    - name: kCriticallyLow
      description: "Critically low."
    - name: kLow
      description: "Low."
    - name: kMedium
      description: "Medium."
    - name: kHigh
      description: "High."
    - name: kFull
      description: "Full."
    - name: kOk
      description: "OK."
  - name: DistanceUnit
    description: "The distance unit."
    value:
    - name: kUnspecified
      description: "Unspecified."
    - name: kKilometers
      description: "Kilometers."
    - name: kMiles
      description: "Miles."
  - name: CapacityUnit
    description: "The unit of capacity."
    value:
    - name: kUnspecified
      description: "Unspecified."
    - name: kMiles
      description: "Miles."
    - name: kKilometers
      description: "Kilometers."
    - name: kKilowattHours
      description: "Kilowatt hours."
  - name: ChargeSpeed
    description: "Charging speed."
    value:
    - name: kUnspecified
      description: "Unspecified."
    - name: kSlow
      description: "Slow."
    - name: kNormal
      description: "Normal."
    - name: kRapid
      description: "Rapid."
  - name: EnergySource
    description: "Energy source."
    value:
    - name: kUnspecified
      description: "Unspecified."
    - name: kBattery
      description: "Battery."
    - name: kSolar
      description: "Solar."

ExtendedOperationalState:
  description: "This trait represents any device that supports operating in specific zones, and has
    an ongoing duration for its operation which can be queried."

  # ExtendedOperationalState attributes
  attributes:
  - name: operationZones
    description: "Indicates supported zone names. Strings should be localized as set by the user.
      This list is not exclusive and users can report any names they want."
  - name: activeOperationZones
    description: "Indicates operation zones in which the device is currently running, from the list
      of available zones."
  - name: currentPhaseCountdownTimeSeconds
    description: "Time remaining on current cycle, in seconds."
  - name: minOperationDurationSeconds
    description: "Indicates the minimum operation duration the device supports."
  - name: maxOperationDurationSeconds
    description: "Indicates the maximum operation duration the device supports."
  - name: operationCompletionTimestamp
    description: "Indicates expected operation completion time if the device was started with the
      [startWithDuration](ExtendedOperationalState.startWithDuration) command
      (Unix epoch timestamp in seconds)."

  # ExtendedOperationalState commands
  commands:
  - name: StartWithOperationZones
    description:
    - "Start the device in one or more operation zones."
    param:
    - name: operationZones
      description: "Indicates one or more zones in which to start running."
  - name: StartWithDuration
    description:
    - "Start the device in one or more operation zones for the specified duration."
    param:
    - name: operationZones
      description: "Indicates one or more zones in which to start running."
    - name: durationSeconds
      description: "Indicates how long the action should run, in seconds. Must be between
        minimum and maximum operation duration supported by the device."

  # ExtendedOperationalState enums
  enums:
  - name: StatusEnum
    description: "Status of the initial command and follow up response."
    value:
    - name: kUnspecified
      description: "Unspecified."
    - name: kSuccess
      description: "Success."
    - name: kFailure
      description: "Failure."

  # ExtendedOperationalState events
  events:
  - name: StartStopFollowUp
    description: "Follow-up event for start and stop commands."
    value:
    - name: isRunning
      description: "Indicates whether the device was successfully started or stopped."
  - name: PauseUnpauseFollowUp
    description: "Follow-up event for pause/unpause commands."
    value:
    - name: isPaused
      description: "Indicates whether the device was successfully paused or resumed."
  - name: StartStopErrorFollowUp
    description: "Follow-up event for generic command errors."
    value:
    - name: errorCode
      description: "The error encountered when processing the command if the status
        has `Failure` value."

  # ExtendedOperationalState bitmaps
  bitmaps:
  - name: OperationalStateFeature
    description: "ExtendedOperationalState cluster FeatureMap."
    value:
    - name: kSupportsZones
      description: "Supports limiting its operation in user-specified zones."
    - name: kSupportsDuration
      description: "Supports operating for a user-specified duration of time."

ExtendedTemperatureControl:
  description: "Trait for devices, other than thermostats, that support controlling temperature,
    either within or around the device."

  # ExtendedTemperatureControl attributes
  attributes:
  - name: temperatureDisplayMode
    description: "Indicates the units of temperature displayed on the thermostat screen."

  # ExtendedTemperatureControl enums
  enums:
  - name: TemperatureDisplayMode
    description: "The units of temperature displayed on the thermostat screen."
    value:
    - name: kUnspecified
      description: "Unspecified."
    - name: kCelsius
      description: "Celsius."
    - name: kFahrenheit
      description: "Fahrenheit."

  # ExtendedTemperatureControl events
  events:
  - name: TemperatureSetpointReached
    description: "Notification that a device has reached its target temperature."
    value:
    - name: priority
      description: "Represents the notification level. The currently supported value is 0, which
        indicates that the notification should be spoken aloud."
    - name: targetTemperatureReached
      description: "Indicates whether the device was being preheated or otherwise reached its
        target temperature."
    - name: temperatureSetpointCelsius
      description: "The temperature in Celsius the device is set to, with a resolution of 0.01°C."
  - name: TemperatureControlError
    description: "Notification that a device hasn't been able to reach the target temperature
      due to an error."
    value:
    - name: errorCode
      description: "The error encountered."

ExtendedThermostat:
  description: "This trait covers handling both temperature point and modes, and is an extension
    of the Matter standard trait, Thermostat."

  # ExtendedThermostat attributes
  attributes:
  - name: activePresetHandle
    description: "The current preset handle that is running, from the list of supported presets.
      This attribute is not set if no presets are actively running."
  - name: activeRemoteTemperatureSensorIds
    description: "The external device IDs of remote, active temperature sensors that this device
      can detect. This attribute is not set if the device does not currently have any active,
      remote temperature sensors."
  - name: averageLocalTemperature
    description: "The average ambient temperature across all active sensors, in Celsius
      with a resolution of 0.01°C. This attribute gets set if the device has multiple active
      temperature sensors."
  - name: extendedProgrammingOperationMode
    description: "Additional information about the operational status of the device."
  - name: extendedRunningMode
    description: "Currently running mode of the device."
  - name: extendedSetpointChangeSource
    description: "The source of the current temperature hold."
  - name: extendedSupportedModes
    description: "The extended thermostat modes that this device supports."
  - name: extendedSystemMode
    description: "The current mode of the device."
  - name: maxCoolSafetySetpointLimit
    description: "Maximum threshold of the supported temperature range for cooling."
  - name: maxHeatSafetySetpointLimit
    description: "Maximum threshold of the supported temperature range for heating."
  - name: maxSetpointHoldSeconds
    description: "The maximum number of seconds that a temperature setpoint can be held.
      Setting this value to `-1` indicates that there is no limit to the hold duration.
      If unset, holding the temperature to a setpoint is not supported."
  - name: maxSettableThermostatTemperatureSensors
    description: "The number of temperature sensors that can be simultaneously active for this
      thermostat."
  - name: minCoolSafetySetpointLimit
    description: "Minimum threshold of the supported temperature range for cooling."
  - name: minHeatSafetySetpointLimit
    description: "Minimum threshold of the supported temperature range for heating."
  - name: presets
    description: "Information about the presets that the devices supports."
  - name: remoteTemperatureSensorIds
    description: "The external device IDs of remote temperature sensors that this device
      can detect."
  - name: targetTemperatureTimestampSeconds
    description: "A timestamp representing the estimated time when the target temperature
      will be reached."
  - name: temperatureSetpointHoldExpiryTimestampSeconds
    description: "The Unix Epoch timestamp of when an active temperature hold expires. Setting
      this value to `-1` indicates that the hold has no expiration."

  # ExtendedThermostat bitmaps
  bitmaps:
  - name: ExtendedThermostatFeature
    description: "ExtendedThermostat trait feature map."
    value:
    - name: kPresets
      description: "Whether this device supports presets."
    - name: kRemoteTemperatureSensing
      description: "Whether this device supports remote temperature sensors."
  - name: ExtendedProgrammingOperationMode
    description: "Thermostat-extended operation modes."
    value:
    - name: kSafetyOverride
      description: "The thermostat is currently heating or cooling due to safety thresholds
        being met."
    - name: kPreconditioningEnergyProgram
      description: "The thermostat is preconditioning due to an upcoming energy program event."
    - name: kPreconditioningSchedule
      description: "The thermostat is preconditioning for an upcoming scheduled event."

  # ExtendedThermostat enums
  enums:
  - name: ExtendedRunningMode
    description: "The current mode of the device."
    value:
    - name: kAuto
      description: "Automatic mode with the temperature set from a schedule or by learned behavior."
    - name: kDry
      description: "Dry mode."
    - name: kEco
      description: "Energy-saving mode."
    - name: kFanOnly
      description: "Fan running without heating or cooling activity."
    - name: kHeatCool
      description: "Maintaining the heating and cooling targets within a range."
    - name: kOn
      description: "Restores the previous mode of the device."
    - name: kOff
      description: "Disables heating and cooling activity."
    - name: kPurifier
      description: "Purifying mode."
    - name: kStandard
      description: "The thermostat is running in one of the standard modes,
        not in any of the defined extended modes for this trait. For more information, refer
        to the `thermostatRunningMode` attribute of the Thermostat cluster."
  - name: ExtendedSetpointChangeSource
    description: "The source of the current temperature hold."
    value:
    - name: kEnergyProgram
      description: "This hold was set by an active energy program."
    - name: kUnspecified
      description: "Unspecified source."
  - name: ExtendedThermostatMode
    description: "Represents a mode in which a thermostat can operate."
    value:
    - name: kEco
      description: "Energy-saving mode."
    - name: kOn
      description: "Restores the previous mode of the device."
    - name: kPurifier
      description: "Purifying mode."
    - name: kStandard
      description: "The thermostat is running in one of the standard modes,
        not in any of the defined extended modes for this trait.
        For more information, refer to the `systemMode` attribute of the Thermostat cluster."
  - name: PresetScenario
    description: "The type of preset."
    value:
    - name: kAway
      description: "Away, also known as Leave."
    - name: kComfort
      description: "Temperature is optimized for comfort."
    - name: kEco
      description: "Energy-saving mode."
    - name: kHome
      description: "Home, also known as Return."
    - name: kOccupied
      description: "For use when the space is occupied.      "
    - name: kSleep
      description: "Temperature is optimized for sleeping."
    - name: kUnoccupied
      description: "For use when the space is vacant."
    - name: kUnspecified
      description: "Unspecified."
    - name: kUserDefined
      description: "User-defined preset."
    - name: kVacation
      description: "Temperature is optimized for vacation."
    - name: kWake
      description: "Temperature is optimized for when the user is awake."

  # ExtendedThermostat structs
  structs:
  - name: Preset
    description: "Information about a preset."
    value:
    - name: names
      description: "Synonyms for the preset in each supported language."
    - name: presetHandle
      description: "The internal handle of the temperature preset that is used in commands and
        states. This handle can be non-user-friendly, and it is shared across all languages."
    - name: presetMaxHoldSeconds
      description: "The maximum number of seconds this preset can be held. A setting of `-1`
        means there is is no limit on the hold duration. If unset, holding this preset is
        not supported."
    - name: presetScenario
      description: "The type of this preset, which determines which icon will be used to represent
        this preset on touch surfaces."
  - name: PresetSynonyms
    description: "Synonyms for the preset in a given language."
    value:
    - name: language
      description: "ISO 639-1 language code, for example, `en` for English."
    - name: synonyms
      description: "Synonym of the preset, with the first string in this list being used as
        the canonical name of the preset in the given language."

FanControl:
  description: "This trait provides an interface for controlling the speed of a fan."

  # FanControl attributes
  attributes:
  - name: fanMode
    description: "The current speed mode of the fan. Valid modes are defined in
      [FanModeEnum][FanControlTrait.FanModeEnum]."
  - name: fanModeSequence
    description: "The supported fan speed ranges. Valid modes are defined in
      [FanModeSequenceEnum][FanControlTrait.FanModeSequenceEnum]."
  - name: percentSetting
    description: "The speed setting for the fan."
  - name: percentCurrent
    description: "The actual currently operating fan speed, or `0` to indicate that the fan is off."
  - name: speedMax
    description: "The fan speed (value of `1`) or the maximum speed, if the fan is capable of
      multiple speeds,"
  - name: speedSetting
    description: "The speed setting for the fan."
  - name: speedCurrent
    description: "The actual currently operating fan speed, or `0` to indicate that the fan is off."
  - name: rockSupport
    description: "A bitmap that indicates what rocking motions the server supports. Valid
      values are:
      <ul><li><code>0</code> — RockLeftRight</li>
      <li><code>1</code> —  RockUpDown</li>
      <li><code>2</code> —  RockRound</li></ul>"
  - name: rockSetting
    description: "A bitmap that indicates the current active fan rocking motion settings."
  - name: windSupport
    description: "A bitmap that indicates what wind modes the server supports. Valid values are:
         <ul><li><code>0</code> — Sleep Wind</li>
         <li><code>1</code> —  Natural Wind</li></ul>"
  - name: windSetting
    description: "A bitmap that indicates the current active fan wind feature settings. Valid
      values are:
         <ul><li><code>0</code> — Sleep Wind</li>
         <li><code>1</code> —  Natural Wind</li></ul>"
  - name: airflowDirection
    description: "Indicates the current airflow direction of the fan. May be written by a client to
      indicate a new airflow direction for the fan."

  # FanControl commands
  commands:
  - name: Step
    description:
    - "Speed up or slow down the fan, in steps, without the client having to know the fan speed."
    param:
    - name: direction
      description: "Whether the fan speed increases or decreases to the next step value. Valid
        directions are defined in [StepDirectionEnum][FanControlTrait.StepDirectionEnum]."
    - name: wrap
      description: "Fan speed wraps between highest and lowest step value."
    - name: lowestOff
      description: "Whether the fan being off (speed value `0`) is included as a step value."

  # FanControl bitmaps
  bitmaps:
  - name: Feature
    description: "FanControl cluster FeatureMap."
    value:
    - name: kMultiSpeed
      description: "Supports 1-100 speeds."
    - name: kAuto
      description: "Supports automatic fan speed mode."
    - name: kRocking
      description: "Supports rocking movement."
    - name: kWind
      description: "Supports wind emulation."
    - name: kStep
      description: "Supports fan speeds in steps."
    - name: kAirflowDirection
      description: "Supports air flow direction."
  - name: RockBitmap
    description: "The current active fan rocking motion setting."
    value:
    - name: kRockLeftRight
      description: "The fan is using a rock left to right setting."
    - name: kRockUpDown
      description: "The fan is using a rock up and down setting."
    - name: kRockRound
      description: "The fan is using a rock around setting."
  - name: WindBitmap
    description: "The current active fan wind feature setting."
    value:
    - name: kSleepWind
      description: "The fan is using a sleep wind setting."
    - name: kNaturalWind
      description: "The fan is using a natural wind setting."

  # FanControl enums
  enums:
  - name: AirflowDirectionEnum
    description: "Specifies the air flow direction."
    value:
    - name: kForward
      description: "Fan is using forward air direction."
    - name: kReverse
      description: "Fan is using reverse air direction."
  - name: FanModeEnum
    description: "Specifies the current fan mode."
    value:
    - name: kOff
      description: "The fan is off. Selecting this mode sets the
        [percentSetting][FanControlTrait.Attributes.percentSetting] and
        [percentCurrent][FanControlTrait.Attributes.percentCurrent] attributes and, if present,
        the [speedSetting][FanControlTrait.Attributes.speedSetting] and
        [speedCurrent][FanControlTrait.Attributes.speedCurrent] attributes to 0 (zero)."
    - name: kLow
      description: "The fan is using a low speed. Selecting this mode sets the attributes
        [speedSetting][FanControlTrait.Attributes.speedSetting],
        [speedCurrent][FanControlTrait.Attributes.speedCurrent],
        [percentSetting][FanControlTrait.Attributes.percentSetting] and,
        [percentCurrent][FanControlTrait.Attributes.percentCurrent] to a single value in the
        corresponding range."
    - name: kMedium
      description: "The fan is using a medium speed. Selecting this mode sets the attributes
        [speedSetting][FanControlTrait.Attributes.speedSetting],
        [speedCurrent][FanControlTrait.Attributes.speedCurrent],
        [percentSetting][FanControlTrait.Attributes.percentSetting] and,
        [percentCurrent][FanControlTrait.Attributes.percentCurrent] to a single value in the
        corresponding range."
    - name: kHigh
      description: "The fan is using a high speed. Selecting this mode sets the attributes
        [speedSetting][FanControlTrait.Attributes.speedSetting],
        [speedCurrent][FanControlTrait.Attributes.speedCurrent],
        [percentSetting][FanControlTrait.Attributes.percentSetting] and,
        [percentCurrent][FanControlTrait.Attributes.percentCurrent] to a single value in the
        corresponding range."
    - name: kOn
      description: "The fan is on."
    - name: kAuto
      description: "The fan is using an auto speed. Selecting this mode sets the
        [percentSetting][FanControlTrait.Attributes.percentSetting] and, if present,
        [speedSetting][FanControlTrait.Attributes.speedSetting] attributes to null."
    - name: kSmart
      description: "The Smart mode for the fan."
  - name: FanModeSequenceEnum
    description: "Supported fan speed ranges."
    value:
    - name: kOffLowMedHigh
      description: "Fan supports off, low, medium and high speeds."
    - name: kOffLowHigh
      description: "Fan supports off, low and high speeds."
    - name: kOffLowMedHighAuto
      description: "Fan supports off, low, medium, high and auto speeds."
    - name: kOffLowHighAuto
      description: "Fan supports off, low, high and auto speeds."
    - name: kOffHighAuto
      description: "Fan supports off, on and auto speeds."
    - name: kOffHigh
      description: "Fan supports off and on speeds."
  - name: StepDirectionEnum
    description: "The direction to take for a fan speed change."
    value:
    - name: kIncrease
      description: "Speeds up the fan in steps."
    - name: kDecrease
      description: "Slows down the fan in steps."

Fill:
  description: "This trait belongs to devices that support being filled such as a bathtub."

  # Fill attributes
  attributes:
  - name: availableFillLevels
    description: "Describes different levels of filling the device."
  - name: isFilled
    description: "Is `true` if the device is filled to any level, `false` if the device is
      completely drained."
  - name: currentFillLevel
    description: "The current `levelName` from the [availableFillLevels] attribute at which the
      device is filled. Required if [availableFillLevels] attribute is set."
  - name: currentFillPercent
    description: "The current fill level percentage. Required if the
      [supportsFillPercent][FillTrait.Feature.supportsFillPercent] feature flag is set."

  # Fill bitmaps
  bitmaps:
  - name: FillFeature
    description: "Contains specific capabilities related to fill."
    value:
    - name: kSupportsFillPercent
      description: "If `true`, the device accepts commands for adjusting the level to a percentage."

  # Fill commands
  commands:
  - name: Fill
    description:
    - "Fill or drain the device."
    param:
    - name: fill
      description: "Set to `true` to fill, `false` to drain."
    - name: fillLevel
      description: "The `levelName` from the
        [availableFillLevels][FillTrait.Attributes.availableFillLevels] attribute to set. If
        unspecified, fill to the default level."
    - name: fillPercent
      description: "The requested level percentage."

  # Fill structs
  structs:
  - name: LevelSynonym
    description: "Synonyms of the level in a given language."
    value:
    - name: levelSynonym
      description: "Synonym of the level. The first string in this list is used as the canonical
        name of the level in that language."
    - name: lang
      description: "ISO 639-1 language code, for example, `en` for English."
  - name: Level
    description: "Level name and its language-specific synonyms."
    value:
    - name: levelName
      description: "Internal name of the level. This can be non-user-friendly, and will be shared
        across all languages."
    - name: levelValues
      description: "Synonyms of the level in each supported language."
  - name: AvailableFillLevels
    description: "The available fill levels."
    value:
    - name: levels
      description: "List of level names and language-specific synonyms."
    - name: ordered
      description: "If `true`, the device handles additional grammar for increase or decrease logic,
        as represented by the levels array (for example, half level)."

FilterMonitoring:
  description: "This trait provides an interface for monitoring the current condition of a filter."

  # FilterMonitoring attributes
  attributes:
  - name: changeIndicationCleanliness
    description: "The current requirement to change the filter, based on its cleanliness."
  - name: changeIndicationLifetime
    description: "The current requirement to change the filter, based on its lifetime."
  - name: condition
    description: "The current condition of the filter based on percentage used."

  # FilterMonitoring bitmaps
  bitmaps:
  - name: FilterMonitoringFeature
    description: "FilterMonitoring trait FeatureMap."
    value:
    - name: kCondition
      description: "The device supports monitoring the condition of the filter based on
        percentage used."
    - name: kWarning
      description: "The device supports a warning indication."

  # FilteringMonitoring enums
  enums:
  - name: ChangeIndication
    description: "Describes the requirements for when to change the filter."
    value:
    - name: kCritical
      description: "The filter resource is exhausted, and immediate intervention is required."
    - name: kOk
      description: "The filter is in good condition, and no intervention is required."
    - name: kUnspecified
      description: "The filter condition is not specified."
    - name: kWarning
      description: "The filter resource will be exhausted soon, and intervention will be required."

  # FilterMonitoring events
  events:
  - name: FilterChangeIndicationCleanliness
    description: "Proactive notification of the current filter-cleanliness state."
    value:
    - name: changeIndication
      description: "The current requirement to change the filter, based on its cleanliness."
    - name: priority
      description: "The notification level, which currently supports a value of `0`
        to indicate that the notification should be spoken."
  - name: FilterChangeIndicationLifetime
    description: "Proactive notification of the current filter-lifetime state."
    value:
    - name: changeIndication
      description: "The current requirement to change the filter, based on its lifetime."
    - name: priority
      description: "The notification level, which currently supports a value of `0`
        to indicate that the notification should be spoken."
  - name: FilterMonitoringSensorError
    description: "Notification of a sensor error."
    value:
    - name: errorCode
      description: "The error code of the sensor."
    - name: priority
      description: "The notification level, which currently supports a value of `0`
        to indicate that the notification should be spoken."

FixedLabel:
  description: "This trait provides an interface to tag an endpoint with zero or more read-only
    labels."

  # FixedLabel attributes
  attributes:
  - name: labelList
    description: "Represents a list containing [LabelStruct][FixedLabelTrait.LabelStruct]
      entries."

  # FixedLabel structs
  structs:
  - name: LabelStruct
    description: "An object describing an endpoint's label."
    value:
    - name: label
      description: "An endpoint identifier."
    - name: value
      description: "A discriminator for a label that may have multiple instances."

FlowMeasurement:
  description: "This trait provides an interface to flow measurement functionality, including
    configuration and provisioning of notifications of flow measurements."

  # FlowMeasurement attributes
  attributes:
  - name: maxMeasuredValue
    description: "The maximum value of [measuredValue]."
  - name: measuredValue
    description: "The flow in cubic meters/hr."
  - name: minMeasuredValue
    description: "The minimum value of [measuredValue]."
  - name: tolerance
    description: "The magnitude of potential error associated with the [measuredValue]."

FormaldehydeConcentrationMeasurement:
  description: "This trait provides an interface to formaldehyde concentration measurement
    functionality."

  # FormaldehydeConcentrationMeasurement attributes
  attributes:
  - name: averageMeasuredValue
    description: "The average value of [measuredValue]
      [FormaldehydeConcentrationMeasurementTrait.Attributes.measuredValue]
      measured during the [averageMeasuredValueWindow]
      [FormaldehydeConcentrationMeasurementTrait.Attributes.averageMeasuredValueWindow]."
  - name: averageMeasuredValueWindow
    description: "The window of time, in seconds, used to measure the [averageMeasuredValue]
      [FormaldehydeConcentrationMeasurementTrait.Attributes.averageMeasuredValue]."
  - name: levelValue
    description: "The level of the substance detected."
  - name: maxMeasuredValue
    description: "The maximum value of [measuredValue]
      [FormaldehydeConcentrationMeasurementTrait.Attributes.measuredValue]
      that can be measured."
  - name: measuredValue
    description: "The most recent measurement as a single-precision floating-point number, in units
      specified by
      [measurementUnit][FormaldehydeConcentrationMeasurementTrait.Attributes.measurementUnit]."
  - name: measurementMedium
    description: "The medium in which
      [measuredValue][FormaldehydeConcentrationMeasurementTrait.Attributes.measuredValue]
      is being measured."
  - name: measurementUnit
    description: "The unit used by
      [measuredValue][FormaldehydeConcentrationMeasurementTrait.Attributes.measuredValue]."
  - name: minMeasuredValue
    description: "The minimum value of [measuredValue]
      [FormaldehydeConcentrationMeasurementTrait.Attributes.measuredValue]
      that can be measured."
  - name: peakMeasuredValue
    description: "The maximum value of [measuredValue]
      [FormaldehydeConcentrationMeasurementTrait.Attributes.measuredValue]
      that has been measured during the [peakMeasuredValueWindow]
      [FormaldehydeConcentrationMeasurementTrait.Attributes.peakMeasuredValueWindow]."
  - name: peakMeasuredValueWindow
    description: "The window of time, in seconds, used to determine the [peakMeasuredValue]
     [FormaldehydeConcentrationMeasurementTrait.Attributes.peakMeasuredValue]."
  - name: uncertainty
    description: "The range of error or deviation that can be found in [measuredValue]
      [FormaldehydeConcentrationMeasurementTrait.Attributes.measuredValue]
      and [peakMeasuredValue]
      [FormaldehydeConcentrationMeasurementTrait.Attributes.peakMeasuredValue]."

  # FormaldehydeConcentrationMeasurement enums
  enums:
  - name: LevelValueEnum
    description: "Level values."
    value:
    - name: kCritical
      description: "Critical."
    - name: kHigh
      description: "High."
    - name: kLow
      description: "Low."
    - name: kMedium
      description: "Medium."
    - name: kUnknown
      description: "Unknown."
  - name: MeasurementMediumEnum
    description: "Mediums in which measurements are taken."
    value:
    - name: kAir
      description: "Air."
    - name: kSoil
      description: "Soil."
    - name: kWater
      description: "Water."
  - name: MeasurementUnitEnum
    description: "Measurement units."
    value:
    - name: kBQM3
      description: "Becquerels per cubic meter."
    - name: kMGM3
      description: "Milligrams per cubic meter."
    - name: kNGM3
      description: "Nanogram per cubic meter."
    - name: kPM3
      description: "Particles per cubic meter."
    - name: kPPB
      description: "Parts per billion."
    - name: kPPM
      description: "Parts per million."
    - name: kPPT
      description: "Parts per trillion."
    - name: kUGM3
      description: "Micrograms per cubic meter."

  # FormaldehydeConcentrationMeasurement bitmaps
  bitmaps:
  - name: Feature
    description: "FormaldehydeConcentrationMeasurementTrait cluster FeatureMap."
    value:
    - name: kAverageMeasurement
      description: "Device supports the average numeric measurement of substance."
    - name: kCriticalLevel
      description: "Device supports the Critical concentration Level."
    - name: kLevelIndication
      description: "Device supports basic level indication for substance using the
        [LevelValueEnum][FormaldehydeConcentrationMeasurementTrait.LevelValueEnum]."
    - name: kMediumLevel
      description: "Device supports the Medium concentration Level."
    - name: kNumericMeasurement
      description: "Device supports numeric measurement of substance."
    - name: kPeakMeasurement
      description: "Device supports peak numeric measurement of substance."

GeneralDiagnostics:
  description: "This trait provides an interface for retrieving information about the general
    diagnostic information for an endpoint."

  # GeneralDiagnostics attributes
  attributes:
  - name: networkInterfaces
    description: "A list of [NetworkInterface][GeneralDiagnosticsTrait.NetworkInterface]
      entries. Each logical network interface on the node must be represented by a single entry
      within the `networkInterfaces` attribute."

  # GeneralDiagnostics structs
  structs:
  - name: NetworkInterface
    description: "Information about a network interface."
    value:
    - name: IPv4Addresses
      description: "A list of the IPv4 addresses that are assigned to the network
        interface."
    - name: IPv6Addresses
      description: "A list of the unicast IPv6 addresses that are assigned
        to the network interface. This list includes the node's link-local address
        and should include any assigned GUA and ULA addresses. This list must not
        include any multicast group addresses to which the node has subscribed."

HepaFilterMonitoring:
  description: "This trait provides an interface for monitoring the current condition of a HEPA
    filter."

  # HepaFilterMonitoring attributes
  attributes:
  - name: condition
    description: "The current condition of the HEPA filter in percent."
  - name: degradationDirection
    description: "The direction of change for the condition of the filter over time."
  - name: changeIndication
    description: "The current status of the requirement to change the HEPA filter. Valid values are
      defined in [ChangeIndicationEnum][HepaFilterMonitoringTrait.ChangeIndicationEnum]."
  - name: inPlaceIndicator
    description: "Indicates if a HEPA filter is currently installed."
  - name: lastChangedTime
    description: "The time the HEPA filter was last changed."
  - name: replacementProductList
    description: "The list of supported replacement HEPA filters. Valid values are
      defined in
      [ReplacementProductStruct][HepaFilterMonitoringTrait.ReplacementProductStruct]"

  # HepaFilterMonitoring commands
  commands:
  - name: ResetCondition
    description:
    - "Reset the [condition][HepaFilterMonitoringTrait.Attributes.condition] and
        [changeIndication][HepaFilterMonitoringTrait.Attributes.changeIndication] attributes to
        indicate full resource availability."

  # HepaFilterMonitoring bitmaps
  bitmaps:
  - name: Feature
    description: "HepaFilterMonitoringTrait cluster FeatureMap."
    value:
    - name: kCondition
      description: "Supports monitoring the condition of the HEPA filter in percentage."
    - name: kWarning
      description: "Supports a warning indication."
    - name: kReplacementProductList
      description: "Supports specifying the list of replacement products."

  # HepaFilterMonitoring enums
  enums:
  - name: ChangeIndicationEnum
    description: "The condition of the HEPA filter."
    value:
    - name: kOK
      description: "The HEPA filter is in good condition."
    - name: kWarning
      description: "The HEPA filter will need replacing soon."
    - name: kCritical
      description: "The HEPA filter needs replacement."
  - name: DegradationDirectionEnum
    description: "The direction in which the condition of the HEPA filter changes over time."
    value:
    - name: kUp
      description: "The condition is indicated by an increasing value."
    - name: kDown
      description: "The condition is indicated by a decreasing value."
  - name: ProductIdentifierTypeEnum
    description: "The type of identifier used to describe the product."
    value:
    - name: kUPC
      description: "Uses a 12-digit Universal Product Code."
    - name: kGTIN8
      description: "Uses a 8-digit Global Trade Item Number."
    - name: kEAN
      description: "Uses a 13-digit European Article Number."
    - name: kGTIN14
      description: "Uses a 14-digit Global Trade Item Number."
    - name: kOEM
      description: "Uses a Original Equipment Manufacturer part number."

  # HepaFilterMonitoring structs
  structs:
  - name: ReplacementProductStruct
    description: "The details of a replacement HEPA filter."
    value:
    - name: productIdentifierType
      description: "The type of product identification. Valid values are defined in
        [ProductIdentifierTypeEnum]."
    - name: productIdentifierValue
      description: "A unique identifier used to identify a replacement product."

HomePresence:
  description: "This trait belongs to the structure and indicates if there are any users in
    the structure."

  # HomePresence attributes
  attributes:
  - name: homePresenceMode
    description: "Indicates if there are any users in the structure."

  # HomePresence enums
  enums:
  - name: HomePresenceMode
    description: "The presence mode of the structure."
    value:
    - name: kUnspecified
      description: "Only set to this state when a structure is created, the structure should not
        return to this state after the initial structure mode is computed."
    - name: kHome
      description: "One or more users are home."
    - name: kAway
      description: "No one is home."
    - name: kSleep
      description: "One or more users are home, but they are all asleep."
    - name: kVacation
      description: "The home is empty and users are away."

Identify:
  description: "This trait supports an endpoint identification state (such as a flashing light)
    that indicates to an observer (such as an installer) which of several nodes or endpoints it is."

  # Identify attributes
  attributes:
  - name: identifyTime
    description: "The remaining length of time, in seconds, that the endpoint will continue to
      identify itself."
  - name: identifyType
    description: "How the identification state is presented to the user. Must be one of the values
      in [IdentifyTrait.IdentifyTypeEnum]."

  # Identify commands
  commands:
  - name: Identify
    description:
    - "Start or stop the identification state for the receiving device."
    - "When this command is called, the [identifyTime][IdentifyTrait.Attributes.identifyTime]
        attribute is set to the value of `identifyTime` specified in this command."
    param:
    - name: identifyTime
      description: "The amount of time, in seconds, that the device should identify itself. A value
        of 0 stops the identification state. A value other than 0 starts the identification state,
        which lasts for the value (seconds) specified."
  - name: TriggerEffect
    description:
    - "Start an effect that provides visual feedback to the user."
    - "For example, a device's LED may turn green when it has successfully connected to the
        network."
    param:
    - name: effectIdentifier
      description: "The identify effect to use. Must be a value from
        [IdentifyTrait.EffectIdentifierEnum]."
    - name: effectVariant
      description: "Variant of the effect, indicated by the [effectIdentifier] parameter, that is
        triggered. This must be one of the values in [IdentifyTrait.EffectVariantEnum]."

  # Identify enums
  enums:
  - name: EffectIdentifierEnum
    description: "The effect to use for an identification state or triggered effect."
    value:
    - name: kBlink
      description: "A blinking effect, such as a light turned on and off once."
    - name: kBreathe
      description: "A breathing effect, such as slowly turning a light on and off over 1 second,
        repeated multiple times."
    - name: kChannelChange
      description: "An effect that indicates a channel changes, such as a light turning orange for
        8 seconds."
    - name: kFinishEffect
      description: "The current effect sequence is completed before terminating. A sequence is a
        single repetition of the effect, such as a single blink or breathe."
    - name: kOkay
      description: "An effect that indicates an okay state, such as a light turning green for a
        second."
    - name: kStopEffect
      description: "The effect is terminated as soon as possible."
  - name: EffectVariantEnum
    description: "Variants of the effect identifier."
    value:
    - name: kDefault
      description: "The default effect is used."
  - name: IdentifyTypeEnum
    description: "The identification state presented to the user."
    value:
    - name: kActuator
      description: "The identification state is conveyed by actuator functionality, such as through
        a window blind operation or in-wall relay."
    - name: kAudibleBeep
      description: "The identification state is conveyed by an audible beep."
    - name: kDisplay
      description: "The identification state is visible on a display."
    - name: kLightOutput
      description: "The identification state is conveyed by the lighting output of a lighting
        product."
    - name: kNone
      description: "The identification state is not presented to the user."
    - name: kVisibleIndicator
      description: "The identification state is conveyed by an indicator on the device, such as a
        small LED."

IlluminanceMeasurement:
  description: "This trait provides an interface to illuminance measurement functionality."

  # IlluminanceMeasurement attributes
  attributes:
  - name: measuredValue
    description: "The illuminance in Lux. Valid values range from `1` to `0xFFFE`, indicating the
      various states of illuminance measurement."
  - name: minMeasuredValue
    description: "The minimum value of [measuredValue] that can be measured."
  - name: maxMeasuredValue
    description: "The maximum value of [measuredValue] that can be measured."
  - name: tolerance
    description: "The potential error magnitude associated with [measuredValue]."
  - name: lightSensorType
    description: "The electronic type of the light sensor. Valid values are defined in
      [LightSensorTypeEnum][IlluminanceMeasurementTrait.LightSensorTypeEnum]."

  # IlluminanceMeasurement enums
  enums:
  - name: LightSensorTypeEnum
    description: "Specifies the illuminance measurement sensor type."
    value:
    - name: kPhotodiode
      description: "Sensor is photodiode type."
    - name: kCMOS
      description: "Sensor is a CMOS type."

KeypadInput:
  description: "This trait provides an interface for key code based input and control on a device
    such as a video player or an endpoint such as a content app."

  # KeypadInput commands
  commands:
  - name: SendKey
    description:
    - "Process a key code as input to the media device."
    param:
    - name: keyCode
      description: "The key code to process."
    response:
