LaundryDryerControls:
  description: "This trait provides a way to access options associated with the operation of a
    laundry dryer device type."

  # LaundryDryerControls attributes
  attributes:
  - name: supportedDrynessLevels
    description: "The list of supported dryness levels available to the appliance in the currently
      selected mode."
  - name: selectedDrynessLevel
    description: "The currently-selected dryness level."

  # LaundryDryerControls enums
  enums:
  - name: DrynessLevelEnum
    description: "Represents the level of dryness that will be used while drying in a selected
      mode."
    value:
    - name: kLow
      description: "Low dryness level."
    - name: kNormal
      description: "Normal dryness level."
    - name: kExtra
      description: "Extra dryness level."
    - name: kMax
      description: "Max dryness level."

LaundryWasherControls:
  description: "This trait provides a way to access options associated with the operation of a
    laundry washer device type."

  # LaundryWasherControls attributes
  attributes:
  - name: spinSpeeds
    description: "The list of spin speeds available, as determined by the manufacturer, for the
      appliance in the currently selected mode."
  - name: spinSpeedCurrent
    description: "The index of the currently selected spin speed.
      This attribute is an integer between 0 and the number of entries in
      [spinSpeeds][LaundryWasherControlsTrait.Attributes.spinSpeeds] minus 1."
  - name: numberOfRinses
    description: "The number of times that a rinse cycle shall be performed on a device for the
      current mode of operation. The client can change this value if desired."
  - name: supportedRinses
    description: "The number of rinses allowed for a specific mode. The value of this attribute
      may change at runtime based on the currently selected mode."

  # LaundryWasherControls enums
  enums:
  - name: NumberOfRinsesEnum
    description: "Representation of the number of rinses to be performed for a selected mode."
    value:
    - name: kNone
      description: "No rinse cycles are performed."
    - name: kNormal
      description: "Performs normal rinse cycles as determined by the manufacturer."
    - name: kExtra
      description: "Performs an extra rinse cycle."
    - name: kMax
      description: "Performs the maximum number of rinse cycles as determined by the manufacturer."

  # LaundryWasherControls bitmaps
  bitmaps:
  - name: Feature
    description: "LaundryWasherControls cluster FeatureMap."
    value:
    - name: kSpin
      description: "Supports multiple spin speeds. This may not be supported in some modes."
    - name: kRinse
      description: "Supports multiple rinse cycles. This may not be supported in some modes."

LaundryWasherMode:
  description: "This trait provides an interface to laundry washer devices."

  # LaundryWasherMode attributes
  attributes:
  - name: currentMode
    description: "The current mode. This must be one of the values in
      [supportedModes][LaundryWasherModeTrait.Attributes.supportedModes]."
  - name: description
    description: "Describes the purpose of the mode in this cluster instance."
  - name: onMode
    description: "The value of the [currentMode][LaundryWasherModeTrait.Attributes.currentMode]
      that depends on the state of an [OnOff] cluster on
      the same endpoint. If the [OnOff] cluster changes its `onOff` attribute from `off` to `on`,
      the `currentMode` is changed to this value. Enabled by the
      [onOff][LaundryWasherMode.Feature.onOff] feature."
  - name: standardNamespace
    description: "The single standard namespace for any standard semantic tag value supported in
      this or any other cluster instance with the same namespace. A null value means there is no
      namespace for this cluster instance, and that there are no semantic tags."
  - name: startUpMode
    description: "The desired startup mode for the device when it is supplied with power."
  - name: supportedModes
    description: "The list of supported modes for the cluster instance."

  # LaundryWasherMode commands
  commands:
  - name: ChangeToMode
    description:
    - "Change the mode of the device's cluster instance, and set the
      [currentMode][LaundryWasherModeTrait.Attributes.currentMode] attribute of the
      device's cluster instance."
    param:
    - name: newMode
      description: "The mode to set the cluster instance to. This must be one of the values in
        [ModeOptionStruct][LaundryWasherMode.ModeOptionStruct]."
    response:
      description: "The result of the completed `ChangeToMode` command."
      param:
      - name: status
        description: "The status of the `ChangeToMode` command. Valid values are defined by the
          device manufacturer."
      - name: statusText
        description: "Text describing the status of the `ChangeToMode` command."

  # LaundryWasherMode enums
  enums:
  - name: ModeTag
    description: "The ModeTags for LaundryWasherMode."
    value:
    - name: kAuto
      description: "Decides which options, features, and setting values to use."
    - name: kQuick
      description: "Optimizes for faster completion."
    - name: kQuiet
      description: "Operates silently or barely audibly."
    - name: kLowNoise
      description: "Optimizes for low noise operation."
    - name: kLowEnergy
      description: "Optimizes for lower energy usage."
    - name: kVacation
      description: "Provides a mode suitable for use during vacations or other extended absences."
    - name: kMin
      description: "Uses the lowest available setting value."
    - name: kMax
      description: "Uses the highest available setting value."
    - name: kNight
      description: "Provides a mode suitable for use during night time."
    - name: kDay
      description: "Provides a mode suitable for use during day time."
    - name: kNormal
      description: "The normal regimen of operation."
    - name: kDelicate
      description: "Mode optimized for washing delicate garments."
    - name: kHeavy
      description: "Mode optimized for heavy washing."
    - name: kWhites
      description: "Mode optimized for stain removal on white fabrics."

  # LaundryWasherMode bitmaps
  bitmaps:
    - name: Feature
      description: "LaundryWasherMode cluster FeatureMap."
      value:
      - name: kOnOff
        description: "There is a dependency on the [OnOff] cluster. When this bit is set, the
          [currentMode][LaundryWasherMode.Attributes.currentMode] is set to
          [onMode][LaundryWasherMode.Attributes.onMode] when the power is turned on."

  # LaundryWasherMode structs
  structs:
  - name: ModeOptionStruct
    description: "Describes a mode that may be selected on the device."
    value:
    - name: label
      description: "Text that describes the mode option and is meant to be read and understood by
        the user."
    - name: mode
      description: "A unique identifier for the mode option."
    - name: modeTags
      description: "A list of tags that are associated with the mode option, which may be used by
        a device to determine the semantics of a certain mode."
  - name: ModeTagStruct
    description: "Describes a mode tag. The same manufacturer code and mode tag value in
        separate cluster instances are part of the same namespace and have the same meaning. For
        example, a manufacturer tag meaning \"pinch\" can be used both in a cluster whose purpose is
        to choose the amount of sugar, or in a cluster whose purpose is to choose the amount of
        salt."
    value:
    - name: mfgCode
      description: "The manufacturer's vendor ID."
    - name: value
      description: "The mode tag within a mode tag namespace. If the `mfgCode` field exists, this is
        set to a manufacturer-defined value, otherwise, it's set to a standard value."

LeafWetnessMeasurement:
  description: "This trait provides an interface to leaf wetness measurement."

  # LeafWetnessMeasurement attributes
  attributes:
  - name: maxMeasuredValue
    description: "The maximum value of the measured value that can be measured."
  - name: measuredValue
    description: "Leaf wetness measured in water content percentage."
  - name: minMeasuredValue
    description: "The minimum value of the measured value that can be measured."
  - name: tolerance
    description: "The magnitude of the possible error that is associated with the measured value,
      using the same units and resolution. The true value is in the range
      (`measuredValue` - `tolerance`) to (`measuredValue` + `tolerance`), but never outside the
      possible physical range."

LevelControl:
  description: "This trait provides an interface for controlling a characteristic of a device that
    can be set to a level."

  # LevelControl attributes
  attributes:
  - name: currentFrequency
    description: "The frequency at which the device is at [currentLevel]. A value of `0` means the
      frequency is unknown. Cannot be less than the [minFrequency] or greater than the
      [maxFrequency]."
  - name: currentLevel
    description: "The current level of the device, which is device dependent. For example, a level
      for a light may mean the brightness level. Cannot be less than the [minLevel] or greater than
      the [maxLevel]."
  - name: defaultMoveRate
    description: "The movement rate (in units per second) when a
      [move][LevelControlCommands.move] command is reeceived with a `rate` parameter
      of null."
  - name: maxFrequency
    description: "The maximum value that can be assigned to the [currentFrequency] attribute. This
      value is always greater than or equal to [minFrequency]. A value of `0` means undefined."
  - name: maxLevel
    description: "The maximum value that can be assigned to the [currentLevel] attribute."
  - name: minFrequency
    description: "The minimum value that can be assigned to the [currentFrequency] attribute. This
      value is always less than or equal to [maxFrequency]. A value of `0` means undefined."
  - name: minLevel
    description: "The minimum value that can be assigned to the [currentLevel] attribute."
  - name: offTransitionTime
    description: "The time taken (in 0.1 seconds) to move the [currentLevel] from the [maxLevel] to
      the [minLevel] when an [on][OnOffCommands.on] command is received by an [OnOff] cluster
      on the same endpoint. If not implemented or defined, [onOffTransitionTime] is used instead."
  - name: onLevel
    description: "The value that the [currentLevel] attribute is set to when the
      [onOff][OnOffTrait.Attributes.onOff] attribute of the [OnOff] cluster is set to true as a
      result of processing an [OnOff] cluster command. Cannot be less than the [minLevel] or greater
      than the [maxLevel]."
  - name: onOffTransitionTime
    description: "The time taken (in 0.1 seconds) to move to or from the target level when
      [on][OnOffCommands.on] or [off][OnOffCommands.off] commands are received by an
      [OnOff] cluster on the same endpoint. Not supported for devices that are not able to
      transition at a variable rate."
  - name: onTransitionTime
    description: "The time taken (in 0.1 seconds) to move the [currentLevel] from the [minLevel] to
      the [maxLevel] when an [on][OnOffCommands.on] command is received by an [OnOff] cluster
      on the same endpoint. If not implemented or defined, [onOffTransitionTime] is used instead."
  - name: options
    description: "A bitmap that determines the default behavior of some cluster commands. This
      should only be changed during commissioning. See [LevelControlTrait.OptionsBitmap] for
      more information."
  - name: remainingTime
    description: "The time remaining (in 0.1 seconds) until the current command is complete."
  - name: startUpCurrentLevel
    description: "The desired startup level for a device when it is supplied with power, which is
      reflected in the [currentLevel] attribute. A value of `0` sets [currentLevel] to [minLevel].
      A value of null, or a device reboot from an OTA, sets [currentLevel] to its previous value.
      Any other value sets [currentLevel] to that value."

  # LevelControl commands
  commands:
  - name: Move
    description:
    - "Change a device's level based on a rate of movement."
    param:
    - name: moveMode
      description: "The direction in which to move the level. This must be one of the values in
        [LevelControlTrait.MoveModeEnum]."
    - name: rate
      description: "The rate (in units per seconds) used to move the device's `currentLevel` to the
        [minLevel][LevelControlTrait.Attributes.minLevel] or
        [maxLevel][LevelControlTrait.Attributes.maxLevel]."
    - name: optionsMask
      description: "Determines which bits in the [options][LevelControlTrait.Attributes.options]
        attribute should be overridden by `optionsOverride`."
    - name: optionsOverride
      description: "If the corresponding bit in `optionsMask` is set to `1`, the bit set here
        overrides the corresponding bit in [options][LevelControlTrait.Attributes.options]
        attribute."
  - name: MoveToClosestFrequency
    description:
    - "Change a device's current frequency."
    param:
    - name: frequency
      description: "The frequency to change the
        [currentFrequency][LevelControlTrait.Attributes.currentFrequency] to."
  - name: MoveToLevel
    description:
    - "Move a device from its current level to the provided level."
    param:
    - name: level
      description: "The level to move the device to."
    - name: transitionTime
      description: "The time (in 0.1 seconds) taken to move the device to the new level."
    - name: optionsMask
      description: "Determines which bits in the [options][LevelControlTrait.Attributes.options]
        attribute should be overridden by `optionsOverride`."
    - name: optionsOverride
      description: "If the corresponding bit in `optionsMask` is set to `1`, the bit set here
        overrides the corresponding bit in [options][LevelControlTrait.Attributes.options]
        attribute."
  - name: MoveToLevelWithOnOff
    description:
    - "Move a device from its current level to the provided level and toggle the
        [onOff][OnOffTrait.Attributes.onOff] attribute of the [OnOff] cluster depending on the
        end value of [currentLevel][LevelControlTrait.Attributes.currentLevel]."
    - "If this command sets the `currentLevel` above the `minLevel`, the
        [onOff][OnOffTrait.Attributes.onOff] attribute is set to true."
    - "If this command sets the `currentLevel` to the `minLevel`, the
        [onOff][OnOffTrait.Attributes.onOff] attribute is set to false."
    param:
    - name: level
      description: "The level to move the device to."
    - name: transitionTime
      description: "The time (in 0.1 seconds) taken to move the device to the new level."
    - name: optionsMask
      description: "Determines which bits in the [options][LevelControlTrait.Attributes.options]
        attribute should be overridden by `optionsOverride`."
    - name: optionsOverride
      description: "If the corresponding bit in `optionsMask` is set to `1`, the bit set here
        overrides the corresponding bit in [options][LevelControlTrait.Attributes.options]
        attribute."
  - name: MoveWithOnOff
    description:
    - "Move a device's level based on a rate of movement and toggle the
        [onOff][OnOffTrait.Attributes.onOff] attribute of the [OnOff] cluster depending on the
        end value of [currentLevel][LevelControlTrait.Attributes.currentLevel]."
    - "If this command sets the `currentLevel` above the `minLevel`, the
        [onOff][OnOffTrait.Attributes.onOff] attribute is set to true."
    - "If this command sets the `currentLevel` to the `minLevel`, the
        [onOff][OnOffTrait.Attributes.onOff] attribute is set to false."
    param:
    - name: moveMode
      description: "The direction in which to move the level. This must be one of the values in
        [LevelControlTrait.MoveModeEnum]."
    - name: rate
      description: "The rate (in units per seconds) used to move the device's `currentLevel` to the
        [minLevel][LevelControlTrait.Attributes.minLevel] or
        [maxLevel][LevelControlTrait.Attributes.maxLevel]."
    - name: optionsMask
      description: "Determines which bits in the [options][LevelControlTrait.Attributes.options]
        attribute should be overridden by `optionsOverride`."
    - name: optionsOverride
      description: "If the corresponding bit in `optionsMask` is set to `1`, the bit set here
        overrides the corresponding bit in [options][LevelControlTrait.Attributes.options]
        attribute."
  - name: Step
    description:
    - "Move a device's level a specific amount over a period of time."
    - "If the `stepSize` used results in a
        [currentLevel][LevelControlTrait.Attributes.currentLevel] that is greater than the
        `maxLevel` or less than the `minLevel`, then the command stops when the `currentLevel`
        reaches the `maxLevel` or `minLevel`, respectively."
    - "The command may complete in a shorter time than specified for `transitionTime` if the
        `maxLevel` or `minLevel` is reached before the transition time is over."
    param:
    - name: stepMode
      description: "The direction in which to move the level. This must be one of the values in
        [LevelControlTrait.StepModeEnum]."
    - name: stepSize
      description: "The amount of units to move the device's
        [currentLevel][LevelControlTrait.Attributes.currentLevel] to."
    - name: transitionTime
      description: "The time (in 0.1 seconds) taken to move the device to the new level."
    - name: optionsMask
      description: "Determines which bits in the [options][LevelControlTrait.Attributes.options]
        attribute should be overridden by `optionsOverride`."
    - name: optionsOverride
      description: "If the corresponding bit in `optionsMask` is set to `1`, the bit set here
        overrides the corresponding bit in [options][LevelControlTrait.Attributes.options]
        attribute."
  - name: StepWithOnOff
    description:
    - "Move a device's level a specific amount over a period of time and toggle the
        [onOff][OnOffTrait.Attributes.onOff] attribute of the [OnOff] cluster depending on the end
        value of [currentLevel][LevelControlTrait.Attributes.currentLevel]."
    - "If the `stepSize` used results in a
        [currentLevel][LevelControlTrait.Attributes.currentLevel] that is greater than the
        `maxLevel` or less than the `minLevel`, then the command stops when the `currentLevel`
        reaches the `maxLevel` or `minLevel`, respectively."
    - "The command may complete in a shorter time than specified for `transitionTime` if the
        `maxLevel` or `minLevel` is reached before the transition time is over."
    - "If this command sets the `currentLevel` above the `minLevel`, the
        [onOff][OnOffTrait.Attributes.onOff] attribute is set to true."
    - "If this command sets the `currentLevel` to the `minLevel`, the
        [onOff][OnOffTrait.Attributes.onOff] attribute is set to false."
    param:
    - name: stepMode
      description: "The direction in which to move the level. This must be one of the values in
        [LevelControlTrait.StepModeEnum]."
    - name: stepSize
      description: "The amount of units to move the device's
        [currentLevel][LevelControlTrait.Attributes.currentLevel] to."
    - name: transitionTime
      description: "The time (in 0.1 seconds) taken to move the device to the new level."
    - name: optionsMask
      description: "Determines which bits in the [options][LevelControlTrait.Attributes.options]
        attribute should be overridden by `optionsOverride`."
    - name: optionsOverride
      description: "If the corresponding bit in `optionsMask` is set to `1`, the bit set here
        overrides the corresponding bit in [options][LevelControlTrait.Attributes.options]
        attribute."
  - name: Stop
    description:
    - "Terminate a `Move`, `MoveToLevel`, or `Step` command (including their `OnOff` variants)
        currently in progress, and sets the
        [remainingTime][LevelControlTrait.Attributes.remainingTime] attribute to `0`."
    - "This command and [StopWithOnOff] are identical."
    param:
    - name: optionsMask
      description: "Determines which bits in the [options][LevelControlTrait.Attributes.options]
        attribute should be overridden by `optionsOverride`."
    - name: optionsOverride
      description: "If the corresponding bit in `optionsMask` is set to `1`, the bit set here
        overrides the corresponding bit in [options][LevelControlTrait.Attributes.options]
        attribute."
  - name: StopWithOnOff
    description:
    - "Terminate a `Move`, `MoveToLevel`, or `Step` command (including their `OnOff` variants)
        currently in progress, and sets the
        [remainingTime][LevelControlTrait.Attributes.remainingTime] attribute to `0`."
    - "This command and [Stop] are identical."
    param:
    - name: optionsMask
      description: "Determines which bits in the [options][LevelControlTrait.Attributes.options]
        attribute should be overridden by `optionsOverride`."
    - name: optionsOverride
      description: "If the corresponding bit in `optionsMask` is set to `1`, the bit set here
        overrides the corresponding bit in [options][LevelControlTrait.Attributes.options]
        attribute."

  # LevelControl bitmaps
  bitmaps:
  - name: Feature
    description: "LevelControl cluster FeatureMap. Some behaviors of these features are described in
      the cluster attributes and commands. For complete details of these features, see the [Matter
      Specification](https://csa-iot.org/developer-resource/specifications-download-request/)."
    value:
    - name: kFrequency
      description: "Supports frequency attributes and behavior."
    - name: kLighting
      description: "Has behavior that supports lighting apps."
    - name: kOnOff
      description: "Dependency with the [OnOff] cluster."
  - name: OptionsBitmap
    description: "Flags for LevelControl options."
    value:
    - name: kCoupleColorTempToLevel
      description: "Couple changes to the
        [currentlevel][LevelControlTrait.Attributes.currentLevel] attribute with the color
        temperature set in the
        [colorTemperatureMireds][ColorControl.Attributes.colorTemperatureMireds] attribute of the
        `LevelControl` cluster. This bit is ignored if the
        [lighting][LevelControlTrait.Feature.lighting] feature is not supported."
    - name: kExecuteIfOff
      description: "Indicates a dependency on the [OnOff] cluster. A `LevelControl` command does not
        continue past [options][LevelControlTrait.Attributes.options] processing if all of the
        following are true:
        <ul><li>The command is Move, `MoveToLevel`, Step, or Stop.</li>
          <li>The `OnOff` cluster exists on the same endpoint as this cluster.</li>
          <li>The onOff attribute of the `OnOff` cluster on this endpoint is false.</li>
          <li>The value of this bit (`executeIfOff`) is `0`.</li></ul>"

  # LevelControl enums
  enums:
  - name: MoveModeEnum
    description: "The direction in which to move a device's level."
    value:
    - name: kDown
      description: "Decrease the device's level."
    - name: kUp
      description: "Increase the device's level."
  - name: StepModeEnum
    description: "The direction in which to step a device's level."
    value:
    - name: kDown
      description: "Decrease the device's level."
    - name: kUp
      description: "Increase the device's level."

LightEffects:
  description: "This trait belongs to devices that can support complex lighting commands
    to change states, such as looping through various colors."

  # LightEffects attributes
  attributes:
  - name: defaultSleepDurationSeconds
    description: "The default duration, in seconds, for the effect triggered by the
      [sleepEffectSet][LightEffectsCommands.sleepEffectSet] command."
  - name: defaultWakeDurationSeconds
    description: "The default duration, in seconds, for the effect triggered by the
      [wakeEffectSet][LightEffectsCommands.wakeEffectSet] command."
  - name: effectEndTimestampSeconds
    description: "Unix timestamp for when the current effect is expected to end, assuming that
      the effect ends on its own."
  - name: pulseEffectSet
    description: "Indicates that the pulse effect is currently active."
  - name: sleepEffectSet
    description: "Indicates that the sleep effect is currently active."
  - name: wakeEffectSet
    description: "Indicates that the wake effect is currently active."

  # LightEffects bitmaps
  bitmaps:
  - name: LightEffectsFeature
    description: "Contains specific capabilities related to light effects."
    value:
    - name: kPulse
      description: "The device supports the pulse effect, which means that light intensity
        ramps from mid-level brightness to maximum-level brightness and then ramps back
        to mid-level brightness, with a total cycle time of one pulse per second. During
        each cycle, maximum-level brightness lasts for about 200 milliseconds
        and mid-level brightness, excluding ramping, typically lasts for at least 500 milliseconds."
    - name: kSleep
      description: "The device supports the sleep effect, which gradually lowers brightness and,
        optionally, adjusts the color temperature over a period of time."
    - name: kWake
      description: "The device supports the wake effect, which gradually increases brightness and,
        optionally, adjusts the color temperature over a period of time."

  # LightEffects commands
  commands:
  - name: PulseEffectSet
    description:
    - "Activates the pulse effect."
    param:
    - name: durationSeconds
      description: "Duration for the pulse effect, in seconds."
    - name: color
      description: "Color of the light for the duration of the effect."
  - name: SleepEffectSet
    description:
    - "Activates the sleep effect."
    param:
    - name: durationSeconds
      description: "Duration for the sleep effect, in seconds."
  - name: StopEffect
    description:
    - "Stops the active effect."
  - name: WakeEffectSet
    description:
    - "Activates the wake effect."
    param:
    - name: durationSeconds
      description: "Duration for the wake effect, in seconds."

  # LightEffects structs
  structs:
  - name: Color
    description: "Color of the light for the duration of the effect."
    value:
    - name: name
      description: "Name of the requested color."
    - name: temperature
      description: "Color temperature in degrees of Kelvin. Cannot be used if either
        `spectrumHSV` or `spectrumRGB`are set."
    - name: spectrumHSV
      description: "Color definition using the HSV model. Cannot be used if either
        `temperature` or `spectrumRGB`are set."
    - name: spectrumRGB
      description: "Color definition using the RGB model. Cannot be used if either
        `spectrumHSV` or `temperature` are set."
  - name: SpectrumHSV
    description: "Represents a color using the HSV model."
    value:
    - name: hue
      description: "The specific tone of color, measured in a circle from 0 to 360 degrees."
    - name: saturation
      description: "The amount of black, measured from 0 to 100 percent."
    - name: value
      description: "The brightness of a color, measured from 0 to 100 percent, with 0 considered
        to be black."

LocalizationConfiguration:
  description: "This trait provides attributes for determining and configuring localization
    information that a node shall utilize when conveying values to a user."

  # LocalizationConfiguration attributes
  attributes:
  - name: activeLocale
    description: "The locale that the node is currently configured to use when conveying
      information. This attribute must be a language tag as defined by
      BCP47."
  - name: supportedLocales
    description: "A list of locale strings that are valid values for the
      `activeLocale` attribute. The list must not contain duplicate entries.
       The ordering of the items in the list does not matter."

Locator:
  description: "This trait is used to locate devices, which can be found by means of a local
    indicator, such as beeping, ringing, or flashing."

  # Locator bitmaps
  bitmaps:
  - name: LocatorFeature
    description: "Map containing specific capabilities related to locating a device."
    value:
    - name: kIsRingable
      description: "The device can play audio to indicate its location."
    - name: kIsSilenceable
      description: "The device can be silenced while ringing."
    - name: kReportsLocation
      description: "The device can provide its coordinates for vocalized location."

  # Locator commands
  commands:
  - name: Locate
    description:
    - "Locate the target device by generating a local alert."
    param:
    - name: lang
      description: "Current language of query or display."
    - name: reportLocation
      description: "Indicates that coordinates are expected in the response and that the device
        should not ring."
  - name: Silence
    description:
    - "Silence any in-progress alarms on devices that make an audible response
         for local alerts."

LockUnlock:
  description: "This trait belongs to any devices that support locking and unlocking,
    or reporting a locked state, except door locks, which are covered by the Matter standard
    `DoorLock` cluster."

  # LockUnlock attributes
  attributes:
  - name: lockState
    description: "The current lock state of the device."

  # LockUnlock commands
  commands:
  - name: Lock
    description:
    - "Lock the device."
  - name: Unlock
    description:
    - "Unlock the device."

  # LockUnlock enums
  enums:
  - name: LockState
    description: "The current state of the device."
    value:
    - name: kUnspecified
      description: "The lock state is unspecified."
    - name: kLocked
      description: "The device is locked."
    - name: kUnlocked
      description: "The device is unlocked."
    - name: kJammed
      description: "The device is jammed and its locked state cannot be determined."
  - name: StatusEnum
    description: "The status of the lock or unlock command."
    value:
    - name: kUnspecified
      description: "The status is unspecified."
    - name: kSuccess
      description: "The command completed successfully."
    - name: kFailure
      description: "The command failed to complete successfully."

  # LockUnlock events
  events:
  - name: LockFollowUp
    description: "Follow up response for the [lock][LockUnlockCommands.lock] command."
    value:
    - name: status
      description: "The result status of the command. Valid values are defined in
        [StatusEnum][LockUnlockTrait.StatusEnum]."
    - name: errorCode
      description: "The error encountered when processing the command."
  - name: UnlockFollowUp
    description: "Follow up response for the [unlock][LockUnlockCommands.unlock]
      command."
    value:
    - name: status
      description: "The result status of the command. Valid values are defined in
        [StatusEnum][LockUnlockTrait.StatusEnum]."
    - name: errorCode
      description: "The error encountered when processing the command."

LowPower:
  description: "This trait provides an interface for managing low power mode on a device."

  # LowPower commands
  commands:
  - name: Sleep
    description:
    - "Put the device into low power mode."

MatterUpgradable:
  description: "This trait denotes that the device can be upgraded to use the Matter standards for
    device control."

  # MatterUpgradable commands
  commands:
  - name: InitiateMatterUpgrade
    description:
    - "Initiates the Matter upgrade for a device."

Max2FilterMonitoring:
  description: "This trait provides an interface for monitoring the Max2 filter on a device."

  # Max2FilterMonitoring attributes
  attributes:
  - name: changeIndication
    description: "The current requirement to change the Max2 filter."
  - name: condition
    description: "The current condition of the Max2 filter in terms of percentage of use remaining."

  # Max2Filtering bitmaps
  bitmaps:
  - name: FilterMonitoringFeature
    description: "Max2FilterMonitoring trait feature map."
    value:
    - name: kCondition
      description: "The device supports monitoring the condition of the filter in
        terms of percentage of use remaining."
    - name: kWarning
      description: "The device supports a warning indication."

  # Max2Filtering enums
  enums:
  - name: ChangeIndication
    description: "Describes the requirement to change the filter."
    value:
    - name: kCritical
      description: "The filter resource has been exhausted and immediate intervention is required."
    - name: kOk
      description: "The filter is in good condition and no intervention is required."
    - name: kUnspecified
      description: "The filter condition is unspecified."
    - name: kWarning
      description: "The filter resource will soon be exhausted and intervention will
        be required."

MediaInput:
  description: "This trait provides an interface for controlling the input selector on a media
    device such as a video player."

  # MediaInput attributes
  attributes:
  - name: currentInput
    description: "The index of the currently selected input."
  - name: inputList
    description: "A list of media inputs supported by the device."

  # MediaInput commands
  commands:
  - name: HideInputStatus
    description:
    - "Hide the input list on the display."
  - name: RenameInput
    description:
    - "Change the name of the specified input."
    param:
    - name: index
      description: "The index of the input to be renamed."
    - name: name
      description: "The new name for the specified input."
  - name: SelectInput
    description:
    - "Change the media input on the device."
    param:
    - name: index
      description: "The index of the input to select."
  - name: ShowInputStatus
    description:
    - "Show the input list on the display."

  # MediaInput bitmaps
  bitmaps:
  - name: Feature
    description: "The MediaInput cluster FeatureMap."
    value:
    - name: kNameUpdates
      description: "Supports updating the input names."

  # MediaInput enums
  enums:
  - name: InputTypeEnum
    description: "Types of input."
    value:
    - name: kAux
      description: "Auxiliary input."
    - name: kCoax
      description: "Coaxial input."
    - name: kComposite
      description: "Composite input."
    - name: kHDMI
      description: "HDMI input."
    - name: kInput
      description: "A generic type of input."
    - name: kInternal
      description: "An internal, virtual input, as opposed to a physical input."
    - name: kLine
      description: "Line input."
    - name: kOptical
      description: "Optical input."
    - name: kOther
      description: "Other input."
    - name: kSCART
      description: "SCART input."
    - name: kUSB
      description: "USB input."
    - name: kVideo
      description: "Video input."

  # MediaInput structs
  structs:
  - name: InputInfoStruct
    description: "Information about an input."
    value:
    - name: description
      description: "The user-editable description of the input."
    - name: index
      description: "The index of the input."
    - name: inputType
      description: "The type of the input."
    - name: name
      description: "The name of the input."

MediaPlayback:
  description: "This trait provides an interface for controlling media playback (play, pause, and so
    forth) on a media device such as a TV, set-top box, or smart speaker."

  # MediaPlayback attributes
  attributes:
  - name: currentState
    description: "The current playback state of media."
  - name: duration
    description: "The duration, in milliseconds, of the media currently being played back. If no
      media is currently being played, this is null."
  - name: playbackSpeed
    description: "The speed at which the current media is being played."
  - name: sampledPosition
    description: "The position of playback as of the specified time."
  - name: seekRangeEnd
    description: "The furthest forward valid position to which a client may seek, in milliseconds,
      relative to the start of the media."
  - name: seekRangeStart
    description: "The earliest valid position to which a client may seek, in milliseconds, relative
      to the start of the media."
  - name: startTime
    description: "The start time of the media, such as a livestream event, in UTC (ISO-8601) format.
      This is null when the start time doesn't apply to the current media, such as in the case of
      prerecorded material."
  - name: activeAudioTrack
    description: "The currently active audio track."
  - name: availableAudioTracks
    description: "The list of available audio tracks."
  - name: activeTextTrack
    description: "The currently active text track."
  - name: availableTextTracks
    description: "The list of available text tracks."

  # MediaPlayback commands
  commands:
  - name: FastForward
    description:
    - "Fast forward the current media."
    response:
      description: "The outcome of the `FastForward` command."
      param:
      - name: data
        description: "App-specific data pertaining to the `FastForward` command."
      - name: status
        description: "The status of the `FastForward` command."
  - name: Next
    description:
    - "Move to the next item in the media."
    response:
      description: "The outcome of the `Next` command."
      param:
      - name: data
        description: "App-specific data pertaining to the Next command."
      - name: status
        description: "The status of the `Next` command."
  - name: Pause
    description:
    - "Pause the current media."
    response:
      description: "The outcome of the `Pause` command."
      param:
      - name: data
        description: "App-specific data pertaining to the Pause command."
      - name: status
        description: "The status of the `Pause` command."
  - name: Play
    description:
    - "Play the current media."
    response:
      description: "The outcome of the `Play` command."
      param:
      - name: data
        description: "App-specific data pertaining to the Play command."
      - name: status
        description: "The status of the `Play` command."
  - name: Previous
    description:
    - "Move to the previous item in the current media."
    response:
      description: "The outcome of the `Previous` command."
      param:
      - name: data
        description: "App-specific data pertaining to the Previous command."
      - name: status
        description: "The status of the `Previous` command."
  - name: Rewind
    description:
    - "Rewind the current media."
    response:
      description: "The outcome of the `Rewind` command."
      param:
      - name: data
        description: "App-specific data pertaining to the Rewind command."
      - name: status
        description: "The status of the `Rewind` command."
  - name: Seek
    description:
    - "Change the playback position in the current media to the specified position."
    param:
    - name: position
      description: "The position to seek to, relative to the start of the media, in milliseconds."
    response:
      description: "The outcome of the `Seek` command."
      param:
      - name: data
        description: "App-specific data pertaining to the Seek command."
      - name: status
        description: "The status of the `Seek` command."
  - name: SkipBackward
    description:
    - "Skip backward by a specified amount of time within the current media."
    param:
      - name: deltaPositionMilliseconds
        description: "The duration of the time span to skip backward in the media, in milliseconds."
    response:
      description: "The outcome of the `SkipBackward` command."
      param:
      - name: data
        description: "App-specific data pertaining to the `SkipBackward` command."
      - name: status
        description: "The status of the `SkipBackward` command."
  - name: SkipForward
    description:
    - "Skip forward by a specified amount of time within the current media."
    param:
    - name: deltaPositionMilliseconds
      description: "The duration of the time span to skip forward in the media, in milliseconds."
    response:
      description: "The outcome of the `SkipForward` command."
      param:
      - name: data
        description: "App-specific data pertaining to the `SkipForward` command."
      - name: status
        description: "The status of the `SkipForward` command."
  - name: StartOver
    description:
    - "Start over from the beginning of the current media."
    response:
      description: "The outcome of the `StartOver` command."
      param:
      - name: data
        description: "App-specific data pertaining to the `StartOver` command."
      - name: status
        description: "The status of the `StartOver` command."
  - name: Stop
    description:
    - "Stop playing the current media."
    response:
      description: "The outcome of the `Stop` command."
      param:
      - name: data
        description: "App-specific data pertaining to the Stop command."
      - name: status
        description: "The status of the `Stop` command."
  - name: ActivateAudioTrack
    description:
    - "Activate an audio track."
    param:
    - name: trackID
      description: "Track ID."
    - name: audioOutputIndex
      description: "Audio output index."
  - name: ActivateTextTrack
    description:
    - "Activate a text track."
    param:
    - name: trackID
      description: "Track ID."
  - name: DeactivateTextTrack
    description:
    - "Deactivate the current text track."

  # MediaPlayback bitmaps
  bitmaps:
  - name: Feature
    description: "The MediaPlayback cluster FeatureMap."
    value:
    - name: kAdvancedSeek
      description: "Supports advanced media-seeking behavior in the user interface, for
        example, a seek bar."
    - name: kVariableSpeed
      description: "Supports variable speed playback on media that can play at different speeds."
    - name: kTextTracks
      description: "Supports text tracks."
    - name: kAudioTracks
      description: "Supports audio tracks."
    - name: kAudioAdvance
      description: "Supports audio advance."

  # MediaPlayback enums
  enums:
  - name: StatusEnum
    description: "Playback statuses."
    value:
    - name: kInvalidStateForCommand
      description: "Command failed: Requested playback command is invalid in the current playback
        state."
    - name: kNotActive
      description: "Command failed: This endpoint is not active for playback."
    - name: kNotAllowed
      description: "Command failed: The requested playback command is not allowed in the current
        playback state. For example, attempting to fast-forward during a commercial might return
        `NotAllowed`."
    - name: kSeekOutOfRange
      description: "Command failed: The [Seek][MediaPlaybackTrait.SeekCommand] command was issued
        with a specified position that is outside the allowed seek range of the media."
    - name: kSpeedOutOfRange
      description: "Command failed: The [FastForward][MediaPlaybackTrait.FastForwardCommand]
        command or [Rewind][MediaPlaybackTrait.RewindCommand] command was issued but the media is
        already playing back at the fastest speed supported by the server in the respective
        direction."
    - name: kSuccess
      description: "Command succeeded."
  - name: PlaybackStateEnum
    description: "Playback states."
    value:
    - name: kBuffering
      description: "The media is not currently buffering, playback will start when buffer is
        filled."
    - name: kNotPlaying
      description: "The media is not currently playing."
    - name: kPaused
      description: "The media is currently paused."
    - name: kPlaying
      description: "The media is currently playing, fast-forwarding, or rewinding."
  - name: CharacteristicEnum
    description: "Track characteristics."
    value:
    - name: kForcedSubtitles
      description: "Textual information meant for display when no other text representation is
        selected."
    - name: kDescribesVideo
      description: "Textual or audio media component containing a textual description (intended for
        audio synthesis) or an audio description describing a visual component."
    - name: kEasyToRead
      description: "Simplified or reduced captions as specified in
        United States Code Title 47 CFR 79.103(c)(9)."
    - name: kFrameBased
      description: "A media characteristic that indicates that a track selection option includes
        frame-based content."
    - name: kMainProgram
      description: "Main media component(s) which is/are intended for presentation if no other
        information is provided."
    - name: kOriginalContent
      description: "A media characteristic that indicates that a track or media selection option
        contains original content."
    - name: kVoiceOverTranslation
      description: "A media characteristic that indicates that a track or media selection option
        contains a language translation and verbal interpretation of spoken dialog."
    - name: kCaption
      description: "Textual media component containing transcriptions of spoken dialog and auditory
        cues such as sound effects and music for the hearing impaired."
    - name: kSubtitle
      description: "Textual transcriptions of spoken dialog."
    - name: kAlternate
      description: "Textual media component containing transcriptions of spoken dialog and auditory
        cues such as sound effects and music for the hearing impaired."
    - name: kSupplementary
      description: "Media content component that is supplementary to a media content component of
        a different media component type."
    - name: kCommentary
      description: "Experience that contains a commentary (e.g. director’s commentary) (typically
        audio)."
    - name: kDubbedTranslation
      description: "Experience that contains an element that is presented in a different language
        from the original (e.g. dubbed audio, translated captions)."
    - name: kDescription
      description: "Textual or audio media component containing a textual description (intended for
        audio synthesis) or an audio description describing a visual component."
    - name: kMetadata
      description: "Media component containing information intended to be processed by application
        specific elements."
    - name: kEnhancedAudioIntelligibility
      description: "Experience containing an element for improved intelligibility of the dialogue."
    - name: kEmergency
      description: "Experience that provides information, about a current emergency, that is
        intended to enable the protection of life, health, safety, and property, and may also
        include critical details regarding the emergency and how to respond to the emergency."
    - name: kKaraoke
      description: "Textual representation of a songs’ lyrics, usually in the same language as the
        associated song as specified in SMPTE ST 2067-2."

  # MediaPlayback structs
  structs:
  - name: PlaybackPositionStruct
    description: "A playback position within a media stream."
    value:
    - name: position
      description: "The discrete position within the media stream, in milliseconds from
        the beginning of the stream, as of the time specified in the `updatedAt` field."
    - name: updatedAt
      description: "The time when the `position` was last updated."
  - name: TrackAttributesStruct
    description: "Attributes of a track."
    value:
    - name: languageCode
      description: "Language code."
    - name: displayName
      description: "Display name."
  - name: TrackStruct
    description: "A track."
    value:
    - name: id
      description: "Track ID."
    - name: trackAttributes
      description: "Track attributes."

  # MediaPlayback events
  events:
  - name: StateChanged
    description: "State changed event."
    value:
    - name: currentState
      description: "Indicates the updated playback state."
    - name: startTime
      description: "Indicates the updated tart time."
    - name: duration
      description: "Indicates the updated duration."
    - name: sampledPosition
      description: "Indicates updated position of playback."
    - name: playbackSpeed
      description: "Indicates the updated playback speed."
    - name: seekRangeEnd
      description: "Indicates the updated seek range end."
    - name: seekRangeStart
      description: "Indicates the updated seek range start."
    - name: data
      description: "Contains optional app-specific data."
    - name: audioAdvanceUnmuted
      description: "Indicates whether audio is unmuted by the player due to a FF or REW command."

Messages:
  description: "This trait provides an interface for passing messages that a device can present
    to the user."

  # Messages attributes
  attributes:
  - name: activeMessageIDs
    description: "A list of the message IDs of the messages that are being
      presented to the user. A message ID is an octet string with a fixed length of 16,
      containing the binary encoding of a UUID as specified in RFC 4122."
  - name: messages
    description: "A list of queued messages. To preserve user privacy, the server can further limit
      the set of messages returned in a `read` request."

  # Messages bitmaps
  bitmaps:
  - name: Feature
    description: "Messages cluster FeatureMap."
    value:
    - name: kConfirmationReply
      description: "The device supports confirmation and reply messages."
    - name: kConfirmationResponse
      description: "The device is capable of presenting a list of responses to the user
        and recording the user's choice for the response."
    - name: kProtectedMessages
      description: "The device is capable of requiring the user to authenticate before
        viewing a message."
    - name: kReceivedConfirmation
      description: "The device supports getting confirmation from a user that the message was
        received."
  - name: MessageControlBitmap
    description: "Control information related to a message."
    value:
    - name: kConfirmationRequired
      description: "The message requires confirmation from the user."
    - name: kMessageConfirmed
      description: "The message has been confirmed by the user."
    - name: kMessageProtected
      description: "The message is protected by a PIN."
    - name: kReplyMessage
      description: "The message supports a reply from the user."
    - name: kResponseRequired
      description: "The message requires a response from the user."

  # Messages commands
  commands:
  - name: CancelMessagesRequest
    description:
    - "Cancels the messages in the passed fields."
    param:
    - name: messageIds
      description: "Provides a list of `messageIds` for the messages to be cancelled, and causes
        any active presentation of the messages to stop."
  - name: PresentMessagesRequest
    description:
    -  "Appends the message in the passed fields to the
      [messages][MessagesTrait.Attributes.messages] attribute. If appending the message would cause
      the number of messages to be greater than the capacity of the list, the device will not append
      any message to [messages][MessagesTrait.Attributes.messages], and will return a status code of
      `RESOURCE_EXHAUSTED`."
    param:
    - name: duration
      description: "The amount of time, in milliseconds, after the `startTime` during which the
        message is available to be presented. A null value means that the `duration` time remains
        the same until it's actively changed."
    - name: messageControl
      description: "The control information related to the message."
    - name: messageId
      description: "Globally unique ID of the message."
    - name: messageText
      description: "A string that contains the message to be presented to the user."
    - name: priority
      description: "The priority level for this message."
    - name: responses
      description: "A list of responses that the user can select to dismiss the message."
    - name: startTime
      description: "The time, in UTC, at which the message becomes available to be presented.
        A null value indicates that the message is available immediately."

  # Messages enums
  enums:
  - name: FutureMessagePreferenceEnum
    description: "A display device may include this preference in the
      [MessageComplete][MessagesTrait.MessageComplete] event as a hint to clients
      about how to handle future similar messages for the user."
    value:
    - name: kAllowed
      description: "Similar messages are allowed to be presented to the user."
    - name: kDisallowed
      description: "Similar messages are not allowed to be presented to the user."
    - name: kIncreased
      description: "Similar messages are allowed to be presented to the user, but at an
        increased rate."
    - name: kReduced
      description: "Similar messages are allowed to be presented to the user, but at a reduced
        rate."
    - name: kBanned
      description: "No further messages should be sent to the user."
  - name: MessagePriorityEnum
    description: "Priority should be used to determine which messages to show when the
      number of eligible messages is larger than the device's capacity to present them."
    value:
    - name: kCritical
      description: "The message should be sent with a critical level of importance."
    - name: kHigh
      description: "The message should be sent with a high level of importance."
    - name: kMedium
      description: "The message should be sent with a medium level of importance."
    - name: kLow
      description: "The message should be sent with a low level of importance."

  # Messages events
  events:
  - name: MessageComplete
    description: "This event is sent when the message is confirmed by the user or when the duration
        of the message has elapsed without confirmation."
    value:
    - name: futureMessagesPreference
      description: "A user-provided preference for the delivery of similar messages in the
        future. A null value indicates there is no change in user preference."
    - name: messageID
      description: "The `messageID` for the message being confirmed."
    - name: reply
      description: "A user-provided reply to a message. If there is no reply
        or the message did not have the
        [responseRequired][MessagesTrait.MessageControlBitmap.responseRequired] bit set,
        this field is null."
    - name: responseID
      description: "The
          [messageResponseId][MessagesTrait.MessageResponseOptionStruct.messageResponseId]
          selected by the user. If there is no response before the duration of the message
          elapses, this field is null."
  - name: MessagePresented
    description: "This event is sent when a message is presented to the user."
    value:
    - name: messageID
      description: "The `messageID` for the message being presented."
  - name: MessageQueued
    description: "This event is sent when a message is added to the
      [messages][MessagesTrait.Attributes.messages] attribute."
    value:
    - name: messageID
      description: "The `messageID` for the message being queued."

  # Messages structs
  structs:
  - name: MessageResponseOptionStruct
    description: "A possible response to a message."
    value:
    - name: label
      description: "The text for this option, for example `yes` or `no`."
    - name: messageResponseID
      description: "A unique, unsigned 32-bit numeric identifier for this message response
        option."
  - name: MessageStruct
    description: "Information about a single message."
    value:
    - name: duration
      description: "The amount of time, in milliseconds, after the `startTime` during which the
        message is available to be presented. A null value means that the `duration` time remains
        the same until it's actively changed."
    - name: messageControl
      description: "Control information related to the message."
    - name: messageID
      description: "A globally unique ID for this message."
    - name: messageText
      description: "A string that contains the message to be presented."
    - name: priority
      description: "The priority level for this message."
    - name: responses
      description: "A list of responses that the user can select to dismiss the message."
    - name: startTime
      description: "The time, in UTC, at which the message becomes available to be presented. A null
        value indicates that the message is available immediately."

MicrowaveOvenControl:
  description: "This trait defines an interface for controlling a microwave oven device."

  # MicrowaveOvenControl attributes
  attributes:
  - name: cookTime
    description: "The total cook time associated with the operation of the device."
  - name: maxCookTime
    description: "The maximum value to which the
      [cookTime][MicrowaveOvenControlTrait.Attributes.cookTime] attribute can be set."
  - name: maxPower
    description: "The maximum power level that can be set."
  - name: minPower
    description: "The minimum power level that can be set."
  - name: powerSetting
    description: "The power level associated with the operation of the device."
  - name: powerStep
    description: "The increment of power that can be set."
  - name: selectedWattIndex
    description: "The index of
      [supportedWatts][MicrowaveOvenControlTrait.Attributes.supportedWatts] of the currently
      selected power setting."
  - name: supportedWatts
    description: "The list of supported power levels, in watts."
  - name: wattRating
    description: "The power rating of the device, in watts."

  # MicrowaveOvenControl commands
  commands:
  - name: AddMoreTime
    description:
    - "Add more time to the [cookTime][MicrowaveOvenControlTrait.Attributes.cookTime] attribute of
      the server."
    param:
    - name: timeToAdd
      description: "The number of seconds to be added to the
        [cookTime][MicrowaveOvenControlTrait.Attributes.cookTime] attribute."
  - name: SetCookingParameters
    description:
    - "Sets the cooking parameters associated with the operation of the device."
    param:
    - name: cookMode
      description: "The value to which the
       [currentMode][MicrowaveOvenModeTrait.Attributes.currentMode] attribute should be set."
    - name: cookTime
      description: "The cook time associated with the operation of the device."
    - name: powerSetting
      description: "The power setting associated with the operation of the device."
    - name: startAfterSetting
      description: "Indicates whether or not the oven should be started when the command is
        received."
    - name: wattSettingIndex
      description: "The value to which the
        [selectedWattIndex][MicrowaveOvenControlTrait.Attributes.selectedWattIndex] attribute is
        set."

  # MicrowaveOvenControl bitmaps
  bitmaps:
  - name: Feature
    description: "MicrowaveOvenControl cluster FeatureMap."
    value:
    - name: kPowerAsNumber
      description: "Power is specified as a unitless number or a percentage."
    - name: kPowerInWatts
      description: "Power is specified in watts."
    - name: kPowerNumberLimits
      description: "Supports the limit attributes used with the
        [powerAsNumber][MicrowaveOvenControlTrait.Feature.powerAsNumber] feature."

MicrowaveOvenMode:
  description: "This trait defines additional mode tags and namespace enumerated values for
    microwave oven devices."

  # MicrowaveOvenMode attributes
  attributes:
  - name: currentMode
    description: "The current mode of the microwave oven device."
  - name: supportedModes
    description: "The modes supported by the microwave oven device."
  - name: startUpMode
    description: "The desired startup mode for the microwave oven device when it is supplied with
      power."
  - name: onMode
    description: "The value of the [currentMode] that depends on the state of an [OnOff] cluster on
      the same microwave oven endpoint."

  # MicrowaveOvenMode bitmaps
  bitmaps:
  - name: Feature
    description: "MicrowaveOvenMode cluster FeatureMap."
    value:
    - name: kOnOff
      description: "The microwave oven device can be turned on and off. There is a dependency on the
        [OnOff] cluster."

  # MicrowaveOvenMode structs
  structs:
  - name: ModeOptionStruct
    description: "Represents the possible mode of the `MicrowaveOvenMode` instance."
    value:
    - name: label
      description: "Readable text that describes the mode option for the user."
    - name: mode
      description: "Identifies the mode option for the
        [supportedModes][MicrowaveOvenModeTrait.Attributes.supportedModes] attribute."
    - name: modeTags
      description: "A list of tags that are associated with the `mode` option, which may be used by
        a device to determine the semantics of a certain mode."
  - name: ModeTagStruct
    description: "Describes a mode tag."
    value:
    - name: mfgCode
      description: "The manufacturer's vendor ID."
    - name: value
      description: "The mode tag within a mode tag namespace. If the `mfgCode` field exists, this
        is set to a manufacturer-defined value, otherwise, it's set to a standard value."

  enums:
  - name: ModeTag
    description: "Descriptive names of microwave oven modes."
    value:
    - name: kAuto
      description: "Decides which options, features, and setting values to use."
    - name: kQuick
      description: "Optimizes for faster completion."
    - name: kQuiet
      description: "Operates silently or barely audibly."
    - name: kLowNoise
      description: "Optimizes for low noise operation."
    - name: kLowEnergy
      description: "Optimizes for lower energy usage."
    - name: kVacation
      description: "Provides a mode suitable for use during vacations or other extended absences."
    - name: kMin
      description: "Uses the lowest available setting value."
    - name: kMax
      description: "Uses the highest available setting value."
    - name: kNight
      description: "Provides a mode suitable for use during night time."
    - name: kDay
      description: "Provides a mode suitable for use during day time."
    - name: kDefrost
      description: "Defrost mode."
    - name: kNormal
      description: "Normal mode."

ModeSelect:
  description: "This trait provides an interface for controlling a characteristic of a device that
    can be set to one of several predefined values."

  # ModeSelect attributes
  attributes:
  - name: currentMode
    description: "The current mode of a cluster instance on a device. This must be one of the values
      in [ModeOptionStruct][ModeSelectTrait.ModeOptionStruct]."
  - name: description
    description: "Describes the purpose of the mode in this cluster instance."
  - name: onMode
    description: "The value of the [currentMode] that depends on the state of an [OnOff] cluster on
      the same endpoint. If the [OnOff] cluster changes its `onOff` attribute from `off` to `on`,
      the `currentMode` is changed to this value. Enabled by the
      [onOff][ModeSelectTrait.Feature.onOff] feature."
  - name: standardNamespace
    description: "The single standard namespace for any standard semantic tag value supported in
      this or any other cluster instance with the same namespace. A null value means there is no
      namespace for this cluster instance, and that there are no semantic tags."
  - name: startUpMode
    description: "The desired startup mode for the device when it is supplied with power."
  - name: supportedModes
    description: "The list of supported modes for the cluster instance."

  # ModeSelect commands
  commands:
  - name: ChangeToMode
    description:
    - "Change the mode of the device's cluster instance, and set the
      [currentMode][ModeSelectTrait.Attributes.currentMode] attribute of the device's cluster
      instance."
    param:
    - name: newMode
      description: "The mode to set the cluster instance to. This must be one of the values in
        [ModeOptionStruct][ModeSelectTrait.ModeOptionStruct]."

  # ModeSelect bitmaps
  bitmaps:
  - name: Feature
    description: "ModeSelect cluster FeatureMap."
    value:
    - name: kOnOff
      description: "The cluster instance has a dependency with an [OnOff] cluster on the same
        endpoint. See the [onMode][ModeSelectTrait.Attributes.onMode] attribute for more
        information."

  # ModeSelect structs
  structs:
  - name: ModeOptionStruct
    description: "Represents the possible mode of the cluster instance."
    value:
    - name: label
      description: "Readable text that describes the mode option for the user."
    - name: mode
      description: "Identifies the mode option for the
        [supportedModes][ModeSelectTrait.Attributes.supportedModes] attribute."
    - name: semanticTags
      description: "A list of semantic tags for the mode option, used to determine the meaning of
        the mode as defined in a standard- or manufacturer-specific namespace. These values are
        defined in [SemanticTagStruct][ModeSelectTrait.SemanticTagStruct]."
  - name: SemanticTagStruct
    description: "Represents a semantic tag."
    value:
    - name: mfgCode
      description: "The Vendor ID if the [value] field is a semantic tag defined by the
        manufacturer, otherwise this is null."
    - name: "value"
      description: "The semantic tag within a semantic tag namespace that is either standard- or
        manufacturer-specific."

MotionDetection:
  description: "This trait supports detecting motion."

  # MotionDetection attributes
  attributes:
  - name: lastMotionDetectionEventEndTimestampSeconds
    description: "The Unix Epoch timestamp in seconds at which a motion event
      last ended, which occurs when the [supportsMotionDetectionEventInProgress]
      [MotionDetectionTrait.Feature.supportsMotionDetectionEventInProgress] feature flag
      becomes `false`. A value of -1 for this attribute indicates that either
      motion has not yet been detected or no timestamp is available."
  - name: lastMotionDetectionEventStartTimestampSeconds
    description: "The Unix Epoch timestamp in seconds at which a motion event
      last started, which occurs when the [supportsMotionDetectionEventInProgress]
      [MotionDetectionTrait.Feature.supportsMotionDetectionEventInProgress]
      feature flag becomes `true`. A value of -1 for this attribute indicates that either
      motion has not yet been detected or no timestamp is available."
  - name: motionDetectionEventInProgress
    description: "Whether or not a motion detection event is in progress. This attribute
      is returned if the
      [supportsMotionDetectionEventInProgress]
      [MotionDetectionTrait.Feature.supportsMotionDetectionEventInProgress] feature flag is set."
  - name: motionDetectionTimestampSeconds
    description: "The Unix Epoch timestamp in seconds at which motion was last
      detected. This attribute is returned if the
      [supportsMotionDetectionTimestampSeconds]
      [MotionDetectionTrait.Feature.supportsMotionDetectionTimestampSeconds] feature flag is set.
      A value of -1 for this attribute indicates that either no motion has been detected
      or no timestamp is available."

  # MotionDetection bitmaps
  bitmaps:
  - name: MotionDetectionFeature
    description: "MotionDetection trait FeatureMap."
    value:
    - name: kSupportsMotionDetectionEventInProgress
      description: "Indicates if the `motionDetectionEventInProgress` attribute will be populated
        when queried."
    - name: kSupportsMotionDetectionTimestampSeconds
      description: "Indicates if the `motionDetectionTimestampSeconds` attribute will be populated
        when queried."

  # MotionDetection events
  events:
  - name: MotionDetected
    description: "Proactive notification that occurs when the system detects motion."
    value:
    - name: motionDetectionEndTimestampMillis
      description: "The Unix Epoch timestamp in milliseconds at which motion was last detected."
    - name: motionDetectionStartTimestampMillis
      description: "The Unix Epoch timestamp in milliseconds at which motion was first detected."
    - name: motionDetectionTimestampSeconds
      description: "The Unix Epoch timestamp in seconds at which motion was detected."
    - name: priority
      description: "The notification level. The currently supported value is 0, which indicates
        that the notification should be spoken."

MeterIdentification:
  description: "This cluster provides attributes for determining advanced information about a
    utility metering device."

  # MeterIdentification attributes
  attributes:
  - name: meterType
    description: "Indicates the Meter type features, decided by the manufacturer."
  - name: pointOfDelivery
    description: "Indicates the unique identification of the connection point for the premises for
      billing purposes."
  - name: meterSerialNumber
    description: "Indicates the meter serial number."
  - name: protocolVersion
    description: "Indicates the protocol version."
  - name: powerThreshold
    description: "Indicates the maximum instantaneous power demand that can be distributed to the
      customer without any risk of overload."

  # MeterIdentification bitmaps
  bitmaps:
  - name: Feature
    description: "MeterIdentification cluster FeatureMap."
    value:
    - name: kPowerThreshold
      description: "Supports information about the power threshold."

  # MeterIdentification enums
  enums:
  - name: PowerThresholdSourceEnum
    description: "Sources of power threshold."
    value:
    - name: kContract
      description: "Indicates the power threshold comes from a signed contract."
    - name: kRegulator
      description: "Indicates the power threshold comes from a legal regulator."
    - name: kEquipment
      description: "Indicates the power threshold comes from a certified limits of the meter."
  - name: MeterTypeEnum
    description: "Type of meter."
    value:
    - name: kUtility
      description: "Utility."
    - name: kPrivate
      description: "Private."
    - name: kGeneric
      description: "Generic."

  # MeterIdentification structs
  structs:
  - name: PowerThresholdStruct
    description: "Represents information about a power threshold."
    value:
    - name: powerThreshold
      description: "Indicates the instantaneous power demand that can be distributed to the customer
        without any risk of overload in mW provided by the contract or Distribution Network
        Operator."
    - name: apparentPowerThreshold
      description: "Indicates the instantaneous apparent power demand that can be distributed to the
        customer without any risk of overload in mW provided by the contract or Distribution Network
        Operator."
    - name: powerThresholdSource
      description: "Indicates the reason why the power threshold is set."

Mount:
  description: "This trait provides device-specific mount-related information
    and functionality."

  # Mount attributes
  attributes:
  - name: mountDetectionType
    description: "The method or mechanism used to detect and determine the current mount state.
      Valid values are defined in
      [MountDetectionTypeEnum][MountTrait.MountDetectionTypeEnum]."
  - name: mountState
    description: "The physical attachment state of the device to the mount. Valid values
      are defined in
      [MountStateEnum][MountTrait.MountStateEnum]."
  - name: mountTypeName
    description: "Name of the detected mount type."
  - name: mountTypeOverride
    description: "User-defined override to bypass automatic mount detection. This allows users to
      force the device to treat the mount as attached even if detection fails or if the mount is
      detached. Valid values are defined in
      [MountTypeOverrideEnum][MountTrait.MountTypeOverrideEnum]."

  # Mount bitmaps
  bitmaps:
  - name: Feature
    description: "Mount cluster FeatureMap."
    value:
    - name: kMountStateChangeEventSupported
      description: "Device supports generating events when the physical mount state changes."
    - name: kDeviceMovedEventSupported
      description: "Device supports generating events when it detects movement while mounted."

  # Mount enums
  enums:
  - name: MountDetectionTypeEnum
    description: "The method or mechanism used to detect and determine the current mount state."
    value:
    - name: kMagnetic
      description: "The mount state is determined by magnetic sensors."
    - name: kOther
      description: "The mount state is determined by other hardware mechanisms
        such as pins, wiring, or electrical signals."
    - name: kUnspecified
      description: "The mount detection type is unspecified."
    - name: kUserOverride
      description: "Unofficial mount or overridden by the user with the [mountTypeOverride]
        [MountTrait.Attributes.mountTypeOverride]."
  - name: MountStateEnum
    description: "The physical attachment state of the device to the mount."
    value:
    - name: kAttached
      description: "The device is physically attached to the mount."
    - name: kDetached
      description: "The device is physically detached from the mount."
    - name: kUnspecified
      description: "The mount state is unspecified."
  - name: MountTypeOverrideEnum
    description: "User-defined override to bypass automatic mount detection."
    value:
    - name: kUnspecified
      description: "The override is unspecified."
    - name: kOfficial
      description: "The mount is an official or certified accessory. Mount detection is enabled."
    - name: kUnofficial
      description: "The mount is unofficial. Mount detection is disabled, and the mount state is
        forced to attached."

  # Mount events
  events:
  - name: MountStateChangeEvent
    description: "Generated when the device detects a change in its physical attachment state."
    value:
    - name: mountState
      description: "The physical-attachment state of the device to the mount. Valid values
        are defined in [MountStateEnum][MountTrait.MountStateEnum]."
    - name: mountDetectionType
      description: "The method or mechanism used to detect and determine the current mount state.
        Valid values are defined in [MountDetectionTypeEnum][MountTrait.MountDetectionTypeEnum]."
    - name: mountTypeName
      description: "Name of the detected mount type."
  - name: DeviceMovedEvent
    description: "Generated when the device detects physical movement while it is in the attached
      state."

NetworkControl:
  description: "This trait belongs to devices that can report network data and perform
    network-specific operations."

  # NetworkControl attributes
  attributes:
  - name: guestNetworkEnabled
    description: "Whether the guest network is enabled."
  - name: guestNetworkSettings
    description: "Contains the SSID of the guest network."
  - name: lastNetworkUploadSpeedTest
    description: "Results of the most recent network-upload speed test."
  - name: lastNetworkDownloadSpeedTest
    description: "Results of the most recent network-download speed test."
  - name: networkEnabled
    description: "Whether the main network is enabled."
  - name: networkProfiles
    description: "The supported network profile names."
  - name: networkProfileStates
    description: "States for the network profiles."
  - name: networkSettings
    description: "Contains the SSID of the main network."
  - name: networkSpeedTestInProgress
    description: "Whether a network-speed test is currently being run."
  - name: networkUsageLimitMB
    description: "The network usage limit for the current billing period."
  - name: networkUsageMB
    description: "The network usage in megabytes for the current billing period."
  - name: networkUsageUnlimited
    description: "Whether the network usage is unlimited. If this attribute is `true`,
      the `networkUsageLimitMB` attribute is ignored."
  - name: numConnectedDevices
    description: "Number of devices connected to the network."

  # NetworkControl bitmaps
  bitmaps:
  - name: NetworkControlFeature
    description: "NetworkControl trait FeatureMap."
    value:
    - name: kSupportsDisablingGuestNetwork
      description: "Whether this device supports disabling the guest network."
    - name: kSupportsDisablingNetworkProfile
      description: "Whether this device supports disabling network profiles."
    - name: kSupportsEnablingGuestNetwork
      description: "Whether this device supports enabling the guest network."
    - name: kSupportsEnablingNetworkProfile
      description: "Whether this device supports enabling network profiles."
    - name: kSupportsGettingGuestNetworkPassword
      description: "Whether this device supports obtaining the password of the guest network
        by running the `GetGuestNetworkPassword` command."
    - name: kSupportsNetworkDownloadSpeedTest
      description: "Whether this device supports testing the download speed of the network."
    - name: kSupportsNetworkUploadSpeedTest
      description: "Whether this device supports testing the upload speed of the network."

  # NetworkControl commands
  commands:
  - name: EnableDisableGuestNetwork
    description:
    - "Enables or disables the guest network. Secondary user verification with a PIN must be used.
      A user's home security can be affected if other security devices are disabled as a result of
      running this command."
    param:
    - name: enable
      description: "A value of `true` enables the guest network, `false` disables the
        guest network."
  - name: EnableDisableNetworkProfile
    description:
    - "Enables or disables a network profile. Secondary user verification with a PIN
      must be used. A user's home security can be affected if other security devices are disabled
      as a result of running this command."
    param:
    - name: enable
      description: "A value of `true` enables the profile, `false` disables the profile."
    - name: networkProfileName
      description: "The profile name from the list of available profiles."
  - name: GetGuestNetworkPassword
    description:
    - "Gets the password of the guest network."
    param:
    - name: guestNetworkPassword
      description: "The password for the guest network."
  - name: TestNetworkSpeed
    description:
    - "Tests the network's download and upload speed."
    param:
    - name: testDownloadSpeed
      description: "Whether the download speed should be tested."
    - name: testUploadSpeed
      description: "Whether the upload speed should be tested."

  # NetworkControl enums
  enums:
  - name: SpeedTestStatus
    description: "Whether the most recent network-download speed test succeeded or failed."
    value:
    - name: kFailure
      description: "Failure."
    - name: kSuccess
      description: "Success."
    - name: kUnspecified
      description: "Unspecified."

  # NetworkControl events
  events:
  - name: TestNetworkSpeedFollowUp
    description: "The follow-up event for the `TestNetworkSpeed` command."
    value:
    - name: errorCode
      description: "The error encountered when processing the command."
    - name: networkDownloadSpeedMbps
      description: "The network download speed measured in megabits per second."
    - name: networkUploadSpeedMbps
      description: "The network upload speed measured in megabits per second."
    - name: status
      description: "The result status of the command."

  # NetworkControl structs
  structs:
  - name: GuestNetworkSettings
    description: "Settings of the guest network."
    value:
    - name: ssid
      description: "SSID of the guest network."
  - name: LastNetworkDownloadSpeedTest
    description: "Results of the most recent network-download speed test."
    value:
    - name: downloadSpeedMbps
      description: "The download speed in megabits per second of the most recent network
        speed test."
    - name: status
      description: "Whether the most recent network-download speed test succeeded or failed."
    - name: unixTimestampSeconds
      description: "The Unix Epoch timestamp of when the most recent network-download speed test
        was run."
  - name: LastNetworkUploadSpeedTest
    description: "The results of the most recent network-upload speed test."
    value:
    - name: status
      description: "Whether the most recent network-upload speed test succeeded or failed."
    - name: unixTimestampSeconds
      description: "The Unix Epoch timestamp of when the most recent network-upload speed test
        was run."
    - name: uploadSpeedMbps
      description: "The upload speed in megabits per second of the most recent network
        speed test."
  - name: NetworkProfileState
    description: "The state of one of the network profiles."
    value:
    - name: enabled
      description: "Network profile state."
    - name: networkProfileName
      description: "Network profile name."
  - name: NetworkSettings
    description: "Settings of the main network."
    value:
    - name: ssid
      description: "SSID of the main network."

NitrogenDioxideConcentrationMeasurement:
  description: "This trait provides an interface to nitrogen dioxide concentration measurement
    functionality."

  # NitrogenDioxideConcentrationMeasurement attributes
  attributes:
  - name: averageMeasuredValue
    description: "The average value of [measuredValue]
      [NitrogenDioxideConcentrationMeasurementTrait.Attributes.measuredValue]
      measured during the [averageMeasuredValueWindow]
      [NitrogenDioxideConcentrationMeasurementTrait.Attributes.averageMeasuredValueWindow]."
  - name: averageMeasuredValueWindow
    description: "The window of time, in seconds, used to measure the [averageMeasuredValue]
      [NitrogenDioxideConcentrationMeasurementTrait.Attributes.averageMeasuredValue]."
  - name: levelValue
    description: "The level of the substance detected."
  - name: maxMeasuredValue
    description: "The maximum value of [measuredValue]
      [NitrogenDioxideConcentrationMeasurementTrait.Attributes.measuredValue]
      that can be measured."
  - name: measuredValue
    description: "The most recent measurement as a single-precision floating-point number, in units
      specified by
      [measurementUnit][NitrogenDioxideConcentrationMeasurementTrait.Attributes.measurementUnit]."
  - name: measurementMedium
    description: "The medium in which
      [measuredValue][NitrogenDioxideConcentrationMeasurementTrait.Attributes.measuredValue]
      is being measured."
  - name: measurementUnit
    description: "The unit used by
      [measuredValue][NitrogenDioxideConcentrationMeasurementTrait.Attributes.measuredValue]."
  - name: minMeasuredValue
    description: "The minimum value of [measuredValue]
      [NitrogenDioxideConcentrationMeasurementTrait.Attributes.measuredValue]
      that can be measured."
  - name: peakMeasuredValue
    description: "The maximum value of [measuredValue]
      [NitrogenDioxideConcentrationMeasurementTrait.Attributes.measuredValue]
      that has been measured during the [peakMeasuredValueWindow]
      [NitrogenDioxideConcentrationMeasurementTrait.Attributes.peakMeasuredValueWindow]."
  - name: peakMeasuredValueWindow
    description: "The window of time, in seconds, used to determine the [peakMeasuredValue]
     [NitrogenDioxideConcentrationMeasurementTrait.Attributes.peakMeasuredValue]."
  - name: uncertainty
    description: "The range of error or deviation that can be found in [measuredValue]
      [NitrogenDioxideConcentrationMeasurementTrait.Attributes.measuredValue]
      and [peakMeasuredValue]
      [NitrogenDioxideConcentrationMeasurementTrait.Attributes.peakMeasuredValue]."

  # NitrogenDioxideConcentrationMeasurement enums
  enums:
  - name: LevelValueEnum
    description: "Level values."
    value:
    - name: kCritical
      description: "Critical."
    - name: kHigh
      description: "High."
    - name: kLow
      description: "Low."
    - name: kMedium
      description: "Medium."
    - name: kUnknown
      description: "Unknown."
  - name: MeasurementMediumEnum
    description: "Mediums in which measurements are taken."
    value:
    - name: kAir
      description: "Air."
    - name: kSoil
      description: "Soil."
    - name: kWater
      description: "Water."
  - name: MeasurementUnitEnum
    description: "Measurement units."
    value:
    - name: kBQM3
      description: "Becquerels per cubic meter."
    - name: kMGM3
      description: "Milligrams per cubic meter."
    - name: kNGM3
      description: "Nanogram per cubic meter."
    - name: kPM3
      description: "Particles per cubic meter."
    - name: kPPB
      description: "Parts per billion."
    - name: kPPM
      description: "Parts per million."
    - name: kPPT
      description: "Parts per trillion."
    - name: kUGM3
      description: "Micrograms per cubic meter."

  # NitrogenDioxideConcentrationMeasurement bitmaps
  bitmaps:
  - name: Feature
    description: "NitrogenDioxideConcentrationMeasurement cluster FeatureMap."
    value:
    - name: kAverageMeasurement
      description: "Device supports the average numeric measurement of substance."
    - name: kCriticalLevel
      description: "Device supports the Critical concentration Level."
    - name: kLevelIndication
      description: "Device supports basic level indication for substance using the
        [LevelValueEnum][NitrogenDioxideConcentrationMeasurementTrait.LevelValueEnum]."
    - name: kMediumLevel
      description: "Device supports the Medium concentration Level."
    - name: kNumericMeasurement
      description: "Device supports numeric measurement of substance."
    - name: kPeakMeasurement
      description: "Device supports peak numeric measurement of substance."

ObjectDetection:
  description: "This trait belongs to devices that can detect objects or people, and sends a
    notification to the user. By default, these notifications are announced
    on smart displays and speakers by Google Assistant following a doorbell ring chime."

  # ObjectDetection enums
  enums:
  - name: ObjectType
    description: "Detected object types."
    value:
    - name: kFaceFamiliar
      description: "A person whose face is recognized has been detected."
    - name: kFaceUnfamiliar
      description: "A person whose face is not recognized has been detected."
    - name: kPackageDelivered
      description: "A package has been delivered."
    - name: kPerson
      description: "A person has been detected."
    - name: kUnknown
      description: "A person or object has been detected, but no more information is known."

  # ObjectDetection events
  events:
  - name: ObjectDetected
    description: "Detection notification event."
    value:
    - name: detectionTimestampMillis
      description: "The Unix Epoch timestamp in milliseconds at which the object was detected."
    - name: objects
      description: "The objects detected, listed by category."
    - name: priority
      description: "The notification level. The currently supported value is 0, which indicates
        that the notification should be spoken."

  # ObjectDetection structs
  structs:
  - name: Object
    description: "Information about a specific object that has been detected."
    value:
    - name: endTimestampMillis
      description: "The Unix Epoch timestamp in milliseconds at which the object was last detected."
    - name: imageUrl
      description: "The URL of the object's image."
    - name: name
      description: "Label of the object."
    - name: type
      description: "Type of the object."
    - name: startTimestampMillis
      description: "The Unix Epoch timestamp in milliseconds at which the object was
        first detected."
  - name: Objects
    description: "Categorization of the objects detected."
    value:
    - name: familiar
      description: "Count of objects recognized by the user that have no label."
    - name: named
      description: "List of objects recognized by the user that have been tagged with a label."
    - name: objects
      description: "List of objects detected."
    - name: unclassified
      description: "Count of objects detected that the device was unable to classify."
    - name: unfamiliar
      description: "Count of objects detected by the device that the user may not recognize."

OccupancySensing:
  description: "This trait provides an interface to occupancy sensing functionality."

  # OccupancySensing attributes
  attributes:
  - name: holdTime
    description: "The time delay, in seconds, before the sensor changes to its unoccupied state
      after the last detection of occupancy."
  - name: holdTimeLimits
    description: "The server's limits and default value for the holdTime attribute."
  - name: occupancy
    description: "The sensed (processed) status of occupancy."
  - name: occupancySensorType
    description: "The type of occupancy sensor. Valid values are defined in
      [OccupancySensorTypeEnum][OccupancySensingTrait.OccupancySensorTypeEnum]"
  - name: occupancySensorTypeBitmap
    description: "The active occupancy sensor type. Valid modes are defined in
      [OccupancySensorTypeBitmap][OccupancySensingTrait.OccupancySensorTypeBitmap]"
  - name: PirOccupiedToUnoccupiedDelay
    description: "The time delay in seconds before the PIR sensor changes to its unoccupied state
      after detecting movement in the sensed area."
  - name: PirUnoccupiedToOccupiedDelay
    description: "The time delay in seconds before the PIR sensor changes to its occupied state
      after detecting movement in the sensed area."
  - name: PirUnoccupiedToOccupiedThreshold
    description: "The number of movement detection events that must occur within the
      [PirUnoccupiedToOccupiedDelay] period before the PIR sensor transitions to its occupied
      state."
  - name: ultrasonicOccupiedToUnoccupiedDelay
    description: "The time delay in seconds before the ultrasonic sensor changes to its unoccupied
      state after detecting movement in the sensed area."
  - name: ultrasonicUnoccupiedToOccupiedDelay
    description: "The time delay in seconds before the Ultrasonic sensor changes to its occupied
      state after detecting movement in the sensed area."
  - name: ultrasonicUnoccupiedToOccupiedThreshold
    description: "The number of movement detection events required during the
      [ultrasonicUnoccupiedToOccupiedDelay] period before the ultrasonic sensor transitions to its
      occupied state."
  - name: physicalContactOccupiedToUnoccupiedDelay
    description: "The time delay in seconds before the physical contact occupancy sensor switches
      to its unoccupied state after detecting an unoccupied event."
  - name: physicalContactUnoccupiedToOccupiedDelay
    description: "The time delay in seconds before the physical contact occupancy sensor switches
      to its occupied state after detecting an occupied event."
  - name: physicalContactUnoccupiedToOccupiedThreshold
    description: "The number of movement detection events required during the
      [physicalContactUnoccupiedToOccupiedDelay] period before the PIR sensor transitions to its
      occupied state."

  # OccupancySensing bitmaps
  bitmaps:
  - name: Feature
    description: "OccupancySensing cluster FeatureMap."
    value:
    - name: kOther
      description: "Supports sensing using a modality not listed in the other bits."
    - name: kPassiveInfrared
      description: "Supports sensing using PIR (Passive InfraRed)."
    - name: kUltrasonic
      description: "Supports sensing using UltraSound."
    - name: kPhysicalContact
      description: "Supports sensing using a physical contact."
    - name: kActiveInfrared
      description: "Supports sensing using Active InfraRed measurement."
    - name: kRadar
      description: "Supports sensing using radar waves (microwave)."
    - name: kRFSensing
      description: "Supports sensing using analysis of radio signals."
    - name: kVision
      description: "Supports sensing based on analyzing images."
  - name: OccupancyBitmap
    description: "The current active occupancy state."
    value:
    - name: kOccupied
      description: "The sensed occupancy state."
  - name: OccupancySensorTypeBitmap
    description: "The current active occupancy sensor type."
    value:
    - name: kPir
      description: "Supports a passive infrared sensor."
    - name: kUltrasonic
      description: "Supports an ultrasonic sensor."
    - name: kPhysicalContact
      description: "Supports a physical contact sensor."

  # OccupancySensing enums
  enums:
  - name: OccupancySensorTypeEnum
    description: "Specifies the occupancy sensor type."
    value:
    - name: kPir
      description: "Sensor is a passive infrared sensor."
    - name: kUltrasonic
      description: "Sensor is an ultrasonic sensor."
    - name: kPirAndUltrasonic
      description: "Sensor is a passive infrared and ultrasonic sensor."
    - name: kPhysicalContact
      description: "Sensor is a physical contact sensor."

  # OccupancySensing events
  events:
  - name: OccupancyChanged
    description: "Generated when the occupancy status changes."
    value:
    - name: occupancy
      description: "The new occupancy state."

  # OccupancySensing structs
  structs:
  - name: HoldTimeLimitsStruct
    description: "Provides information on the server’s supported values for the holdTime attribute."
    value:
    - name: holdTimeMin
      description: "The minimum supported value for the holdTime attribute, in seconds."
    - name: holdTimeMax
      description: "The maximum supported value for the holdTime attribute, in seconds."
    - name: holdTimeDefault
      description: "The default value for the holdTime attribute, in seconds."

OnOff:
  description: "This trait provides an interface for turning devices on and off."

  # OnOff attributes
  attributes:
  - name: globalSceneControl
    description: "When set to true, prevents the global scene from being destroyed by subsequent
      [off][OnOffCommands.off] or [on][OnOffCommands.on] commands."
  - name: offWaitTime
    description: "The length of time (in 0.1 seconds) that the
      [onOff][OnOffTrait.Attributes.onOff] attribute is false before allowing another
      [OnWithTimedOff][OnOffTrait.OnWithTimedOffCommand.Request] command to turn the device back
      on."
  - name: onOff
    description: "Whether the device type implemented on the endpoint is turned off (false) or
      turned on (true)."
  - name: onTime
    description: "The length of time (in 0.1 seconds) that the
      [onOff][OnOffTrait.Attributes.onOff] attribute is true before changing to false when using
      the [OnWithTimedOff][OnOffTrait.OnWithTimedOffCommand.Request] command."
  - name: startUpOnOff
    description: "The desired startup behavior of a device when supplied with power. If not set,
      the [onOff][OnOffTrait.Attributes.onOff] attribute is set to its previous value."

  # OnOff commands
  commands:
  - name: "Off"
    description:
    - "Turn off the device, and set the [onOff][OnOffTrait.Attributes.onOff] attribute to false."
  - name: OffWithEffect
    description:
    - "Allow devices to be turned off using enhanced ways of fading."
    param:
    - name: effectIdentifier
      description: "The fading effect to use when turning the device off. Must be a value from
        [OnOffTrait.EffectIdentifierEnum]."
    - name: effectVariant
      description: "Variant of the effect, indicated by the [effectIdentifier] parameter, that is
        triggered. This must be one of the values in
        [OnOffTrait.DelayedAllOffEffectVariantEnum] or
        [OnOffTrait.DyingLightEffectVariantEnum] that correspond to the effect specified for
        `effectIdentifier`."
  - name: "On"
    description:
    - "Turn on the device, and set the [onOff][OnOffTrait.Attributes.onOff] attribute to true."
  - name: OnWithRecallGlobalScene
    description:
    - "Allow the recall of the settings (global scene) the device had when the device was turned
        off."
    - "This command is ignored if the
        [globalSceneControl][OnOffTrait.Attributes.globalSceneControl] attribute is true."
    - "If the `globalSceneControl` attribute is false, the global scene is recalled, the
        [onOff][OnOffTrait.Attributes.onOff] attribute is updated accordingly, and the
        `globalSceneControl` attribute is set to true."
    - "When this command is called, if the [onTime][OnOffTrait.Attributes.onTime] attribute is 0,
        then the [offWaitTime][OnOffTrait.Attributes.offWaitTime] attribute is also set to 0."
  - name: OnWithTimedOff
    description:
    - "Allow the device to be turned on for a specific duration with a guarded off duration so that,
        should the device be subsequently turned off, further
        [OnWithTimedOff][OnOffTrait.OnWithTimedOffCommand.Request] commands received during this
        time are prevented from turning the devices back on."
    param:
    - name: onOffControl
      description: "When set to `1`, the
        [onWithTimedOff][OnOffCommands.onWithTimedOff] command will only be processed
        if the `onOff` attribute is `true`. When set to `0`, the
        [onWithTimedOff][OnOffCommands.onWithTimedOff] command is always processed."
    - name: onTime
      description: "The duration for which device is turned on. Sets the value of the `onTime`
        attribute."
    - name: offWaitTime
      description: "The guarded off duration to set for the device. Sets the value of the
        `offWaitTime` attribute."
  - name: Toggle
    description:
    - "If the device is off, turn the device on and set the
      [onOff][OnOffTrait.Attributes.onOff] attribute to `true`."
    - "If the device is on, turn the device off and set the
      [onOff][OnOffTrait.Attributes.onOff] attribute to `false`."

  # OnOff bitmaps
  bitmaps:
  - name: OnOffControlBitmap
    description: "Flags for cluster control."
    value:
    - name: kAcceptOnlyWhenOn
      description: "Indicates a command is only accepted when the `onOff` attribute is true."
  - name: Feature
    description: "OnOff cluster FeatureMap."
    value:
    - name: kLighting
      description: "Device has behavior that supports lighting apps."
    - name: kDeadFrontBehavior
      description: "Device supports dead front behavior when the `onOff` attribute is false."

  # OnOff enums
  enums:
  - name: DelayedAllOffEffectVariantEnum
    description: "Delayed fading effects for lighting."
    value:
    - name: kDelayedOffFastFade
      description: "Lights are set to fade off in 0.8 seconds."
    - name: kNoFade
      description: "Lights do not fade."
    - name: kDelayedOffSlowFade
      description: "Lights are set to dim to 50% in 0.8 seconds, then to fade off in 12 seconds."
  - name: DyingLightEffectVariantEnum
    description: "Dying effects for lighting."
    value:
    - name: kDyingLightFadeOff
      description: "Lights are set brighten 20% in 0.5 seconds, then to fade off in 1 second."
  - name: EffectIdentifierEnum
    description: "Fading effect types for use with lighting."
    value:
    - name: kDelayedAllOff
      description: "Lights are set to dim or fade off."
    - name: kDyingLight
      description: "Lights are set to brighten and then fade off."
  - name: StartUpOnOffEnum
    description: "Startup behaviors for a device."
    value:
    - name: kOff
      description: "Sets the [onOff][OnOffTrait.Attributes.onOff] attribute to false on startup."
    - name: kOn
      description: "Sets the [onOff][OnOffTrait.Attributes.onOff] attribute to true on startup."
    - name: kToggle
      description: "If the previous value of the [onOff][OnOffTrait.Attributes.onOff] attribute is
        false, set the `onOff` attribute to true on startup, and vice versa."

OpenClose:
  description: "This trait belongs to devices that support opening and closing, and in some cases
    opening and closing partially or potentially in more than one direction."

  # OpenClose attributes
  attributes:
  - name: openDirection
    description: "List of supported directions in which the device can open or close. Include this
      attribute if the device supports opening and closing in more than one direction."
  - name: openPercent
    description: "Indicates the percentage that a device is opened, where 0 is closed and 100 is
      fully open."
  - name: openState
    description: "The list of states for each supported open direction."

  # OpenClose commands
  commands:
  - name: Close
    description:
    - "Fully close the device."
  - name: GoToOpenPercentage
    description:
    - "Open the device to a specific percentage, where 0 is closed and 100 is fully open."
    param:
    - name: openPercent
      description: "Indicates the percentage that a device should be opened, where 0 is closed and
        100 is fully open."
    - name: openDirection
      description: "The direction in which to open. Only present if the device supports multiple
        directions, as indicated by the [openDirection][OpenCloseTrait.Attributes.openDirection]
        attribute, and a direction is specified by the user."
  - name: Open
    description:
    - "Fully open the device."
    param:
    - name: openDirection
      description: "The direction in which to open. Only present if the device supports multiple
        directions, as indicated by the [openDirection][OpenCloseTrait.Attributes.openDirection]
        attribute, and a direction is specified by the user."
  - name: Step
    description:
    - "Adjust the open-close state of the device relative to the current state."
    param:
    - name: openRelativePercent
      description: "The exact percentage to change open-close state."
    - name: openDirection
      description: "The direction in which to open. Only present if the device supports multiple
        directions, as indicated by the [openDirection][OpenCloseTrait.Attributes.openDirection]
        attribute, and a direction is specified by the user."

  # OpenClose bitmaps
  bitmaps:
  - name: OpenCloseFeature
    description: "OpenClose trait FeatureMap."
    value:
    - name: kSupportsDiscreteOnlyOpenClose
