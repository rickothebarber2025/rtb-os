UserLabel:
  description: "This trait provides an interface to tag an endpoint with zero or more labels."

  # UserLabel attributes
  attributes:
  - name: labelList
    description: "Represents a list containing a minimum of `4`
      [LabelStruct][UserLabelTrait.LabelStruct] entries per node."

  # UserLabel structs
  structs:
  - name: LabelStruct
    description: "An object describing an endpoint's label."
    value:
    - name: label
      description: "An endpoint identifier."
    - name: value
      description: "A discriminator for a label that may have multiple instances."

ValveConfigurationAndControl:
  description: "This trait provides an interface for configuring a valve."

  # ValveConfigurationAndControl attributes
  attributes:
  - name: autoCloseTime
    description: "The UTC time when the valve will close, depending on value of the
      [openDuration][ValveConfigurationAndControlTrait.Attributes.openDuration] attribute."
  - name: currentLevel
    description: "The current level of the valve as a percentage value, between fully closed and
      fully open."
  - name: currentState
    description: "The current state of the valve."
  - name: defaultOpenDuration
    description: "The default duration, in seconds, for which the valve will remain open, if a
      value for the `openDuration` parameter is not present in the `Open` command."
  - name: defaultOpenLevel
    description: "The default value used for the
      [targetLevel][ValveConfigurationAndControlTrait.Attributes.targetLevel] attribute, when a
      valve transitions from the closed to the open state, caused by an `Open` command, if a value
      for the `targetLevel` parameter isn't present in the `Open` command."
  - name: levelStep
    description: "The step size supported by the valve."
  - name: openDuration
    description: "The total duration, in seconds, for which the valve will remain open
      for the current opening."
  - name: remainingDuration
    description: "The remaining duration, in seconds, until the valve closes."
  - name: targetLevel
    description: "The target level of the valve as a percentage value, between fully closed and
      fully open."
  - name: targetState
    description: "The target state, while changing the state, of the valve."
  - name: valveFault
    description: "Any faults registered by the valve."

  # ValveConfigurationAndControl commands
  commands:
  - name: Close
    description:
    - "Set the valve to its closed position."
  - name: Open
    description:
    - "Set the valve to its open position."
    param:
    - name: openDuration
      description: "How long the valve should remain open for the current `Open` operation."
    - name: targetLevel
      description: "The target level used for the current `Open` operation."

  # ValveConfigurationAndControl bitmaps
  bitmaps:
  - name: Feature
    description: "ValveConfigurationAndControl Trait FeatureMap."
    value:
    - name: kLevel
      description: "Device supports setting the specific position of the valve."
    - name: kTimeSync
      description: "UTC time is used for time indications."
  - name: ValveFaultBitmap
    description: "The reason for a valve fault condition."
    value:
    - name: kBlocked
      description: "Blocked."
    - name: kCurrentExceeded
      description: "Available current exceeded."
    - name: kGeneralFault
      description: "Unspecified fault."
    - name: kLeaking
      description: "Leak detected."
    - name: kNotConnected
      description: "No valve is connected to the controller."
    - name: kShortCircuit
      description: "Short circuit detected."

  # ValveConfigurationAndControl enums
  enums:
  - name: StatusCodeEnum
    description: "Status code."
    value:
    - name: kFailureDueToFault
      description: "The requested action could not be performed due to a fault on the valve."
  - name: ValveStateEnum
    description: "The state of the valve."
    value:
    - name: kClosed
      description: "Valve is in closed position."
    - name: kOpen
      description: "Valve is in open position."
    - name: kTransitioning
      description: "Valve is transitioning between closed and open positions or between levels."

  # ValveConfigurationAndControl events
  events:
  - name: ValveFault
    description: "The valve either registered or cleared a fault, such as when the valve
      isn't able to transition to the requested target level or state."
    value:
    - name: valveFault
      description: "The value of the
        [valveFault][ValveConfigurationAndControlTrait.Attributes.valveFault] attribute, at the
        time this event is generated."
  - name: ValveStateChanged
    description: "The valve state changed."
    value:
    - name: valveLevel
      description: "The new level of the valve."
    - name: valveState
      description: "The new state of the valve."

VideoAnalysis:
  description: "This trait provides an interface for initiating natural language event searches."

  # VideoAnalysis events
  events:
  - name: QueryMatched
    description: "An event that is triggered when a query is matched with the video clip."
    value:
    - name: query
      description: "A natural language query to be matched with the video clip."

VisitorAnnouncement:
  description: "This trait provides settings for visitor announcements when a doorbell is pressed."

  # VisitorAnnouncement attributes
  attributes:
  - name: visitorAnnouncementsEnabled
    description: "Enables announcement of visitor arrivals on speakers and smart displays."

Volume:
  description: "This trait provides a volume extension to the
    `LevelControl` trait and is only for use with the Automation API."

  # Volume attributes
  attributes:
  - name: currentVolumePercent
    description: "The current volume percentage setting in the range of 0 to 100."
  - name: isMuted
    description: "Whether or not the speaker is muted."

  # Volume commands
  commands:
  - name: MoveToVolume
    description:
    - "Move the volume of the device to the specified volume."
    param:
    - name: volumePercent
      description: "The desired volume percentage setting in the range of 0 to 100."
  - name: VolumeStep
    description:
    - "Incremental step volume. If volume + step is greater than 100,
      the volume is set to 100. If volume + step is less than 0, the volume
      is set to 0."
    param:
    - name: step
      description: "Indicates the increment by which to increase or decrease the volume.
        Valid values are between 0 and 100."
    - name: stepMode
      description: "Indicates whether to increase or decrease the volume."
  - name: Mute
    description:
    - "Mutes the device."
  - name: Unmute
    description:
    - "Unmutes the device and sets the volume to the last non-zero volume."

  # Volume enums
  enums:
  - name: VolumeStepModeEnum
    description: "Step values that indicate whether to increase or decrease the volume."
    value:
    - name: kIncrease
      description: "Increase the device's volume."
    - name: kDecrease
      description: "Decrease the device's volume."

WebRtcLiveView:
  restricted: true

  description: "This trait provides the functionality to control a live view session."

  # WebRtcLiveView attributes
  attributes:
  - name: supportedQualityHints
    description: "The supported quality hints for a live view session."
  - name: supportedTalkbackType
    description: "The current type of talkback supported by the device."

  # WebRtcLiveView commands
  commands:
  - name: ChangeLiveViewQuality
    description:
    - "Change the quality of a WebRTC live stream. If the requested quality is not supported, the
      closest available matching quality will be used."
    param:
    - name: mediaSessionId
      description: "The media session ID of the live stream to change."
    - name: qualityHint
      description: "The quality hint for the live view session."
    response:
      description: "The outcome of the `ChangeLiveViewQuality` command."
      param:
      - name: mediaSessionId
        description: "The media session ID of the live stream."
      - name: qualityHint
        description: "The new quality hint of the live view session."
  - name: StartLiveView
    description:
    - "Start a WebRTC live stream."
    param:
    - name: qualityHint
      description: "The quality hint for the live view session."
    - name: offerSdp
      description: "An SDP offer, specific to the local device that will display the WebRTC live
        stream."
    response:
      description: "The outcome of the `ExtendLiveView` command."
      param:
      - name: mediaSessionId
        description: "The media session ID of the live stream to start."
      - name: answerSdp
        description: "The SDP answer for the live stream."
      - name: liveSessionDurationSeconds
        description: "The duration, in seconds, for which the live stream was extended."
  - name: StopLiveView
    description:
    - "Stop a WebRTC live stream."
    param:
    - name: mediaSessionId
      description: "The media session ID of the live stream to start."
  - name: StartTalkback
    description:
    - "Start a WebRTC live stream."
    param:
    - name: mediaSessionId
      description: "The media session ID of the live stream to start."
    - name: offerSdp
      description: "The SDP offer for the talkback media stream."
  - name: StopTalkback
    description:
    - "Start a WebRTC live stream."
    param:
    - name: mediaSessionId
      description: "The media session ID of the live stream to stop."
  - name: ExtendLiveView
    description:
    - "Extend a WebRTC live stream."
    param:
    - name: mediaSessionId
      description: "The media session ID of the live stream to extend."
    - name: extendedDurationSeconds
      description: "The duration, in seconds, for which the live stream should be extended."
    response:
      description: "The outcome of the `ExtendLiveView` command."
      param:
      - name: liveSessionDurationSeconds
        description: "The initial duration, in seconds, for the live stream."

  # WebRtcLiveView enums
  enums:
  - name: TalkbackType
    description: "The type of talkback supported by the device."
    value:
    - name: kDirectly
      description: "The device supports directly sending audio data to the remote endpoint."
    - name: kRenegotiation
      description: "The device supports renegotiation of the SDP offer/answer exchange to
        negotiate the talkback media stream."
  - name: QualityHint
    description: "The quality hint (or preference) for a live view session."
    value:
    - name: kUnspecified
      description: "Unspecified."
    - name: kSd
      description: "Standard Definition, typically one of 240p, 360p, 480p."
    - name: kHd
      description: "High Definition, typically 720p."
    - name: kFhd
      description: "Full High Definition, typically 1080p."
    - name: kQhd
      description: "Quad High Definition, typically 1440p."
    - name: kUhd
      description: "Ultra High Definition, typically 2160p."

ZoneManagement:
  description: "This trait provides an interface to manage regions of interest, known as zones,
     which can be defined by either the manufacturer or the end user. This is a minimalistic custom
     version of the ZoneManagement standard Matter cluster, and provides functionality for
     some of the zone settings."

  # ZoneManagement attributes
  attributes:
  - name: maxUserDefinedZones
    description: "The maximum number of user-defined zones supported."
  - name: maxZones
    description: "The maximum number of zones supported."
  - name: sensitivity
    description: "The sensitivity of the underlying zone triggering detection mechanism."
  - name: sensitivityMax
    description: "The maximum sensitivity level supported."
  - name: triggers
    description: "Specifies all currently defined triggers controlling the generation of
      `ZoneTriggered` and `ZoneStopped` events."
  - name: twoDCartesianMax
    description: "The maximum X and Y points that are allowed for TwoD Cartesian Zones."
  - name: zones
    description: "All currently defined zones as a list of
      [ZoneInformationStruct][ZoneManagementTrait.ZoneInformationStruct]. Use the commands from
      this cluster to add, update, or remove entries from this list."

  # ZoneManagement bitmaps
  bitmaps:
  - name: Feature
    description: "ZoneManagement cluster FeatureMap."
    value:
    - name: kTwoDimensionalCartesianZone
      description: "Supports 2D Cartesian zones."
    - name: kPerZoneSensitivity
      description: "Supports per-zone sensitivity."
    - name: kUserDefined
      description: "Supports user-defined zones."
    - name: kFocusZones
      description: "Supports focus zones."

  # ZoneManagement commands
  commands:
  - name: CreateOrUpdateTrigger
    description:
    - "Creates or updates a zone trigger."
    param:
    - name: trigger
      description: "The zone trigger control."
  - name: CreateTwoDCartesianZone
    description:
    - "Creates and stores a two-dimensional Cartesian zone."
    param:
    - name: zone
      description: "A [TwoDCartesianZoneStruct][ZoneManagementTrait.TwoDCartesianZoneStruct]
        value representing all information required to define the two-dimensional Cartesian zone."
    response:
      description: "The result of the `CreateTwoDCartesianZone` command."
      param:
      - name: zoneId
        description: "An unsigned 16-bit integer representing the unique `ZoneID`."
  - name: RemoveTrigger
    description:
    - "Removes a zone trigger."
    param:
    - name: zoneId
      description: "The unique zone ID."
  - name: RemoveZone
    description:
    - "Removes the user-defined zone indicated by the `ZoneID`. The default zone with `zoneID = 0`
       cannot be removed."
    param:
    - name: zoneId
      description: "The `ZoneID` of the zone to be removed."
  - name: UpdateTwoDCartesianZone
    description:
    - "Updates a stored two-dimensional Cartesian zone.
       When updating the default zone (`zoneID = 0`), only the `use` field
       within the provided `TwoDCartesianZoneStruct` can be modified."
    param:
    - name: zoneId
      description: "The `ZoneID` of the zone to be updated."
    - name: zone
      description: "A [TwoDCartesianZoneStruct][ZoneManagementTrait.TwoDCartesianZoneStruct]
        value representing updated zone information."

  # ZoneManagement enums
  enums:
  - name: StatusCodeEnum
    description: "Zone management status codes."
    value:
    - name: kZoneNotFound
      description: "Zone not found."
    - name: kZoneInUse
      description: "Zone in use."
  - name: ZoneEventStoppedReasonEnum
    description: "Reasons for a zone event stopping."
    value:
    - name: kActionStopped
      description: "Indicates that whatever triggered the zone event has stopped being detected."
    - name: kTimeout
      description: "Indicates that the max duration for detecting triggering activity has been
        reached."
  - name: ZoneEventTriggeredReasonEnum
    description: "Reasons for a zone event triggering."
    value:
    - name: kMotion
      description: "Motion detected."
  - name: ZoneSourceEnum
    description: "The source of the zone."
    value:
    - name: kMfg
      description: "The zone is defined by the manufacturer."
    - name: kUser
      description: "The zone is defined by the user."
  - name: ZoneTypeEnum
    description: "The type of the zone."
    value:
    - name: kTwoDCARTZone
      description: "Indicates a two-dimensional Cartesian Zone."
  - name: ZoneUseEnum
    description: "The intended use of the zone."
    value:
    - name: kAnimal
      description: "The zone is intended to detect animals."
    - name: kFocus
      description: "The zone provides a focus area."
    - name: kMotion
      description: "The zone is intended to detect motion."
    - name: kPackage
      description: "The zone is intended to detect packages."
    - name: kPerson
      description: "The zone is intended to detect persons."
    - name: kPrivacy
      description: "The zone is intended to protect privacy."
    - name: kVehicle
      description: "The zone is intended to detect vehicles."

  # ZoneManagement events
  events:
  - name: ZoneTriggered
    description: "Generated when a zone is triggered."
    value:
    - name: zone
      description: "The triggered zone ID."
    - name: reason
      description: "The reason the zone was triggered."
  - name: ZoneStopped
    description: "Generated when a zone event stops."
    value:
    - name: zone
      description: "The stopped zone ID."
    - name: reason
      description: "The reason the zone event stopped."

  # ZoneManagement structs
  structs:
  - name: TwoDCartesianZoneStruct
    description: "Encodes all information needed to define a `TwoDCartesianZone`."
    value:
    - name: name
      description: "A string representing the name of the Zone. This is not guaranteed to be
        unique."
    - name: use
      description: "A [ZoneUseEnum][ZoneManagementTrait.ZoneUseEnum] value
        representing the purpose of the zone."
    - name: vertices
      description: "A list of vertices of type
        [TwoDCartesianVertexStruct][ZoneManagementTrait.TwoDCartesianVertexStruct].
        These vertices define a
        simple polygon on the TwoD Cartesian plane, which represents the bounds of the `TwoD
        Cartesian Zone` with an implicit connection between the last and first list items."
    - name: color
      description: "The color, in RGB or RGBA, used for attaching a color to the zone definition.
        This value is informational only and has no effect on the behavior of the zone."
  - name: TwoDCartesianVertexStruct
    description: "Encodes a point on the two-dimensional Cartesian plane for the `TwoDCartesianZone`
      feature."
    value:
    - name: x
      description: "The X coordinate of the vertex."
    - name: y
      description: "The Y coordinate of the vertex."
  - name: ZoneInformationStruct
    description: "Encodes basic information about a zone without containing the specifics of
      how the zone is defined."
    value:
    - name: zoneID
      description: "Unique ZoneID of the zone."
    - name: zoneType
      description: "A [ZoneTypeEnum][ZoneManagementTrait.ZoneTypeEnum] value
        representing the type of the zone."
    - name: zoneSource
      description: "The [ZoneSourceEnum][ZoneManagementTrait.ZoneSourceEnum] value representing
        the source of the zone."
    - name: twoDCartesianZone
      description: "Detailed information for the `TwoDCartesianZone`."
  - name: ZoneTriggerControlStruct
    description: "Settings for controlling zone triggers."
    value:
    - name: zoneID
      description: "Unique ZoneID of the zone."
    - name: initialDuration
      description: "Indicates the initial duration in seconds after triggering activity is first
        detected before the Node could generate a `ZoneStopped` event."
    - name: augmentationDuration
      description: "Indicates the duration in seconds that the `TriggerDetectedDuration` value is to
        be extended by if the triggering activity is still detected during this period."
    - name: maxDuration
      description: "Indicates the maximum duration in seconds after the initial triggering activity
        detection that additional triggering activity will be detected."
    - name: blindDuration
      description: "Indicates the duration in seconds after a `ZoneStopped` event is generated that
        the Node shall not generate any `ZoneTriggered` events."
    - name: sensitivity
      description: "Indicates the per-zone sensitivity of the underlying zone triggering detection
        mechanism. The higher the value, the more sensitive the detection."
