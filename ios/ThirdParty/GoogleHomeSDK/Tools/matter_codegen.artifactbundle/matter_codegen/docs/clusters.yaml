    - name: productIdentifierValue
      description: "The unique identifier value for the product."

WindowCovering:
  description: "This trait provides an interface to an automatic window covering that can be raised
    or tilted."

  # WindowCovering attributes
  attributes:
  - name: currentPositionLift
    description: "The distance of the window covering from the fully-open position, in centimeters."
  - name: currentPositionLiftPercent100ths
    description: "The position of the window covering as a percentage with a minimum step of 0.01%.
      For example, 10000 equals 100.00%."
  - name: currentPositionLiftPercentage
    description: "The position of the window covering as a percentage with a 1% default step. This
      attribute is equivalent to
      [currentPositionLiftPercent100ths][WindowCoveringTrait.Attributes.currentPositionLiftPercent100ths]
      attribute divided by 100."
  - name: currentPositionTilt
    description: "The current tilt position of the window covering, in degrees."
  - name: currentPositionTiltPercent100ths
    description: "The position of the window covering as a percentage with a minimal step of 0.01%.
      For example, 10000 equals 100.00%."
  - name: currentPositionTiltPercentage
    description: "The position of the window covering as a percentage with a 1% default step. This
      attribute is equivalent to
      [currentPositionTiltPercent100ths][WindowCoveringTrait.Attributes.currentPositionTiltPercent100ths]
      attribute divided by 100."
  - name: installedClosedLimitLift
    description: "The closed limit when tilting the window covering, in tenths of a degree."
  - name: installedClosedLimitTilt
    description: "The closed limit when lifting the window covering, in tenths of a degree."
  - name: installedOpenLimitLift
    description: "The open limit for lifting the window covering, in centimeters."
  - name: installedOpenLimitTilt
    description: "The open limit for tilting the window covering, in tenths of a degree."
  - name: numberOfActuationsLift
    description: "The total number of lift or slide actuations applied to the window covering since
      it was installed."
  - name: numberOfActuationsTilt
    description: "The total number of tilt actuations applied to the window covering since it was
      installed."
  - name: physicalClosedLimitLift
    description: "The maximum possible encoder position for setting the height of the window
      covering, in centimeters."
  - name: physicalClosedLimitTilt
    description: "The maximum possible encoder position for setting the angle of the window
      covering."
  - name: targetPositionLiftPercent100ths
    description: "The lift position which the window covering is moving to, as a percentage."
  - name: targetPositionTiltPercent100ths
    description: "The tilt position which the window covering is moving to, as a percentage."
  - name: configStatus
    description: "Configuration and status information for the window covering."
  - name: operationalStatus
    description: "Indicates currently ongoing operations and applies to all types of devices."
  - name: mode
    description: "Allows configuration of the window covering, such as: reversing the motor
      direction, or placing the motor into maintenance mode."
  - name: safetyStatus
    description: "Reflects the state of the safety sensors and the common issues preventing
      movements."
  - name: type
    description: "The type of window covering. "
  - name: endProductType
    description: "With the [Type][WindowCovering.Type], this specifies the subtype of window
      covering."

  # WindowCovering commands
  commands:
  - name: UpOrOpen
    description:
    - "Adjust the window covering position so the physical lift or slide and tilt is at the maximum
      open or up position."
  - name: DownOrClose
    description:
    - "Adjust the window covering position so the physical lift or slide and tilt is at the maximum
      closed or down position."
  - name: StopMotion
    description:
    -  "Stop any adjustments to physical tilt and lift or slide that is currently underway."
  - name: GoToLiftValue
    description:
    - "Adjust the window covering to the specified lift position."
    - "The specified lift position must be between
      [installedClosedLimitLift][WindowCoveringTrait.Attributes.installedClosedLimitLift] and
      [installedOpenLimitLift][WindowCoveringTrait.Attributes.installedOpenLimitLift]."
    param:
    - name: liftValue
      description: "The lift position, in centimeters."
  - name: GoToLiftPercentage
    description:
    - "Adjust the window covering to the specified lift position."
    param:
    - name: liftPercent100thsValue
      description: "The lift position, as a percentage."
  - name: GoToTiltValue
    description:
    - "Adjust the window covering to the specified tilt position."
    - "The specified tilt position must be between
      [installedClosedLimitTilt][WindowCoveringTrait.Attributes.installedClosedLimitTilt] and
      [installedOpenLimitTilt][WindowCoveringTrait.Attributes.installedOpenLimitTilt]."
    param:
    - name: tiltValue
      description: "The tilt position, in degrees."
  - name: GoToTiltPercentage
    description:
    - "Adjust the window covering to the specified tilt position."
    param:
    - name: tiltPercent100thsValue
      description: "The tilt position, in hundredths of a percent."

  # WindowCovering bitmaps
  bitmaps:
  - name: ConfigStatus
    description: "Configuration and status information for the WindowCovering."
    value:
    - name: kOperational
      description: "When set to `true`, the window covering is operational. When set to `false`,
        the window covering is not operational."
    - name: kOnlineReserved
      description: "Deprecated."
    - name: kLiftMovementReversed
      description: "When set to `true`, lift movement is reversed. When set to `false`, the lift
        movement is in the normal direction."
    - name: kLiftPositionAware
      description: "When set to `true`, the lift control is position-aware. When set to `false`, the
        lift control isn't position-aware."
    - name: kTiltPositionAware
      description: "When set to `true`, the tilt control is position-aware. When set to `false`, the
       tilt control isn't position-aware."
    - name: kLiftEncoderControlled
      description: "When set to `true`, the window covering uses an encoder to set the height.
        When set to `false`, the window covering doesn't use an encoder to set the height."
    - name: kTiltEncoderControlled
      description: "When set to `true`, the window covering uses an encoder to set the tilt angle.
        When set to `false`, the window covering doesn't use an encoder to set the tilt angle."
  - name: Feature
    description: "WindowCovering cluster FeatureMap."
    value:
    - name: kLift
      description: "Lift control and behavior for lifting or sliding window coverings."
    - name: kTilt
      description: "Tilt control and behavior for tilting window coverings."
    - name: kPositionAwareLift
      description: "Position-aware lift control is supported."
    - name: kAbsolutePosition
      description: "Absolute positioning is supported."
    - name: kPositionAwareTilt
      description: "Position-aware tilt control is supported."
  - name: Mode
    description: "Can be used to configure the window covering by enabling or disabling various
      modes and capabilities."
    value:
    - name: kMotorDirectionReversed
      description: "When set to `true`, the lift movement is reversed. When set to `false`, the life
        movement is in the normal direction."
    - name: kCalibrationMode
      description: "When set to `true`, the window covering is in calibration mode. When set to
        `false`, the window covering is in normal mode."
    - name: kMaintenanceMode
      description: "When set to `true`, the window covering is in maintenance mode. When set to
        `false`, the window covering is in normal mode."
    - name: kLedFeedback
      description: "When set to `true`, the LEDs display feedback. When set to `false`, the LEDs are
        off."
  - name: OperationalStatus
    description: "Indicates in which direction the covering is currently moving or if it has
      stopped."
    value:
    - name: kGlobal
      description: "The type of this value doesn't align to the Matter specification and should not
        be used."
    - name: kLift
      description: "The type of this value doesn't align to the Matter specification and should not
      be used."
    - name: kTilt
      description: "The type of this value doesn't align to the Matter specification and should not
      be used."
  - name: SafetyStatus
    description: "Reflects the state of the safety sensors and the common issues preventing
      movements."
    value:
    - name: kFailedCommunication
      description: "Communication failure to sensors or other safety equipment."
    - name: kHardwareFailure
      description: "PCB, fuse and other electrics problems."
    - name: kManualOperation
      description: "The actuator is manually operated and is preventing actuator movement (for
        example, the actuator is disengaged or decoupled)."
    - name: kMotorJammed
      description: "Mechanical problem related to the motor(s) detected."
    - name: kObstacleDetected
      description: "An obstacle is preventing actuator movement."
    - name: kPositionFailure
      description: "Device failed to reach the desired position."
    - name: kPower
      description: "Device has a power-related issue or limitation."
    - name: kProtection
      description: "Protection is activated."
    - name: kRemoteLockout
      description: "Movement commands are ignored outside some time-and-date range."
    - name: kStopInput
      description: "Local safety sensor is preventing movements (for example
        Safety EU Standard EN60335)."
    - name: kTamperDetection
      description: "Tampering detected on sensors or other safety equipment."
    - name: kThermalProtection
      description: "Motor(s) and/or electric circuit thermal protection activated."

  # WindowCovering enums
  enums:
  - name: Type
    description: "The type of window covering."
    value:
    - name: kAwning
      description: "An awning."
    - name: kDrapery
      description: "A form of drapery."
    - name: kProjectorScreen
      description: "A projector screen."
    - name: kRollerShade
      description: "A roller shade."
    - name: kRollerShade2Motor
      description: "A roller shade with two motors."
    - name: kRollerShadeExterior
      description: "An exterior roller shade."
    - name: kRollerShadeExterior2Motor
      description: "An exterior roller shade with two motors."
    - name: kShutter
      description: "A shutter."
    - name: kTiltBlindLiftAndTilt
      description: "A blind with lift and tilt capabilities."
    - name: kTiltBlindTiltOnly
      description: "A blind with only tilt capability."
    - name: kUnknown
      description: "An unknown type of window covering."
  - name: EndProductType
    description: "With the [Type][WindowCovering.Type], this specifies the subtype of window
      covering."
    value:
    - name: kAwningTerracePatio
      description: "A patio or terrace awning."
    - name: kAwningVerticalScreen
      description: "A vertical screen."
    - name: kBalloonShade
      description: "A balloon shade."
    - name: kCellularShade
      description: "A cellular shade."
    - name: kCentralCurtain
      description: "A central curtain."
    - name: kExteriorVenetianBlind
      description: "An exterior Venetian blind."
    - name: kExteriorVerticalScreen
      description: "An exterior vertical screen."
    - name: kInteriorBlind
      description: "An interior blind."
    - name: kInteriorVenetianBlind
      description: "An interior Venetian blind."
    - name: kLateralLeftCurtain
      description: "A lateral left curtain."
    - name: kLateralRightCurtain
      description: "A lateral right curtain."
    - name: kLayeredShade
      description: "A layered shade."
    - name: kLayeredShade2D
      description: "A two-dimensional layered shade."
    - name: kPleatedShade
      description: "A pleated shade."
    - name: kRollerShade
      description: "A roller shade."
    - name: kRollerShutter
      description: "A roller shutter."
    - name: kRomanShade
      description: "A roman shade."
    - name: kSheerShade
      description: "A sheer shade."
    - name: kSlidingShutter
      description: "A sliding shutter."
    - name: kSwingingShutter
      description: "A swinging shutter."
    - name: kTiltOnlyInteriorBlind
      description: "An interior blind that only tilts."
    - name: kTiltOnlyPergola
      description: "A pergola that only tilts."
    - name: kUnknown
      description: "An unknown window covering type."
    - name: kVerticalBlindStripCurtain
      description: "A vertical blind strip curtain."
    - name: kWovenWood
      description: "A woven wood window covering."

