    description: "This event is generated when the set of charge faults currently detected
      by the device on this battery power source changes. This event corresponds to a change
      in value in [ActiveBatChargeFaults][PowerSourceTrait.Attributes.activeBatChargeFaults]."
    value:
    - name: current
      description: "The set of faults currently detected."
    - name: previous
      description: "The set of faults detected prior to this change event."
  - name: BatFaultChange
    description: "This event is generated when the set of battery faults currently detected
      by the device on this battery power source changes. This event corresponds to a change
      in value in [ActiveBatFaults][PowerSourceTrait.Attributes.activeBatFaults]."
    value:
    - name: current
      description: "The set of faults currently detected."
    - name: previous
      description: "The set of faults detected prior to this change event."
  - name: WiredFaultChange
    description: "This event is generated when the set of wired faults currently detected
      by the device on this wired power source changes. This event corresponds to a change
      in value in [ActiveWiredFaults][PowerSourceTrait.Attributes.activeWiredFaults]."
    value:
    - name: current
      description: "The set of faults currently detected."
    - name: previous
      description: "The set of faults detected prior to this change event."

PreFilterMonitoring:
  description: "This trait provides an interface to pre-filter state monitoring."

  # PreFilterMonitoring attributes
  attributes:
  - name: changeIndication
    description: "Current requirement for when to change the pre-filter."
  - name: condition
    description: "Percentage of remaining use of the pre-filter."

  # PreFilterMonitoring bitmaps
  bitmaps:
  - name: FilterMonitoringFeature
    description: "PreFilterMonitoring trait FeatureMap."
    value:
    - name: kCondition
      description: "The device supports monitoring the condition of the pre-filter in percentage
        of remaining use."
    - name: kWarning
      description: "The device supports the warning indication."

  # PreFilterMonitoring enums
  enums:
  - name: ChangeIndication
    description: "The requirement for changing the pre-filter."
    value:
    - name: kCritical
      description: "Pre-filter resource is exhausted, immediate intervention is required."
    - name: kOk
      description: "Pre-filter is in good condition, no intervention required."
    - name: kUnspecified
      description: "Unspecified."
    - name: kWarning
      description: "Pre-filter resource will be exhausted soon, intervention will be required."

PresetMessage:
  description: "This trait provides an interface that supports speaking or displaying
     a preset message."

  # PresetMessage attributes
  attributes:
  - name: availablePhraseTypes
    description: "The available phrase types."

  # PresetMessage structs
  structs:
  - name: PhraseType
    description: "A type of phrase."
    value:
    - name: phraseType
      description: "The description of the phrase type."

  # PresetMessage commands
  commands:
  - name: PlayPresetMessage
    description:
    - "Play a preset message."
    param:
    - name: phraseType
      description: "This parameter indicates which message to play."

PressureMeasurement:
  description: "This trait provides an interface to pressure measurement functionality, including
    configuration and provision of notifications of pressure measurements."

  # PressureMeasurement attributes
  attributes:
  - name: measuredValue
    description: "The measured value represents pressure in kPa, calculated at 10 times the
      pressure value."
  - name: minMeasuredValue
    description: "The minimum measured value indicates the minimum pressure value that can be
      measured."
  - name: maxMeasuredValue
    description: "The maximum measured value indicates the maximum pressure value that can be
      measured."
  - name: tolerance
    description: "The tolerance attribute indicates the magnitude of possible error associated
      with the [measuredValue][PressureMeasurement.MeasuredValue], defining the true value within
      a specific range around it."
  - name: scaledValue
    description: "The scaled value represents pressure in Pascals, using a formula that includes
      the base 10 exponent of scale applied to the pressure value."
  - name: minScaledValue
    description: "The minimum scaled value indicates the minimum measurable value of
      [scaledValue]."
  - name: maxScaledValue
    description: "The maximum scaled value indicates the maximum measurable value of
      [scaledValue]."
  - name: scaledTolerance
    description: "The scaled tolerance indicates the possible error range around
      [scaledValue]."
  - name: scale
    description: "The scale attribute defines the base 10 exponent used to calculate the
      [scaledValue]."

  # PressureMeasurement bitmaps
  bitmaps:
  - name: Feature
    description: "PressureMeasurement cluster FeatureMap."
    value:
    - name: kExtended
      description: "Supports extended range and resolution."

PumpConfigurationAndControl:
  description: "This trait provides an interface for the setup and control of pump devices, and the
    automatic reporting of pump status information. Note that control of pump speed is handled by
    the [OnOff] and [LevelControl] clusters."

  # PumpConfigurationAndControl attributes
  attributes:
  - name: capacity
    description: "The actual capacity of the pump as a percentage of the effective maximum
      setpoint value. It is updated dynamically as the speed of the pump changes.
      The valid range is 0 % to 163.835%, with 0.005 % granularity. Although this attribute is a
      signed value, values less than zero have no physical meaning."
  - name: controlMode
    description: "The control mode of the pump as defined in
      [ControlModeEnum][PumpConfigurationAndControlTrait.ControlModeEnum]."
  - name: effectiveControlMode
    description: "The current effective control mode of the pump as defined in
      [ControlModeEnum][PumpConfigurationAndControlTrait.ControlModeEnum]."
  - name: effectiveOperationMode
    description: "The current effective operation mode of the pump as defined in
      [OperationModeEnum][PumpConfigurationAndControlTrait.OperationModeEnum]."
  - name: lifetimeEnergyConsumed
    description: "The accumulated energy consumption through the entire lifetime of the
      pump in kWh. The value of this attribute is updated dynamically as the energy consumption of
      the pump increases. If it rises above the maximum value, it rolls over and starts again at 0.
      This attribute is writeable, in order to allow setting to an appropriate value after
      maintenance. The valid range is 0 kWh to 4,294,967,294 kWh."
  - name: lifetimeRunningHours
    description: "Specifies the accumulated number of hours that the pump has been powered and the
      motor has been running. It is updated dynamically as it increases. It is preserved over power
      cycles of the pump. If `lifeTimeRunningHours` rises above maximum value, it rolls over and
      starts again at 0. This attribute is writeable, in order to allow setting to an appropriate
      value after maintenance. The valid range is 0 to 16,777,214 hrs."
  - name: maxCompPressure
    description: "The maximum compensated pressure the pump can achieve when it is working with the
      [controlMode][PumpConfigurationAndControlTrait.Attributes.controlMode] attribute set to
      `ProportionalPressure`. The valid range for this attribute is -3,276.7 kPa to 3,276.7 kPa,
      in steps of 0.1 kPa."
  - name: maxConstFlow
    description: "The maximum flow the pump can achieve when it is working with the
      [controlMode][PumpConfigurationAndControlTrait.Attributes.controlMode] attribute set to
      `ConstantFlow`. The valid range is 0 m3/h to 6,553.4 m3/h, insteps of 0.1 m3/h."
  - name: maxConstPressure
    description: "The maximum pressure the pump can achieve when it is working with the
      [controlMode][PumpConfigurationAndControlTrait.Attributes.controlMode] attribute set to
      `ConstantPressure`. The valid range is -3,276.7 kPa to 3,276.7 kPa, in steps of 0.1 kPa."
  - name: maxConstSpeed
    description: "The maximum speed the pump can achieve when it is working with the
      [controlMode][PumpConfigurationAndControlTrait.Attributes.controlMode] attribute set to
      `ConstantSpeed`. The valid range is 0 to 65,534 RPM, in steps of 1 RPM."
  - name: maxConstTemp
    description: "The maximum temperature the pump can maintain in the system when it is
      working with the [controlMode][PumpConfigurationAndControlTrait.Attributes.controlMode]
      attribute set to `ConstantTemperature`. The valid range is -273.15 °C to 327.67 °C, in steps
      of 0.01 °C."
  - name: maxFlow
    description: "The maximum flow the pump can achieve. It is a physical limit, and does not apply
      to any specific control mode or operation mode. The valid range is 0 m3/h to 6,553.4 m3/h, in
      steps of 0.1 m3/h."
  - name: maxPressure
    description: "The maximum pressure the pump can achieve. It is a physical limit, and does
      not apply to any specific control mode or operation mode. The valid range is -3,276.7 kPa to
      3,276.7 kPa, in steps of 0.1 kPa."
  - name: maxSpeed
    description: "The maximum speed the pump can achieve. It is a physical limit, and does not apply
      to any specific control mode or operation mode. The valid range is 0 to 65,534 RPM, in steps
      of 1 RPM."
  - name: minCompPressure
    description: "The minimum compensated pressure the pump can achieve when it is working with the
      [controlMode][PumpConfigurationAndControlTrait.Attributes.controlMode] attribute set to
      `ProportionalPressure`. The valid range is -3,276.7 kPa to 3,276.7 kPa, in steps of 0.1 kPa."
  - name: minConstFlow
    description: "The minimum flow the pump can achieve when it is working with the
      [controlMode][PumpConfigurationAndControlTrait.Attributes.controlMode] attribute set to
      `ConstantFlow`. The valid range is 0 m3/h to 6,553.4 m3/h, in steps of 0.1 m3/h."
  - name: minConstPressure
    description: "The minimum pressure the pump can achieve when it is working with the
      [controlMode][PumpConfigurationAndControlTrait.Attributes.controlMode] attribute set to
      `ConstantPressure`. The valid range is -3,276.7 kPa to 3,276.7 kPa, in steps of 0.1 kPa."
  - name: minConstSpeed
    description: "The minimum speed the pump can achieve when it is working with the
      [controlMode][PumpConfigurationAndControlTrait.Attributes.controlMode] attribute set to
      `ConstantSpeed`. The valid range is 0 to 65,534 RPM, in steps of 1 RPM."
  - name: minConstTemp
    description: "The minimum temperature the pump can maintain in the system when it is
      working with the [controlMode][PumpConfigurationAndControlTrait.Attributes.controlMode]
      attribute set to `ConstantTemperature`. The valid range is -273.15 °C to 327.67 °C, in steps
      of 0.01 °C."
  - name: operationMode
    description: "The operation mode of the pump as defined in
      [OperationModeEnum][PumpConfigurationAndControlTrait.OperationModeEnum]."
  - name: power
    description: "The actual power consumption of the pump in watts. The value of this attribute is
      updated dynamically as the power consumption of the pump changes. The valid range is 0 to
      16,777,214 watts."
  - name: pumpStatus
    description: "The activity status of the pump functions as listed in
      [PumpStatusBitmap][PumpConfigurationAndControlTrait.PumpStatusBitmap]."
  - name: speed
    description: "The actual speed of the pump measured in RPM. It is updated dynamically as
      the speed of the pump changes. The valid range is 0 to 65.534 RPM."

  # PumpConfigurationAndControl bitmaps
  bitmaps:
  - name: PumpStatusBitmap
    description: "A bitmap indicating different aspects of the current state of the pump."
    value:
    - name: kDeviceFault
      description: "A fault related to the system or pump device."
    - name: kLocalOverride
      description: "Device control is overridden by hardware, such as an external STOP button or
        through a local HMI."
    - name: kRemoteFlow
      description: "A remote flow sensor is used as the sensor for the regulation of the pump."
    - name: kRemotePressure
      description: "A remote pressure sensor is used as the sensor for the regulation of the pump."
    - name: kRemoteTemperature
      description: "A remote temperature sensor is used as the sensor for the regulation of the
        pump."
    - name: kRunning
      description: "Pump is currently running."
    - name: kSpeedHigh
      description: "Setpoint is too high to achieve."
    - name: kSpeedLow
      description: "Setpoint is too low to achieve."
    - name: kSupplyFault
      description: "A fault related to the supply to the pump."
  - name: Feature
    description: "PumpConfigurationAndControl cluster FeatureMap."
    value:
    - name: kAutomatic
      description: "Automatic mode."
    - name: kCompensatedPressure
      description: "Compensated pressure mode."
    - name: kConstantFlow
      description: "Constant flow mode."
    - name: kConstantPressure
      description: "Constant pressure mode."
    - name: kConstantSpeed
      description: "Constant speed mode."
    - name: kConstantTemperature
      description: "Constant temperature mode."
    - name: kLocalOperation
      description: "Operation using local settings."

  # PumpConfigurationAndControl enums
  enums:
  - name: ControlModeEnum
    description: "The various modes of controlling the pump."
    value:
    - name: kAutomatic
      description: "The operation of the pump is automatically optimized to
        provide the most suitable performance with respect to comfort and energy savings."
    - name: kConstantFlow
      description: "The pump is regulating its speed to maintain a constant flow through the pump."
    - name: kConstantPressure
      description: "The pump is regulating its speed to maintain a constant differential pressure
        over its flanges."
    - name: kConstantSpeed
      description: "The pump is running at a constant speed."
    - name: kConstantTemperature
      description: "The pump is regulating its speed to maintain a constant temperature."
    - name: kProportionalPressure
      description: "The pump will regulate its speed to maintain a constant
        differential pressure over its flanges."
  - name: OperationModeEnum
    description: "The various modes of operation for the pump."
    value:
    - name: kLocal
      description: "The pump is running with the local settings of the pump, regardless of
        what those are."
    - name: kMaximum
      description: "The pump is running at its maximum possible speed."
    - name: kMinimum
      description: "The pump is running at its minimum possible speed."
    - name: kNormal
      description: "The pump is controlled by a setpoint, as defined by a connected
        remote sensor or by the
        [controlMode][PumpConfigurationAndControlTrait.Attributes.controlMode] attribute."

  # PumpConfigurationAndControl events
  events:
  - name: SupplyVoltageLow
    description: "Generated when the supply voltage is low."
  - name: SupplyVoltageHigh
    description: "Generated when the supply voltage is high."
  - name: PowerMissingPhase
    description: "Generated when a power phase is missing."
  - name: SystemPressureLow
    description: "Generated when the system pressure is low."
  - name: SystemPressureHigh
    description: "Generated when the system pressure is high."
  - name: DryRunning
    description: "Generated when dry running is detected."
  - name: MotorTemperatureHigh
    description: "Generated when the motor temperature is high."
  - name: PumpMotorFatalFailure
    description: "Generated when a fatal pump motor failure occurs."
  - name: ElectronicTemperatureHigh
    description: "Generated when the electronic temperature is high."
  - name: PumpBlocked
    description: "Generated when the pump is blocked."
  - name: SensorFailure
    description: "Generated when a sensor failure occurs."
  - name: ElectronicNonFatalFailure
    description: "Generated when a non-fatal electronic failure occurs."
  - name: ElectronicFatalFailure
    description: "Generated when a fatal electronic failure occurs."
  - name: GeneralFault
    description: "Generated when a general fault occurs."
  - name: Leakage
    description: "Generated when leakage is detected."
  - name: AirDetection
    description: "Generated when air is detected."
  - name: TurbineOperation
    description: "Generated when turbine operation occurs."

PushAvStreamTransport:
  restricted: true

  description: "This trait is a minimalistic version of the PushAvStreamTransport standard Matter
    cluster, and only provides an On/Off-like functionality for cameras."

  # PushAvStreamTransport attributes
  attributes:
  - name: currentConnections
    description: "A list of all the allocated connections."
  - name: supportedFormats
    description: "A list of all the supported formats for the push transport."

  # PushAvStreamTransport bitmaps
  bitmaps:
  - name: Feature
    description: "PushAvStreamTransport cluster FeatureMap."
    value:
    - name: kMetadata
      description: "Metadata is supported."
    - name: kUnsupported
      description: "No features are supported."
    - name: kPerZoneSensitivity
      description: "Per-zone zone sensitivity is supported."

  # PushAvStreamTransport commands
  commands:
  - name: AllocatePushTransport
    description:
    - "Allocate a push transport."
    param:
    - name: transportOptions
      description: "The transport options to allocate."
    response:
      description: "Contains the allocated transport."
      param:
      - name: transportConfiguration
        description: "The transport configuration."
  - name: DeallocatePushTransport
    description:
    - "Deallocate a push transport."
    param:
    - name: connectionId
      description: "The connection ID of the transport to deallocate."
  - name: FindTransport
    description:
    - "Get the transport configuration for the specified push transport or all allocated transports
       if no `connectionId` is specified."
    param:
    - name: connectionId
      description: "The connection ID of the transport."
    response:
      description: "Contains the transport configuration."
      param:
      - name: transportConfigurations
        description: "The transport configurations."
  - name: ManuallyTriggerTransport
    description:
    - "Manually trigger a transport."
    param:
    - name: activationReason
      description: "The reason for transport trigger activation. Valid values are defined in
        [TriggerActivationReasonEnum]."
    - name: connectionId
      description: "The connection ID of the transport."
    - name: timeControl
      description: "Control over the duration and timing of the stream transport."
    - name: userDefined
      description: "This optional parameter allows for including arbitrary, user-defined binary
       data as a long octet string within the `ManuallyTriggerTransportCommand`."
    response:
      description: "Contains the transport configuration."
      param:
      - name: transportConfiguration
        description: "The transport configuration."
  - name: ModifyPushTransport
    description:
    - "Modify the transport status."
    param:
    - name: connectionId
      description: "The connection ID of the transport to set."
    - name: transportOptions
      description: "The transport option to set for a connection. Valid values are defined in
        [TransportOptionsStruct]."
  - name: SetTransportStatus
    description:
    - "Set the transport status."
    param:
    - name: connectionId
      description: "The connection ID of the transport to set."
    - name: transportStatus
      description: "The transport status to set. Valid values are defined in [TransportStatusEnum]."

  # PushAvStreamTransport enums
  enums:
  - name: CMAFInterfaceEnum
    description: "The CMAF interface."
    value:
    - name: kInterface1
      description: "Interface 1."
    - name: kInterface2DASH
      description: "Interface 2 DASH."
    - name: kInterface2HLS
      description: "Interface 2 HLS."
  - name: ContainerFormatEnum
    description: "The container format."
    value:
    - name: kCMAF
      description: "CMAF."
  - name: IngestMethodsEnum
    description: "The ingest method."
    value:
    - name: kCMAFIngest
      description: "The specific method for ingesting or pushing AV stream data."
  - name: StatusCodeEnum
    description: "The status code."
    value:
    - name: kInvalidCombination
      description: "Invalid combination."
    - name: kInvalidOptions
      description: "Invalid options."
    - name: kInvalidStream
      description: "Invalid stream."
    - name: kInvalidStreamUsage
      description: "Invalid stream usage."
    - name: kInvalidTransportStatus
      description: "Invalid transport status."
    - name: kInvalidTriggerType
      description: "Invalid trigger type."
    - name: kInvalidTime
      description: "Invalid time."
    - name: kInvalidTLSEndpoint
      description: "Invalid TLS endpoint."
    - name: kInvalidUrl
      description: "Invalid URL."
    - name: kInvalidZone
      description: "Invalid zone."
    - name: kUnsupported
      description: "Unsupported."
  - name: StreamUsageEnum
    description: "The type of the camera stream."
    value:
    - name: kAnalysis
      description: "Analysis."
    - name: kInternal
      description: "Internal."
    - name: kLiveView
      description: "Live view."
    - name: kRecording
      description: "Recording."
  - name: TransportStatusEnum
    description: "The transport status."
    value:
    - name: kActive
      description: "Active."
    - name: kInactive
      description: "Inactive."
  - name: TransportTriggerTypeEnum
    description: "The trigger type of the transport."
    value:
    - name: kCommand
      description: "Command."
    - name: kContinuous
      description: "Continuous."
    - name: kMotion
      description: "Motion."
  - name: TriggerActivationReasonEnum
    description: "The reason for transport trigger activation."
    value:
    - name: kAutomation
      description: "Automation."
    - name: kEmergency
      description: "Emergency."
    - name: kUserInitiated
      description: "User initiated."

  # PushAvStreamTransport events
  events:
  - name: PushTransportBegin
    description: "Event that is sent when a transport push begins."
    value:
    - name: connectionId
      description: "The connection ID of the transport that was triggered."
    - name: triggerType
      description: "The type of the transport trigger that was used to start the push transport."
    - name: activationReason
      description: "The reason for transport trigger activation."
  - name: PushTransportEnd
    description: "Event that is sent when a transport push ends."
    value:
    - name: connectionId
      description: "The connection ID of the transport that was triggered."

  # PushAvStreamTransport structs
  structs:
  - name: CMAFContainerOptionsStruct
    description: "The container type and related options."
    value:
    - name: CENCKey
      description: "The common encryption key."
    - name: CENCKeyID
      description: "The common encryption key ID."
    - name: chunkDuration
      description: "The chunk duration."
    - name: CMAFInterface
      description: "CMAF interface type (Interface1, Interface2DASH, Interface2HLS)."
    - name: metadataEnabled
      description: "Whether metadata is enabled."
    - name: segmentDuration
      description: "The duration of each segment in the CMAF stream."
    - name: sessionGroup
      description: "An identifier for grouping sessions."
    - name: trackName
      description: "The name of the media track."
  - name: ContainerOptionsStruct
    description: "Defines the options related to the container format used for an AV stream."
    value:
    - name: CMAFContainerOptions
      description: "An optional field containing a `CMAFContainerOptionsStruct` when the
        containerType is CMAF, allowing for detailed configuration of CMAF parameters."
    - name: containerType
      description: "The container format."
  - name: SupportedFormatStruct
    description: "Defines the supported formats for a push transport."
    value:
    - name: containerFormat
      description: "The container format."
    - name: ingestMethod
      description: "The ingest method."
  - name: TransportMotionTriggerTimeControlStruct
    description: "Defines parameters for controlling the timing of a transport stream triggered by
      motion."
    value:
    - name: augmentationDuration
      description: "How much the stream duration can be extended, in seconds."
    - name: blindDuration
      description: "A period during which new motion triggers are ignored after an event, in
        seconds."
    - name: initialDuration
      description: "The initial length of the stream after a motion trigger, in seconds."
    - name: maxDuration
      description: "The maximum total duration the stream can run, in seconds."
  - name: TransportConfigurationStruct
    description: "The transport configuration."
    value:
    - name: connectionID
      description: "The connection ID of the transport."
    - name: fabricIndex
      description: "The fabric index ID of the transport."
    - name: transportOptions
      description: "Detailed configuration options for the transport, such as stream usage, URLs,
        and trigger settings."
    - name: transportStatus
      description: "The transport status."
  - name: TransportOptionsStruct
    description: "The transport options."
    value:
    - name: audioStreamID
      description: "The ID of the audio stream."
    - name: containerOptions
      description: "The container type and related options."
    - name: expiryTime
      description: "The time of stream expiration, in seconds from the UNIX epoch."
    - name: ingestMethod
      description: "The ingest method."
    - name: streamUsage
      description: "The type of the camera stream."
    - name: TLSEndpointID
      description: "The ID of the TLS endpoint."
    - name: triggerOptions
      description: "Settings related to triggering events."
    - name: url
      description: "The URL of the camera stream."
    - name: videoStreamID
      description: "The ID of the video stream."
  - name: TransportTriggerOptionsStruct
    description: "Settings related to triggering events."
    value:
    - name: maxPreRollLen
      description: "The maximum length of pre-roll content (video or audio) that can be
        included when a transport trigger occurs."
    - name: motionSensitivity
      description: "The sensitivity level for motion-triggered stream transport."
    - name: motionTimeControl
      description: "The time control for the motion-triggered stream transport."
    - name: motionZones
      description: "The motion zones to trigger the stream."
    - name: triggerType
      description: "The trigger type of the transport."
  - name: TransportZoneOptionsStruct
    description: "Defines options related to a specific zone for transport triggers."
    value:
    - name: sensitivity
      description: "An optional 8-bit unsigned integer that indicates
        the sensitivity level for this zone."
    - name: zone
      description: "A nullable 16-bit unsigned integer that represents the zone ID."
    - name: zoneIsNull
      description: "Indicates whether the zone is null."

RadonConcentrationMeasurement:
  description: "This trait provides an interface to radon concentration measurement
    functionality."

  # RadonConcentrationMeasurement attributes
  attributes:
  - name: averageMeasuredValue
    description: "The average value of [measuredValue]
      [RadonConcentrationMeasurementTrait.Attributes.measuredValue]
      measured during the [averageMeasuredValueWindow]
      [RadonConcentrationMeasurementTrait.Attributes.averageMeasuredValueWindow]."
  - name: averageMeasuredValueWindow
    description: "The window of time, in seconds, used to measure the [averageMeasuredValue]
      [RadonConcentrationMeasurementTrait.Attributes.averageMeasuredValue]."
  - name: levelValue
    description: "The level of the substance detected."
  - name: maxMeasuredValue
    description: "The maximum value of [measuredValue]
      [RadonConcentrationMeasurementTrait.Attributes.measuredValue]
      that can be measured."
  - name: measuredValue
    description: "The most recent measurement as a single-precision floating-point number, in units
      specified by
      [measurementUnit][RadonConcentrationMeasurementTrait.Attributes.measurementUnit]."
  - name: measurementMedium
    description: "The medium in which
      [measuredValue][RadonConcentrationMeasurementTrait.Attributes.measuredValue]
      is being measured."
  - name: measurementUnit
    description: "The unit used by
      [measuredValue][RadonConcentrationMeasurementTrait.Attributes.measuredValue]."
  - name: minMeasuredValue
    description: "The minimum value of [measuredValue]
      [RadonConcentrationMeasurementTrait.Attributes.measuredValue]
      that can be measured."
  - name: peakMeasuredValue
    description: "The maximum value of [measuredValue]
      [RadonConcentrationMeasurementTrait.Attributes.measuredValue]
      that has been measured during the [peakMeasuredValueWindow]
      [RadonConcentrationMeasurementTrait.Attributes.peakMeasuredValueWindow]."
  - name: peakMeasuredValueWindow
    description: "The window of time, in seconds, used to determine the [peakMeasuredValue]
     [RadonConcentrationMeasurementTrait.Attributes.peakMeasuredValue]."
  - name: uncertainty
    description: "The range of error or deviation that can be found in [measuredValue]
      [RadonConcentrationMeasurementTrait.Attributes.measuredValue]
      and [peakMeasuredValue]
      [RadonConcentrationMeasurementTrait.Attributes.peakMeasuredValue]."

  # RadonConcentrationMeasurement enums
  enums:
  - name: LevelValueEnum
    description: "Level values."
    value:
    - name: kCritical
      description: "Critical."
    - name: kHigh
      description: "High."
    - name: kLow
      description: "Low."
    - name: kMedium
      description: "Medium."
    - name: kUnknown
      description: "Unknown."
  - name: MeasurementMediumEnum
    description: "Mediums in which measurements are taken."
    value:
    - name: kAir
      description: "Air."
    - name: kSoil
      description: "Soil."
    - name: kWater
      description: "Water."
  - name: MeasurementUnitEnum
    description: "Measurement units."
    value:
    - name: kBQM3
      description: "Becquerels per cubic meter."
    - name: kMGM3
      description: "Milligrams per cubic meter."
    - name: kNGM3
      description: "Nanogram per cubic meter."
    - name: kPM3
      description: "Particles per cubic meter."
    - name: kPPB
      description: "Parts per billion."
    - name: kPPM
      description: "Parts per million."
    - name: kPPT
      description: "Parts per trillion."
    - name: kUGM3
      description: "Micrograms per cubic meter."

  # RadonConcentrationMeasurement bitmaps
  bitmaps:
  - name: Feature
    description: "RadonConcentrationMeasurementTrait cluster FeatureMap."
    value:
    - name: kAverageMeasurement
      description: "Device supports the average numeric measurement of substance."
    - name: kCriticalLevel
      description: "Device supports the Critical concentration Level."
    - name: kLevelIndication
      description: "Device supports basic level indication for substance using the
        [LevelValueEnum][RadonConcentrationMeasurementTrait.LevelValueEnum]."
    - name: kMediumLevel
      description: "Device supports the Medium concentration Level."
    - name: kNumericMeasurement
      description: "Device supports numeric measurement of substance."
    - name: kPeakMeasurement
      description: "Device supports peak numeric measurement of substance."

Reboot:
  description: "This trait belongs to devices that support rebooting as a single action."

  # Reboot commands
  commands:
  - name: Reboot
    description:
    - "Reboots the device."

Record:
  description: "This trait belongs to media devices that have a recording capability."

  # Record attributes
  attributes:
  - name: isCurrentlyRecording
    description: "Indicates if the device is currently recording."

  # Record commands
  commands:
  - name: StartRecording
    description:
    - "Starts recording whatever is currently playing."
  - name: StopRecording
    description:
    - "Stops recording whatever is currently playing."

RecordingMode:
  description: "This trait supports devices that can record
    in different recording modes."

  # RecordingMode attributes
  attributes:
  - name: availableRecordingModes
    description: "List of all available recording modes."
  - name: selectedRecordingMode
    description: "The selected recording mode, which is
      user configurable."
  - name: supportedRecordingModes
    description: "All supported recording modes even if they are not
       currently available."

  # RecordingMode enums
  enums:
  - name: RecordingModeEnum
    description: "Different types of recording modes supported by the device."
    value:
    - name: kDisabled
      description: "Video recording is disabled, but the camera can still live
        stream, basic event detectors are still enabled, and images
        can be captured."
    - name: kCvr
      description: "Continuous video recording."
    - name: kEbr
      description: "Event-based recording that only records video when an event
        is detected by the camera's perception pipeline. For battery-powered
        cameras, the user can configure the maximum duration of a
        recorded clip."
    - name: kImages
      description: "Records still images when an event is detected by the
        camera's perception pipeline."
    - name: kLiveView
      description: "The camera supports live streaming, but all event detectors
        are off and no video or images are recorded."
    - name: kEtr
      description: "Event-triggered recording that only records a short video
        when an event is detected by the camera's perception pipeline.
        The user cannot configure the duration of the recorded clip."

  # RecordingMode structs
  structs:
  - name: RecordingModeStruct
    description: "Contains information about a specific recording mode."
    value:
    - name: recordingMode
      description: "An instance of
        [RecordingModeEnum][RecordingModeTrait.RecordingModeEnum]
        that specifies the type of recording mode."
    - name: maxDuration
      description: "The maximum duration of a recorded clip in seconds."
    - name: expiryDurationSeconds
      description: "The time to live of the recorded clip in seconds."

RefrigeratorAlarm:
  description: "This trait provides an interface for refrigerator alarms."

  # RefrigeratorAlarm attributes
  attributes:
  - name: mask
    description: "A bitmap indicating an enabled alarm. Valid values are defined in
      [AlarmBitmap][RefrigeratorAlarmTrait.AlarmBitmap]."
  - name: state
    description: "The alarm's current status."
  - name: supported
    description: "The available alarms."

  # RefrigeratorAlarm bitmaps
  bitmaps:
  - name: AlarmBitmap
    description: "Bitmap indicating which alarms are supported."
    value:
    - name: kDoorOpen
      description: "Supports monitoring the refrigerator door being open for a vendor-defined
        amount of time."

  # RefrigeratorAlarm events
  events:
  - name: Notify
    description: "Generated when alarm changes state."
    value:
    - name: active
      description: "Alarm has become active. Valid values are defined in
        [AlarmBitmap][RefrigeratorAlarmTrait.AlarmBitmap]."
    - name: inactive
      description: "Alarm has become inactive. Valid values are defined in
        [AlarmBitmap][RefrigeratorAlarmTrait.AlarmBitmap]."
    - name: state
      description: "A copy of [state][RefrigeratorAlarmTrait.Attributes.state] when this event
        was generated."
    - name: mask
      description: "A copy of [mask][RefrigeratorAlarmTrait.Attributes.mask] when this event was
        generated."

RefrigeratorAndTemperatureControlledCabinetMode:
  description: "This trait provides an interface to refrigerator and temperature controlled cabinet
    devices."

  # RefrigeratorAndTemperatureControlledCabinetMode attributes
  attributes:
  - name: currentMode
    description: "The current mode of the device. This must be one of the
        [supportedModes][RefrigeratorAndTemperatureControlledCabinetModeTrait.Attributes.supportedModes]."
  - name: onMode
    description: "The value of
      [currentMode][RefrigeratorAndTemperatureControlledCabinetModeTrait.Attributes.currentMode]
      that depends on the state of the [OnOff] cluster."
  - name: startUpMode
    description: "The mode that the device enters when powered up. This must be one of the
        [supportedModes][RefrigeratorAndTemperatureControlledCabinetModeTrait.Attributes.supportedModes]."
  - name: supportedModes
    description: "The modes supported by the device."

  # RefrigeratorAndTemperatureControlledCabinetMode commands
  commands:
  - name: ChangeToMode
    description:
    - "Change device modes."
    param:
    - name: newMode
      description: "The mode to change to. This must be one of the
        [supportedModes][RefrigeratorAndTemperatureControlledCabinetModeTrait.Attributes.supportedModes]."
    response:
      description: "The result of the completed `ChangeToMode` command."
      param:
      - name: status
        description: "The status of the `ChangeToMode` command. Valid values are defined by the
          device manufacturer."
      - name: statusText
        description: "Text describing the status of the `ChangeToMode` command."

  # RefrigeratorAndTemperatureControlledCabinetMode enums
  enums:
  - name: ModeTag
    description: "The ModeTags for RefrigeratorAndTemperatureControlledCabinetMode."
    value:
    - name: kAuto
      description: "Decides which options, features, and setting values to use."
    - name: kQuick
      description: "Optimizes for faster completion."
    - name: kQuiet
      description: "Operates silently or barely audibly."
    - name: kLowNoise
      description: "Optimizes for low noise operation."
    - name: kLowEnergy
      description: "Optimizes for lower energy usage."
    - name: kVacation
      description: "Provides a mode suitable for use during vacations or other extended absences."
    - name: kMin
      description: "Uses the lowest available setting value."
    - name: kMax
      description: "Uses the highest available setting value."
    - name: kNight
      description: "Provides a mode suitable for use during night time."
    - name: kDay
      description: "Provides a mode suitable for use during day time."
    - name: kRapidCool
      description: "This mode reduces the temperature rapidly to a point above freezing."
    - name: kRapidFreeze
      description: "This mode reduces the temperature rapidly to a point below freezing."

  # RefrigeratorAndTemperatureControlledCabinetMode bitmaps
  bitmaps:
  - name: Feature
    description: "RefrigeratorAndTemperatureControlledCabinetMode cluster FeatureMap."
    value:
    - name: kOnOff
      description: "There is a dependency on the [OnOff] cluster. When this bit is set, the
        [currentMode][RefrigeratorAndTemperatureControlledCabinetModeTrait.Attributes.currentMode]
        is set to [onMode][RefrigeratorAndTemperatureControlledCabinetModeTrait.Attributes.onMode]
        when the power is turned on."

  # RefrigeratorAndTemperatureControlledCabinetMode structs
  structs:
  - name: ModeTagStruct
    description: "Describes a mode tag. The same manufacturer code and mode tag value in
        separate cluster instances are part of the same namespace and have the same meaning. For
        example, a manufacturer tag meaning \"pinch\" can be used both in a cluster whose purpose is
        to choose the amount of sugar, or in a cluster whose purpose is to choose the amount of
        salt."
    value:
    - name: mfgCode
      description: "The manufacturer's vendor ID."
    - name: value
      description: "The mode tag within a mode tag namespace. If the `mfgCode` field exists, this is
        set to a manufacturer-defined value, otherwise, it's set to a standard value."
  - name: ModeOptionStruct
    description: "Describes a mode that may be selected on the device."
    value:
    - name: label
      description: "Text that describes the mode option and is meant to be read and understood by
        the user."
    - name: mode
      description: "A unique identifier for the mode option."
    - name: modeTags
      description: "A list of tags that are associated with the `mode` option, which may be used by
        a device to determine the semantics of a certain mode."

RelativeHumidityControl:
  description: "This trait belongs to devices that support humidity settings such as
    humidifiers and dehumidifiers."

  # RelativeHumidityControl attributes
  attributes:
  - name: minRelativeHumidity
    description: "The minimum humidity level as a percentage."
  - name: maxRelativeHumidity
    description: "The maximum humidity level as a percentage."
  - name: relativeHumiditySetpoint
    description: "The current target humidity percentage of the device."

  # RelativeHumidityControl enums
  enums:
  - name: StepMode
    description: "Indicates the direction of a step change."
    value:
    - name: kUnspecified
      description: "Unspecified direction."
    - name: kUp
      description: "Step upwards."
    - name: kDown
      description: "Step downwards."

  # RelativeHumidityControl commands
  commands:
  - name: SetRelativeHumidity
    description:
    - "Set the relative humidity level to a specific value."
    param:
    - name: humidity
      description: "Setpoint humidity percentage. Must fall between
        [minRelativeHumidity][RelativeHumidityControlTrait.Attributes.minRelativeHumidity]
        [maxRelativeHumidity][RelativeHumidityControlTrait.Attributes.maxRelativeHumidity]."
  - name: StepRelativeHumidity
    description:
    - "Increase or decrease the relative humidity."
    param:
    - name: relativeHumidityPercent
      description: "The percentage value to adjust the humidity level. For example, if
        the current level of relative humidity is set to 50%, then
        `StepRelativeHumidity` with a `relativeHumidityPercent` of `10` sets
        relative humidity to 55%."
    - name: relativeHumidityWeight
      description: "The amount of ambiguous humidity change from a small amount to a large amount."
    - name: stepMode
      description: "Indicates the direction of the change."

RelativeHumidityMeasurement:
  description: "This trait provides an interface to relative humidity measurements of water in the
    air."

  # RelativeHumidityMeasurement attributes
  attributes:
  - name: maxMeasuredValue
    description: "The maximum humidity value that can be measured."
  - name: measuredValue
    description: "The percentage of water in the air."
  - name: minMeasuredValue
    description: "The minimum humidity value that can be measured."
  - name: tolerance
    description: "The magnitude of possible error associated with the [measuredValue], defining the
      true value within a specific range around it."

Rotation:
  description: "This trait belongs to devices that support rotation, which can be specified in
    percentage of a full rotation or in number of degrees. The default direction of a rotation
    is clockwise."

  # Rotation attributes
  attributes:
  - name: rotationDegrees
    description: "The number of degreees that the device is currently rotated in the clockwise
      direction."
  - name: rotationDegreesRange
    description: "The number of degrees that a device is permitted to rotate."
  - name: rotationPercent
    description: "The percentage that the device is currently rotated in the clockwise direction.
      A value of 0.0 means that the device is not rotated at all, and a value of 100.0
      means that the device is fully rotated."
  - name: targetRotationPercent
    description: "The intended percentage of the device's clockwise rotation as the result
      of an ongoing change in rotation."

  # Rotation bitmaps
  bitmaps:
  - name: RotationFeature
    description: "Rotation trait FeatureMap."
    value:
    - name: kSupportsContinuousRotation
      description: "Indicates if this device supports continuous rotation."
    - name: kSupportsDegreesRotation
      description: "Indicates if this device supports rotation by degrees."
    - name: kSupportsPercentRotation
      description: "Indicates if this device supports rotation by percentage."

  # Rotation commands
  commands:
  - name: RotateToDegrees
    description:
    - "Sets the absolute rotation in degrees."
    param:
    - name: rotationDegrees
      description: "An absolute value that sets the final clockwise rotation of the device in
        number of degrees. This value must fall within the range specified in
        [rotationDegreesRange][RotationTrait.Attributes.rotationDegreesRange]."
  - name: RotateToPercentage
    description:
    - "Sets the absolute rotation in percentage."
    param:
    - name: rotationPercent
      description: "An absolute value that sets the final clockwise rotation of the device in
        percentage of a full rotation."

  # Rotation structs
  structs:
  - name: RotationDegreesRange
    description: "The number of degrees that a device can rotate."
    value:
    - name: rotationDegreesMax
      description: "Maximum rotation in number of degrees"
    - name: rotationDegreesMin
      description: "Minimum rotation in number of degrees."

RvcCleanMode:
  description: "This trait provides an interface to the cleaning modes of robotic vacuum
    cleaners."

  # RvcCleanMode attributes
  attributes:
  - name: currentMode
    description: "The current mode. This must be one of the values in
      [supportedModes][RvcCleanModeTrait.Attributes.supportedModes]."
  - name: description
    description: "Describes the purpose of the mode in this cluster instance."
  - name: onMode
    description: "The value of the [currentMode][RvcCleanModeTrait.Attributes.currentMode] that
      depends on the state of an [OnOff] cluster on
      the same endpoint. If the [OnOff] cluster changes its `onOff` attribute from `off` to `on`,
      the `currentMode` is changed to this value. Enabled by the [onOff][RvcCleanMode.Feature.onOff]
      feature."
  - name: standardNamespace
    description: "The single standard namespace for any standard semantic tag value supported in
      this or any other cluster instance with the same namespace. A null value means there is no
      namespace for this cluster instance, and that there are no semantic tags."
  - name: startUpMode
    description: "The desired startup mode for the device when it is supplied with power."
  - name: supportedModes
    description: "The list of supported modes for the cluster instance."

  # RvcCleanMode commands
  commands:
  - name: ChangeToMode
    description:
    - "Change the mode of the device's cluster instance, and set the
      [currentMode][RvcCleanModeTrait.Attributes.currentMode] attribute of the device's cluster
      instance."
    param:
    - name: newMode
      description: "The mode to set the cluster instance to. This must be one of the values in
        [ModeOptionStruct][RvcCleanMode.ModeOptionStruct]."
    response:
      description: "The result of the completed `ChangeToMode` command."
      param:
      - name: status
        description: "The status of the `ChangeToMode` command. Valid values are defined by the
          device manufacturer."
      - name: statusText
        description: "Text describing the status of the `ChangeToMode` command."

  # RvcCleanMode enums
  enums:
  - name: ModeTag
    description: "The ModeTags for RvcCleanMode."
    value:
    - name: kAuto
      description: "Decides which options, features, and setting values to use."
    - name: kQuick
      description: "Optimizes for faster completion."
    - name: kQuiet
      description: "Operates silently or barely audibly."
    - name: kLowNoise
      description: "Optimizes for low noise operation."
    - name: kLowEnergy
      description: "Optimizes for lower energy usage."
    - name: kVacation
      description: "Provides a mode suitable for use during vacations or other extended absences."
    - name: kMin
      description: "Uses the lowest available setting value."
    - name: kMax
      description: "Uses the highest available setting value."
    - name: kNight
      description: "Provides a mode suitable for use during night time."
    - name: kDay
      description: "Provides a mode suitable for use during day time."
    - name: kVacuumThenMop
      description: "Vacuums then mops the relevant areas."
    - name: kDeepClean
      description: "The device is optimized for improved cleaning."
    - name: kVacuum
      description: "The device's vacuum feature is enabled."
    - name: kMop
      description: "The device's mopping feature is enabled."
  - name: StatusCode
    description: "The status codes for RvcCleanMode."
    value:
    - name: kCleaningInProgress
      description: "The device is cleaning."

  # RvcCleanMode bitmaps
  bitmaps:
    - name: Feature
      description: "RvcCleanMode cluster FeatureMap."
      value:
      - name: kOnOff
        description: "There is a dependency on the [OnOff] cluster. When this bit is set, the
          [currentMode][RvcCleanMode.Attributes.currentMode] is set to
          [onMode][RvcCleanMode.Attributes.onMode] when the power is turned on."
      - name: kDirectModeChange
        description: "Indicates whether the cluster implementation supports changing the clean modes
          while the RvcCleanMode cluster’s `CurrentMode` attribute is set to a mode without the
          `Idle` mode tag."

  # RvcCleanMode structs
  structs:
  - name: ModeOptionStruct
    description: "Describes a mode that may be selected on the device."
    value:
    - name: label
      description: "Text that describes the mode option and is meant to be read and understood by
        the user."
    - name: mode
      description: "A unique identifier for the mode option."
    - name: modeTags
      description: "A list of tags that are associated with the mode option, which may be used by
        a device to determine the semantics of a certain mode."
  - name: ModeTagStruct
    description: "Describes a mode tag. The same manufacturer code and mode tag value in
        separate cluster instances are part of the same namespace and have the same meaning. For
        example, a manufacturer tag meaning \"pinch\" can be used both in a cluster whose purpose is
        to choose the amount of sugar, or in a cluster whose purpose is to choose the amount of
        salt."
    value:
    - name: mfgCode
      description: "The manufacturer's vendor ID."
    - name: value
      description: "The mode tag within a mode tag namespace. If the `mfgCode` field exists, this is
        set to a manufacturer-defined value, otherwise, it's set to a standard value."

RvcOperationalState:
  description: "This trait provides an interface to the cleaning modes of robotic vacuum
    cleaners."

  # RvcOperationalState attributes
  attributes:
  - name: countdownTime
    description: "The estimated time left in seconds before the operation is completed."
  - name: currentPhase
    description: "The current phase of operation being performed by the device."
  - name: operationalError
    description: "The details of any current error condition being experienced by the device when
      the [operationalState][RvcOperationalStateTrait.Attributes.operationalState] attribute is
      Error."
  - name: operationalState
    description: "The current operational state of the device."
  - name: operationalStateList
    description: "The set of possible operational states that the device exposes."
  - name: phaseList
    description: "The set of phases that the device can go through for the selected function or
      mode. The list may not be in sequence order. These phases are manufacturer-specific and may
      change when a different function or mode is selected."

  # RvcOperationalState commands
  commands:
  - name: GoHome
    description:
    - "Send the device to its home base."
    response:
      description: "The result of the completed `GoHome` command."
      param:
      - name: commandResponseState
        description: "The return status of the `GoHome` command."
  - name: Pause
    description:
    - "Pause the device if possible, based on the current operation underway."
    response:
      description: "The result of the completed `Pause` command."
      param:
      - name: commandResponseState
        description: "The return status of the `Pause` command."
  - name: Resume
    description:
    - "Resume operation if the device is in a state where it can be resumed."
    response:
      description: "The result of the completed `Resume` command."
      param:
      - name: commandResponseState
        description: "The return status of the `Resume` command."
  - name: Stop
    description:
    - "Stop the device if possible, based on the current operation underway."
    response:
      description: "The result of the completed `Stop` command."
      param:
      - name: commandResponseState
        description: "The return status of the `Stop` command."
  - name: Start
    description:
    - "Start the device if the device is in a state where it can be started."
    response:
      description: "The result of the completed `Start` command."
      param:
      - name: commandResponseState
        description: "The return status of the `Start` command."

  # RvcOperationalState enums
  enums:
  - name: OperationalStateEnum
    description: "The operational states."
    value:
    - name: kStopped
      description: "The device is stopped."
    - name: kRunning
      description: "The device is operating."
    - name: kPaused
      description: "The device is paused."
    - name: kError
      description: "The device is in an error state."
    - name: kSeekingCharger
      description: "The device is en route to the charging dock."
    - name: kCharging
      description: "The device is charging."
    - name: kDocked
      description: "The device is on the dock, not charging."
    - name: kEmptyingDustBin
      description: "The device is emptying its dust bin."
    - name: kCleaningMop
      description: "The device is cleaning its mop."
    - name: kFillingWaterTank
      description: "The device is filling its water tank."
    - name: kUpdatingMaps
      description: "The device is updating its maps."
  - name: ErrorStateEnum
    description: "The error states."
    value:
    - name: kNoError
      description: "The device is not in an error state."
    - name: kUnableToStartOrResume
      description: "The device is unable to start or resume operation."
    - name: kUnableToCompleteOperation
      description: "The device is unable to complete the current operation."
    - name: kCommandInvalidInState
      description: "The device cannot process the command in its current state."
    - name: kFailedToFindChargingDock
      description: "The device failed to find or reach the charging dock."
    - name: kStuck
      description: "The device is stuck and requires manual intervention."
    - name: kDustBinMissing
      description: "The dust bin is missing."
    - name: kDustBinFull
      description: "The dust bin is full."
    - name: kWaterTankEmpty
      description: "The water tank is empty."
    - name: kWaterTankMissing
      description: "The water tank is missing."
    - name: kWaterTankLidOpen
      description: "The water tank lid is open."
    - name: kMopCleaningPadMissing
      description: "The cleaning pad is missing."
    - name: kLowBattery
      description: "The device is unable to start or continue operation due to low battery level."
    - name: kCannotReachTargetArea
      description: "The device cannot reach the target area."
    - name: kDirtyWaterTankFull
      description: "The dirty water tank is full."
    - name: kDirtyWaterTankMissing
      description: "The dirty water tank is missing."
    - name: kWheelsJammed
      description: "The wheels are jammed."
    - name: kBrushJammed
      description: "The brush is jammed."
    - name: kNavigationSensorObscured
      description: "The navigation sensor is obscured."

  # RvcOperationalState structs
  structs:
  - name: ErrorStateStruct
    description: "Used to indicate the error state of the device when the
      [operationalState][RvcOperationStateTrait.Attributes.operationalState] attribute is
      Error."
    value:
    - name: errorStateDetails
      description: "Details about the error condition."
    - name: errorStateId
      description: "Present only when populated with a vendor-specific error ID."
    - name: errorStateLabel
      description: "Present only when `errorStateId` is populated with a vendor-specific error ID."
  - name: OperationalStateStruct
    description: "Used to indicate a possible state of the device."
    value:
    - name: operationalStateId
      description: "The operational state."
    - name: operationalStateLabel
      description: "A human-readable description of the operational state. Only present when the
        `operationalStateId` is vendor-specific."

  # RvcOperationalState events
  events:
  - name: OperationalError
    description: "This event is generated when a reportable error condition is detected."
    value:
    - name: errorState
      description: "An enumeration range or generally applicable values that indicate specific
       errors. The enumeration ranges for the
       [errorStateId][RvcOperationalStateTrait.ErrorStateStruct.errorStateId] field values are:
      <table>
        <tr>
          <td><code>0x00</code> to <code>0x3F</code></td>
          <td><b>GeneralErrors</b></td>
          <td>General errors.</td>
        </tr>
        <tr>
          <td><code>0x40</code> to <code>0x7F</code></td>
          <td><b>DerivedClusterErrors</b></td>
          <td>Derived cluster-specific errors.</td>
        </tr>
        <tr>
          <td><code>0x80</code> to <code>0xBF</code></td>
          <td><b>ManufacturerError</b></td>
          <td>Vendor-specific errors.</td>
        </tr>
      </table>
      <p>The generally applicable
          [errorStateId][RvcOperationalStateTrait.ErrorStateStruct.errorStateId]
          values are:</p>
        <table>
        <tr>
          <td><code>0x00</code></td>
          <td><b>NoError</b></td>
          <td>When the device is not in an error state.</td>
        </tr>
        <tr>
          <td><code>0x01</code></td>
          <td><b>UnableToStartOrResume</b></td>
          <td>When the device is unable to start or
            resume operation.</td>
        </tr>
        <tr>
          <td><code>0x02</code></td>
          <td><b>UnableToCompleteOperation</b></td>
          <td>When the device is unable to complete
            the current operation.</td>
        </tr>
        <tr>
          <td><code>0x03</code></td>
          <td><b>CommandInvalidInState</b></td>
          <td>When the device cannot process the command in its current state.</td>
        </tr>
      </table>"
  - name: OperationCompletion
    description: "This event is generated when the overall operation ends, successfully or
      otherwise."
    value:
    - name: completionErrorCode
      description: "Provides an indication of the state at the end of the operation."
    - name: totalOperationalTime
      description: "The total operational time, in seconds, from when the operation was started,
        until the operation completed, including any time spent while paused."
    - name: pausedTime
      description: "The total time spent in the paused state, in seconds."

RvcRunMode:
  description: "This trait provides an interface to the running modes of robotic vacuum
    cleaners."

  # RvcRunMode attributes
  attributes:
  - name: currentMode
    description: "The current mode. This must be one of the values in
      [supportedModes][RvcRunModeTrait.Attributes.supportedModes]."
  - name: description
    description: "Describes the purpose of the mode in this cluster instance."
  - name: onMode
    description: "The value of the [currentMode][RvcRunModeTrait.Attributes.currentMode] that
      depends on the state of an [OnOff] cluster on
      the same endpoint. If the [OnOff] cluster changes its `onOff` attribute from `off` to `on`,
      the `currentMode` is changed to this value."
  - name: standardNamespace
    description: "The single standard namespace for any standard semantic tag value supported in
      this or any other cluster instance with the same namespace. A null value means there is no
      namespace for this cluster instance, and that there are no semantic tags."
  - name: startUpMode
    description: "The desired startup mode for the device when it is supplied with power."
  - name: supportedModes
    description: "The list of supported modes for the cluster instance."

  # RvcRunMode commands
  commands:
  - name: ChangeToMode
    description:
    - "Change the mode of the device's cluster instance, and set the
      [currentMode][RvcRunModeTrait.Attributes.currentMode] attribute of the device's cluster
      instance."
    param:
    - name: newMode
      description: "The mode to set the cluster instance to. This must be one of the values in
        [ModeOptionStruct][RvcRunMode.ModeOptionStruct]."
    response:
      description: "The result of the completed `ChangeToMode` command."
      param:
      - name: status
        description: "The status of the `ChangeToMode` command. Valid values are defined by the
          device manufacturer."
      - name: statusText
        description: "Text describing the status of the `ChangeToMode` command."

  # RvcRunMode enums
  enums:
  - name: ModeTag
    description: "The ModeTags for RvcRunMode."
    value:
    - name: kAuto
      description: "Decides which options, features, and setting values to use."
    - name: kQuick
      description: "Optimizes for faster completion."
    - name: kQuiet
      description: "Operates silently or barely audibly."
    - name: kLowNoise
      description: "Optimizes for low noise operation."
    - name: kLowEnergy
      description: "Optimizes for lower energy usage."
    - name: kVacation
      description: "Provides a mode suitable for use during vacations or other extended absences."
    - name: kMin
      description: "Uses the lowest available setting value."
    - name: kMax
      description: "Uses the highest available setting value."
    - name: kNight
      description: "Provides a mode suitable for use during night time."
    - name: kDay
      description: "Provides a mode suitable for use during day time."
    - name: kIdle
      description: "The device is doing something other than cleaning or mapping."
    - name: kCleaning
      description: "The device is cleaning or paused while in the middle of cleaning."
    - name: kMapping
      description: "The device is mapping."
  - name: StatusCode
    description: "The status codes for RvcRunMode."
    value:
    - name: kStuck
      description: "The device is stuck."
    - name: kDustBinMissing
      description: "The dust bin is missing."
    - name: kDustBinFull
      description: "The dust bin is full."
    - name: kWaterTankEmpty
      description: "The water tank is empty."
    - name: kWaterTankMissing
      description: "The water tank is missing."
    - name: kWaterTankLidOpen
      description: "The lid to the water tank is open."
    - name: kMopCleaningPadMissing
      description: "The mop cleaning pad is missing."
    - name: kBatteryLow
      description: "The battery is low."

  # RvcRunMode structs
  structs:
  - name: ModeOptionStruct
    description: "Describes a mode that may be selected on the device."
    value:
    - name: label
      description: "Text that describes the mode option and is meant to be read and understood by
        the user."
    - name: mode
      description: "A unique identifier for the mode option."
    - name: modeTags
      description: "A list of tags that are associated with the mode option, which may be used by
        a device to determine the semantics of a certain mode."
  - name: ModeTagStruct
    description: "Describes a mode tag. The same manufacturer code and mode tag value in
        separate cluster instances are part of the same namespace and have the same meaning. For
        example, a manufacturer tag meaning \"pinch\" can be used both in a cluster whose purpose is
        to choose the amount of sugar, or in a cluster whose purpose is to choose the amount of
        salt."
    value:
    - name: mfgCode
      description: "The manufacturer's vendor ID."
    - name: value
      description: "The mode tag within a mode tag namespace. If the `mfgCode` field exists, this is
        set to a manufacturer-defined value, otherwise, it's set to a standard value."

  # RvcRunMode bitmaps
  bitmaps:
  - name: Feature
    description: "RvcRunMode cluster FeatureMap."
    value:
    - name: kOnOff
      description: "There is a dependency on the [OnOff] cluster."
    - name: kDirectModeChange
      description: "Indicates whether the cluster implementation supports changing the run modes
        while the RVC Run Mode cluster’s `currentMode` attribute is set to a mode without the `Idle`
        mode tag."

SearchableHome:
  description: "This trait provides an interface for querying devices in a home."

  # SearchableHome attributes
  attributes:
  - name: searchable
    description: "Indicates whether the device is searchable. A device is searchable if it is
      discoverable via a search query."

  # SearchableHome structs
  structs:
  - name: BasicCameraEventDetailsStruct
    description: "A basic camera event details struct."
    value:
    - name: endTime
      description: "The end time of the camera event."
    - name: entityObjectId
      description: "The ID of the camera that recorded the event."
    - name: previewUrl
      description: "The preview URL of the camera event."
    - name: sessionId
      description: "The session ID of the camera event."
    - name: shortCaption
      description: "The short caption of the camera event."
    - name: startTime
      description: "The start time of the camera event."
    - name: thumbnailUrl
      description: "The thumbnail URL of the camera event."

  # SearchableHome commands
  commands:
  - name: GetRecentSearches
    description:
    - "Gets the recent searches for the device."
    response:
      description: "The result of the completed `GetRecentSearches` command."
      param:
      - name: recentSearches
        description: "The list of recent searches for the device."
  - name: GetSearchSuggestions
    description:
    - "Gets the search suggestions for the device."
    response:
      description: "The result of the completed `GetSearchSuggestions` command."
      param:
      - name: suggestions
        description: "The list ofsearch suggestions for the device."
  - name: Search
    description:
    - "Initiates a search for camera events."
    param:
    - name: query
      description: "The search query."
    response:
      description: "The result of the completed `Search` command."
      param:
      - name: cameraEventsList
        description: "The list of camera events that match the search query."
      - name: queryResponse
        description: "The query response for the search query."
      - name: traceId
        description: "Unique ID trace context for the search session."

Scene:
  description: "A group of settings for one or more devices, capable of being activated with a
    single command or button press. For example, a scene that dims the lights in the living room,
    and turns on the TV and surround sound system."

  # Scene attributes
  attributes:
  - name: sceneReversible
    description: "Indicates that the scene can be reversed. For example, a scene that dims a group
      of lights can be reversed, in other words, the lights return to their former brightness."
  - name: sceneDynamic
    description: "Indicates that the scene is dynamic, meaning it changes over time while
      active. For example, a scene that adjusts the volume of a TV to compensate for intermittent
      background noise."

ServiceArea:
  description: "This trait provides an interface for controlling the areas where
    a device should operate, for reporting the status at each area, and for
    querying the current area."

  # ServiceArea attributes
  attributes:
  - name: currentArea
    description: "The area where the device is currently located, regardless of whether it is
      operating. If the device is not
      mobile and can operate in multiple areas sequentially, this attribute indicates the area
      that is currently being serviced or the area that is currently traversed by the device."
  - name: estimatedEndTime
    description: "The estimated Unix epoch time for completing service in the area,
      indicated by the
      [currentArea][ServiceAreaTrait.Attributes.currentArea] attribute. A value of `0`
      means that the operation has completed."
  - name: progress
    description: "The operating status of one or more areas. Each entry in this list has a
      unique value for the `AreaID` field in [ProgressStruct][ServiceAreaTrait.ProgressStruct]."
  - name: selectedAreas
    description: "The set of areas where the device should attempt to operate. Mobile devices
      may travel without operating across any areas while attempting to reach the areas indicated by
      the `SelectedAreas` attribute. For example, a robotic vacuum cleaner may drive without
      cleaning when traveling without operating. If this attribute is empty, the device is not
      constrained to operate in any specific areas."
  - name: supportedAreas
    description: "The list of supported service areas for the device. Each item in this list
      represents a unique area, as indicated by the `AreaID` field of
      [AreaStruct][ServiceAreaTrait.AreaStruct]."
  - name: supportedMaps
    description: "The list of supported maps for the device. Each item in this list represents a
      unique map, as indicated by the `MapID` field of
      [MapStruct][ServiceAreaTrait.MapStruct]. A map is a full or partial representation
      of a home known to the device. Each map includes one or more areas."

  # ServiceArea bitmaps
  bitmaps:
  - name: Feature
    description: "ServiceArea cluster FeatureMap."
    value:
    - name: kSelectWhileRunning
      description: "Supports the ability to select areas while the device is running."
    - name: kProgressReporting
      description: "Supports the progress-reporting feature."
    - name: kMaps
      description: "Supports the maps feature."

  # ServiceArea commands
  commands:
  - name: SelectAreas
    description:
    - "Selects the areas where the device should attempt to operate."
    param:
    - name: newAreas
      description: "The list of areas where the device should attempt to operate."
    response:
      description: "The result of the completed `SelectAreas` command."
      param:
      - name: status
        description: "The status of the `SelectAreas` command. If the Status field is set to
         `Success` or `UnsupportedArea`,
          the server can use a non-empty string for the `StatusText` field to provide additional
          information. For example, if Status is set to `UnsupportedArea`, the server can use
          `StatusText` to indicate which areas are unsupported.
          If the Status field is not set to `Success` or `UnsupportedArea`,
          the `StatusText` field can include a vendor-defined error description which
          can be used to explain the error to the user."
      - name: statusText
        description: "Text describing the status of the `SelectAreas` command."
  - name: SkipArea
    description:
    - "Indicates to the device that the area specified by the `areaID` field should be skipped."
    param:
    - name: skippedArea
      description: "The area to skip, and to attempt operating in other areas on the
        [supportedAreas][ServiceAreaTrait.Attributes.supportedAreas] attribute list."
    response:
      description: "The result of the completed `SkipArea` command."
      param:
      - name: status
        description: "The status of the `SkipArea` command. If the Status field is set to
          `Success` or `InvalidAreaList`, the server can use a non-empty string for the
          `StatusText` field to provide additional information. For example, if Status is set to
          `InvalidAreaList`, the server can use `StatusText` to indicate which areas are invalid.
          If the Status field is not set to `Success` or `InvalidAreaList`,
          the `StatusText` field can include a vendor-defined error description which
          can be used to explain the error to the user."
      - name: statusText
        description: "Text describing the status of the `SkipArea` command."

  # ServiceArea enums
  enums:
  - name: OperationalStatusEnum
    description: "The operational status of the device for an area."
    value:
    - name: kPending
      description: "The device has not yet started operating in the given area, or has not finished
        operating in that area but is not currently operating in the area."
    - name: kOperating
      description: "The device is currently operating in the given area."
    - name: kSkipped
      description: "The device has skipped the given area, before or during operating at it, due
        to a `SkipArea` command, an out-of-band command,
        a vendor-specific reason, or because the device ended operating without success."
    - name: kCompleted
      description: "The device has finished operating in the given area."
  - name: SelectAreasStatus
    description: "The status of the `SelectAreas` command."
    value:
    - name: kSuccess
      description: "Attempting to operate in the areas identified by the entries of the
        `newAreas` field is allowed and possible. The `selectedAreas` attribute is set to the
         value of the `newAreas` field."
    - name: kUnsupportedArea
      description: "The value of at least one of the entries of the `newAreas` field doesn't
        match any entries in the `supportedAreas` attribute."
    - name: kInvalidInMode
      description: "The received request cannot be handled due to the current mode of the device."
    - name: kInvalidSet
      description: "The set of values is invalid, for example areas on different floors that a
        robot knows it can't reach on its own."
  - name: SkipAreaStatus
    description: "The status of the `SkipArea` command."
    value:
    - name: kSuccess
      description: "Skipping the area is allowed and possible, or the device was operating at the
        last available area and has stopped."
    - name: kInvalidAreaList
      description: "The `selectedAreas` attribute is empty."
    - name: kInvalidInMode
      description: "The received request cannot be handled due to the current mode of the device.
        For example, the `currentArea` attribute is null or the device is not operating."
    - name: kInvalidSkippedArea
      description: "The `skippedArea` field doesn't match an entry in the `supportedAreas` list."

  # ServiceArea structs
  structs:
  - name: AreaStruct
    description: "Data about an area known to the server."
    value:
    - name: areaID
      description: "The identifier of the area."
    - name: mapID
      description: "The map identifier which the area is associated with. A value of `null`
        indicates that the area is not associated with a map. If the `supportedMaps` attribute is
        not empty, this field matches the `MapID` field of an entry from the `supportedMaps`
        attribute's list. If the `supportedMaps` attribute is empty, this field is `null`."
    - name: areaInfo
      description: "Data describing the area. This field is used by clients to determine the name
        or the semantics of a certain area."
  - name: AreaInfoStruct
    description: "The name and semantic data describing an area."
    value:
    - name: locationInfo
      description: "The name of the area, floor number or area type. Area-type values come from
        the Matter Common Area Type Namespace."
    - name: landmarkInfo
      description: "Indicates an association with a landmark. For example, this may indicate
        that the area refers to a zone next to a table. A value of `null` indicates that the
        information is not available or known."
  - name: LandmarkInfoStruct
    description: "The data from this structure indicates a landmark and device position relative to
      the landmark."
    value:
    - name: landmarkTag
      description: "Indicates that the area is associated with a landmark. This field is the ID
        of a landmark semantic tag, located within the Common Landmark Namespace defined in the
        Matter specification."
    - name: relativePositionTag
      description: "The position of the area relative to a landmark. This is a static description
        of a zone known to the server, and this field never reflects the device's own proximity or
        position relative to the landmark, but that of the zone. This field is the ID of a
        relative position semantic tag, located within the Common Relative Position Namespace
        defined in the Matter specification."
  - name: LocationDescriptorStruct
    description: "Data describing the location of an area."
    value:
    - name: floorNumber
      description: "The floor number of the area. A value of `null` indicates that the floor
        number is not available or known."
    - name: areaType
      description: "The type of the area. A value of `null` indicates that the area type is not
        available or known."
    - name: locationName
      description: "The name of the area. A value of `null` indicates that the area name is
        unknown."
  - name: MapStruct
    description: "A struct representing a map."
    value:
    - name: mapID
      description: "The map's identifier."
    - name: name
      description: "A user-understandable map description, such as Main Floor."
  - name: ProgressStruct
    description: "Data about the operating status of an area."
    value:
    - name: areaID
      description: "The identifier of the area, where the identifier is an entry in the
        [supportedAreas][ServiceAreaTrait.Attributes.supportedAreas] attribute's list."
    - name: status
      description: "The operational status of the device for the area,
        indicated by the `areaID` field."
    - name: totalOperationalTime
      description: "The total operational time, in seconds, from when the device started to
        operate at the area indicated by the `areaID` field until the operation finished."
    - name: estimatedTime
      description: "The estimated time for the operation, in seconds, from when the device
        starts operating at the area indicated by the `areaID` field until
        the operation completes, excluding any time spent while not operating in the area."

SimplifiedOnOff:
  description: "This trait provides an enum based on-off extension to the `OnOff` trait and is only
    for use with the Automation API."

  # SimplifiedOnOff attributes
  attributes:
  - name: onOff
    description: "Indicates the on or off state of the device."

  # SimplifiedOnOff enums
  enums:
  - name: OnOffEnum
    description: "The on or off state of the device."
    value:
    - name: kUnspecified
      description: "The device's on or off state is unspecified."
    - name: kOn
      description: "The device is on."
    - name: kOff
      description: "The device is off."

SimplifiedThermostat:
  description: "This trait provides an extension to the `Thermostat` trait and is only for use with
    the Automation API."

  # SimplifiedThermostat attributes
  attributes:
  - name: systemMode
    description: "The current operating mode of the thermostat. Valid values are defined by
      [SystemModeEnum][SimplifiedThermostatTrait.SystemModeEnum]."

  # SimplifiedThermostat commands
  commands:
  - name: SetSystemMode
    description:
    - "Set the system mode."
    param:
    - name: systemMode
      description: "The mode to set the system to."

  # SimplifiedThermostat enums
  enums:
  - name: SystemModeEnum
    description: "Thermostat operating modes."
    value:
    - name: kUnspecified
      description: "The thermostat mode is unspecified."
    - name: kOff
      description: "The thermostat is not set to engage any climate control functions."
    - name: kAuto
      description: "Demand is generated for either cooling or heating, as required."
    - name: kCool
      description: "Demand is only generated for cooling."
    - name: kHeat
      description: "Demand is only generated for heating."
    - name: kEmergencyHeat
      description: "Second stage heating is in use to achieve desired temperature."
    - name: kPrecooling
      description: "The thermostat is in precooling mode."
    - name: kFanOnly
      description: "Demand is only generated for fan."
    - name: kDry
      description: "Demand is only generated for dehumidification."
    - name: kSleep
      description: "The thermostat is set to sleep mode."
    - name: kEco
      description: "The thermostat is in eco mode. Eco mode is only supported if the underlying
        device natively supports it."
    - name: kPurifier
      description: "The thermostat is in purifier mode."

SmokeCoAlarm:
  description: "This trait provides an interface for managing the state of smoke and CO alarms."

  # SmokeCoAlarm attributes
  attributes:
  - name: expressedState
    description: "The visible and audible conditions of the alarm."
  - name: smokeState
    description: "Indicates whether device's smoke sensor is currently triggering a smoke alarm."
  - name: COState
    description: "Indicates whether device's CO sensor is currently triggering a CO alarm."
  - name: batteryAlert
    description: "Indicates whether the power resource faulty detection mechanism is currently
      triggered."
  - name: deviceMuted
    description: "Indicates whether the audible expression of the device is currently muted."
  - name: testInProgress
    description: "Indicates whether the device self-test is currently activated."
  - name: hardwareFaultAlert
    description: "Indicates whether the hardware fault detection mechanism is currently triggered."
  - name: endOfServiceAlert
    description: "Indicates whether the end-of-service has been triggered."
  - name: interconnectSmokeAlarm
    description: "Indicates whether the interconnected smoke alarm is currently triggering by
      branching devices."
  - name: interconnectCOAlarm
    description: "Indicates whether the interconnected CO alarm is currently triggering by
      branching devices."
  - name: contaminationState
    description: "The contamination level of the smoke sensor."
  - name: smokeSensitivityLevel
    description: "The sensitivity level of the smoke sensor configured on the device."
  - name: expiryDate
    description: "The date when the device reaches its stated expiration date."

  # SmokeCoAlarm bitmaps
  bitmaps:
  - name: Feature
    description: "SmokeCoAlarm cluster FeatureMap."
    value:
    - name: kSmokeAlarm
      description: "Supports smoke alarm."
    - name: kCOAlarm
      description: "Supports CO alarm."

  # SmokeCoAlarm commands
  commands:
  - name: SelfTestRequest
    description:
    - "Initiate a device self-test."

  # SmokeCoAlarm enums
  enums:
  - name: AlarmStateEnum
    description: "The state of the alarm."
    value:
    - name: kNormal
      description: "The device is not alarming."
    - name: kWarning
      description: "The device is in a warning state."
    - name: kCritical
      description: "The device is in a critical state."
  - name: ContaminationStateEnum
    description: "The contamination state of the alarm's sensor."
    value:
    - name: kNormal
      description: "The sensor is not contaminated."
    - name: kLow
      description: "The sensor has low contamination."
    - name: kWarning
      description: "The sensor is in a warning state."
    - name: kCritical
      description: "The sensor is in a critical state."
  - name: EndOfServiceEnum
    description: "The expiration status of the device."
    value:
    - name: kNormal
      description: "The device has not expired."
    - name: kExpired
      description: "The device has reached end of service."
  - name: ExpressedStateEnum
    description: "The current state of the alarm."
    value:
    - name: kNormal
      description: "The device is not alarming."
    - name: kSmokeAlarm
      description: "Smoke alarm state."
    - name: kCOAlarm
      description: "CO alarm state."
    - name: kBatteryAlert
      description: "Battery alert state."
    - name: kTesting
      description: "Test in progress."
    - name: kHardwareFault
      description: "Hardware fault alert state."
    - name: kEndOfService
      description: "End of service alert state."
    - name: kInterconnectSmoke
      description: "Interconnected smoke alarm state."
    - name: kInterconnectCO
      description: "Interconnected CO alarm state."
  - name: MuteStateEnum
    description: "The device's mute state."
    value:
    - name: kNotMuted
      description: "The device is not muted."
    - name: kMuted
      description: "The device is muted."
  - name: SensitivityEnum
    description: "The device's sensitivity state."
    value:
    - name: kHigh
      description: "High sensitivity."
    - name: kStandard
      description: "Standard sensitivity."
    - name: kLow
      description: "Low sensitivity."

  # SmokeCoAlarm events
  events:
  - name: SmokeAlarm
    description: "Generated when the [smokeState][SmokeCoAlarmTrait.Attributes.smokeState]
      attribute changes state."
    value:
    - name: alarmSeverityLevel
      description: "The current value of the [smokeState][SmokeCoAlarmTrait.Attributes.smokeState]
        attribute. Valid values are defined in
        [AlarmStateEnum][SmokeCoAlarmTrait.AlarmStateEnum]."
  - name: COAlarm
    description: "Generated when the [COState][SmokeCoAlarmTrait.Attributes.COState] attribute
      changes state."
    value:
    - name: alarmSeverityLevel
      description: "The current value of the [COState][SmokeCoAlarmTrait.Attributes.COState]
        attribute. Valid values are defined in
        [AlarmStateEnum][SmokeCoAlarmTrait.AlarmStateEnum]."
  - name: LowBattery
    description: "Generated when the [batteryAlert][SmokeCoAlarmTrait.Attributes.batteryAlert]
      attribute changes state."
    value:
    - name: alarmSeverityLevel
      description: "The current value of the
        [batteryAlert][SmokeCoAlarmTrait.Attributes.batteryAlert] attribute. Valid values are
        defined in [AlarmStateEnum][SmokeCoAlarmTrait.AlarmStateEnum]."
  - name: HardwareFault
    description: "Generated when the device detects a hardware fault."
  - name: EndOfService
    description: "Generated when the
      [endOfServiceAlert][SmokeCoAlarmTrait.Attributes.endOfServiceAlert] attribute is set to
      `Expired`."
  - name: SelfTestComplete
    description: "Generated when the self test completes."
  - name: AlarmMuted
    description: "Generated when the [deviceMuted][SmokeCoAlarmTrait.Attributes.deviceMuted]
      attribute changes to `Muted`."
  - name: MuteEnded
    description: "Generated when the [deviceMuted][SmokeCoAlarmTrait.Attributes.deviceMuted]
      attribute changes to `NotMuted`."
  - name: InterconnectSmokeAlarm
    description: "Generated when the device hosting the server receives a smoke alarm from an
      interconnected sensor."
    value:
    - name: alarmSeverityLevel
      description: "The current value of the [smokeState][SmokeCoAlarmTrait.Attributes.smokeState]
        attribute. Valid values are defined in
        [AlarmStateEnum][SmokeCoAlarmTrait.AlarmStateEnum]."
  - name: InterconnectCOAlarm
    description: "Generated when the device hosting the server receives a CO alarm from an
      interconnected sensor."
    value:
    - name: alarmSeverityLevel
      description: "The current value of the
        [COState][SmokeCoAlarmTrait.Attributes.COState] attribute. Valid values are defined in
        [AlarmStateEnum][SmokeCoAlarmTrait.AlarmStateEnum]."
  - name: AllClear
    description: "Generated when the [expressedState][SmokeCoAlarmTrait.Attributes.expressedState]
      attribute returns to `Normal`."

SmokeLevelConcentrationMeasurement:
  description: "This trait belongs to devices that measure smoke concentration."

  # SmokeLevelConcentrationMeasurement attributes
  attributes:
  - name: measurementUnit
    description: "The unit of measurement used to measure smoke concentration."
  - name: measuredValue
    description: "The measured level of smoke concentration."
  - name: levelValue
    description: "The level of smoke concentration as a descriptive value."

  # SmokeLevelConcentrationMeasurement bitmaps
  bitmaps:
  - name: SmokeLevelMeasurementFeature
    description: "SmokeLevelConcentrationMeasurement trait feature map."
    value:
    - name: kNumericMeasurement
      description: "Numeric measurement supported."
    - name: kLevelIndication
      description: "Level indication supported."
    - name: kMediumLevel
      description: "Medium concentration level recognized."
    - name: kCriticalLevel
      description: "Critical concentration level recognized."

  # SmokeLevelConcentrationMeasurement enums
  enums:
  - name: ConcentrationLevel
    description: "Descriptive values for smoke concentration level."
    value:
    - name: kUnspecified
      description: "Unspecified."
    - name: kLow
      description: "Low."
    - name: kMedium
      description: "Medium."
    - name: kHigh
      description: "High."
    - name: kCritical
      description: "Critical."
  - name: MeasurementUnit
    description: "Smoke concentration measurement unit."
    value:
    - name: kUnspecified
      description: "Unspecified."
    - name: kPartsPerMillion
      description: "Parts per million."

SoftwareUpdate:
  description: "This trait belongs to devices that support software updates."

  # SoftwareUpdate attritbutes
  attributes:
  - name: lastSoftwareUpdateTimeSeconds
    description: "The Epoch Unix timestamp (number of seconds elapsed since the Unix Epoch) of the
      latest successful software update."

  # SoftwareUpdate commands
  commands:
  - name: SoftwareUpdate
    description:
    - "Updates the device with the latest software."

SoilMeasurement:
  description: "This trait provides an interface to soil measurement."

  # SoilMeasurement attributes
  attributes:
  - name: soilMoistureMeasurementLimits
    description: "The measurement accuracy and limits of the soil moisture measurement."
  - name: soilMoistureMeasuredValue
    description: "Soil moisture measured in water content percentage."

  # SoilMeasurement enums
  enums:
  - name: MeasurementTypeEnum
    description: "The type of measurement."
    value:
    - name: kActiveCurrent
      description: "Active current in milliamps (mA)."
    - name: kActivePower
      description: "Active power in milliwatts (mW)."
    - name: kApparentCurrent
      description: "Apparent current in milliamps (mA)."
    - name: kApparentEnergy
      description: "Apparent energy in millivolt-amp-hours (mVAh)."
    - name: kApparentPower
      description: "Apparent power in millivolt-amps (mVA)."
    - name: kElectricalEnergy
      description: "Electrical energy in milliwatt-hours (mWh)."
    - name: kFrequency
      description: "AC frequency in millihertz (mHz)."
    - name: kNeutralCurrent
      description: "AC neutral current in milliamps (mA)."
    - name: kPowerFactor
      description: "Power factor ratio in +/- 1/100ths of a percent."
    - name: kReactiveCurrent
      description: "Reactive current in milliamps (mA)."
    - name: kReactiveEnergy
      description: "Reactive energy in millivolt-amp-hours reactive (mVARh)."
    - name: kReactivePower
      description: "Reactive power in millivolt-amps reactive (mVAR)."
    - name: kRMSCurrent
      description: "RMS current in milliamps (mA)."
    - name: kRMSPower
      description: "RMS power in milliwatts (mW)."
    - name: kRMSVoltage
      description: "RMS voltage in millivolts (mV)."
    - name: kSoilMoisture
      description: "Soil moisture in percent."
    - name: kUnspecified
      description: "Unspecified."
    - name: kVoltage
      description: "Voltage in millivolts (mV)."

  # SoilMeasurement structs
  structs:
  - name: MeasurementAccuracyRangeStruct
    description: "The accuracy of a measurement for a range of measurement values, shown as a
      maximum +/- percentage of the true value, a maximum +/- fixed value of the
      true value, or both."
    value:
    - name: fixedMax
      description: "The maximum +/- fixed accuracy for the associated measurement, in the
        unit indicated by `measurementType`."
    - name: fixedMin
      description: "The minimum +/- fixed accuracy for the associated measurement, in the
        unit indicated by `measurementType`."
    - name: fixedTypical
      description: "The typical +/- fixed accuracy for the associated measurement, in the
        unit indicated by `measurementType`."
    - name: percentMax
      description: "The maximum +/- percentage accuracy for the associated measurement."
    - name: percentMin
      description: "The minimum +/- percentage accuracy for the associated measurement."
    - name: percentTypical
      description: "The typical +/- percentage accuracy for the associated measurement."
    - name: rangeMax
      description: "The maximum measurement value for the specified level of accuracy.
        The value of this field is greater than the value of the `rangeMin` field and
        greater than or equal to the value of `minMeasuredValue`. The value of
        this field is less than or equal to the value of `maxMeasuredValue`."
    - name: rangeMin
      description: "The minimum measurement value for the specified level of accuracy.
        The value of this field is greater than or equal to the value of
        `minMeasuredValue`. The value of this field is less than or equal to the
        value of `maxMeasuredValue`."
  - name: MeasurementAccuracyStruct
    description: "The set of accuracy ranges for a given measurement, the maximum and minimum
      values for the measurement, and whether the measurement is directly measured or
      only estimated from other existing information."
    value:
    - name: accuracyRanges
      description: "A list of measurement ranges and their associated accuracies."
    - name: maxMeasuredValue
      description: "The maximum possible value of the measured value."
    - name: measured
      description: "Whether the associated measurement was directly measured. If this field
        is not set to `true`, then the associated measurement was estimated."
    - name: minMeasuredValue
      description: "The minimum possible value of the measured value."
    - name: measurementType
      description: "The measurement type for the accuracy provided."

SoilMoistureMeasurement:
  description: "This trait belongs to devices that measure soil moisture."

  # SoilMoistureMeasurement attributes
  attributes:
  - name: measuredValue
    description: "The moisture level."
  - name: minMeasuredValue
    description: "The minimum value of
      [measuredValue][SoilMoistureMeasurementTrait.Attributes.measuredValue]
      that can be measured."
  - name: maxMeasuredValue
    description: "The maximum value of
      [measuredValue][SoilMoistureMeasurementTrait.Attributes.measuredValue]
      that can be measured."
  - name: tolerance
    description: "The magnitude of potential error associated with the [measuredValue]."

StatusReport:
  description: "This trait reports the current status of a specific device or a connected
    group of devices."

  # StatusReport attributes
  attributes:
  - name: currentStatusReports
    description: "Current error or exception statuses of the device and any related device IDs."

  # StatusReport structs
  structs:
  - name: CurrentStatusReport
    description: "Current error or exception statuses of the device and any related device IDs."
    value:
    - name: blocking
      description: "Indicates if the error or current status is blocking
        the execution of additional commands."
    - name: priority
      description: "Priority of this status, with the lowest values denoting the highest priorities.
        The highest priority is `0`. An error or exception status is reported from the highest
        priority to the lowest."
    - name: targetDeviceId
      description: "ID of the target device."
    - name: statusCode
      description: "Current status of the device."

SpeedMeasurement:
  description: "This trait provides an interface to speed measurement."

  # SpeedMeasurement attributes
  attributes:
  - name: maxMeasuredValue
    description: "The maximum value of the current speed that can be measured."
  - name: measuredValue
    description: "The current speed value."
  - name: measurementUnit
    description: "The measurement unit used to measure the current speed value."
  - name: minMeasuredValue
    description: "The minimum value of the current speed that can be measured."
  - name: tolerance
    description: "The magnitude of the possible error that is associated with the
      measured value, using the same units and resolution. The true value is in the
      range of (`measuredValue` - `tolerance`) to (`measuredValue` + `tolerance`), but never outside
      of the possible physical range."

  # SpeedMeasurement enums
  enums:
  - name: MeasurementUnit
    description: "The speed measurement unit."
    value:
    - name: kRotationsPerMinute
      description: "Rotations per minute."
    - name: kUnspecified
      description: "Unspecified."

Switch:
  description: "This trait exposes interactions with a switch device, for the purpose of using those
    interactions by other devices."

  # Switch attributes
  attributes:
  - name: numberOfPositions
    description: "The maximum number of positions the switch has. A switch must have a minimum of
      two positions."
  - name: currentPosition
    description: "The current position of the switch. The default position is `0`. The valid range
      of values is `0` to `[numberOfPositions]-1`."
  - name: multiPressMax
    description: "The maximum number of consecutive presses that can be detected and reported by a
      momentary switch which supports multi-press."

  # Switch bitmaps
  bitmaps:
  - name: Feature
    description: "Switch cluster FeatureMap."
    value:
    - name: kActionSwitch
      description: "Indicates simplified handling of events for multi-press-capable switches."
    - name: kLatchingSwitch
      description: "The latching switch (such as a rocker) maintains its position after being
        pressed or turned."
    - name: kMomentarySwitch
      description: "The momentary switch (such as a push button) does not maintain its position
        after being pressed or turned. After releasing, it goes back to its idle position."
    - name: kMomentarySwitchLongPress
      description: "The momentary switch (such as a push button) can distinguish and report long
        pressed from short presses."
    - name: kMomentarySwitchMultiPress
      description: "The momentary switch (such as a push button) can distinguish and report double
        press and potentially multiple presses with more events, such as a triple press."
    - name: kMomentarySwitchRelease
      description: "The momentary switch (such as a push button) can distinguish and report release
        events."

  # Switch events
  events:
  - name: SwitchLatched
    description: "Indicates that the latching switch moved to a new position."
    value:
    - name: newPosition
      description: "The value of the [currentPosition][SwitchTrait.Attributes.currentPosition]
        attribute after the move."
  - name: InitialPress
    description: "Indicates that the momentary switch starts to be pressed after debouncing."
    value:
    - name: newPosition
      description: "The value of the [currentPosition][SwitchTrait.Attributes.currentPosition]
        attribute after the press."
  - name: LongPress
    description: "Indicates that the momentary switch has been pressed for a long time."
    value:
    - name: newPosition
      description: "The value of the [currentPosition][SwitchTrait.Attributes.currentPosition]
        attribute after the press."
  - name: ShortRelease
    description: "Indicates that the momentary switch has been released after a short press and
      after debouncing."
    value:
    - name: previousPosition
      description: "The value of the [currentPosition][SwitchTrait.Attributes.currentPosition]
        attribute just prior to the release."
  - name: LongRelease
    description: "Indicates that the momentary switch has been released after a
      [LongPress][SwitchTrait.LongPress] and after debouncing."
    value:
    - name: previousPosition
      description: "The value of the [currentPosition][SwitchTrait.Attributes.currentPosition]
        attribute just prior to the release."
  - name: MultiPressOngoing
    description: "Indicates how many times the momentary switch has been pressed in a multi-press
      sequence."
    value:
    - name: newPosition
      description: "The value of the [currentPosition][SwitchTrait.Attributes.currentPosition]
        attribute after the press."
    - name: currentNumberOfPressesCounted
      description: "Valid values are:
        <ul>
        <li><code>2</code> when the second press of a multi-press sequence has been detected,</li>
        <li><code>3</code> when the third press of a multi-press sequence has been detected,</li>
        <li><code><em>n</em></code> when the <em>n</em>th press of a multi-press sequence has been
          detected.</li>
        </ul>"
  - name: MultiPressComplete
    description: "Indicates how many times the momentary switch has been pressed in a multi-press
      sequence."
    value:
    - name: previousPosition
      description: "The value of the [currentPosition][SwitchTrait.Attributes.currentPosition]
        attribute just prior to the release."
    - name: totalNumberOfPressesCounted
      description: "Valid values are:
        <ul>
        <li><code>1</code> when there was one press, and the sequence has
          ended - in other words, it was not a multiple-press,</li>
        <li><code>2</code> when there were exactly two presses in a multi-press sequence, and the
          sequence has ended,</li>
        <li><code>3</code> when there were exactly three presses in a multi-press sequence, and the
          sequence has ended,</li>
        <li><code><em>n</em></code> when there were exactly <em>n</em> presses in a multi-press
          sequence, and the sequence has ended.</li>
        </ul>"

Talk:
  description: "This trait belongs to any device that supports speaking out loud on a
    third-party device by establishing either a real-time (full-duplex) or
    intercom style (half-duplex) connection between Google and the third-party device."

  # Talk Attributes
  attributes:
  - name: audioCommunicationType
    description: "The type of audio communication system this device uses, either full-duplex
      or half-duplex."
  - name: currentlyInUse
    description: "Indicates if the feature is currently in use with an active open connection."

  # Talk enums
  enums:
  - name: AudioCommunicationType
    description: "Indicates the type of audio communication system this device uses."
    value:
    - name: kFdx
      description: "Real-time two-way communication (full-duplex)."
    - name: kHdx
      description: "Intercom-style conversation with only one speaker at a time (half-duplex)."
    - name: kUnspecified
      description: "Unspecified."

TargetNavigator:
  description: "This trait provides an interface for UX navigation within a set of targets on a
    device or endpoint."

  # TargetNavigator attributes
  attributes:
  - name: targetList
    description: "A list of unique navigable targets within the UX of an endpoint, such as
      a video player or content app."
  - name: currentTarget
    description: "The identifier for the target currently in the foreground on the corresponding
      endpoint."

  # TargetNavigator commands
  commands:
  - name: NavigateTarget
    description:
    - "Navigate the UX to the identified target."
    param:
    - name: target
      description: "The identifier for the navigation target."
    - name: data
      description: "App-specific data."
    response:
      description: "The result of the completed `NavigateTarget` command."
      param:
      - name: status
        description: "The return status of the `NavigateTarget` command. Valid values are listed in
          [StatusEnum][TargetNavigatorTrait.StatusEnum]."
      - name: data
        description: "App-specific data."

  # TargetNavigator enums
  enums:
  - name: StatusEnum
    description: "Target Navigator status."
    value:
    - name: kSuccess
      description: "Command succeeded."
    - name: kTargetNotFound
      description: "Requested target was not found in the
        [targetList][TargetNavigatorTrait.Attributes.targetList]."
    - name: kNotAllowed
      description: "Requested target is not allowed in the current state."

  # TargetNavigator events
  events:
  - name: TargetUpdated
    description: "Generated when there is a change in either the active target or the list of
      available targets or both."
    value:
    - name: targetList
      description: "Indicates the updated target list if there is a change in the list of targets."
    - name: currentTarget
      description: "Indicates the updated target that is in the foreground."
    - name: data
      description: "Contains optional app-specific data."

  # TargetNavigator struct
  structs:
  - name: TargetInfoStruct
    description: "An object describing the navigable target."
    value:
    - name: identifier
      description: "The unique ID within the
        [targetList][TargetNavigatorTrait.Attributes.targetList]."
    - name: name
      description: "The unique name, as a string."

TemperatureControl:
  description: "This trait provides an interface to the setpoint temperature on devices such as
    washers, refrigerators, and water heaters."

  # TemperatureControl attributes
  attributes:
  - name: maxTemperature
    description: "The maximum temperature at which the
      [temperatureSetpoint][TemperatureControlTrait.Attributes.temperatureSetpoint] attribute may
      be set."
  - name: minTemperature
    description: "The minimum temperature at which the
      [temperatureSetpoint][TemperatureControlTrait.Attributes.temperatureSetpoint] attribute may
      be set."
  - name: selectedTemperatureLevel
    description: "The positional index of the setting in the
      [supportedTemperatureLevels][TemperatureControlTrait.Attributes.supportedTemperatureLevels]
      list, representing the currently selected temperature level."
  - name: step
    description: "The discrete value by which the
      [temperatureSetpoint][TemperatureControlTrait.Attributes.temperatureSetpoint] attribute can
      be changed using the
      [SetTemperatureCommand][TemperatureControlTrait.SetTemperatureCommand]."
  - name: supportedTemperatureLevels
    description: "The list of supported temperature level settings that may be selected using the
      [SetTemperatureCommand][TemperatureControlTrait.SetTemperatureCommand]
      `TargetTemperatureLevel` parameter. Each string is specified by the manufacturer, and
      describes a temperature level. For example, a washing machine can have temperature levels like
      \"Cold\", \"Warm\", and \"Hot\"."
  - name: temperatureSetpoint
    description: "The desired temperature setpoint."

  # TemperatureControl commands
  commands:
  - name: SetTemperature
    description:
    - "Set the desired temperature."
    param:
    - name: targetTemperature
      description: "The desired temperature setpoint."
    - name: targetTemperatureLevel
      description: "The desired temperature level, in terms of the index of the setting in the
        [supportedTemperatureLevels][TemperatureControlTrait.Attributes.supportedTemperatureLevels]
        list."

  # TemperatureControl bitmaps
  bitmaps:
  - name: Feature
    description: "TemperatureControl cluster FeatureMap."
    value:
    - name: kTemperatureLevel
      description: "Use actual temperature numbers, in Celsius."
    - name: kTemperatureNumber
      description: "Use vendor-specific temperature levels."
    - name: kTemperatureStep
      description: "Use step control with temperature numbers. This feature is for devices that
        support discrete temperature setpoints that are larger than the temperature resolution
        imposed by the temperature data type."

TemperatureMeasurement:
  description: "This trait provides an interface to temperature measurement capability."

  # TemperatureMeasurement attributes
  attributes:
  - name: maxMeasuredValue
    description: "The maximum value of [measuredValue]
      that can be measured. `null` indicates that the temperature is unknown."
  - name: measuredValue
    description: "The temperature in hundredths of a degree Celsius. `null` indicates that the
      temperature is unknown."
  - name: minMeasuredValue
    description: "The minimum value of [measuredValue] that can be measured. `null` indicates that
      the temperature is unknown."
  - name: tolerance
    description: "The tolerance of the [measuredValue] in hundredths of a degree Celsius."

Thermostat:
  description: "This trait provides an interface to the functionality of a thermostat."

  # Thermostat attributes
  attributes:
  - name: thermostatSuggestions
    description: "This is provisional and is not available for use."
  - name: maxThermostatSuggestions
    description: "This is provisional and is not available for use."
  - name: currentThermostatSuggestion
    description: "This is provisional and is not available for use."
  - name: absMaxCoolSetpointLimit
    description: "The absolute maximum level that the cooling setpoint may
      be set to. This is a limitation imposed by the manufacturer."
  - name: absMaxHeatSetpointLimit
    description: "The absolute maximum level that the heating setpoint may
      be set to. This is a limitation imposed by the manufacturer."
  - name: absMinCoolSetpointLimit
    description: "The absolute minimum level that the cooling setpoint may
      be set to. This is a limitation imposed by the manufacturer."
  - name: absMinHeatSetpointLimit
    description: "The absolute minimum level that the heating setpoint may
      be set to. This is a limitation imposed by the manufacturer."
  - name: ACCapacity
    description: "The capacity of the mini split AC as expressed by
      [ACCapacityformat][ThermostatTrait.Attributes.ACCapacityformat]."
  - name: ACCapacityformat
    description: "The format for [ACCapacity][ThermostatTrait.Attributes.ACCapacity]."
  - name: ACCoilTemperature
    description: "The temperature of the AC coil, as measured locally or remotely (over the
      network)."
  - name: ACCompressorType
    description: "The type of compressor used within the mini split AC."
  - name: ACErrorCode
    description: "This bitmap indicates the type of errors encountered within the mini split AC.
      Error codes are reported with four-byte values. Each bit within the four bytes indicates a
      unique error code. For more details, see the [Matter
      Specification](https://csa-iot.org/developer-resource/specifications-download-request/)."
  - name: ACLouverPosition
    description: "The position of the louver on the AC."
  - name: ACRefrigerantType
    description: "Type of refrigerant used within the mini split AC."
  - name: ACType
    description: "The type of mini split AC in terms of how cooling and heating is accomplished by
      the device."
  - name: activePresetHandle
    description: "The active preset."
  - name: activeScheduleHandle
    description: "The active schedule."
  - name: controlSequenceOfOperation
    description: "The possible system modes that the thermostat can operate in. Valid modes are
      defined by
      [ControlSequenceOfOperationEnum][ThermostatTrait.Attributes.ControlSequenceOfOperationEnum]."
  - name: emergencyHeatDelta
    description: "The delta between the
      [localTemperature][ThermostatTrait.Attributes.localTemperature] attribute and
      [occupiedHeatingSetpoint][ThermostatTrait.Attributes.occupiedHeatingSetpoint] or
      [unoccupiedHeatingSetpoint][ThermostatTrait.Attributes.unoccupiedHeatingSetpoint] at which
      the thermostat server will operate in emergency heat mode. The purpose of this attribute is to
      provide thermostat clients the ability to configure rapid heating when a setpoint is of a
      specified amount greater than the measured temperature. This allows the heated space to be
      quickly heated to the desired level set by the user."
  - name: HvacSystemTypeConfiguration
    description: "The HVAC system type controlled by the thermostat. Each bit represents a type of
      system configuration."
  - name: localTemperature
    description: "The current temperature. The value may be local or remote, depending on the value
      of [RemoteSensing][ThermostatTrait.Attributes.remoteSensing]."
  - name: localTemperatureCalibration
    description: "The offset the thermostat server makes to the measured temperature (locally or
      remotely) to adjust the `localTemperature` attribute prior to using, displaying or reporting
      it. The purpose of this attribute is to adjust the calibration of the thermostat server
      according to the user's preferences (for example, to match if there are multiple servers
      displaying different values for the same HVAC area) or compensate for variability amongst
      temperature sensors."
  - name: maxCoolSetpointLimit
    description: "The maximum level that the cooling setpoint may be set
      to. This allows the user to define setpoint limits more constrictive than the
      manufacturer imposed ones. Limiting users (for example, in a commercial building) to such
      setpoint limits can help conserve power."
  - name: maxHeatSetpointLimit
    description: "The maximum level that the heating setpoint may be set to.
      This allows the user to define setpoint limits more constrictive than the manufacturer imposed
      ones. Limiting users (for example, in a commercial building) to such setpoint limits can help
      conserve power."
  - name: minCoolSetpointLimit
    description: "The minimum level that the cooling setpoint may be set to.
      This allows the user to define setpoint limits more constrictive than the
      manufacturer imposed ones. Limiting users (for example, in a commercial building) to such
      setpoint limits can help conserve power."
  - name: minHeatSetpointLimit
    description: "The minimum level that the heating setpoint may be set to.
      This allows the user to define setpoint limits more constrictive than the manufacturer
      imposed ones. Limiting users (for example, in a commercial building) to such setpoint limits
      can help conserve power."
  - name: minSetpointDeadBand
    description: "On devices which support the auto feature, this specifies the minimum
      difference between the heat setpoint and the cool setpoint."
  - name: numberOfDailyTransitions
    description: "The number of daily schedule transitions the thermostat can handle."
  - name: numberOfWeeklyTransitions
    description: "The number of weekly schedule transitions the thermostat can handle."
  - name: numberOfPresets
    description: "The number of presets the thermostat can handle."
  - name: numberOfScheduleTransitionPerDay
    description: "The number of schedule transitions per day the thermostat can handle."
  - name: numberOfScheduleTransitions
    description: "The number of schedule transitions the thermostat can handle."
  - name: numberOfSchedules
    description: "The number of schedules the thermostat can handle."
  - name: occupancy
    description: "This specifies whether the heated or cooled space is occupied or not, as measured
      locally or remotely (over the network). If bit 0 = `1`, the space is occupied, else it is
      unoccupied. All other bits are reserved."
  - name: occupiedCoolingSetpoint
    description: "The cooling mode setpoint when the room is occupied."
  - name: occupiedHeatingSetpoint
    description: "The heating mode setpoint when the room is occupied."
  - name: occupiedSetback
    description: "The amount that the thermostat will allow the
       [localTemperature][ThermostatTrait.Attributes.localTemperature] attribute to float above
       the [occupiedCoolingSetpoint][ThermostatTrait.Attributes.occupiedCoolingSetpoint] (in other
       words, [occupiedCoolingSetpoint][ThermostatTrait.Attributes.occupiedCoolingSetpoint] +
       `occupiedSetback` ) or below the
       [occupiedHeatingSetpoint][ThermostatTrait.Attributes.occupiedHeatingSetpoint] (in other
       words, [occupiedHeatingSetpoint][ThermostatTrait.Attributes.occupiedHeatingSetpoint] -
       `occupiedSetback` ) before initiating a state change to bring the temperature back to the
       user's desired setpoint. This is sometimes also referred to as the 'span'. The purpose of
       this is to allow remote configuration of the span between the desired setpoint and the
       measured temperature to help prevent over-cycling and reduce energy bills, though this may
       result in lower comfort on the part of some users. A null value indicates the attribute is
       unused."
  - name: occupiedSetbackMax
    description: "The maximum value that the user can set the
       [occupiedSetback][ThermostatTrait.Attributes.occupiedSetback] to.
       A null value indicates the attribute is unused."
  - name: occupiedSetbackMin
    description: "The minimum value that the user can set the
       [occupiedSetback][ThermostatTrait.Attributes.occupiedSetback] to.
       A null value indicates the attribute is unused."
  - name: outdoorTemperature
    description: "The outdoor temperature, as measured locally or remotely
      (over the network)."
  - name: PICoolingDemand
    description: "The level of cooling demanded by the PI (proportional
      integral) control loop in use by the thermostat (if any), in percent. This value is 0 when the
      thermostat is in 'off' or 'heating' mode."
  - name: PIHeatingDemand
    description: "The level of heating demanded by the PI (proportional
      integral) control loop in use by the thermostat (if any), in percent. This value is 0 when the
      thermostat is in 'off' or 'cooling' mode."
  - name: presets
    description: "Setpoint presets."
  - name: presetTypes
    description: "Types of setpoint presets available."
  - name: remoteSensing
    description: "This bitmap indicates when the local temperature, outdoor temperature and
      occupancy are being sensed by remote networked sensors, rather than internal sensors.
      A bit set to 1 indicates remote sensing of the relevant value.
      For more details, see the [Matter
      Specification](https://csa-iot.org/developer-resource/specifications-download-request/)."
  - name: scheduleTypes
    description: "Types of schedule available."
  - name: schedules
    description: "Schedules."
  - name: setpointChangeAmount
    description: "The delta between the current active
      [occupiedCoolingSetpoint][ThermostatTrait.Attributes.occupiedCoolingSetpoint] or
      [occupiedHeatingSetpoint][ThermostatTrait.Attributes.occupiedHeatingSetpoint] and
      the previous active setpoint. A null value indicates that the previous setpoint was
      unknown."
  - name: setpointChangeSource
    description: "The source of the current active
      [occupiedCoolingSetpoint][ThermostatTrait.Attributes.occupiedCoolingSetpoint] or
      [occupiedHeatingSetpoint][ThermostatTrait.Attributes.occupiedHeatingSetpoint]
      (in other words, who or what determined the current setpoint).
      This enables service providers to determine whether changes to setpoints were
      initiated due to occupant comfort, scheduled programming, or some other source, such as an
      electric utility or service provider. Because automation services may initiate frequent
      setpoint changes, this attribute clearly differentiates the source of setpoint changes made at
      the thermostat."
  - name: setpointChangeSourceTimestamp
    description: "The UTC time at which the
      [setpointChangeSource][ThermostatTrait.Attributes.setpointChangeSource] change
      was recorded."
  - name: setpointHoldExpiryTimestamp
    description: "The UTC time at which the [setpointHold][ThermostatTrait.Attributes.setpointHold]
      expires."
  - name: startOfWeek
    description: "The day of the week that this thermostat considers to be the start of week for
      weekly setpoint scheduling."
  - name: systemMode
    description: "The current operating mode of the thermostat. Valid values are defined by
      [SystemModeEnum][ThermostatTrait.Attributes.SystemModeEnum]."
  - name: temperatureSetpointHold
    description: "The temperature hold status on the thermostat."
  - name: temperatureSetpointHoldDuration
    description: "This sets the period in minutes for which a setpoint hold is active. A
      null value indicates the field is unused. All other values are reserved."
  - name: thermostatProgrammingOperationMode
    description: "The operational state of the thermostat's programming.
      For complete details, see the [Matter
      Specification](https://csa-iot.org/developer-resource/specifications-download-request/)."
  - name: thermostatRunningMode
    description: "The running mode of the thermostat. This attribute uses
      the [ThermostatRunningModeEnum][ThermostatTrait.Attributes.ThermostatRunningModeEnum] values.
      This attribute is intended to provide additional information when the thermostat is in auto
      mode."
  - name: thermostatRunningState
    description: "The current relay state of the heat, cool, and fan relays."
  - name: unoccupiedCoolingSetpoint
    description: "The cooling mode setpoint when the room is unoccupied."
  - name: unoccupiedHeatingSetpoint
    description: "The heating mode setpoint when the room is unoccupied."
  - name: unoccupiedSetback
    description: "The amount that the thermostat server will allow the
      [localTemperature][ThermostatTrait.Attributes.localTemperature] attribute to float above the
      [unoccupiedCoolingSetback][ThermostatTrait.Attributes.unoccupiedCoolingSetback] setpoint (in
      other words, [unoccupiedCoolingSetback][ThermostatTrait.Attributes.unoccupiedCoolingSetback]
      + [unoccupiedSetback][ThermostatTrait.Attributes.unoccupiedSetback] ) or below the
      [unoccupiedHeatingSetback][ThermostatTrait.Attributes.unoccupiedHeatingSetback] setpoint (in
      other words, [unoccupiedHeatingSetback][ThermostatTrait.Attributes.unoccupiedHeatingSetback]
      - [unoccupiedSetback][ThermostatTrait.Attributes.unoccupiedSetback] ) before initiating a
      state change to bring the temperature back to the user's desired setpoint. This attribute is
      sometimes also referred to as the 'span'. The purpose of this attribute is to allow remote
      configuration of the span between the desired setpoint and the measured temperature to help
      prevent over-cycling and reduce energy bills, though this may result in lower comfort on the
      part of some users. A null value indicates the attribute is unused."
  - name: unoccupiedSetbackMax
    description: "The maximum value that the user can set the
      [unoccupiedSetback][ThermostatTrait.Attributes.unoccupiedSetback] to.
      A null value indicates the attribute is unused."
  - name: unoccupiedSetbackMin
    description: "The minimum value that the user can set the
      [unoccupiedSetback][ThermostatTrait.Attributes.unoccupiedSetback] to.
      A null value indicates the attribute is unused."

  # Thermostat commands
  commands:
  - name: AddThermostatSuggestion
    description:
    - "This command is provisional and is not available for use."
  - name: AtomicRequest
    description:
    - "Begin, commit, or cancel an atomic write."
    param:
    - name: requestType
      description: "The type of atomic request being made by the client."
    - name: attributeRequests
      description: "A list of attribute IDs the client wishes to write to during an atomic request."
    - name: timeout
      description: "An interval in milliseconds in which the client will either commit
         or rollback the atomic write. "
    response:
      description: "The result of the atomic request."
      param:
      - name: statusCode
        description: "The status of the atomic write."
      - name: attributeStatus
        description: "A list of statuses for the attributes involved in the atomic write. This list
          contain a status for each of the attribute IDs provided in the `AtomicRequest` command."
      - name: timeout
        description: "A timeout provided by the server."
  - name: ClearWeeklySchedule
    description:
    - "This method is deprecated in the Matter specification and is not supported."
  - name: GetRelayStatusLog
    description:
    - "This method is deprecated in the Matter specification and is not supported."
  - name: GetWeeklySchedule
    description:
    - "This method is deprecated in the Matter specification and is not supported."
    param:
    - name: daysToReturn
      description: "The number of days the client would like to return the set point values for. It
        can be any combination of single days or the entire week."
    - name: modeToReturn
      description: "Indicates the mode the client would like to return the set point values for. It
        can be any combination of modes."
    response:
      description: "The weekly schedule, with the same payload as
        [setWeeklySchedule][Thermostat.setWeeklySchedule]."
      param:
      - name: numberOfTransitionsForSequence
        description: "The number of individual transitions to expect for this sequence of commands."
      - name: dayOfWeekForSequence
        description: "The day(s) of the week to which all the transitions within the payload of the
          command should be associated. The bitmap values conform to those defined in
          [ScheduleDayOfWeekBitmap][ThermostatTrait.ScheduleDayOfWeekBitmap]."
      - name: modeForSequence
        description: "How the app decodes the `coolSetpoint` and
        `heatSetpoint` fields of each transition. The bitmap values confirm to those defined in
        [ScheduleModeBitmap][ThermostatTrait.ScheduleModeBitmap]."
      - name: transitions
        description: "The list of setpoint transitions used to update the specified daily schedules.
          Each setpoint transition is represented by a
          [WeeklyScheduleTransitionStruct][ThermostatTrait.WeeklyScheduleTransitionStruct]."
  - name: RemoveThermostatSuggestion
    description:
    - "This command is provisional and is not available for use."
  - name: SetActiveSchedule
    description:
    - "Set the active schedule."
    param:
    - name: scheduleHandle
      description: "The handle of the schedule to be made active."
  - name: SetActivePreset
    description:
    - "Set the active preset."
    param:
    - name: presetHandle
      description: "The handle of the preset to be made active."
  - name: SetpointRaiseLower
    description:
    - "Change the setpoint for the current thermostat mode."
    param:
    - name: mode
      description: "The setpoint(s) to be adjusted.
        Valid values are defined by
        [SetpointRaiseLowerModeEnum][ThermostatTrait.SetpointRaiseLowerModeEnum]."
    - name: amount
      description: "The amount (possibly negative) that should be added to the setpoint(s), in steps
        of 0.1°C."
  - name: SetWeeklySchedule
    description:
    - "This method is deprecated in the Matter specification and is not supported."
    param:
    - name: numberOfTransitionsForSequence
      description: "The number of individual transitions to expect for this sequence of commands."
    - name: dayOfWeekForSequence
      description: "The day(s) of the week to which all the transitions within the payload
         of the command should be associated. The bitmap values conform to those defined in
         [ScheduleDayOfWeekBitmap][ThermostatTrait.ScheduleDayOfWeekBitmap]."
    - name: modeForSequence
      description: "How the app decodes the `coolSetpoint` and
        `heatSetpoint` fields of each transition. The bitmap values confirm to those defined in
        [ScheduleModeBitmap][ThermostatTrait.ScheduleModeBitmap]."
    - name: transitions
      description: "The list of setpoint transitions used to update the specified daily schedules.
       Each setpoint transition is represented by a
       [WeeklyScheduleTransitionStruct][ThermostatTrait.WeeklyScheduleTransitionStruct]."

