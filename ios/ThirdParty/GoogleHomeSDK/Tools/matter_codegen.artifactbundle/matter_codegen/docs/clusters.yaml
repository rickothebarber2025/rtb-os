AccountLogin:
  description: "This trait provides commands to facilitate user account login on a content app or a
    node."

  # AccountLogin commands
  commands:
  - name: GetSetupPin
    description:
    - "Determine if the active user account of the given content app matches the active user account
       of the given commissionee, and if it does, return a setup PIN which can be used to establish
       a password-authenticated session with the commissionee."
    param:
    - name: tempAccountIdentifier
      description: "The client's temporary account identifier."
    response:
      description: "Contains the setup PIN."
      param:
      - name: setupPin
        description: "The setup PIN, or null if the content app user account doesn't match the
          commissionee user account."
  - name: Login
    description:
    - "Allow the content app to assume the user account of the given commissionee by leveraging the
       setup PIN input by the user during the commissioning process."
    param:
    - name: tempAccountIdentifier
      description: "The client's temporary account identifier."
    - name: setupPin
      description: "The setup PIN."
    - name: node
      description: "The client's node ID."
  - name: Logout
    description:
    - "Instruct the content app to clear the current user account and end the user session."
    param:
    - name: node
      description: "The client's node ID."

  # AccountLogin events
  events:
  - name: LoggedOut
    description: "Indicates that the current user account has logged out of the content app."
    value:
    - name: node
      description: "The node ID of the user account that was logged out, if that node ID is
        available."
    - name: fabricIndex
      description: "The fabric index associated with this event."

Actions:
  description: "This trait provides a standardized way for a node to expose information about
    logical grouping of endpoints on the node, expose information about named actions that can be
    performed on a group of endpoints, expose commands to trigger such actions, and expose events
    to receive feedback on the state of such actions."

  # Actions attributes
  attributes:
  - name: endpointLists
    description: "A list of endpoint list IDs."
  - name: setupUrl
    description: "A URL referencing a location that provides information about the capabilities
      provided by the cluster. This URL follows the syntax specified in RFC 3986, with a maximum
      length of 512 ASCII characters."

  # Actions commands
  commands:
  - name: DisableAction
    description:
    - "Disable an action."
    param:
    - name: actionId
      description: "The action identifier."
    - name: invokeId
      description: "The `invokeId` to be provided in the `StateChanged` event when the action
        changes to a new state, or an `ActionFailed` event when execution of the action fails.
        The client is responsible for providing this value when invoking the command. It may be
        used by the client to correlate an event to the command."
  - name: DisableActionWithDuration
    description:
    - "Disable an action for a specified amount of time, then enable it."
    param:
    - name: actionId
      description: "The action identifier."
    - name: duration
      description: "The requested duration in seconds."
    - name: invokeId
      description: "The `invokeId` to be provided in the `StateChanged` event when the action
        changes to a new state, or an `ActionFailed` event when execution of the action fails.
        The client is responsible for providing this value when invoking the command. It may be
        used by the client to correlate an event to the command."
  - name: EnableAction
    description:
    - "Enable an action."
    param:
    - name: actionId
      description: "The action identifier."
    - name: invokeId
      description: "The `invokeId` to be provided in the `StateChanged` event when the action
        changes to a new state, or an `ActionFailed` event when execution of the action fails.
        The client is responsible for providing this value when invoking the command. It may be
        used by the client to correlate an event to the command."
  - name: EnableActionWithDuration
    description:
    - "Enable an action for a specified amount of time, then disable it."
    param:
    - name: actionId
      description: "The action identifier."
    - name: duration
      description: "The requested duration in seconds."
    - name: invokeId
      description: "The `invokeId` to be provided in the `StateChanged` event when the action
        changes to a new state, or an `ActionFailed` event when execution of the action fails.
        The client is responsible for providing this value when invoking the command. It may be
        used by the client to correlate an event to the command."
  - name: InstantAction
    description:
    - "Trigger an action (state change) on endpoints in an asynchronous manner."
    param:
    - name: actionId
      description: "The action identifier."
    - name: invokeId
      description: "The `invokeId` to be provided in the `StateChanged` event when the action
        changes to a new state, or an `ActionFailed` event when execution of the action fails.
        The client is responsible for providing this value when invoking the command. It may be
        used by the client to correlate an event to the command."
  - name: InstantActionWithTransition
    description:
    - "Trigger an action (state change) on endpoints, specifying how long the state change should
       take."
    param:
    - name: actionId
      description: "The action identifier."
    - name: invokeId
      description: "The `invokeId` to be provided in the `StateChanged` event when the action
        changes to a new state, or an `ActionFailed` event when execution of the action fails.
        The client is responsible for providing this value when invoking the command. It may be
        used by the client to correlate an event to the command."
    - name: transitionTime
      description: "The transition time (in 0.1 seconds)."
  - name: PauseAction
    description:
    - "Pause an ongoing action."
    param:
    - name: actionId
      description: "The action identifier."
    - name: invokeId
      description: "The `invokeId` to be provided in the `StateChanged` event when the action
        changes to a new state, or an `ActionFailed` event when execution of the action fails.
        The client is responsible for providing this value when invoking the command. It may be
        used by the client to correlate an event to the command."
  - name: PauseActionWithDuration
    description:
    - "Pause an ongoing action for a specified amount of time, after which it resumes."
    param:
    - name: actionId
      description: "The action identifier."
    - name: duration
      description: "The requested duration in seconds."
    - name: invokeId
      description: "The `invokeId` to be provided in the `StateChanged` event when the action
        changes to a new state, or an `ActionFailed` event when execution of the action fails.
        The client is responsible for providing this value when invoking the command. It may be
        used by the client to correlate an event to the command."
  - name: ResumeAction
    description:
    - "Resume a paused action."
    param:
    - name: actionId
      description: "The action identifier."
    - name: invokeId
      description: "The `invokeId` to be provided in the `StateChanged` event when the action
        changes to a new state, or an `ActionFailed` event when execution of the action fails.
        The client is responsible for providing this value when invoking the command. It may be
        used by the client to correlate an event to the command."
  - name: StartAction
    description:
    - "Start an action."
    param:
    - name: actionId
      description: "The action identifier."
    - name: invokeId
      description: "The `invokeId` to be provided in the `StateChanged` event when the action
        changes to a new state, or an `ActionFailed` event when execution of the action fails.
        The client is responsible for providing this value when invoking the command. It may be
        used by the client to correlate an event to the command."
  - name: StartActionWithDuration
    description:
    - "Start an action, allow it to run for a specified amount of time, after which it stops."
    param:
    - name: actionId
      description: "The action identifier."
    - name: duration
      description: "The requested duration in seconds."
    - name: invokeId
      description: "The `invokeId` to be provided in the `StateChanged` event when the action
        changes to a new state, or an `ActionFailed` event when execution of the action fails.
        The client is responsible for providing this value when invoking the command. It may be
        used by the client to correlate an event to the command."
  - name: StopAction
    description:
    - "Stop the ongoing action."
    param:
    - name: actionId
      description: "The action identifier."
    - name: invokeId
      description: "The `invokeId` to be provided in the `StateChanged` event when the action
        changes to a new state, or an `ActionFailed` event when execution of the action fails.
        The client is responsible for providing this value when invoking the command. It may be
        used by the client to correlate an event to the command."

  # Actions bitmaps
  bitmaps:
  - name: CommandBits
    description: "Bitmap indicating which commands are supported."
    value:
    - name: kDisableAction
      description: "Supports the [DisableActionCommand][ActionsTrait.DisableActionCommand]."
    - name: kDisableActionWithDuration
      description: "Supports the
        [DisableActionWithDurationCommand][ActionsTrait.DisableActionWithDurationCommand]."
    - name: kEnableAction
      description: "Supports the [EnableActionCommand][ActionsTrait.EnableActionCommand]."
    - name: kEnableActionWithDuration
      description: "Supports the
        [EnableActionWithDurationCommand][ActionsTrait.EnableActionWithDurationCommand]."
    - name: kInstantAction
      description: "Supports the [InstantActionCommand][ActionsTrait.InstantActionCommand]."
    - name: kInstantActionWithTransition
      description: "Supports the
        [InstantActionWithTransitionCommand][ActionsTrait.InstantActionWithTransitionCommand]."
    - name: kPauseAction
      description: "Supports the [PauseActionCommand][ActionsTrait.PauseActionCommand]."
    - name: kPauseActionWithDuration
      description: "Supports the
        [PauseActionWithDurationCommand][ActionsTrait.PauseActionWithDurationCommand]."
    - name: kResumeAction
      description: "Supports the [ResumeActionCommand][ActionsTrait.ResumeActionCommand]."
    - name: kStartAction
      description: "Supports the [StartActionCommand][ActionsTrait.StartActionCommand]."
    - name: kStartActionWithDuration
      description: "Supports the
        [StartActionWithDurationCommand][ActionsTrait.StartActionWithDurationCommand]."
    - name: kStopAction
      description: "Supports the [StopActionCommand][ActionsTrait.StopActionCommand]."

  # Actions enums
  enums:
  - name: ActionErrorEnum
    description: "Error types."
    value:
    - name: kInterrupted
      description: "The action was interrupted by another command or interaction."
    - name: kUnknown
      description: "The action was interrupted for an unknown reason."
  - name: ActionStateEnum
    description: "Action state."
    value:
    - name: kActive
      description: "The action is active."
    - name: kDisabled
      description: "The action is disabled."
    - name: kInactive
      description: "The action is inactive."
    - name: kPaused
      description: "The action is paused."
  - name: ActionTypeEnum
    description: "Action types."
    value:
    - name: kAlarm
      description: "Higher priority notification."
    - name: kAutomation
      description: "Control an automation (for example, motion-activated lights)."
    - name: kException
      description: "A sequence of commands that runs when the expected does not happen."
    - name: kNotification
      description: "Send a message to the user."
    - name: kOther
      description: "Use this only when none of the other values applies."
    - name: kScene
      description: "Set the endpoints to a predetermined state."
    - name: kSequence
      description: "A sequence of states with a specific time pattern."
  - name: EndpointListTypeEnum
    description: "Type of endpoint list."
    value:
    - name: kOther
      description: "An unspecified type of endpoint group."
    - name: kRoom
      description: "User-configured group of endpoints where each endpoint can be in only one room."
    - name: kZone
      description: "User-configured group of endpoints where an endpoint can be in any number of
        zones."

  # Actions structs
  structs:
  - name: ActionStruct
    description: "The details of a single action."
    value:
    - name: actionId
      description: "A unique identifier used to identify an action."
    - name: endpointListId
      description: "A reference to the associated endpoint list, which specifies the endpoints on
        this node which will be impacted by this `actionId`."
    - name: name
      description: "The name as assigned by the user or automatically by the server associated
        with this action."
    - name: state
      description: "The current state of this action."
    - name: supportedCommands
      description: "A bitmap indicating which of the cluster's commands are supported for this
        particular action."
    - name: type
      description: "The type of endpoint list."
  - name: EndpointListStruct
    description: "The details of a single endpoint list, a set of endpoints that have some logical
      relation."
    value:
    - name: endpointListId
      description: "A unique identifier for the endpoint list."
    - name: endpoints
      description: "A list of endpoint numbers."
    - name: name
      description: "The name, as assigned by the user or automatically by the server,
        associated with the set of endpoints in this list. This can be used for identifying the
        action to the user by the client. For example, \"living room\"."
    - name: type
      description: "The type of endpoint list."

  # Actions events
  events:
  - name: ActionFailed
    description: "Indicates that the action failed to complete as intended."
    value:
    - name: actionId
      description: "The `actionId` of the action which has changed state."
    - name: invokeId
      description: "The `invokeId` which was provided to the
        most recent command referencing this `actionId`."
    - name: error
      description: "The reason for the action's failure."
    - name: newState
      description: "The state that the action was in at the time of the event."
  - name: StateChanged
    description: "The state of an action changed during execution of a command, and the most recent
      command using the `actionId` populated the `invokeId` attribute."
    value:
    - name: actionId
      description: "The `actionId` of the action which has
        changed state."
    - name: invokeId
      description: "The `invokeId` which was provided to the
        most recent command referencing this `actionId`."
    - name: newState
      description: "The state that the action has changed to."

ActivatedCarbonFilterMonitoring:
  description: "This trait provides an interface for the current condition of an activated carbon
    filter."

  # ActivatedCarbonFilterMonitoring attributes
  attributes:
  - name: condition
    description: "The current condition of the resource in percent."
  - name: degradationDirection
    description: "The direction of change for the condition of the filter over time."
  - name: changeIndication
    description: "The current status of the requirement to change the filter. Valid values are
      defined in
      [ChangeIndicationEnum][ActivatedCarbonFilterMonitoringTrait.ChangeIndicationEnum]."
  - name: inPlaceIndicator
    description: "Indicates if a filter is currently installed."
  - name: lastChangedTime
    description: "The time the filter was last changed."
  - name: replacementProductList
    description: "The list of supported replacement filters. Valid values are
      defined in
      [ReplacementProductStruct][ActivatedCarbonFilterMonitoringTrait.ReplacementProductStruct]."

  # ActivatedCarbonFilterMonitoring commands
  commands:
  - name: ResetCondition
    description:
    - "Reset the [condition][ActivatedCarbonFilterMonitoringTrait.Attributes.condition] and
        [changeIndication][ActivatedCarbonFilterMonitoringTrait.Attributes.changeIndication]
        attributes to indicate full resource availability."

  # ActivatedCarbonFilterMonitoring bitmaps
  bitmaps:
  - name: Feature
    description: "ActivatedCarbonFilterMonitoring cluster FeatureMap."
    value:
    - name: kCondition
      description: "Supports monitoring the condition of the activated carbon filter in percentage."
    - name: kWarning
      description: "Supports a warning indication."
    - name: kReplacementProductList
      description: "Supports specifying the list of replacement products."

  # ActivatedCarbonFilterMonitoring enums
  enums:
  - name: ChangeIndicationEnum
    description: "The condition of the activated carbon filter."
    value:
    - name: kOK
      description: "The activated carbon filter is in good condition."
    - name: kWarning
      description: "The activated carbon filter will need replacing soon."
    - name: kCritical
      description: "The activated carbon filter needs replacement."
  - name: DegradationDirectionEnum
    description: "The direction in which the condition of the activated carbon filter changes over
      time."
    value:
    - name: kUp
      description: "The condition is indicated by an increasing value."
    - name: kDown
      description: "The condition is indicated by a decreasing value."
  - name: ProductIdentifierTypeEnum
    description: "The type of identifier used to describe the product."
    value:
    - name: kUPC
      description: "Uses a 12-digit Universal Product Code."
    - name: kGTIN8
      description: "Uses a 8-digit Global Trade Item Number."
    - name: kEAN
      description: "Uses a 13-digit European Article Number."
    - name: kGTIN14
      description: "Uses a 14-digit Global Trade Item Number."
    - name: kOEM
      description: "Uses a Original Equipment Manufacturer part number."

  # ActivatedCarbonFilterMonitoring structs
  structs:
  - name: ReplacementProductStruct
    description: "The details of a replacement activated carbon filter."
    value:
    - name: productIdentifierType
      description: "The type of product identification. Valid values are defined in
        [ProductIdentifierTypeEnum]."
    - name: productIdentifierValue
      description: "A unique identifier used to identify a replacement product."

AirQuality:
  description: "This trait provides an interface to air quality classification using distinct
    levels."

  # AirQuality attributes
  attributes:
  - name: airQuality
    description: "The currently measured air quality. Valid values are defined in
      [AirQualityEnum][AirQualityTrait.AirQualityEnum]."

  # AirQuality bitmaps
  bitmaps:
  - name: Feature
    description: "AirQuality cluster FeatureMap."
    value:
    - name: kFair
      description: "Fair air quality level is supported."
    - name: kModerate
      description: "Moderate air quality level is supported."
    - name: kVeryPoor
      description: "Very poor air quality level is supported."
    - name: kExtremelyPoor
      description: "Extremely poor air quality level is supported."

  # AirQuality enums
  enums:
  - name: AirQualityEnum
    description: "The quality of the analyzed air."
    value:
    - name: kUnknown
      description: "The air quality is unknown."
    - name: kGood
      description: "The air quality is good."
    - name: kFair
      description: "The air quality is fair."
    - name: kModerate
      description: "The air quality is moderate."
    - name: kPoor
      description: "The air quality is poor."
    - name: kVeryPoor
      description: "The air quality is very poor."
    - name: kExtremelyPoor
      description: "The air quality is extremely poor."

ApplicationBasic:
  description: "This trait provides information about a content app running on a video player
    device."

  # ApplicationBasic attributes
  attributes:
  - name: allowedVendorList
    description: "The list of allowed Vendor IDs."
  - name: application
    description: "The ID of the content app."
  - name: applicationName
    description: "The name of the content app."
  - name: applicationVersion
    description: "The content app version."
  - name: productId
    description: "The numeric ID for the content app."
  - name: status
    description: "The app status. Valid values are defined in
      [ApplicationStatusEnum][ApplicationBasicTrait.ApplicationStatusEnum]."
  - name: vendorId
    description: "The Vendor ID of the content app."
  - name: vendorName
    description: "The name of the vendor of the content app."

  # ApplicationBasic enums
  enums:
  - name: ApplicationStatusEnum
    description: "Application statuses."
    value:
    - name: kStopped
      description: "Application is not running."
    - name: kActiveHidden
      description: "Application is running but is not visible."
    - name: kActiveVisibleFocus
      description: "Application is running, is visible, and is the active target for input."
    - name: kActiveVisibleNotFocus
      description: "Application is running and visible, but is not the active target for input."

  # ApplicationBasic structs
  structs:
  - name: ApplicationStruct
    description: "A global identifier for an app."
    value:
    - name: applicationId
      description: "The unique app identifier, expressed as a string."
    - name: catalogVendorId
      description: "The Vendor ID."

ApplicationLauncher:
  description: "This trait provides an interface to launch apps."

  # ApplicationLauncher attributes
  attributes:
  - name: catalogList
    description: "The list of supported app catalogs, where each entry in the list is the
      Vendor ID for the catalog."
  - name: currentApp
    description: "The ID of the current in-focus app."

  # ApplicationLauncher commands
  commands:
  - name: HideApp
    description:
    - "Hide the specified app."
    param:
    - name: application
      description: "The app to be hidden."
    response:
      description: "The outcome of the `HideApp` command."
      param:
      - name: data
        description: "App-specific data."
      - name: status
        description: "The status of the `HideApp` command."
  - name: LaunchApp
    description:
      - "Launches an app."
    param:
    - name: application
      description: "The app to launch."
    - name: data
      description: "Data to be passed to the app upon launch."
    response:
      description: "The result of the completed `LaunchApp` command."
      param:
      - name: data
        description: "App-specific data."
      - name: status
        description: "The status of the `LaunchApp` command."
  - name: StopApp
    description:
      - "Stop the app."
    param:
    - name: application
      description: "The app to be stopped."
    response:
      description: "The result of the completed `StopApp` command."
      param:
      - name: data
        description: "App-specific data."
      - name: status
        description: "The status of the `StopApp` command."

  # ApplicationLauncher enums
  enums:
  - name: StatusEnum
    description: "ApplicationLauncher statuses."
    value:
    - name: kAppNotAvailable
      description: "The requested app is not available."
    - name: kSuccess
      description: "The command succeeded."
    - name: kSystemBusy
      description: "The video platform is unable to honor the command."
    - name: kPendingUserApproval
      description: "User approval for app download is pending."
    - name: kDownloading
      description: "Downloading the requested app."
    - name: kInstalling
      description: "Installing the requested app."

  # ApplicationLauncher bitmaps
  bitmaps:
  - name: Feature
    description: "ApplicationLauncher cluster FeatureMap."
    value:
    - name: kApplicationPlatform
      description: "Support for attributes and commands required for endpoint to support launching
        any application within the supported application catalogs."

  # ApplicationLauncher structs
  structs:
  - name: ApplicationEPStruct
    description: "An app along with its corresponding endpoint."
    value:
    - name: application
      description: "The app ID."
    - name: endpoint
      description: "The endpoint."
  - name: ApplicationStruct
    description: "An app."
    value:
    - name: applicationId
      description: "The app ID."
    - name: catalogVendorId
      description: "The Vendor ID for the catalog."

ArmDisarm:
  description: "This trait supports arming and disarming, as used in security systems."

  # ArmDisarm attributes
  attributes:
  - name: armState
    description: "Current arm state of the device."
  - name: availableArmLevels
    description: "The supported security levels of the device."
  - name: currentArmLevel
    description: "The current security level."
  - name: entryAllowanceEndTimeSeconds
    description: "The Epoch Unix timestamp of when an active entry allowance expires,
      before which the user must enter a pin to prevent the alarm from sounding.
      The timestamp is a long integer, such as `1710825433`. Once the exact time represented
      by the timestamp has been reached, the alarm sounds. In the meantime, the device provides a
      time countdown to the user."
  - name: exitAllowanceEndTimeSeconds
    description: "The Epoch Unix timestamp of when an active exit allowance expires,
      before which the user must leave the house if the device is arming.
      The timestamp is a long integer, such as `1710825433`. Once the exact time represented
      by the timestamp has been reached, the alarm sounds. The user may cancel arming
      or disarming while this countdown is active."
  - name: exitAllowanceSeconds
    description: "Number of seconds before the
      [currentArmLevel][ArmDisarmTrait.Attributes.currentArmLevel] takes effect."
  - name: isArmed
    description: " Indicates if the device is currently armed."
  - name: targetArmLevel
    description: "The level
      from [availableArmLevels][ArmDisarmTrait.Attributes.availableArmLevels]
      that the device will enter after an exit countdown completes."

  # ArmDisarm commands
  commands:
  - name: ArmDisarm
    description:
    - "Sets the alarm level of the device."
    param:
    - name: arm
      description: "Starts the arming or disarming operation."
    - name: armLevel
      description: "The name of the arm level to use."
    - name: cancel
      description: "Whether to cancel an ongoing arming or disarming operation."

  # ArmDisarm enums
  enums:
  - name: ArmState
    description: "The current arm state of the device."
    value:
    - name: kAlarm
      description: "The device is in the alarm state."
    - name: kArmed
      description: "The device is in the armed state."
    - name: kDisarmed
      description: "This device is in the disarmed state."
    - name: kPreAlarm
      description: "The device is in the pre-alarm state."
    - name: kUnspecified
      description: "The arm state is unspecified."
    - name: kExitCountdown
      description: "Number of seconds before the device enters the specified arm level."
  - name: ErrorCode
    description: "The error encountered when processing the `ArmDisarm` command."
    value:
    - name: kDeviceMoved
      description: "The device has been moved."
    - name: kDeviceTampered
      description: "There are indications that tampering of the device has occurred."
    - name: kDeviceUnplugged
      description: "The device is unplugged."
    - name: kDoorOpen
      description: "The device has detected an open door."
    - name: kIsOpen
      description: "The device sensor detects that something is open, but it cannot detect whether
        it is a door or window that is open."
    - name: kMotionDetected
      description: "The device has detected motion."
    - name: kUnspecified
      description: "An unspecified error has occurred."
    - name: kWindowOpen
      description: "The device has detected an open window."
  - name: LevelCategory
    description: "The security-level category, which influences how the level is displayed on
      devices with screens."
    value:
    - name: kAway
      description: "Away."
    - name: kCustom
      description: "Custom."
    - name: kInstant
      description: "Instant."
    - name: kNight
      description: "Night."
    - name: kStay
      description: "Stay."
    - name: kUnknown
      description: "Unknown."
  - name: StatusEnum
    description: "The result status of the `ArmDisarm` command."
    value:
    - name: kFailure
      description: "The command failed."
    - name: kSuccess
      description: "The command succeeded."
    - name: kUnspecified
      description: "The result of the command is not provided."

  # ArmDisarm events
  events:
  - name: ArmDisarmArmState
    description: "Proactive notification when the device enters a specific arm state."
    value:
    - name: armState
      description: "The current arm state of the device."
    - name: currentArmLevel
      description: "The level name of the current security level if multiple security levels exist."
    - name: entryAllowanceEndTimeSeconds
      description: "The Epoch Unix timestamp of when an active entry allowance expires,
        before which the user must enter a pin to prevent the alarm from sounding.
        The timestamp is a long integer, such as `1710825433`. Once the exact time
        represented by the timestamp has been reached, the alarm sounds. In the meantime,
        the device provides a time countdown to the user."
    - name: exitAllowanceEndTimeSeconds
      description: "The Epoch Unix timestamp of when an active exit allowance expires,
        before which the user must leave the house if the device is arming.
        The timestamp is a long integer, such as `1710825433`. Once the exact time
        represented by the timestamp has been reached, the alarm sounds. The user may
        cancel arming or disarming while this countdown is active."
    - name: priority
      description: "The notification level. The currently supported value is 0,
        which indicates that the notification should be spoken aloud."
    - name: targetArmLevel
      description: "The level
        from [availableArmLevels][ArmDisarmTrait.Attributes.availableArmLevels]
        that the device will enter after an exit countdown completes."
    - name: triggeredDeviceId
      description: "The ID of the device that triggered the event, which may be different
        from the device that sent the notification."
    - name: errorCode
      description: "The status of the device that triggered the event."
  - name: ArmDisarmFollowUp
    description: "Follow up response to the [armDisarm][ArmDisarmCommands.armDisarm]
      command."
    value:
    - name: status
      description: "The result status of the command."
    - name: armState
      description: "Indicates the arm state of the device: either `Armed` or `Disarmed`."
    - name: errorCode
      description: "The error encountered when processing the [armDisarm][ArmDisarm.armDisarm]
        command."

  # ArmDisarm structs
  structs:
  - name: AvailableArmLevels
    description: "The supported security levels of the device. If this attribute is not
      reported, the device supports only one level."
    value:
    - name: levels
      description: "The available security levels supported by the device."
    - name: ordered
      description: "If set to `true`, additional grammar for increase or decrease logic applies,
        in the order of the levels array. If this value is set to `false`, additional grammar for
        increase or decrease logic is not supported."
  - name: Levels
    description: "Information about security-level names."
    value:
    - name: level
      description: "The internal name of the security level that is used in commands and
        states. This name can be non user friendly and is shared across all languages."
    - name: levelValues
      description: "Repeated sets of synonyms for a specific langauage."
    - name: levelCategory
      description: "The security-level category."
    - name: exitAllowanceSeconds
      description: "Number of seconds before the
        [currentArmLevel][ArmDisarmTrait.Attributes.currentArmLevel] takes effect."
  - name: LevelValues
    description: "Contains a user-friendly name for the levels as well as the language code."
    value:
    - name: levelSynonym
      description: "User-friendly names for the level in each supported language. These names
         should be in sentence case and avoid words such as `arm` and `armed`. The first string
         in this list is used as the default name of the level and is
         displayed on devices with screens."
    - name: languageCode
      description: "Language code for the synonym of the corresponding level."

Assistant:
  description: "This trait supports devices that represent an Assistant surface."

  # Assistant attributes
  attributes:
  - name: truncatedLocalNetworkId
    description: "The truncated local network ID."
  - name: onDemandAssistantDiscoverability
    description: "If [activateAssistantDiscoverability][Assistant.activateAssistantDiscoverability]
      is available for use from Assistant setup."
  - name: needsAssistantUnlink
    description: "If this device needs extra handling for unlinking the Assistant."

  # Assistant commands
  commands:
  - name: ActivateAssistantDiscoverability
    description:
    - "Activate Assistant discoverability."
    response:
      description: "Extra handling required for unlinking the Assistant and removing credentials
        from the device."

AudioInput:
  description: "This trait supports devices that can gather audio (for example, has a microphone)."

  # AudioInput attributes
  attributes:
  - name: audioInputQuality
    description: "Quality of the audio input the device supports."
  - name: audioInputEnvironment
    description: "User's environment and the type of information that should be shared."

  # AudioInput enums
  enums:
  - name: AudioInputQuality
    description: "The current audio input quality of the device."
    value:
    - name: kUnspecified
      description: "The input quality is unspecified."
    - name: kVoiceQuality
      description: "Supports voice quality."
    - name: kMusicQuality
      description: "Supports music quality."
  - name: AudioInputEnvironment
    description: "The user's audio input environment of the device."
    value:
    - name: kUnspecified
      description: "The user's audio environment is unspecified."
    - name: kSurroundingUsers
      description: "The user's audio environment includes surrounding users."
    - name: kAuthenticatedUserOnly
      description: "The user's audio environment requires privacy."

AudioOutput:
  description: "This trait provides an interface for controlling the output on a video player device
    such as a TV."

  # AudioOutput attributes
  attributes:
  - name: currentOutput
    description: "The index of the currently-selected output."
  - name: outputList
    description: "The outputs supported by the device."

  # AudioOutput commands
  commands:
  - name: RenameOutput
    description:
    - "Rename the specified output."
    param:
    - name: index
      description: "The index of the output to rename."
    - name: name
      description: "The new name of the specified output."
  - name: SelectOutput
    description:
    - "Change the output on the device to the specified output."
    param:
    - name: index
      description: "The index of the output to select."

  # AudioOutput enums
  bitmaps:
  - name: Feature
    description: "AudioOutput cluster FeatureMap."
    value:
    - name: kNameUpdates
      description: "Supports updates to output names."

  # AudioOutput enums
  enums:
  - name: OutputTypeEnum
    description: "The type of output."
    value:
    - name: kHDMI
      description: "HDMI."
    - name: kBT
      description: "Bluetooth."
    - name: kOptical
      description: "Optical."
    - name: kHeadphone
      description: "Headphone."
    - name: kInternal
      description: "Internal."
    - name: kOther
      description: "Other."

  # AudioOutput structs
  structs:
  - name: OutputInfoStruct
    description: "Contains information about an output."
    value:
    - name: index
      description: "The unique index of the output."
    - name: name
      description: "The name of the output."
    - name: outputType
      description: "The type of the output. Valid values are defined in
        [OutputTypeEnum]."

AvStreamAnalysis:
  description: "This trait supports devices that can analyze audio or video streams."

  # AvStreamAnalysis attributes
  attributes:
  - name: enabledEventTriggers
    description: "The event triggers that are enabled for the device."
  - name: supportedEventTriggers
    description: "The event triggers that are supported by the device."

  # AvStreamAnalysis commands
  commands:
  - name: SetOrUpdateEventDetectionTriggers
    description:
    - "Sets or updates the enablement status of the requested event detection triggers.
       This command overrides the existing enablement status of the triggers passed in the request."
    param:
    - name: eventTriggerEnablements
      description: "The list of event triggers and their desired enablement status.
        Each entry specifies an `EventTriggerTypeEnum` and its corresponding
        `EnablementStatusEnum`."
    response:
      description: "Indicates that the command was successfully processed."

  # AvStreamAnalysis enums
  enums:
  - name: EnablementStatusEnum
    description: "Defines the possible states for whether a feature or event trigger is enabled or
      disabled."
    value:
    - name: kDisabled
      description: "The event trigger is disabled."
    - name: kEnabled
      description: "The event trigger is enabled."
  - name: EventTriggerTypeEnum
    description: "All possible event triggers that could be supported."
    value:
    - name: kMotion
      description: "Motion detected."
    - name: kPersonDetected
      description: "A person was detected."
    - name: kVehicleDetected
      description: "A vehicle was detected."
    - name: kAnimalDetected
      description: "An animal was detected."
    - name: kPackageDetected
      description: "A package was detected."
    - name: kSound
      description: "Sound detected."
    - name: kPersonTalking
      description: "A person is talking."
    - name: kDogBark
      description: "A dog bark was detected."
    - name: kGlassBreak
      description: "Glass breaking sound detected."
    - name: kSmokeAlarm
      description: "Smoke alarm sound detected."
    - name: kCoAlarm
      description: "Carbon monoxide alarm sound detected."
    - name: kPackageDelivered
      description: "A package was delivered."
    - name: kPackageRetrieved
      description: "A package was retrieved."
    - name: kGarageDoor
      description: "An event related to a garage door, for example, open or close."
    - name: kVideoAnalysisDescription
      description: "Used for generating a description of the video."
    - name: kFace
      description: "Used for face identification."

  # AvStreamAnalysis structs
  structs:
  - name: EventTriggerEnablement
    description: "Defines the enablement status for a given event trigger type."
    value:
    - name: eventTriggerType
      description: "The type of event trigger."
    - name: enablementStatus
      description: "The enablement status of the event trigger."

BallastConfiguration:
  description: "This trait is used for configuring a lighting ballast."

  # BallastConfiguration attributes
  attributes:
  - name: ballastFactorAdjustment
    description: "The multiplication factor, as a percentage, to be applied to the configured light
      output of the lamps. A typical usage of this mechanism is to compensate for reduction in
      efficiency over the lifetime of a lamp."
  - name: ballastStatus
    description: "The activity status of the ballast functions.
      <ul>
        <li>Bit 0: Ballast Non-operational
          <ul>
            <li><code>0</code>: The ballast is fully operational</li>
            <li><code>1</code>: The ballast is not fully operational</li>
          </ul>
        </li>
         <li>Bit 1: Lamp Failure
          <ul>
            <li><code>0</code>: All lamps are operational</li>
            <li><code>1</code>: One or more lamps are faulty or disconnected</li>
          </ul>
        </li>
      </ul>"
  - name: intrinsicBallastFactor
    description: "The ballast factor of the ballast-and-lamp combination, prior to any adjustment.
      `null` indicates an invalid value."
  - name: lampAlarmMode
    description: "Specifies which attributes may trigger an alarm notification.
    <ul>
      <li>Bit 0: lampBurnHours
        <ul>
          <li><code>0</code> [lampBurnHours][BallastConfigurationTrait.Attributes.lampBurnHours]
          cannot trigger an alarm.</li>
          <li><code>1</code> [lampBurnHours][BallastConfigurationTrait.Attributes.lampBurnHours]
          can trigger an alarm.</li>
        </ul>
      </li>
     </ul>"
  - name: lampBurnHours
    description: "The length of time the lamps have been operated, in hours, cumulative since the
      last re-lamping."
  - name: lampBurnHoursTripPoint
    description: "The number of hours the [lampBurnHours] attribute may reach before an alarm is
      generated."
  - name: lampManufacturer
    description: "The name of the lamp manufacturer."
  - name: lampQuantity
    description: "The number of connected lamps."
  - name: lampRatedHours
    description: "The number of hours of use the lamps are rated for by the manufacturer."
  - name: lampType
    description: "The type of lamps (including their wattage) connected to the ballast."
  - name: maxLevel
    description: "The light output of the ballast according to the Dimming Light Curve when the
      [currentLevel][LevelControlTrait.Attributes.currentLevel] attribute of the
      [LevelControl] cluster equals 254 and the [onOff][OnOffTrait.Attributes.onOff] attribute of
      the [OnOff] cluster is `true`."
  - name: minLevel
    description: "The light output of the ballast according to the Dimming Light Curve when the
      [currentLevel][LevelControlTrait.Attributes.currentLevel] attribute of the
      [LevelControl] cluster equals 1, and the [onOff][OnOffTrait.Attributes.onOff] attribute of
      the [OnOff] cluster is `true`."
  - name: physicalMinLevel
    description: "The minimum light output the ballast can achieve according to the
      Dimming Light Curve (1-254)."
  - name: physicalMaxLevel
    description: "The maximum light output the ballast can achieve according to the
      Dimming Light Curve (1-254)."

BasicInformation:
  description: "This trait provides attributes and events for determining basic information about
    nodes."

  # BasicInformation attributes
  attributes:
  - name: dataModelRevision
    description: "The revision number of the data model against which the node is certified."
  - name: vendorName
    description: "A human-readable (displayable) name of the vendor for the node."
  - name: vendorID
    description: "The Vendor ID."
  - name: productName
    description: "A human-readable (displayable) name of the model for the node such as the model
      number (or other identifier) assigned by the vendor."
  - name: productID
    description: "The Product ID assigned by the vendor that is unique to the specific product of
      the Node."
  - name: nodeLabel
    description: "The user defined name for the node."
  - name: location
    description: "The ISO 3166-1 alpha-2 code representing the country, dependent territory, or
      special area of geographic interest in which the node is located at the time of the
      attribute being set."
  - name: hardwareVersion
    description: "The version number of the hardware of the node."
  - name: hardwareVersionString
    description: "The human-readable version number of the hardware of the node."
  - name: softwareVersion
    description: "The current version number for the software running on the node."
  - name: softwareVersionString
    description: "The current human-readable representation for the software running on the node."
  - name: manufacturingDate
    description: "The date that the node was manufactured."
  - name: partNumber
    description: "The human-readable (displayable) vendor assigned part number for the node whose
      meaning and numbering scheme is vendor defined."
  - name: productUrl
    description: "The link to a product specific web page."
  - name: productLabel
    description: "The vendor specific human-readable (displayable) product label."
  - name: serialNumber
    description: "The human-readable (displayable) serial number."
  - name: localConfigDisabled
    description: "If set to `true`, allow a local node configuration to be disabled."
  - name: reachable
    description: "Indicates whether the node can be reached."
  - name: uniqueID
    description: "The unique identifier for the device, which is constructed in a manufacturer
      specific manner."
  - name: capabilityMinima
    description: "The minimum guaranteed value for some system-wide resource capabilities that are
      not otherwise cluster-specific and do not appear elsewhere."
  - name: productAppearance
    description: "The information about the appearance of the product."
  - name: specificationVersion
    description: "The specification version."
  - name: maxPathsPerInvoke
    description: "The maximum paths per invoke."

  # BasicInformation commands
  commands:
  - name: MfgSpecificPing
    description:
    - "Send a manufacturer specific ping."

  # BasicInformation enums
  enums:
  - name: ColorEnum
    description: "Color values."
    value:
    - name: kBlack
      description: "Black."
    - name: kNavy
      description: "Navy."
    - name: kGreen
      description: "Green."
    - name: kTeal
      description: "Teal."
    - name: kMaroon
      description: "Maroon."
    - name: kPurple
      description: "Purple."
    - name: kOlive
      description: "Olive."
    - name: kGray
      description: "Gray."
    - name: kBlue
      description: "Blue."
    - name: kLime
      description: "Lime."
    - name: kAqua
      description: "Aqua."
    - name: kRed
      description: "Red."
    - name: kFuchsia
      description: "Fuchsia."
    - name: kYellow
      description: "Yellow."
    - name: kWhite
      description: "White."
    - name: kNickel
      description: "Nickel."
    - name: kChrome
      description: "Chrome."
    - name: kBrass
      description: "Brass."
    - name: kCopper
      description: "Copper."
    - name: kSilver
      description: "Silver."
    - name: kGold
      description: "Gold."
  - name: ProductFinishEnum
    description: "Product finish values."
    value:
    - name: kOther
      description: "Other."
    - name: kMatte
      description: "Matte."
    - name: kSatin
      description: "Satin."
    - name: kPolished
      description: "Polished."
    - name: kRugged
      description: "Rugged."
    - name: kFabric
      description: "Fabric."

  # BasicInformation structs
  structs:
  - name: CapabilityMinimaStruct
    description: "A set of constant values related to the overall capabilities of the node."
    value:
    - name: caseSessionsPerFabric
      description: "The actual minimum number of concurrent CASE (certificate-authenticated session
        establishment) sessions that are supported per fabric."
    - name: subscriptionsPerFabric
      description: "The actual minimum number of concurrent subscriptions supported per fabric."
  - name: ProductAppearanceStruct
    description: "The product's appearance."
    value:
    - name: finish
      description: "The product's appearance, as enumerated by
        [ProductFinishEnum][BasicInformationTrait.ProductFinishEnum]."
    - name: primaryColor
      description: "The product's primary color, as enumerated by
        [ColorEnum][BasicInformationTrait.ColorEnum]."

  # BasicInformation events
  events:
  - name: StartUp
    description: "Indicates that the node has completed a boot or reboot process."
    value:
    - name: softwareVersion
      description: "The software version of the node. Set to the same value as available in the
        [softwareVersion][BasicInformationTrait.Attributes.softwareVersion] attribute."
  - name: ShutDown
    description: "Indicates that the node has begun an orderly shutdown sequence on a best effort
      basis."
  - name: Leave
    description: "Indicates that the node has left a given fabric."
    value:
    - name: fabricIndex
      description: "The identifier for the fabric where the target endpoint is located."
  - name: ReachableChanged
    description: "Indicates that the state of the node's reachability has changed."
    value:
    - name: reachableNewValue
      description: "The new [reachable][BasicInformationTrait.Attributes.reachable] attribute
        value."

Binding:
  description: "This trait represents one or more persistent relationships between an endpoint and
    one or more other endpoints. A binding does not require that the relationship exists. It is up
    to the node application to set up the relationship."

  # Binding attributes
  attributes:
  - name: binding
    description: "A list of bindings."

  # Binding structs
  structs:
  - name: TargetStruct
    description: "A remote node and endpoint."
    value:
    - name: cluster
      description: "The cluster ID for the client and server on the target endpoint."
    - name: endpoint
      description: "The remote endpoint to which the local endpoint is bound. "
    - name: fabricIndex
      description: "The identifier for the fabric where the target endpoint is located."
    - name: group
      description: "The target group ID."
    - name: node
      description: "The remote target node ID."

BooleanState:
  description: "This trait provides an interface to a boolean state."

  # BooleanState attributes
  attributes:
  - name: stateValue
    description: "Represents a Boolean state."

  # BooleanState events
  events:
  - name: StateChange
    description: "The value of the [stateValue][BooleanStateTrait.Attributes.stateValue] attribute
      changed."
    value:
    - name: stateValue
      description: "The new value of the [stateValue][BooleanStateTrait.Attributes.stateValue]
        attribute."

BooleanStateConfiguration:
  description: "This trait provides an interface for configuring a boolean sensor, including
    optional state change alarm features and configuration of the sensor's sensitivity level."

  # BooleanStateConfiguration attributes
  attributes:
  - name: alarmsActive
    description: "Indicates which specific alarm modes are currently active."
  - name: alarmsEnabled
    description: "The alarm modes that will be emitted if the sensor is triggered."
  - name: alarmsSupported
    description: "The alarms supported by the sensor."
  - name: alarmsSuppressed
    description: "Indicates which specific alarm modes are currently suppressed."
  - name: currentSensitivityLevel
    description: "The currently selected sensitivity level."
  - name: defaultSensitivityLevel
    description: "The default sensitivity level selected by the manufacturer."
  - name: sensorFault
    description: "Indicates any faults registered by the device."
  - name: supportedSensitivityLevels
    description: "Indicates the number of sensitivity levels supported by the device."

  # BooleanStateConfiguration commands
  commands:
  - name: EnableDisableAlarm
    description:
    - "Enable or disable one or more alarm modes."
    param:
    - name: alarmsToEnableDisable
      description: "The alarm modes to enable or disable."
  - name: SuppressAlarm
    description:
    - "Suppress one or more alarm modes."
    param:
    - name: alarmsToSuppress
      description: "The alarm modes to suppress."

  # BooleanStateConfiguration bitmaps
  bitmaps:
  - name: AlarmModeBitmap
    description: "The modes supported by the alarm."
    value:
    - name: kAudible
      description: "Audible alarm."
    - name: kVisual
      description: "Visible alarm."
  - name: Feature
    description: "BooleanStateConfiguration Trait FeatureMap."
    value:
    - name: kAudible
      description: "Supports audible alarms."
    - name: kVisual
      description: "Supports visible alarms."
    - name: kAlarmSuppress
      description: "The device is able to suppress the supported alarm modes once the user
        acknowledges the alarm. This is intended for situations where the user is aware that the
        sensor is triggered, but doesn't want the alarm to emit anymore, such as when:
        <ul>
        <li>The triggering cause is resolved by the user, but the sensor still detects the
            triggering cause.</li>
        <li>The user can't address the triggering cause, but is aware of the alarm and wants the
          alarm to stop emitting.</li>
        </ul>"
    - name: kSensitivityLevel
      description: "Supports ability to set sensor sensitivity."
  - name: SensorFaultBitmap
    description: "Type of sensor fault."
    value:
    - name: kGeneralFault
      description: "Unspecified fault detected."

  # BooleanStateConfiguration events
  events:
  - name: AlarmsStateChanged
    description: "Generated after any bits in the `alarmsActive` or `alarmsSuppressed` attributes
      change."
    value:
    - name: alarmsActive
      description: "The state of active alarm modes at the time the event was generated."
    - name: alarmsSuppressed
      description: "The state of suppressed alarm modes at the time the event was generated."
  - name: SensorFault
    description: "The device registered or cleared a fault."
    value:
    - name: sensorFault
      description: "The value of the
        [sensorFault][BooleanStateConfigurationTrait.Attributes.sensorFault] attribute at the time
        the event is generated."

Brightness:
  description: "This trait provides a brightness extension to the `LevelControl` trait and is only
    only for use with the Automation API."

  # Brightness attributes
  attributes:
  - name: currentBrightnessPercent
    description: "The current brightness of the device, in percentage, with a range of 0-100."

  # Brightness commands
  commands:
  - name: MoveToBrightness
    description:
    - "Move the brightness of the device to the specified brightness."
    param:
    - name: brightnessPercent
      description: "The desired brightness percentage setting in the range of 0 to 100."
  - name: BrightnessStep
    description:
    - "Incremental step brightness. If brightness + step is greater than 100,
      the brightness is set to 100. If brightness + step is less than 0, the brightness
      is set to 0."
    param:
    - name: step
      description: "Indicates the increment by which to increase or decrease the brightness.
        Valid values are between 0 and 100."
    - name: stepMode
      description: "Indicates whether to increase or decrease the brightness."

  # Brightness enums
  enums:
  - name: BrightnessStepModeEnum
    description: "Step values that indicate whether to increase or decrease the brightness."
    value:
    - name: kIncrease
      description: "Increase the device's brightness."
    - name: kDecrease
      description: "Decrease the device's brightness."

CameraAvSettingsUserLevelManagement:
  description: "Provides an interface into controls associated with the operation of a camera that
    provides pan, tilt, and zoom functions, either mechanically, or against a digital image."

  # CameraAvSettingsUserLevelManagement attributes
  attributes:
  - name: MPTZPosition
    description: "The currently selected mechanical pan, tilt, and zoom positions."
  - name: maxPresets
    description: "The maximum number of presets for mechanical pan, tilt, and zoom."
  - name: MPTZPresets
    description: "A list of presets for mechanical pan, tilt, and zoom."
  - name: DPTZStreams
    description: "A list of video streams that have support for digital movement."
  - name: zoomMax
    description: "Maximum value for mechanical zoom."
  - name: tiltMin
    description: "Minimum value for mechanical tilt in angular degrees of angle."
  - name: tiltMax
    description: "Maximum value for mechanical tilt in angular degrees of angle."
  - name: panMin
    description: "Minimum value for mechanical pan in angular degrees of angle."
  - name: panMax
    description: "Maximum value for mechanical pan in angular degrees of angle."
  - name: movementState
    description: "The current movement state of the device."

  # CameraAvSettingsUserLevelManagement bitmaps
  bitmaps:
  - name: Feature
    description: Features supported by this cluster.
    value:
    - name: kDigitalPTZ
      description: "The device supports digital Pan, Tilt, and Zoom."
    - name: kMechanicalPan
      description: "The device supports mechanical Pan."
    - name: kMechanicalTilt
      description: "The device supports mechanical Tilt."
    - name: kMechanicalZoom
      description: "The device supports mechanical Zoom."
    - name: kMechanicalPresets
      description: "The device supports mechanical saved presets."

  # CameraAvSettingsUserLevelManagement structs
  structs:
  - name: ViewportStruct
    description: "Used to encode a bounding rectangle of the viewport on the image sensor"
    value:
    - name: x1
      description: "Represents the position of the starting vertex along the horizontal (x) axis."
    - name: x2
      description: "Represents the position of the ending vertex along the horizontal (x) axis."
    - name: y1
      description: "Represents the position of the starting vertex along the vertical (y) axis."
    - name: y2
      description: "Represents the position of the ending vertex along the vertical (y) axis."
  - name: MPTZStruct
    description: "Indicates mechanical pan, tilt, and zoom values."
    value:
    - name: pan
      description: "The mechanical pan value of the device in angular degrees of angle. A zero
        value indicates the home position horizontal reference for the direction of view of the
        camera. A negative value indicates a leftward rotation of the camera about the vertical
        axis of the camera coordinate system. A positive value indicates a rightward rotation
        of the camera about the vertical axis of the camera coordinate system."
    - name: tilt
      description: "The mechanical tilt value of the device in angular degrees of angle. A zero
        value indicates a vertical reference for the direction of view of the camera. A negative
        value indicates a downward rotation of the camera about the horizontal axis of the camera
        coordinate system. A positive value indicates an upward rotation of the camera about the
        horizontal axis of the camera coordinate system.  "
    - name: zoom
      description: "The mechanical zoom value to use. A value of 1 indicates the widest possible
        optical field of view."
  - name: MPTZPresetStruct
    description: "Used to save a preset location for mechanical pan, tilt, and zoom."
    value:
    - name: presetId
      description: "Represents the ID for a saved set of preset values for mechanical pan, tilt, and
        zoom."
    - name: presetName
      description: "Name for the preset."
    - name: settings
      description: "The mechanical pan, tilt, and zoom values for the preset."
  - name: DPTZStruct
    description: "Used to indicate support for the per stream digital pan, tilt, and zoom values."
    value:
    - name: videoStreamId
      description: "Indicates the video stream this applies to."
    - name: viewport
      description: "Indicates the per stream viewport applied to this video stream"

  # CameraAvSettingsUserLevelManagement enums
  enums:
    - name: PhysicalMovementEnum
      description: "Provides an enumeration of the possible physical movement states in which the
        camera could be."
      value:
      - name: kIdle
        description: "The camera is idle."
      - name: kMoving
        description: "The camera is moving to a new value of Pan, Tilt, and/or Zoom."

  # CameraAvSettingsUserLevelManagement commands
  commands:
    - name: MPTZSetPosition
      description:
      - "Moves the camera to the provided values for pan, tilt, and zoom in the mechanical PTZ."
      param:
      - name: pan
        description: "Indicates the absolute pan value in angular degrees."
      - name: tilt
        description: "Indicates the absolute tilt value in angular degrees."
      - name: zoom
        description: "Indicates the absolute zoom value."
    - name: MPTZRelativeMove
      description:
      - "Moves the camera by the delta values relative to the currently defined position."
      param:
      - name: panDelta
        description: "Indicates the change in the pan value in degrees relative to the current
          location."
      - name: tiltDelta
        description: "Indicates the change in the tilt value in degrees relative to the current
          location."
      - name: zoomDelta
        description: "Indicates the percentage change in the zoom value relative to the current
          zoom value on the camera."
    - name: MPTZMoveToPreset
      description:
      - "Moves the camera to the positions specified by the Preset passed."
      param:
      - name: presetId
        description: "Matches the `PresetID` of an entry in `MptzPresets`."
    - name: MPTZSavePreset
      description:
      - "Allows creating a new preset or updating the values of an existing one."
      param:
      - name: presetId
        description: "Indicates the ID of an entry in `MptzPresets`."
      - name: name
        description: "The name of the preset."
    - name: MPTZRemovePreset
      description:
      - "Removes a preset entry from the `PresetMptzTable`."
      param:
      - name: presetId
        description: "Indicates the ID of an entry in `MptzPresets`."
    - name: DPTZSetViewport
      description:
      - "Sets the digital viewport for a specific Video Stream."
      param:
      - name: videoStreamId
        description: "Represents the video stream to modify."
      - name: viewport
        description: "Represents the new viewport to apply to the requested stream."
    - name: DPTZRelativeMove
      description:
      - "Changes the per stream viewport by the amount specified in a relative fashion."
      param:
      - name: videoStreamId
        description: "Represents the video stream to modify."
      - name: deltaX
        description: "Represents the number of pixels to move the Viewport on the X axis."
      - name: deltaY
        description: "Represents the number of pixels to move the Viewport on the Y axis."
      - name: zoomDelta
        description: "Represents a percentage change to the size of the Viewport."

CameraAvStreamManagement:
  description: "This trait provides an interface for managing active audio and video streams on a
    camera device. This is a minimalistic custom version of the CameraAvStreamManagement standard
    Matter cluster, and provides functionality for some of the camera settings."

  # CameraAvStreamManagement attributes
  attributes:
  - name: imageRotation
    description: "The amount of clockwise rotation in degrees that the image has been subjected to,
      with 0 and 180 being the only supported values."
  - name: microphoneMuted
    description: "Indicates whether the microphone is muted."
  - name: minViewportResolution
    description: "The minimum resolution (width and height) in pixels that the camera allows for its
      viewport."
  - name: nightVision
    description: "The currently selected Night Vision mode."
  - name: recordingMicrophoneMuted
    description: "Indicates whether the microphone is muted during recording of a clip."
  - name: speakerMaxLevel
    description: "The maximum volume level that can be assigned to the speaker."
  - name: speakerMinLevel
    description: "The minimum volume level that can be assigned to the speaker."
  - name: speakerVolumeLevel
    description: "The current volume level of the speaker."
  - name: statusLightBrightness
    description: "The current brightness of the status light."
  - name: videoSensorParams
    description: "The parameters for the video sensor."
  - name: viewport
    description: "The viewport to apply to all streams."

  # CameraAvStreamManagement enums
  enums:
  - name: ThreeLevelAutoEnum
    description: "Used for the
      [statusLightBrightness][CameraAvStreamManagementTrait.Attributes.statusLightBrightness]
      attribute, allowing the brightness of a status light to be set."
    value:
    - name: kAuto
      description: "Auto."
    - name: kHigh
      description: "High."
    - name: kLow
      description: "Low."
    - name: kMedium
      description: "Unsupported value."
  - name: TriStateAutoEnum
    description: "Used for the [nightVision]
      [CameraAvStreamManagementTrait.Attributes.nightVision] attribute, allowing the Night
      Vision mode to be set."
    value:
    - name: kAuto
      description: "Auto."
    - name: kOff
      description: "Off."
    - name: kOn
      description: "On."

  # CameraAvStreamManagement structs
  structs:
  - name: VideoResolutionStruct
    description: "The resolution of the video."
    value:
    - name: width
      description: "The width of the video in pixels."
    - name: height
      description: "The height of the video in pixels."
  - name: VideoSensorParamsStruct
    description: "Defines parameters related to the [videoSensorParams]
      [CameraAvStreamManagementTrait.Attributes.videoSensorParams] attribute."
    value:
    - name: maxHDRFPS
      description: "An optional field for the maximum frames per second that the video
        sensor can capture when High Dynamic Range (HDR) is enabled."
    - name: maxFPS
      description: "The maximum frames per second that the video sensor can capture."
    - name: sensorHeight
      description: "The height that the video sensor supports."
    - name: sensorWidth
      description: "The width that the video sensor supports."
  - name: VideoStreamStruct
    description: "Captures all parameters of a video stream."
    value:
    - name: videoStreamId
      description: "The uniquely allocated identifier for the video stream."
    - name: videoStreamID
      description: "The uniquely allocated identifier for the video stream."
    - name: streamUsage
      description: "The usage of the stream as described in
        [StreamUsageEnum][PushAvStreamTransportTrait.StreamUsageEnum]."
    - name: minBitRate
      description: "The minimum bitrate for the corresponding video stream in bits per second."
    - name: maxBitRate
      description: "The maximum bitrate for the corresponding video stream in bits per second."
  - name: ViewportStruct
    description: "Used as the type for the [viewport]
      [CameraAvStreamManagementTrait.Attributes.viewport] attribute, allowing control over which
        part of the camera's image is being streamed or processed. The viewport is defined as these
        coordinates:<br><br>
        (x1,y1) (x2,y1)<br>
        (x1,y2) (x2,y2)"
    value:
    - name: x1
      description: "Represents the x-coordinate of the left corners of the viewport."
    - name: x2
      description: "Represents the x-coordinate of the right corners of the viewport."
    - name: y1
      description: "Represents the y-coordinate of the top corners of the viewport."
    - name: y2
      description: "Represents the y-coordinate of the bottom corners of the viewport."

CameraHistory:
  description: "This trait provides an interface to retrieve a camera's historical events."

  # CameraHistory attributes
  attributes:
  - name: dashManifestUrlTemplate
    description: "URL template for the DASH manifest of the session."
  - name: hlsMasterPlaylistUrlTemplate
    description: "URL template for the HLS master playlist of the session."
  - name: mp4DownloadUrlTemplate
    description: "URL template for downloading the mp4 clip of the session."
  - name: previewUrlTemplate
    description: "URL template for the animated preview clip representing the event session."
  - name: thumbnailUrlTemplate
    description: "URL template for the thumbnail image representing the event session."

  # CameraHistory enums
  enums:
  - name: CaptionType
    description: "The type of caption for the event session."
    value:
    - name: kLong
      description: "Long caption."
    - name: kShort
      description: "Short caption."
    - name: kUnknown
      description: "Unknown caption type."
  - name: EventType
    description: "The type of event that the camera recorded."
    value:
    - name: kUnknown
      description: "Unknown event."
    - name: kMotion
      description: "Motion detected."
    - name: kPerson
      description: "Person detected."
    - name: kDoorbell
      description: "Doorbell pressed."
    - name: kPackageDelivered
      description: "Package delivered."
    - name: kPackageRetrieved
      description: "Package retrieved."
    - name: kPackageInTransit
      description: "Package in transit."
    - name: kAnimal
      description: "Animal detected."
    - name: kVehicle
      description: "Vehicle detected."
    - name: kSmokeAlarm
      description: "Smoke alarm detected."
    - name: kCOAlarm
      description: "CO alarm detected."
    - name: kDogBark
      description: "Dog bark detected."
    - name: kPersonTalking
      description: "Person talking detected."
    - name: kGlassBreak
      description: "Glass break detected."
    - name: kGarageDoorOpened
      description: "Garage door opened."
    - name: kGarageDoorClosed
      description: "Garage door closed."
    - name: kSound
      description: "Sound detected."
    - name: kSecurityAlarm
      description: "Security alarm detected."
    - name: kRecordingSmokeAlarm
      description: "Recording of a smoke alarm."
    - name: kRecordingCOAlarm
      description: "Recording of a CO alarm."

  # CameraHistory events
  events:
  - name: HistoryItem
    description: "Represents a single event session recorded by the camera, with comprehensive
      details about the session."
    value:
    - name: captions
      description: "Captions for the session, where the values come from
        [Caption][CameraHistoryTrait.Caption]."
    - name: endTimestampMillis
      description: "The end time of the session in milliseconds since the Unix epoch."
    - name: eventTracks
      description: "Specific events detected within the
        session, (such as motion, person, or face detection), including their timestamps
        and associated zone, where the values come from
        [EventTrack][CameraHistoryTrait.EventTrack]."
    - name: sessionId
      description: "The ID of the session."
    - name: startTimestampMillis
      description: "The start time of the session in milliseconds since the Unix epoch."
    - name: mediaUrl
      description: "Various URLs for accessing media related to the session (preview,
        thumbnail, MP4 download, DASH/HLS manifests), where the values come from
        [MediaUrl][CameraHistoryTrait.MediaUrl]."

  # CameraHistory structs
  structs:
  - name: Caption
    description: "Information about a caption that was detected by the camera."
    value:
    - name: captionText
      description: "The text of the caption."
    - name: captionType
      description: "The type of caption that was detected by the camera, where the value comes
        from [CaptionType][CameraHistoryTrait.CaptionType]."
  - name: EventTrack
    description: "A track of detected events within a camera session, with details
      about what was detected."
    value:
    - name: endTimestampMillis
      description: "The timestamp in milliseconds since the Unix epoch of the end of the track."
    - name: eventTypes
      description: "The types of events that were detected in this track, whose values come from
        [EventType][CameraHistoryTrait.EventType]."
    - name: face
      description: "The face that was detected in this track. The face values come from
        [Face][CameraHistoryTrait.Face]."
    - name: startTimestampMillis
      description: "The timestamp in milliseconds since the Unix epoch of the start of the track."
    - name: trackId
      description: "The ID of the track."
    - name: zones
      description: "Zones in this track where an event was detected. The zone values come from
        [Zone][CameraHistoryTrait.Zone]."
  - name: Face
    description: "Information about a face that was detected by the camera."
    value:
    - name: exemplarId
      description: "The ID of the face exemplar, which is a high-quality representative
        image of a person's face."
    - name: faceId
      description: "The ID of the face that was detected."
  - name: MediaUrl
    description: "Groups together various URLs for accessing different
      media formats (preview, thumbnail, MP4, DASH, HLS) associated with
      a camera history event session."
    value:
    - name: dash_manifest_url
      description: "The URL template for the DASH manifest of the session."
    - name: hls_master_playlist_url
      description: "The URL template for the HLS master playlist of the session."
    - name: mp4_download_url
      description: "The URL template for downloading the mp4 clip of the session."
    - name: preview_url
      description: "The URL template for the animated preview clip representing the event session."
    - name: thumbnail_url
      description: "The URL template for the thumbnail image representing the event session."
  - name: Zone
    description: "Defines a zone where the event occurred."
    value:
    - name: label
      description: "The name of the zone where the event occurred."
    - name: zoneId
      description: "The ID of the zone where the event occurred."

CameraSnapshot:
