ThermostatFanControl:
  description: "This trait provides fan control capabilities for thermostats."

  # ThermostatFanControl attributes
  attributes:
  - name: current_speed
    description: "The currently selected fan speed. This value cannot be 'Auto'."
  - name: user_requested_fan_running
    description: "Whether the fan is running due to the active schedule or
      because of a manual user request."
  - name: ventilation_state
    description: "The active state of ventilation equipment."
  - name: ventilation_alert
    description: "The alert status indicating poor indoor or outdoor air quality
      constraint interactions."
  - name: fan_speed_state
    description: "The active state indicating why the current fan speed is selected."
  - name: max_available_speed
    description: "The maximum number of physical fan speeds supported by the physical installation."
  - name: supports_indefinite_timer
    description: "Whether the circulating fan supports starting a timer that runs indefinitely."
  - name: supports_timer_in_off_mode
    description: "Whether the circulating fan supports starting a timer while the system
       mode is off."
  - name: supports_schedule_in_off_mode
    description: "Whether the circulating fan supports running the fan schedule
      and/or the ventilation schedule while the system mode is off."
  - name: max_timer_duration
    description: "The maximum finite timer duration supported by the thermostat.
      Null should be interpreted as 12 hours."
  - name: supports_fan_activation_for_non_electric_furnaces
    description: "Whether gas furnace specific fan settings extend to all non-electric
      forced-air systems."
  - name: mode
    description: "The active fan control mode."
  - name: hvac_override_speed
    description: "The user-specified override for the automatically selected speed.
      This speed cannot be off."
  - name: schedule_speed
    description: "The fan speed used by the schedule. The speed cannot be off or auto."
  - name: schedule_duty_cycle
    description: "The duty cycle of the schedule in seconds per hour. Supported range: 300 to 3600."
  - name: schedule_start_time
    description: "Schedule start time in seconds relative to local midnight. If
      schedule_start_time equals schedule_end_time, the fan schedule runs
      continuously."
  - name: schedule_end_time
    description: "Schedule end time in seconds relative to local midnight."
  - name: schedule_enabled_in_off_mode
    description: "Whether scheduling is active while system mode is off. Fan
      schedule does not run during CO or smoke safety shutoff."
  - name: timer_speed
    description: "The speed used by the fan timer. The speed cannot be off or auto."
  - name: timer_end
    description: "The end epoch time in seconds of the active finite timer."
  - name: timer_duration
    description: "The requested duration in seconds."
  - name: timer_is_indefinite
    description: "Whether the active timer runs indefinitely, ignoring duration and end time."
  - name: timer_equipment
    description: "If the HVAC system has both a circulating fan and a ventilator, the
      thermostat activates this set of equipment when the fan timer is
      active. If the system has only a fan or only a vent, the
      thermostat ignores this field."
  - name: ventilation_enabled
    description: "Whether automatic ventilation is active. Does not apply
      to timer."
  - name: ventilation_on_time_per_day
    description: "The requested total daily ventilation duration in seconds."
  - name: smart_ventilation_enabled
    description: "Whether smart ventilation, such as managing outdoor and indoor air quality
      interactions, is active."
  - name: ventilation_for_heating_and_cooling_enabled
    description: "Whether free heating and cooling by means of ventilation is active.
      Requires the ventilator type to be configured as supply-only or exhaust-only."
  - name: ventilation_enabled_in_off_mode
    description: "Whether ventilation remains active while system mode is off.
      Ventilation does not run during CO or smoke safety shutoff."

  # ThermostatFanControl enums
  enums:
  - name: FanSpeedSetting
    description: "The fan speed setting."
    value:
    - name: kUnspecified
      description: "The fan speed setting is unspecified."
    - name: kOff
      description: "The fan speed setting is off."
    - name: kStage1
      description: "Low speed."
    - name: kStage2
      description: "Medium speed."
    - name: kStage3
      description: "High speed."
    - name: kAuto
      description: "Automatic speed adjustment."
  - name: FanSpeedState
    description: "The fan speed state."
    value:
    - name: kUnspecified
      description: "The fan speed state is unspecified."
    - name: kOff
      description: "The fan speed state is off."
    - name: kTimer
      description: "The fan speed state is running on a timer."
    - name: kSchedule
      description: "The fan speed state is running on a schedule."
    - name: kEquipmentActivation
      description: "The fan speed state is running due to heating or cooling activation."
    - name: kVentilationActivation
      description: "The fan speed state is running due to ventilation requirements."
    - name: kSystemTest
      description: "The fan speed state is running a system diagnostic test."
  - name: VentilationState
    description: "The ventilation state."
    value:
    - name: kUnspecified
      description: "The ventilation state is unspecified."
    - name: kOff
      description: "The ventilation state is off."
    - name: kTimer
      description: "The ventilation state is running on a timer."
    - name: kSchedule
      description: "The ventilation state is running on a schedule."
    - name: kIndoorAirQuality
      description: "The ventilation state is active due to poor indoor air quality."
    - name: kHeating
      description: "The ventilation state is active due to heating requirements (free heating)."
    - name: kCooling
      description: "The ventilation state is active due to cooling requirements (free cooling)."
    - name: kSystemTest
      description: "The ventilation state is running a system diagnostic test."
  - name: VentilationAlert
    description: "The ventilation alert."
    value:
    - name: kUnspecified
      description: "The ventilation alert is unspecified."
    - name: kOk
      description: "The ventilation alert is normal."
    - name: kOutdoorAirQuality
      description: "The ventilation stopped due to poor outdoor air quality (excludes timers)."
    - name: kIndoorAirQuality
      description: "The ventilation is active due to poor indoor air quality."
    - name: kIndoorOutdoorAirQuality
      description: "The indoor air quality is poor, but ventilation is blocked due to
        poor outdoor air quality."
  - name: FanTotalStages
    description: "The physical stages supported by the fan."
    value:
    - name: kUnspecified
      description: "The number of stages is unspecified."
    - name: kStage1
      description: "One speed."
    - name: kStage2
      description: "Two speeds."
    - name: kStage3
      description: "Three speeds."
    - name: kNone
      description: "No circulating fan is supported."
  - name: FanMode
    description: "The active fan mode."
    value:
    - name: kUnspecified
      description: "The fan mode is unspecified."
    - name: kAuto
      description: "Runs fan automatically during heating or cooling."
    - name: kContinuousOn
      description: "Runs fan continuously."
    - name: kDutyCycle
      description: "Runs fan based on the duty-cycle schedule."
  - name: FanEquipment
    description: "The selected fan equipment."
    value:
    - name: kUnspecified
      description: "The fan equipment is unspecified."
    - name: kFanOnly
      description: "Only the fan is selected."
    - name: kVentOnly
      description: "Only the ventilation is selected."
    - name: kFanAndVent
      description: "Both the fan and ventilation are selected."

  # ThermostatFanControl structs
  structs:
  - name: FanState
    description: "The state of the fan."
    value:
    - name: speed
      description: "The speed of the fan."
    - name: user_requested_fan_running
      description: "Whether the fan is running from a manual user request
        or a duty-cycle schedule."
    - name: fan_speed_state
      description: "The active state of the fan speed."

  # ThermostatFanControl events
  events:
  - name: FanStateChangeEvent
    description: "Indicates that the fan state has changed."
    value:
    - name: fan_state
      description: "The new fan state."
    - name: prior_fan_state
      description: "The previous fan state prior to the change."
  - name: VentilationAlertChangeEvent
    description: "Indicates that the ventilation alert has changed."
    value:
    - name: alert
      description: "The new alert status."
    - name: prior_alert
      description: "The previous alert status prior to the change."


ThermostatUserInterfaceConfiguration:
  description: "This trait provides an interface to allow configuration of the user interface for a
    thermostat, or a thermostat controller device, that supports a keypad and LCD screen."

  # ThermostatUserInterfaceConfiguration attributes
  attributes:
  - name: temperatureDisplayMode
    description: "Indicates the units of temperature (Celsius or Fahrenheit) displayed on the
      thermostat screen."
  - name: keypadLockout
    description: "Indicates the level of functionality available to the user through the
      thermostat's keypad."
  - name: scheduleProgrammingVisibility
    description: "Hides the weekly schedule programming functionality or menu on a thermostat from
      the user, preventing local user programming of the weekly schedule."

  # ThermostatUserInterfaceConfiguration enums
  enums:
  - name: KeypadLockoutEnum
    description: "The level of functionality available to the user through the thermostat's keypad."
    value:
    - name: kLockout1
      description: "Level 1 reduced functionality."
    - name: kLockout2
      description: "Level 2 reduced functionality."
    - name: kLockout3
      description: "Level 3 reduced functionality."
    - name: kLockout4
      description: "Level 4 reduced functionality."
    - name: kLockout5
      description: "Level 5 reduced functionality."
    - name: kNoLockout
      description: "All functionality available to the user."
  - name: ScheduleProgrammingVisibilityEnum
    description: "Visibility levels for schedule programming functionality."
    value:
    - name: kScheduleProgrammingPermitted
      description: "Local schedule programming functionality is enabled at the thermostat."
    - name: kScheduleProgrammingDenied
      description: "Local schedule programming functionality is disabled at the thermostat."
  - name: TemperatureDisplayModeEnum
    description: "Units of temperature."
    value:
    - name: kCelsius
      description: "Temperature displayed in °C."
    - name: kFahrenheit
      description: "Temperature displayed in °F."

ThreadNetworkCapabilities:
  description: "This trait provides an interface for querying the Thread network capabilities of a
    device."

  # ThreadNetworkCapabilities attributes
  attributes:
  - name: internetAccessOption
    description: "Represents whether the device is capable of providing internet access to Thread
      devices."
  - name: epskcSupported
    description: "Represents the capability of supporting EPSKC."

  # ThreadNetworkCapabilities enums
  enums:
  - name: InternetAccessOptionEnum
    description: "Internet access values."
    value:
    - name: kUnspecified
      description: "Unspecified."
    - name: kNone
      description: "No internet access."
    - name: kAll
      description: "Full internet access."
    - name: kNat64Only
      description: "NAT64 internet access only."
    - name: kDhcpv6PdOnly
      description: "DHCPv6 PD internet access only."

ThreadNetworkManagement:
  description: "This trait provides an interface for managing a Thread network."

  # ThreadNetworkManagement attributes
  attributes:
  - name: activeNetworkInfo
    description: "Represents the current active Thread network information."

  # ThreadNetworkManagement commands
  commands:
  - name: ActivateEpskcMode
    description:
    - "Request to activate ePSKc mode for Thread credential sharing."
    param:
    - name: requestedDurationSeconds
      description: "The requested duration for which the ePSKc should be valid. If this field isn't
        set, the duration defaults to 120 seconds."
    response:
      description: "The response from the `ActivateEpskcMode` command, containing the generated
        ephemeral key and the actual duration for which it is valid."
      param:
      - name: epsk
        description: "The generated ephemeral key. Only present if `status` is `kSuccess`."
      - name: status
        description: "The status of the `ActivateEpskcMode` command."
      - name: validationDurationSeconds
        description: "The actual duration for which the ePSKc is valid, as set by the device.
          Only present if `status` is `kSuccess`."
  - name: DeactivateEpskcMode
    description:
    - "Request to immediately deactivate ePSKc mode."
  - name: JoinNetwork
    description:
    - "Request to join a Thread network using the provided operational dataset.
      If the border router device is already part of a network, this command will cause it to
      attempt to migrate to the network together with all Thread devices attached to it."
    param:
    - name: operationalDatasetTlvs
      description: "The Thread operational dataset of the network to join, in TLV format."
    response:
      description: "The response from the `JoinNetwork` command, containing the status of the
        command."
      param:
      - name: status
        description: "The status of the `JoinNetwork` command."
  - name: LeaveNetwork
    description:
    - "Request to leave the current Thread network and factory reset the Thread stack."

  # ThreadNetworkManagement structs
  structs:
  - name: EpskcModeDeactivated
    description: "Information about the ePSKc mode deactivation."
    value:
    - name: reason
      description: "The reason for the ePSKc mode deactivation."
  - name: NetworkInfo
    description: "Information about a Thread network."
    value:
    - name: channel
      description: "The channel of the Thread network."
    - name: extendedPanId
      description: "The extended PAN ID of the Thread network."
    - name: networkName
      description: "The network name of the Thread network."
    - name: panId
      description: "The PAN ID of the Thread network."

Timer:
  description: "This trait can be used to control a built-in timer on a device, such as
    starting a new timer on a sprinkler, and pausing and canceling the timer."

  # Timer attributes
  attributes:
  - name: maxTimerLimitSeconds
    description: "The largest timer setting, in seconds, that is available on the device."
  - name: commandOnlyTimer
    description: "Indicates whether the device supports one-way (`true`) or two-way (`false`)
      communication."
  - name: timerPaused
    description: "Indicates that an active timer exists but is currently paused."
  - name: timerRemainingSeconds
    description: "The remaining number of seconds on the timer."

  # Timer commands
  commands:
  - name: TimerStart
    description:
    - "Starts a new device timer."
    param:
    - name: timerTimeSeconds
      description: "Duration of the timer in seconds, which must be in the range of 1 to
        [maxTimerLimitSeconds][TimerTrait.Attributes.maxTimerLimitSeconds]."
  - name: TimerAdjust
    description:
    - "Adjusts the device timer duration."
    param:
    - name: adjustmentTimeSeconds
      description: "Positive or negative adjustment of the timer in seconds, which must be
        in the range of -[maxTimerLimitSeconds][TimerTrait.Attributes.maxTimerLimitSeconds]
        to [maxTimerLimitSeconds][TimerTrait.Attributes.maxTimerLimitSeconds]."
  - name: TimerPause
    description:
    - "Pauses the device timer."
  - name: TimerResume
    description:
    - "Resumes the device timer."
  - name: TimerCancel
    description:
    - "Cancels the device timer."

Toggles:
  description: "This trait belongs to any devices with settings that can only exist in one of two
    states and provides an interface to a toggle switch that can be turned on or off."

  # Toggles attributes
  attributes:
  - name: currentToggleSettings
    description: "The current state of each toggle that is available on the device."
  - name: supportedToggles
    description: "The list of available toggles."

  # Toggles commands
  commands:
  - name: ChangeToggleSettings
    description:
    - "Changes the state of one or more toggles."
    param:
    - name: updatedToggleSettings
      description: "The list of toggles to change."

  # Toggles structs
  structs:
  - name: Toggle
    description: "A toggle that is available on the device."
    value:
    - name: name
      description: "Internal name of the toggle, which will be used in commands and states.
        This can be non-user-friendly, and will be shared across all languages."
    - name: synonyms
      description: "Synonyms of the toggle in each supported language."
  - name: ToggleSetting
    description: "Indicates if a specific toggle is enabled or not."
    value:
    - name: toggleName
      description: "The internal name of the toggle."
    - name: enabled
      description: "Indicates if the toggle is enabled or not."
  - name: ToggleSynonyms
    description: "Synonyms of the toggle in a given language."
    value:
    - name: language
      description: "The language code in ISO 639-1."
    - name: toggleSynonyms
      description: "Synonyms of the toggle where the first string in this list is used as the
        canonical name of the level in that language."

TotalVolatileOrganicCompoundsConcentrationMeasurement:
  description: "This trait provides an interface to devices that measure concentration of volatile
    organic compounds."

  # TotalVolatileOrganicCompoundsConcentrationMeasurement attributes
  attributes:
  - name: averageMeasuredValue
    description: "The average value of
      [measuredValue][TotalVolatileOrganicCompoundsConcentrationMeasurementTrait.Attributes.measuredValue]
      measured during the
      [averageMeasuredValueWindow][TotalVolatileOrganicCompoundsConcentrationMeasurementTrait.Attributes.averageMeasuredValueWindow]."
  - name: averageMeasuredValueWindow
    description: "The window of time, in seconds, used to determine the
      [averageMeasuredValue][TotalVolatileOrganicCompoundsConcentrationMeasurementTrait.Attributes.averageMeasuredValue]."
  - name: levelValue
    description: "The level of the substance detected."
  - name: maxMeasuredValue
    description: "The maximum value of
      [measuredValue][TotalVolatileOrganicCompoundsConcentrationMeasurementTrait.Attributes.measuredValue]
      that can be measured."
  - name: measuredValue
    description: "The most recent measurement as a single-precision floating-point number, in
      units specified by
      [measurementUnit][TotalVolatileOrganicCompoundsConcentrationMeasurementTrait.Attributes.measurementUnit]."
  - name: measurementMedium
    description: "The medium in which
      [measuredValue][TotalVolatileOrganicCompoundsConcentrationMeasurementTrait.Attributes.measuredValue]
      is being measured."
  - name: measurementUnit
    description: "The unit used by
      [measuredValue][TotalVolatileOrganicCompoundsConcentrationMeasurementTrait.Attributes.measuredValue]."
  - name: minMeasuredValue
    description: "The minimum value of
      [measuredValue][TotalVolatileOrganicCompoundsConcentrationMeasurementTrait.Attributes.measuredValue]
      that can be measured."
  - name: peakMeasuredValue
    description: "The maximum value of
      [measuredValue][TotalVolatileOrganicCompoundsConcentrationMeasurementTrait.Attributes.measuredValue]
      that has been measured during the
      [peakMeasuredValueWindow][TotalVolatileOrganicCompoundsConcentrationMeasurementTrait.Attributes.peakMeasuredValueWindow]."
  - name: peakMeasuredValueWindow
    description: "The window of time used for determining the
      [peakMeasuredValue][TotalVolatileOrganicCompoundsConcentrationMeasurementTrait.Attributes.peakMeasuredValue]
      in seconds."
  - name: uncertainty
    description: "The range of error or deviation that can be found in
      [measuredValue][TotalVolatileOrganicCompoundsConcentrationMeasurementTrait.Attributes.measuredValue]
      and
      [peakMeasuredValueWindow][TotalVolatileOrganicCompoundsConcentrationMeasurementTrait.Attributes.peakMeasuredValueWindow]."

  # TotalVolatileOrganicCompoundsConcentrationMeasurement enums
  enums:
  - name: LevelValueEnum
    description: "Level values."
    value:
    - name: kCritical
      description: "Critical."
    - name: kHigh
      description: "High."
    - name: kLow
      description: "Low."
    - name: kMedium
      description: "Medium."
    - name: kUnknown
      description: "Unknown."
  - name: MeasurementMediumEnum
    description: "Mediums in which measurements are taken."
    value:
    - name: kAir
      description: "Air."
    - name: kSoil
      description: "Soil."
    - name: kWater
      description: "Water."
  - name: MeasurementUnitEnum
    description: "Measurement units."
    value:
    - name: kBQM3
      description: "Becquerels per cubic meter."
    - name: kMGM3
      description: "Milligrams per cubic meter."
    - name: kNGM3
      description: "Nanogram per cubic meter."
    - name: kPM3
      description: "Particles per cubic meter."
    - name: kPPB
      description: "Parts per billion."
    - name: kPPM
      description: "Parts per million."
    - name: kPPT
      description: "Parts per trillion."
    - name: kUGM3
      description: "Micrograms per cubic meter."

  # TotalVolatileOrganicCompoundsConcentrationMeasurement bitmaps
  bitmaps:
  - name: Feature
    description: "TotalVolatileOrganicCompoundsConcentrationMeasurement cluster FeatureMap."
    value:
    - name: kAverageMeasurement
      description: "Device supports the average numeric measurement of substance."
    - name: kCriticalLevel
      description: "Device supports the Critical concentration Level."
    - name: kLevelIndication
      description: "Device supports basic level indication for substance using the
        [LevelValueEnum][TotalVolatileOrganicCompoundsConcentrationMeasurementTrait.LevelValueEnum]."
    - name: kMediumLevel
      description: "Device supports the Medium concentration Level."
    - name: kNumericMeasurement
      description: "Device supports numeric measurement of substance."
    - name: kPeakMeasurement
      description: "Device supports peak numeric measurement of substance."

WakeOnLan:
  description: "This trait provides an interface for managing low power mode on a device that
    supports the Wake On LAN or Wake On Wireless LAN (WLAN) protocol."

  # WakeOnLan attributes
  attributes:
  - name: linkLocalAddress
    description: "The current link-local address of the device."
  - name: MacAddress
    description: "The current 48-bit MAC address of the device."

WaterHeaterManagement:
  description: "This cluster is used to allow clients to control the operation of a hot water
    heating appliance so that it can be used with energy management."

  # WaterHeaterManagement attributes
  attributes:
  - name: heaterTypes
    description: "Indicates the heat sources that the water heater can call on for heating."
  - name: heatDemand
    description: "Indicates if the water heater is heating water (active heat sources)."
  - name: tankVolume
    description: "Indicates the volume of water that the hot water tank can hold (in units of
      Litres)."
  - name: estimatedHeatRequired
    description: "Indicates the estimated heat energy needed to raise the water temperature to the
      target setpoint (in Wh)."
  - name: tankPercentage
    description: "Indicates an approximate level of hot water stored in the tank."
  - name: boostState
    description: "Indicates whether the Boost, as triggered by a Boost command, is currently Active
      or Inactive."

  # WaterHeaterManagement bitmaps
  bitmaps:
  - name: Feature
    description: "WaterHeaterManagement cluster FeatureMap."
    value:
    - name: kEnergyManagement
      description: "Allows energy management control of the tank"
    - name: kTankPercent
      description: "Supports monitoring the percentage of hot water in the tank"
  - name: WaterHeaterHeatSourceBitmap
    description: "Heat sources."
    value:
    - name: kImmersionElement1
      description: "Immersion Heating Element 1"
    - name: kImmersionElement2
      description: "Immersion Heating Element 2"
    - name: kHeatPump
      description: "Heat pump Heating"
    - name: kBoiler
      description: "Boiler Heating (e.g. Gas or Oil)"
    - name: kOther
      description: "Other Heating"

  # WaterHeaterManagement commands
  commands:
  - name: Boost
    description:
    - "Allows a client to request that the water heater is put into a Boost state."
    param:
    - name: boostInfo
      description: "The boost info."
  - name: CancelBoost
    description:
    - "Allows a client to cancel an ongoing Boost operation."

  # WaterHeaterManagement enums
  enums:
  - name: BoostStateEnum
    description: "Boost states."
    value:
    - name: kInactive
      description: "Boost is not currently active"
    - name: kActive
      description: "Boost is currently active"

  # WaterHeaterManagement events
  events:
  - name: BoostStarted
    description: "Generated whenever a Boost command is accepted."
    value:
    - name: boostInfo
      description: "Contains the fields copied from the Boost command."
  - name: BoostEnded
    description: "Generated whenever the `BoostState` transitions from Active to Inactive."

  # WaterHeaterManagement structs
  structs:
  - name: WaterHeaterBoostInfoStruct
    description: "Indicates boost info."
    value:
    - name: duration
      description: "Indicates the time period, in seconds, for which the boost state is activated."
    - name: oneShot
      description: "Indicates whether the boost state will be automatically canceled once the hot
        water has reached the target."
    - name: emergencyBoost
      description: "Indicates that the consumer wants the water to be heated quickly, potentially
        activating multiple heat sources."
    - name: temporarySetpoint
      description: "Indicates the target temperature to which the water will be heated."
    - name: targetPercentage
      description: "Indicates the target percentage of hot water in the tank that the
        `TankPercentage` attribute must reach before the heating is switched off."
    - name: targetReheat
      description: "Indicates the percentage to which the hot water in the tank will be allowed to
        fall before again beginning to reheat it."

WaterHeaterMode:
  description: "Defines additional mode tags and namespaced enumerated values for water heater
    devices."

  # WaterHeaterMode attributes
  attributes:
  - name: supportedModes
    description: "The modes supported by the water heater."
  - name: currentMode
    description: "The current mode of the water heater."
  - name: startUpMode
    description: "The desired startup mode for the water heater when it is supplied with power."
  - name: onMode
    description: "Indicates whether the value of `CurrentMode` depends on the state of the On/Off
      cluster on the same endpoint."

  # WaterHeaterMode bitmaps
  bitmaps:
  - name: Feature
    description: "WaterHeaterMode cluster FeatureMap."
    value:
    - name: kOnOff
      description: "Indicates if there is a dependency on the [OnOff] cluster."

  # WaterHeaterMode commands
  commands:
  - name: ChangeToMode
    description:
    - "Change device modes."
    param:
    - name: newMode
      description: "The mode to change to."
    response:
      description: "The result of the completed `ChangeToMode` command."
      param:
      - name: status
        description: "The status of the `ChangeToMode` command."
      - name: statusText
        description: "Text describing the status of the `ChangeToMode` command."

  # WaterHeaterMode enums
  enums:
  - name: ModeTag
    description: "Descriptive names of water heater modes."
    value:
    - name: kAuto
      description: "Decides which options, features, and setting values to use."
    - name: kQuick
      description: "Optimizes for faster completion."
    - name: kQuiet
      description: "Operates silently or barely audibly."
    - name: kLowNoise
      description: "Optimizes for low noise operation."
    - name: kLowEnergy
      description: "Optimizes for lower energy usage."
    - name: kVacation
      description: "Provides a mode suitable for use during vacations or other extended absences."
    - name: kMin
      description: "Uses the lowest available setting value."
    - name: kMax
      description: "Uses the highest available setting value."
    - name: kNight
      description: "Provides a mode suitable for use during night time."
    - name: kDay
      description: "Provides a mode suitable for use during day time."
    - name: kOff
      description: "Does not attempt to keep the water warm."
    - name: kManual
      description: "Attempts to keep the water warm based on the `OccupiedHeatingSetpoint` attribute
        of the associated Thermostat cluster."
    - name: kTimed
      description: "Attempts to keep the water warm based on the Schedules attribute of the
        associated Thermostat cluster."

  # WaterHeaterMode structs
  structs:
  - name: ModeTagStruct
    description: "Describes a mode tag."
    value:
    - name: mfgCode
      description: "The manufacturer's vendor ID."
    - name: value
      description: "The mode tag within a mode tag namespace."
  - name: ModeOptionStruct
    description: "Represents the possible mode of the `WaterHeaterMode` instance."
    value:
    - name: label
      description: "Readable text that describes the mode option for the user."
    - name: mode
      description: "Identifies the mode option."
    - name: modeTags
      description: "A list of tags that are associated with the mode option."

WaterTankLevelMonitoring:
  description: "Provides an interface to the current condition of a water tank resource."

  # WaterTankLevelMonitoring attributes
  attributes:
  - name: condition
    description: "Indicates the current condition of the resource in percent."
  - name: degradationDirection
    description: "Indicates the direction of change for the condition of the resource over time."
  - name: changeIndication
