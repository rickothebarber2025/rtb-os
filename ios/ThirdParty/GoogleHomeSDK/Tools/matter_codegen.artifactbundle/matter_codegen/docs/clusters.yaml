PowerSource:
  description: "This trait provides an interface to devices that provide power to other devices."

  # PowerSource attributes
  attributes:
  - name: activeBatChargeFaults
    description: "Indicates the set of battery charge faults currently detected by the device on
      this power source. This set is represented as a list in
      [BatChargeFaultEnum][PowerSourceTrait.BatChargeFaultEnum].
      When the device detects that a fault has been raised, the appropriate
      [BatChargeFaultEnum][PowerSourceTrait.BatChargeFaultEnum]
      value is added to this list.
      When the device detects that all conditions contributing to a fault have been cleared,
      the corresponding value is removed from this list.
      An empty list indicates that there are currently no active faults."
  - name: activeBatFaults
    description: "Indicates the set of battery faults currently detected by the device
      on this power source. This set is represented as a list in
      [BatFaultEnum][PowerSourceTrait.BatFaultEnum].
      When the device detects that a fault has been raised, the appropriate
      [BatFaultEnum][PowerSourceTrait.BatFaultEnum]
      value is added to this list.
      When the device detects that all conditions contributing to a fault have been cleared,
      the corresponding value is removed from this list.
      An empty list indicates that there are currently no active faults."
  - name: activeWiredFaults
    description: "The set of wired faults currently detected by
      the device on this power source. This set is represented as a list of
      [WiredFaultEnum][PowerSourceTrait.WiredFaultEnum].
      When the device detects that a fault has been raised, the appropriate
      [WiredFaultEnum][PowerSourceTrait.WiredFaultEnum]
      value is added to this list, provided this value is not already present in the list.
      This list should not contain more than one instance of a specific
      [WiredFaultEnum][PowerSourceTrait.WiredFaultEnum] value.
      When the device detects that all conditions contributing to a fault have been cleared,
      the corresponding [WiredFaultEnum][PowerSourceTrait.WiredFaultEnum] value is removed
      from this list. An empty list indicates that there are currently no active faults."
  - name: batAnsiDesignation
    description: "The string representing the ANSI designation for the battery, as specified in
      ANSI C18."
  - name: batApprovedChemistry
    description: "ID of the preferred chemistry of the battery source, as specified
       in [BatApprovedChemistryEnum][PowerSourceTrait.BatApprovedChemistryEnum]."
  - name: batCapacity
    description: "The preferred minimum charge capacity rating in milliampere-hours of
      battery cells or packs in the battery source."
  - name: batChargeLevel
    description: "The ranking of the charge level
      of the battery used to indicate when intervention is required, as specified
      in [BatChargeLevelEnum][PowerSourceTrait.BatChargeLevelEnum]."
  - name: batChargeState
    description: "The state of the battery charge, as specified in
      [BatChargeStateEnum][PowerSourceTrait.BatChargeStateEnum]."
  - name: batChargingCurrent
    description: "The assessed current in milliamps being supplied to charge the
      battery source. A value of null indicates that the device is currently unable to
      assess the value."
  - name: batCommonDesignation
    description: "The ID of the common or colloquial designation of the battery,
       as specified in [BatCommonDesignationEnum][PowerSourceTrait.BatCommonDesignationEnum]."
  - name: batFunctionalWhileCharging
    description: "Indicates whether the device can remain operational while
      the battery source is charging."
  - name: batIecDesignation
    description: "The string representing the IEC designation for the battery,
      as specified in IEC 60086."
  - name: batPercentRemaining
    description: "The estimated percentage of battery charge remaining until the battery
      can no longer provide power to the device. Values are expressed
      in half-percent units, ranging from 0 to 200. For example, a value of 48 is equivalent to 24%.
      A value of null indicates that the device is currently unable to assess the value.
      Changes to this attribute are reported either
      once every 10 seconds or when the value changes between null and a non-null value."
  - name: batPresent
    description: "Indicates if the device detects that the batteries are properly installed."
  - name: batQuantity
    description: "The number of battery cells or packs in the battery source."
  - name: batReplaceability
    description: "Indicates the replaceability of the battery as specified in
      [BatReplaceabilityEnum][PowerSourceTrait.BatReplaceabilityEnum]."
  - name: batReplacementDescription
    description: "A user-facing description of this battery, containing information
      required to identify a replacement, such as form factor, chemistry,
      or preferred manufacturer."
  - name: batReplacementNeeded
    description: "Indicates if the battery needs to be replaced."
  - name: batTimeRemaining
    description: "The estimated time in seconds before the battery will no longer be able
      to provide power to the device. A value of null indicates that the device is
      currently unable to assess the value. Changes to this attribute are reported either
      once every 10 seconds or when the value changes between null and a non-null value."
  - name: batTimeToFullCharge
    description: "The estimated time in seconds before the battery source is fully charged.
      A value of null indicates that the device is currently unable to assess the value.
      Changes to this attribute are reported either
      once every 10 seconds or when the value changes between null and a non-null value."
  - name: batVoltage
    description: "The currently measured output voltage of the battery in millivolts.
      A value of null indicates that the device is currently unable to assess the value."
  - name: description
    description: "A user-facing description of the source, used to distinguish it from
      other power sources."
  - name: endpointList
    description: "A list of endpoints that are powered by the source defined by
      this cluster. Multiple instances of this cluster can list the same endpoint
      because it is possible for power for an endpoint to come from multiple sources.
      In that case, the [Order][PowerSourceTrait.Attributes.order] attribute indicates
      their priority. For each power source on a device,
      there is only one instance of this cluster. A cluster instance with an empty
      list indicates that the power source is for the entire device, which
      includes all endpoints. A cluster instance with a non-empty list includes
      the endpoint for which the cluster instance resides."
  - name: order
    description: "The relative preference with which the device selects the source to
      provide power. A source with a lower order is selected by the device to provide power
      before any other source with a higher order, if the lower-order source is available."
  - name: status
    description: "The participation of the power source in providing power to the node,
      as specified in [PowerSourceStatusEnum][PowerSourceTrait.PowerSourceStatusEnum]."
  - name: wiredAssessedCurrent
    description: "The assessed instantaneous current draw of the device on the hard-wired source,
      in milliamps. A value of null indicates the device is currently unable to assess
      the value. If the wired source is not connected, but the device is still able to assess
      a value, then the assessed value can be reported."
  - name: wiredAssessedInputFrequency
    description: "The assessed frequency of the voltage, currently provided by the
      hard-wired source, in Hz. A value of null indicates that the device is currently unable
      to assess the value. If the wired source is not connected, but the device
      is still able to assess a value, then the assessed value can be reported."
  - name: wiredAssessedInputVoltage
    description: "The assessed RMS or DC voltage currently provided by the hard-wired source, in
      millivolts. A value of null indicates that the device is currently unable to assess the
      value. If the wired source is not connected, but the device is still able to assess a value,
      then the assessed value can be reported."
  - name: wiredCurrentType
    description: "The type of current that the device expects to be provided by
      the hard-wired source, as specified in
      [WiredCurrentTypeEnum][PowerSourceTrait.WiredCurrentTypeEnum]."
  - name: wiredNominalVoltage
    description: "The nominal voltage in millivolts, given in the device's regulatory
      compliance label, expected to be provided by the hard-wired source."
  - name: wiredMaximumCurrent
    description: "The maximum current in milliamps, given in the device's regulatory
      compliance label, expected to be provided by the hard-wired source."
  - name: wiredPresent
    description: "Indicates if the device detects that the hard-wired power source is
      properly connected."

  # PowerSource bitmaps
  bitmaps:
  - name: Feature
    description: "PowerSource trait FeatureMap."
    value:
    - name: kBattery
      description: "The power source is a battery."
