    - name: kAverageMeasurement
      description: "Device supports the average numeric measurement of substance."
    - name: kCriticalLevel
      description: "Device supports the Critical concentration Level."
    - name: kLevelIndication
      description: "Device supports basic level indication for substance using the
        [LevelValueEnum][CarbonDioxideConcentrationMeasurementTrait.LevelValueEnum]."
    - name: kMediumLevel
      description: "Device supports the Medium concentration Level."
    - name: kNumericMeasurement
      description: "Device supports numeric measurement of substance."
    - name: kPeakMeasurement
      description: "Device supports peak numeric measurement of substance."

CarbonMonoxideConcentrationMeasurement:
  description: "This trait provides an interface to carbon monoxide concentration measurement
    functionality."

  # CarbonMonoxideConcentrationMeasurement attributes
  attributes:
  - name: averageMeasuredValue
    description: "The average value of [measuredValue]
      [CarbonMonoxideConcentrationMeasurementTrait.Attributes.measuredValue]
      measured during the [averageMeasuredValueWindow]
      [CarbonMonoxideConcentrationMeasurementTrait.Attributes.averageMeasuredValueWindow]."
  - name: averageMeasuredValueWindow
    description: "The window of time, in seconds, used to measure the [averageMeasuredValue]
      [CarbonMonoxideConcentrationMeasurementTrait.Attributes.averageMeasuredValue]."
  - name: levelValue
    description: "The level of the substance detected."
  - name: maxMeasuredValue
    description: "The maximum value of [measuredValue]
      [CarbonMonoxideConcentrationMeasurementTrait.Attributes.measuredValue]
      that can be measured."
  - name: measuredValue
    description: "The most recent measurement as a single-precision floating-point number, in units
      specified by
      [measurementUnit][CarbonMonoxideConcentrationMeasurementTrait.Attributes.measurementUnit]."
  - name: measurementMedium
    description: "The medium in which
      [measuredValue][CarbonMonoxideConcentrationMeasurementTrait.Attributes.measuredValue]
      is being measured."
  - name: measurementUnit
    description: "The unit used by
      [measuredValue][CarbonMonoxideConcentrationMeasurementTrait.Attributes.measuredValue]."
  - name: minMeasuredValue
    description: "The minimum value of [measuredValue]
      [CarbonMonoxideConcentrationMeasurementTrait.Attributes.measuredValue]
      that can be measured."
  - name: peakMeasuredValue
    description: "The maximum value of [measuredValue]
      [CarbonMonoxideConcentrationMeasurementTrait.Attributes.measuredValue]
      that has been measured during the [peakMeasuredValueWindow]
      [CarbonMonoxideConcentrationMeasurementTrait.Attributes.peakMeasuredValueWindow]."
  - name: peakMeasuredValueWindow
    description: "The window of time, in seconds, used to determine the [peakMeasuredValue]
      [CarbonMonoxideConcentrationMeasurementTrait.Attributes.peakMeasuredValue]."
  - name: uncertainty
    description: "The range of error or deviation that can be found in [measuredValue]
      [CarbonMonoxideConcentrationMeasurementTrait.Attributes.measuredValue]
      and [peakMeasuredValue]
      [CarbonMonoxideConcentrationMeasurementTrait.Attributes.peakMeasuredValue]."

  # CarbonMonoxideConcentrationMeasurement enums
  enums:
  - name: LevelValueEnum
    description: "Level values."
    value:
    - name: kCritical
      description: "Critical."
    - name: kHigh
      description: "High."
    - name: kLow
      description: "Low."
    - name: kMedium
      description: "Medium."
    - name: kUnknown
      description: "Unknown."
  - name: MeasurementMediumEnum
    description: "Mediums in which measurements are taken."
    value:
    - name: kAir
      description: "Air."
    - name: kSoil
      description: "Soil."
    - name: kWater
      description: "Water."
  - name: MeasurementUnitEnum
    description: "Measurement units."
    value:
    - name: kBQM3
      description: "Becquerels per cubic meter."
    - name: kMGM3
      description: "Milligrams per cubic meter."
    - name: kNGM3
      description: "Nanogram per cubic meter."
    - name: kPM3
      description: "Particles per cubic meter."
    - name: kPPB
      description: "Parts per billion."
    - name: kPPM
      description: "Parts per million."
    - name: kPPT
      description: "Parts per trillion."
    - name: kUGM3
      description: "Micrograms per cubic meter."

  # CarbonMonoxideConcentrationMeasurement bitmaps
  bitmaps:
  - name: Feature
    description: "CarbonMonoxideConcentrationMeasurement cluster FeatureMap."
    value:
    - name: kAverageMeasurement
      description: "Device supports the average numeric measurement of substance."
    - name: kCriticalLevel
      description: "Device supports the Critical concentration Level."
    - name: kLevelIndication
      description: "Device supports basic level indication for substance using the
        [LevelValueEnum][CarbonMonoxideConcentrationMeasurementTrait.LevelValueEnum]."
    - name: kMediumLevel
      description: "Device supports the Medium concentration Level."
    - name: kNumericMeasurement
      description: "Device supports numeric measurement of substance."
    - name: kPeakMeasurement
      description: "Device supports peak numeric measurement of substance."

Channel:
  description: "This trait provides an interface for selecting channels on a device or endpoint."

  # Channel attributes
  attributes:
  - name: channelList
    description: "A list of the supported channels."
  - name: lineup
    description: "A reference to an external source of channel lineup information."
  - name: currentChannel
    description: "The currently selected channel."

  # Channel commands
  commands:
  - name: ChangeChannelByNumber
    description:
    - "Change the channel to the channel specified by `majorNumber` and `minorNumber`."
    param:
    - name: majorNumber
      description: "The channel major number value to which the channel should change, in ATSC
        format."
    - name: minorNumber
      description: "The channel minor number value to which the channel should change, in ATSC
        format."
  - name: ChangeChannel
    description:
    - "Change the channel to the specified channel."
    param:
    - name: match
      description: "A string used to identify the intended channel, which may be a call sign, a
        name, or a number."
    response:
      description: "The status of the `ChangeChannel` command."
      param:
      - name: data
        description: "App-specific data pertaining to the `ChangeChannel` command."
      - name: status
        description: "The status of the `ChangeChannel` command."
  - name: SkipChannel
    description:
    - "Provides channel up and channel down functionality, by allowing the index of the selected
        channel to jump by the specified number of steps."
    param:
    - name: count
      description: "When positive, `count` specifies the number of steps to increase the current
        channel number. When negative, it specifies the number of steps to decrease the current
        channel number."
  - name: GetProgramGuide
    description:
    - "Retrieves the program guide."
    param:
    - name: startTime
      description: "The beginning of the time window for which program guide entries are to be
        retrieved, as a UTC time."
    - name: endTime
      description: "The end of the time window for which program guide entries are to be retrieved,
        as a UTC time."
    - name: channelList
      description: "The set of channels for which program guide entries should be fetched."
    - name: pageToken
      description: "The pagination token used for managing pagination progression."
    - name: recordingFlag
      description: "The flags of the programs for which entries should be fetched."
    - name: externalIdList
      description: "The list of additional external content identifiers."
    - name: data
      description: "Optional app-specific data."
    response:
      description: "The program guide response."
      param:
      - name: paging
        description: "The necessary pagination attributes that defines information for both the
          succeeding and preceding data pages."
      - name: programList
        description: "The list of programs."
  - name: RecordProgram
    description:
    - "Record a specific program or series when it goes live."
    param:
    - name: programIdentifier
      description: "The program identifier for the program that should be recorded."
    - name: shouldRecordSeries
      description: "Whether the whole series associated to the program should be recorded."
    - name: externalIdList
      description: "The list of additional external content identifiers."
    - name: data
      description: "Optional app-specific data."
  - name: CancelRecordProgram
    description:
    - "Cancel recording for a specific program or series."
    param:
    - name: programIdentifier
      description: "The program identifier for the program that should be cancelled from recording."
    - name: shouldRecordSeries
      description: "Whether the whole series associated to the program should be cancelled from
        recording."
    - name: externalIdList
      description: "The list of additional external content identifiers."
    - name: data
      description: "Optional app-specific data."

  # Channel bitmaps
  bitmaps:
  - name: Feature
    description: "Channel cluster FeatureMap."
    value:
    - name: kChannelList
      description: "Device provides a list of available channels."
    - name: kLineupInfo
      description: "Device provides a reference to an external source of lineup information."
    - name: kElectronicGuide
      description: "Provides electronic program guide information."
    - name: kRecordProgram
      description: "Provides ability to record program."
  - name: RecordingFlagBitmap
    description: "Recording flags."
    value:
    - name: kScheduled
      description: "The program is scheduled for recording."
    - name: kRecordSeries
      description: "The program series is scheduled for recording."
    - name: kRecorded
      description: "The program is recorded and available to be played."

  # Channel enums
  enums:
  - name: StatusEnum
    description: "Statuses for channel selection commands."
    value:
    - name: kMultipleMatches
      description: "More than one match for the specified channel was found."
    - name: kNoMatches
      description: "No matches for the specified channel were found."
    - name: kSuccess
      description: "The command succeeded."
  - name: LineupInfoTypeEnum
    description: "Types of lineup information."
    value:
    - name: kMSO
      description: "Multi-system Operator."
  - name: ChannelTypeEnum
    description: "Types of channels."
    value:
    - name: kSatellite
      description: "The channel is sourced from a satellite provider."
    - name: kCable
      description: "The channel is sourced from a cable provider."
    - name: kTerrestrial
      description: "The channel is sourced from a terrestrial provider."
    - name: kOTT
      description: "The channel is sourced from an OTT provider."

  # Channel structs
  structs:
  - name: ChannelInfoStruct
    description: "A channel in a channel lineup."
    value:
    - name: affiliateCallSign
      description: "The local affiliate call sign of channel."
    - name: callSign
      description: "The call sign of the channel."
    - name: identifier
      description: "The unique identifier for a specific channel."
    - name: majorNumber
      description: "The channel major number value, in ATSC format."
    - name: minorNumber
      description: "The channel minor number value, in ATSC format."
    - name: name
      description: "The name of the channel."
    - name: type
      description: "The type or grouping of a specific channel."
  - name: LineupInfoStruct
    description: "A channel lineup."
    value:
    - name: lineupInfoType
      description: "The type of lineup information. Valid values are defined in
        [LineupInfoTypeEnum]."
    - name: lineupName
      description: "The name of the operator lineup."
    - name: operatorName
      description: "The name of the operator."
    - name: postalCode
      description: "The postal code for the operator."
  - name: ProgramStruct
    description: "A program within an electronic program guide (EPG)."
    value:
    - name: identifier
      description: "A unique identifier for a program within an electronic program guide list."
    - name: channel
      description: "The channel associated to the program."
    - name: startTime
      description: "The start time of a program, as a UTC time."
    - name: endTime
      description: "The end time of a program, as a UTC time."
    - name: title
      description: "The title or name for the specific program."
    - name: subtitle
      description: "The subtitle for the specific program."
    - name: description
      description: "The brief description for the specific program."
    - name: audioLanguages
      description: "The audio language for the specific program."
    - name: ratings
      description: "Indicating the level of parental guidance recommended for a particular program."
    - name: thumbnailUrl
      description: "A URL of a thumbnail that clients can use to render an image for the program."
    - name: posterArtUrl
      description: "A URL of a poster that clients can use to render an image for the program on
        the detail view."
    - name: dvbiUrl
      description: "The DVB-I URL associated to the program."
    - name: releaseDate
      description: "The date on which the program was released."
    - name: parentalGuidanceText
      description: "Additional information on the parental guidance."
    - name: recordingFlag
      description: "The recording status of the program."
    - name: seriesInfo
      description: "The information of a series such as season and episode number."
    - name: categoryList
      description: "The category of a particular program."
    - name: castList
      description: "A list of the cast or the crew on the program."
    - name: externalIdList
      description: "The list of additional external content identifiers."
  - name: ProgramCategoryStruct
    description: "The category associated to a program."
    value:
    - name: category
      description: "The category or genre of the program."
    - name: subCategory
      description: "The sub-category or sub-genre of the program."
  - name: SeriesInfoStruct
    description: "The episode information related to a program."
    value:
    - name: season
      description: "The season of the series associated to the program."
    - name: episode
      description: "The episode of the program."
  - name: ProgramCastStruct
    description: "The cast information related to a program."
    value:
    - name: name
      description: "The name of the cast member."
    - name: role
      description: "The role of the cast member."
  - name: PageTokenStruct
    description: "The pagination structure."
    value:
    - name: limit
      description: "The maximum number of entries that should be retrieved from the program guide
        in a single response."
    - name: after
      description: "The cursor that pinpoints the start of the upcoming data page."
    - name: before
      description: "The cursor that pinpoints the end of the upcoming data page."
  - name: ChannelPagingStruct
    description: "The paging structure that includes the previous and next pagination tokens."
    value:
    - name: previousToken
      description: "The token to retrieve the preceding page."
    - name: nextToken
      description: "The token to retrieve the next page."
  - name: AdditionalInfoStruct
    description: "Additional name-value pairs that can be used to identify content."
    value:
    - name: name
      description: "The name of the external ID."
    - name: value
      description: "The value of the external ID."

Chime:
  description: "This trait provides an interface for controlling the chime on a device, and
    is a custom version of the Chime standard Matter cluster."

  # Chime attributes
  attributes:
  - name: enabled
    description: "Whether chime sounds can currently be played."
  - name: externalChime
    description: "Indicates which type of external chime is installed."
  - name: externalChimeDurationSeconds
    description: "The duration of the external chime in seconds, if supported."
  - name: installedChimeSounds
    description: "All installed chime sounds, represented by a list
      of chime sounds. Each entry in this list has a unique `ChimeID` value and a
      unique `Name` value."
  - name: selectedChime
    description: "The currently selected chime sound that will be played."

  # Chime commands
  commands:
  - name: PlayChimeSound
    description:
    - "Play the currently selected chime."

  # Chime enums
  enums:
  - name: ExternalChimeType
    description: "Type of external chime."
    value:
    - name: kElectronic
      description: "An electronic external chime is installed."
    - name: kMechanical
      description: "A mechanical external chime is installed."
    - name: kNone
      description: "No external chime is installed."

  # Chime structs
  structs:
  - name: ChimeSoundStruct
    description: "A chime sound that can be played."
    value:
    - name: chimeID
      description: "A unique identifier for the chime sound."
    - name: name
      description: "The name of the chime sound."

ChimeThemes:
  description: "This trait provides an interface for changing the chime themes on a device."

  # ChimeThemes attributes
  attributes:
  - name: selectedTimeboxedThemeName
    description: "The current timeboxed theme name."

  # ChimeThemes commands
  commands:
  - name: GetAvailableThemes
    description:
    - "Get the available themes."
    response:
      description: "The list of available themes.
        To see which chime themes are available for a user, create a timebox filter and use
        it to filter the results of this command.
        A theme is considered active
        if the current time is within its `startTimeSeconds` and `endTimeSeconds` values
        in the [ThemeStruct][ChimeThemesTrait.ThemeStruct].
        If a start time isn't set, the theme is considered active from the beginning of time.
        If an end time isn't set, the theme continues to be active indefinitely.
        If both are missing, the theme is always active."

  # ChimeThemes structs
  structs:
  - name: ChimeStruct
    description: "A chime."
    value:
    - name: assetId
      description: "The asset ID."
  - name: ThemeStruct
    description: "A theme."
    value:
    - name: name
      description: "The name of the theme."
    - name: chimeSounds
      description: "The chime sounds of the theme."
    - name: endTimeSeconds
      description: "The time that the theme ends."
    - name: startTimeSeconds
      description: "The time that the theme starts."

Clip:
  description: "This trait supports devices that have the capability to save a video clip or to
    take a screenshot."

  # Clip attributes
  attributes:
  - name: canSaveVideoClip
    description: "Device can save a video clip."
  - name: canTakeScreenshot
    description: "Device can take a screenshot."
  - name: supportUserDefinedClipLength
    description: "User can specify a length for the clip they want to save."
  - name: maxClipLengthSeconds
    description: "Maximum duration, in seconds, for a clip."

  # Clip commands
  commands:
  - name: SaveScreenshot
    description:
    - "Save a screenshot."
  - name: SaveVideoClip
    description:
    - "Save a video clip."
    param:
    - name: durationSeconds
      description: "The length of the clip, in seconds, the user wants to save."

ClosureControl:
  description: "This trait provides an interface for controlling a closure."

  # ClosureControl attributes
  attributes:
  - name: countdownTime
    description: "The estimated time remaining, in seconds, before the operation is complete.
      A value of 0 means that the operation has completed. A value of null means that there
      is no time defined until the operation is complete."
  - name: currentErrorList
    description: "A list of active errors. An empty list indicates that there are no active errors."
  - name: latchControlModes
    description: "Whether the latch mechanism can be latched or unlatched remotely."
  - name: mainState
    description: "The current operational state of the closure."
  - name: overallCurrentState
    description: "The current `Position`, `Latch`, and `Speed` states, whichever are applicable
      based on the feature flags set. A null value means that the states are not known."
  - name: overallTargetState
    description: "The `TargetPosition`, `TargetLatch`, `TargetSpeed` values,
      whichever are applicable according to the feature flags set.
      A null value means that the values are not known."

  # ClosureControl bitmaps
  bitmaps:
  - name: Feature
    description: "ClosureControl trait FeatureMap."
    value:
    - name: kCalibration
      description: "The closure can trigger a calibration procedure."
    - name: kInstantaneous
      description: "The closure is capable of changing its position or state instantaneously."
    - name: kManuallyOperable
      description: "The closure can be operated manually by a user, such as to open or close a
        window."
    - name: kMotionLatching
      description: "The closure can be latched and unlatched. When the closure is latched,
        this feature secures an axis, preventing associated actuators from moving components
        along that axis."
    - name: kPositioning
      description: "The closure can be set to discrete positions, including at minimum the
        `FullyOpen` and `FullyClosed` positions."
    - name: kProtection
      description: "The closure is capable of activating a form of protection, such as protection
        against wind. A protection is manufacturer-specific."
    - name: kSpeed
      description: "The closure supports configurable speed during motion toward a
        target position. This feature uses the values in
        [ThreeLevelAutoEnum][ClosureControlTrait.ThreeLevelAutoEnum] to set the supported
        speed levels."
    - name: kVentilation
      description: "The closure can be set to a designated ventilation position, for example
        partially open."
    - name: kPedestrian
      description: "The closure can be set to a dedicated pedestrian position that provides a clear
        walkway through the closure."
  - name: LatchControlModesBitmap
    description: "ClosureControl trait `LatchControlModesBitmap`."
    value:
    - name: kRemoteLatching
      description: "Whether the latch can be latched remotely."
    - name: kRemoteUnlatching
      description: "Whether the latch can be unlatched remotely."

  # ClosureControl commands
  commands:
  - name: Calibrate
    description:
    - "Initiates a calibration of the closure. Procedures of how to achieve the calibration are
         manufacturer-specific."
  - name: MoveTo
    description:
    - "The closure updates its position, latch state and motion speed."
    param:
    - name: position
      description: "The target position of the closure."
    - name: latch
      description: "The target latch state of the closure."
    - name: speed
      description: "The target speed of the closure."
  - name: Stop
    description:
    - "Stops the closure."

  # ClosureControl enums
  enums:
  - name: CurrentPositionEnum
    description: "The current position of the closure."
    value:
    - name: kFullyClosed
      description: "The closure is fully closed."
    - name: kFullyOpened
      description: "The closure is fully open."
    - name: kOpenedAtSignature
      description: "The signature allows a pre-recorded manufacturer- or installer-defined
        position to be reached."
    - name: kOpenedForPedestrian
      description: "The closure is in the pedestrian position."
    - name: kOpenedForVentilation
      description: "The closure is in the ventilation position."
    - name: kPartiallyOpened
      description: "The closure is in a partially opened state."
  - name: ClosureErrorEnum
    description: "Error states that can be reported by the closure.
      The value range of 0x00 to 0x7F is for general errors, and the range of 0x80 to 0xBF is
      for vendor-specific errors."
    value:
    - name: kBlockedBySensor
      description: "The closure is unsafe to move, as determined by a
        sensor, such as a photoelectric sensor."
    - name: kInternalInterference
      description: "An internal element is prohibiting motion. For example this could be an
        integrated door that is open within a larger garage door so that the garage
        door is prevented from moving."
    - name: kMaintenanceRequired
      description: "Applies when malfunctions that are not easily recoverable are detected, or
        when urgent servicing is needed."
    - name: kPhysicallyBlocked
      description: "An obstacle is blocking the closure movement."
    - name: kTemperatureLimited
      description: "A warning raised by the closure that indicates an over-temperature,
         possibly caused by an excessive drive or a stall current."
  - name: MainStateEnum
    description: "The current operational state of the closure."
    value:
    - name: kCalibrating
      description: "The closure is currently calibrating its Opened and Closed limits
        to determine effective physical range."
    - name: kDisengaged
      description: "The closure has a disengaged element that is preventing any actuator movements."
    - name: kError
      description: "The closure is in an error state."
    - name: kMoving
      description: "The closure is moving."
    - name: kProtected
      description: "Some protective measures are activated to prevent damage to the closure.
        Some commands may be rejected."
    - name: kSetupRequired
      description: "Movement commands are ignored since the closure is not operational
        and requires further setup or calibration."
    - name: kStopped
      description: "The closure is stopped."
    - name: kWaitingForMotion
      description: "The closure is waiting for motion."
  - name: TargetPositionEnum
    description: "The target position of the closure."
    value:
    - name: kMoveToFullyClosed
      description: "The closure will move to the fully closed position."
    - name: kMoveToFullyOpen
      description: "The closure will move to the fully opened position."
    - name: kMoveToSignaturePosition
      description: "The closure will move to the pre-recorded manufacturer- or installer-defined
        position."
    - name: kMoveToPedestrianPosition
      description: "The closure will move to the pedestrian position."
    - name: kMoveToVentilationPosition
      description: "The closure will move to the ventilation position."
  - name: ThreeLevelAutoEnum
    description: "Used to set the speed of the closure."
    value:
    - name: kAuto
      description: "Auto."
    - name: kHigh
      description: "High."
    - name: kLow
      description: "Low."
    - name: kMedium
      description: "Medium."

  # ClosureControl events
  events:
  - name: EngageStateChanged
    description: "Generated when the `MainStateEnum` attribute changes state to and from
      `Disengaged`, indicating if the actuator is engaged or disengaged."
    value:
    - name: engageValue
      description: "Whether the actuator is in an engaged state, making actuator movements possible,
        or in a disengaged state, rendering the actuator immobile."
  - name: MovementCompleted
    description: "Indicates that an overall operation has ended, either successfully or otherwise.
      For example, this event gets sent upon the completion of a movement operation
      of blinds or curtains."
  - name: OperationalError
    description: "A reportable error condition has been detected."
    value:
    - name: errorState
      description: "A list of error states of the closure, based on
        [ClosureErrorEnum][ClosureControlTrait.ClosureErrorEnum]."
  - name: SecureStateChanged
    description: "Generated when the `SecureState` field in the `OverallCurrentState`
      attribute changes, and is used to indicate whether a closure is securing a space
      against possible unauthorized entry."
    value:
    - name: secureValue
      description: "Whether the closure is in a secure state."

  # ClosureControl structs
  structs:
  - name: OverallCurrentStateStruct
    description: "The current state of the closure."
    value:
    - name: latch
      description: "The current latch state of the closure. A null value indicates that the
        state is not known."
    - name: position
      description: "The current Position state of the closure, as defined in the
        [CurrentPositionEnum][ClosureControlTrait.CurrentPositionEnum]."
    - name: secureState
      description: "The current secure state of the closure. A secure state requires the closure to
        meet both of the following conditions defined by the
        [OverallCurrentStateStruct][ClosureControlTrait.OverallCurrentStateStruct]:
        <ul>
          <li>If the `Positioning` feature is supported, then the Position field
              of `OverallCurrentState` is `FullyClosed`.</li>
          <li>If the `MotionLatching` feature is supported, then the `Latch` field
          ` of OverallCurrentState`is `True`.</li>
        </ul>"
    - name: speed
      description: "The current speed state of the closure, as defined in the
        [ThreeLevelAutoEnum][ClosureControlTrait.ThreeLevelAutoEnum]."
  - name: OverallTargetStateStruct
    description: "The target state of the closure."
    value:
    - name: latch
      description: "The desired latching state of the closure. A null value indicates that
        there is no desired latching state."
    - name: position
      description: "The target position that the closure is moving to. A null value indicates there
        is no target position."
    - name: speed
      description: "The desired speed at which the closure should perform the movement toward the
        target position. If no speed value has yet been set, the server sets one of
        the speed values defined in
        [ThreeLevelAutoEnum][ClosureControlTrait.ThreeLevelAutoEnum]."

ClosureDimension:
  description: "This trait provides an interface for controlling a single degree of freedom
    (also referred to as a *dimension* or an *axis*) of a composed closure. Some device types
    may define that a Closure Dimension trait instance is associated with a
    corresponding Closure Control trait instance on the same device. In such cases,
    the Closure Dimension trait does not operate independently, rather, it relies on
    the Closure Control trait for supervisory logic."

  # ClosureDimension attributes
  attributes:
  - name: currentState
    description: "The current state of the closure dimension, including its `Latch`, `Position`,
      and `Speed`, as defined in the
      [DimensionStateStruct][ClosureDimensionTrait.DimensionStateStruct]."
  - name: latchControlModes
    description: "Whether the latch mechanism can be latched or unlatched remotely, as defined
      in the [LatchControlModesBitmap][ClosureDimensionTrait.LatchControlModesBitmap]."
  - name: limitRange
    description: "The range of possible values for the `Position` field in the `CurrentState`
      attribute."
  - name: modulationType
    description: "The modulation type of the closure dimension, as defined in the
      [ModulationTypeEnum][ClosureDimensionTrait.ModulationTypeEnum]."
  - name: overflow
    description: "The overflow direction of the closure, as defined in the
      [OverflowEnum][ClosureDimensionTrait.OverflowEnum]."
  - name: resolution
    description: "The minimal acceptable change to the `Position` field of the `targetState`
      and `currentState` attributes. Resolution gives a collection of valid current position
      points over a linear ruler. A resolution of 100% means that the associated dimension
      cannot be placed in an intermediate position because its position is binary."
  - name: rotationAxis
    description: "The axis of rotation for the closure dimension, as defined in the
      [RotationAxisEnum][ClosureDimensionTrait.RotationAxisEnum]."
  - name: stepValue
    description: "The size of a single step, in hundredths of a percent. The value of this attribute
      is an integer multiple of the `resolution` attribute."
  - name: targetState
    description: "The target state of the closure dimension, including its `Latch`, `Position`,
      and `Speed`, as defined in the
      [DimensionStateStruct][ClosureDimensionTrait.DimensionStateStruct]."
  - name: translationDirection
    description: "The direction of translation for the closure dimension, as defined in the
      [TranslationDirectionEnum][ClosureDimensionTrait.TranslationDirectionEnum]."
  - name: unit
    description: "The unit related to the position of the closure, where the unit is defined in
      [ClosureUnitEnum][ClosureDimensionTrait.ClosureUnitEnum]. "
  - name: unitRange
    description: "The physical range of the closure's movement, expressed as minimum and maximum
      values of the unit of measurement.
      The unit of measurement is specified by the `unit` attribute.
      The unit range is determined by the values stored in
      the `min` and `max` fields of the [UnitRangeStruct][ClosureDimensionTrait.UnitRangeStruct]."

  # ClosureDimension bitmaps
  bitmaps:
  - name: Feature
    description: "ClosureDimension cluster FeatureMap."
    value:
    - name: kModulation
      description: "Supports the panel modifying its aspect to control a particular flow,
        such as light, air, or privacy. The possible modulation types include slats orientation,
        slats openwork, stripes alignment, opacity, and ventilation."
    - name: kMotionLatching
      description: "Supports a latch to secure the closure to a position or state.
        An axis with this feature prevents actuators from
        moving along parts of the axis if the dimension is latched."
    - name: kLimitation
      description: "Supports degradation of its functioning.
        The reachable-position range can be limited compared to the full scope
        of a nominal behavior."
    - name: kPositioning
      description: "Supports positioning in the range of 0.00% to 100.00%."
    - name: kRotation
      description: "Supports the panel rotating around a single axis. The possible axes
        include left, right, top, bottom, centered vertical, and centered horizontal."
    - name: kSpeed
      description: "Supports speed motion throttling."
    - name: kTranslation
      description: "Supports the panel moving along a single axis. The possible directions
        of movement include downward, upward, leftward, rightward, forward, and backward."
    - name: kUnit
      description: "Provides additional information about the closure dimension's
        possible range of movement."
  - name: LatchControlModesBitmap
    description: "Describes the latch control modes supported by the closure dimension."
    value:
    - name: kRemoteLatching
      description: "Whether the latch can be latched remotely."
    - name: kRemoteUnlatching
      description: "Whether the latch can be unlatched remotely."

  # ClosureDimension commands
  commands:
  - name: SetTarget
    description:
    - "Moves a dimension of the closure to a target position."
    param:
    - name: latch
      description: "The desired latching state of the closure, as defined in
        the [OverallCurrentStateStruct][ClosureControlTrait.OverallCurrentStateStruct]
        `Latch` field."
    - name: position
      description: "The target position in hundredths of a percent of the closure."
    - name: speed
      description: "The desired speed of the closure, as defined in
        [ThreeLevelAutoEnum][ClosureDimensionTrait.ThreeLevelAutoEnum] enum."
  - name: Step
    description:
    - "Moves a dimension of the closure by a specified number of steps
       to a target position."
    param:
    - name: direction
      description: "Indicates whether the `Position` field of the `TargetState` attribute must be
        increased toward 100.00% or decreased toward 0.00%."
    - name: numberOfSteps
      description: "The number of steps by which the position should be changed. The size of
        one step, given in hundredths of a percent, is determined by the `stepValue` attribute."
    - name: speed
      description: "The desired speed of the closure, as defined in
        [ThreeLevelAutoEnum][ClosureDimensionTrait.ThreeLevelAutoEnum] enum."

  # ClosureDimension enums
  enums:
  - name: ClosureUnitEnum
    description: "Describes the units of measure for a dimension of a composed closure.
      The unit range is determined by the values stored in the `min` and `max` fields of the
      [UnitRangeStruct][ClosureDimensionTrait.UnitRangeStruct]."
    value:
    - name: kDegree
      description: "Degree used as unit."
    - name: kMillimeter
      description: "Millimeter used as unit."
  - name: ModulationTypeEnum
    description: "Describes the modulation type of a composed closure."
    value:
    - name: kOpacity
      description: "Opacity of a surface."
    - name: kStripesAlignment
      description: "Alignment of blind stripes."
    - name: kSlatsOrientation
      description: "Orientation of slats in a surface."
    - name: kSlatsOpenwork
      description: "Aperture of the slats."
    - name: kVentilation
      description: "Ventilation control."
  - name: OverflowEnum
    description: "Describes the overflow state of a composed closure."
    value:
    - name: kBottomInside
      description: "Bottom inside overflow. The panel pivots along its bottom edge, opening inward
        toward the interior of the room."
    - name: kBottomOutside
      description: "Bottom outside overflow. The panel pivots along its bottom edge, opening outward
        away from the interior of the room."
    - name: kLeftInside
      description: "Left inside overflow. The left-hung panel opens inward, pivoting from the right
        toward the interior of the room."
    - name: kLeftOutside
      description: "Left outside overflow. The panel opens outward, pivoting from the right
        exterior of the building."
    - name: kInside
      description: "Inside overflow. The panel opens inward, pivoting from the outside toward the
        interior side."
    - name: kNoOverflow
      description: "No overflow."
    - name: kOutside
      description: "Outside overflow. The panel opens outward, pivoting from the inside away
        from the interior side."
    - name: kRightInside
      description: "Right inside overflow. The right-hung panel opens inward, pivoting from the left
        toward the interior of the room."
    - name: kRightOutside
      description: "Right outside overflow. The panel opens outward, pivoting
        from the left toward the exterior of the building."
    - name: kTopInside
      description: "Top inside overflow. The panel pivots along its top edge, opening inward toward
        the interior of the room."
    - name: kTopOutside
      description: "Top outside overflow. The panel pivots along its top edge, opening outward away
        from the interior of the room."
  - name: RotationAxisEnum
    description: "Describes the axis of rotation of a panel."
    value:
    - name: kBottom
      description: "The panel rotates around a horizontal axis located on the bottom of the panel."
    - name: kCenteredHorizontal
      description: "The panel rotates around a horizontal axis located in the center of the panel."
    - name: kCenteredVertical
      description: "The panel rotates around a vertical axis located in the center of the panel."
    - name: kLeft
      description: "The panel rotates around a vertical axis located on the left side of the panel."
    - name: kLeftBarrier
      description: "The barrier tilts around an axis located at the left end of the barrier."
    - name: kLeftAndRight
      description: "The panel rotates around two vertical axes, one on the left side and one on the
        right side of the panel."
    - name: kLeftAndRightBarriers
      description: "The dual barriers tilt around axes located at each side of
        the composite barrier."
    - name: kRight
      description: "The panel rotates around a vertical axis located on the right side
        of the panel."
    - name: kRightBarrier
      description: "The barrier tilts around an axis located on the right barrier of the
        panel."
    - name: kTop
      description: "The panel rotates around a horizontal axis located on the top of the panel."
    - name: kTopAndBottom
      description: "The panel rotates around two horizontal axes, one on the top and one on the
        bottom of the panel."
  - name: StepDirectionEnum
    description: "Describes the direction of a step motion for a composed closure."
    value:
    - name: kDecrease
      description: "Decrease imcrementally toward the fully closed closure position (0.00%)."
    - name: kIncrease
      description: "Increase incrementally toward the fully open closure position (100.00%)."
  - name: ThreeLevelAutoEnum
    description: "Used to set the speed of the closure."
    value:
    - name: kAuto
      description: "Auto."
    - name: kHigh
      description: "High."
    - name: kLow
      description: "Low."
    - name: kMedium
      description: "Medium."
  - name: TranslationDirectionEnum
    description: "Describes the direction of translation for a composed closure."
    value:
    - name: kBackward
      description: "Backward translation."
    - name: kDepthMask
      description: "Depth mask translation."
    - name: kDepthSymmetry
      description: "Depth symmetry translation."
    - name: kDownward
      description: "Downward translation."
    - name: kForward
      description: "Forward translation."
    - name: kHorizontalMask
      description: "Horizontal mask translation."
    - name: kHorizontalSymmetry
      description: "Horizontal symmetry translation."
    - name: kLeftward
      description: "Leftward translation."
    - name: kRightward
      description: "Rightward translation."
    - name: kUpward
      description: "Upward translation."
    - name: kVerticalMask
      description: "Vertical mask translation."
    - name: kVerticalSymmetry
      description: "Vertical symmetry translation."

  # ClosureDimension structs
  structs:
  - name: DimensionStateStruct
    description: "Describes the current state of a dimension of a composed closure."
    value:
    - name: latch
      description: "The latching state of the closure. A null value indicates that the latching
        state is not known or is not set."
    - name: position
      description: "The position of the closure, expressed as a percentage from 0.00% to 100.00%."
    - name: speed
      description: "The speed of the closure, as defined in the
        [ThreeLevelAutoEnum][ClosureDimensionTrait.ThreeLevelAutoEnum]."
  - name: RangePercent100thsStruct
    description: "Defines an operational range, from a minimum to a maximum percentage.
       for a dimension of a closure."
    value:
    - name: max
      description: "The maximum value in hundredths of a percent, ranging from `min` to 100.00%."
    - name: min
      description: "The minimum value in hundredths of a percent, ranging from 0.00% to `max`."
  - name: UnitRangeStruct
    description: "Defines an operational range, from a minimum to a maximum value, for a dimension
       of a closure."
    value:
    - name: max
      description: "The maximum value of the operational range for this dimension, where the
         unit of measurement is specified by
         [ClosureUnitEnum][ClosureDimensionTrait.ClosureUnitEnum]. The value of `max` must be
         greater than or equal to the value of `min` and less than or equal to 32767.
         The default value is 1."
    - name: min
      description: "The minimum value of the operational range for this dimension,
        where the unit of measurement is specified by
        [ClosureUnitEnum][ClosureDimensionTrait.ClosureUnitEnum]. The value of `min` must be
        less than or equal to the value of `max` and greater than or equal to -32768.
        The default value is 0."

ColorControl:
  description: "This trait provides an interface for changing the color of a light."

  # ColorControl attributes
  attributes:
  - name: colorCapabilities
    description: "The color capabilities that the device supports. This is a bitmap that corresponds
      to the values in [ColorControlTrait.ColorCapabilities]."
  - name: colorLoopActive
    description: "The current active status of the color loop. A value of `1` indicates an active
      color loop. A value of `0` indicates an inactive color loop."
  - name: colorLoopDirection
    description: "The current direction of the color loop. If the value is `1`, the
      [enhancedCurrentHue] attribute is incremented. If the value is `0`, the
      [enhancedCurrentHue] attribute is decremented."
  - name: colorLoopStartEnhancedHue
    description: "The value of the [enhancedCurrentHue] attribute from which to start the color
      loop."
  - name: colorLoopStoredEnhancedHue
    description: "The value of the [enhancedCurrentHue] attribute before the color loop was
      started. `enhancedCurrentHue` is changed back to this value once the color loop is complete."
  - name: colorLoopTime
    description: "The number of seconds it takes to perform a full color loop."
  - name: colorMode
    description: "The attributes that are currently determining the color of the device. Must be one
      of the values in the [ColorMode][ColorControlTrait.ColorMode] enum."
  - name: colorPointBX
    description: "The normalized chromaticity value `x` for this primary, as defined in the CIE xyY
      Color Space, of the current blue color point of the device."
  - name: colorPointBY
    description: "The normalized chromaticity value `y` for this primary, as defined in the CIE xyY
      Color Space, of the current blue color point of the device."
  - name: colorPointBIntensity
    description: "A representation of the relative intensity of the blue color point as defined in
      the Dimming Light Curve in the [BallastConfiguration] cluster, normalized such that the
      color point with the highest relative intensity contains the value `0xfe`. If null, this value
      is invalid."
  - name: colorPointGX
    description: "The normalized chromaticity value `x` for this primary, as defined in the CIE xyY
      Color Space, of the current green color point of the device."
  - name: colorPointGY
    description: "The normalized chromaticity value `y` for this primary, as defined in the CIE xyY
      Color Space, of the current green color point of the device."
  - name: colorPointGIntensity
    description: "A representation of the relative intensity of the green color point as defined in
      the Dimming Light Curve in the [BallastConfiguration] cluster, normalized such that the
      color point with the highest relative intensity contains the value `0xfe`. If null, this value
      is invalid."
  - name: colorPointRX
    description: "The normalized chromaticity value `x` for this primary, as defined in the CIE xyY
      Color Space, of the current red color point of the device."
  - name: colorPointRY
    description: "The normalized chromaticity value `y` for this primary, as defined in the CIE xyY
      Color Space, of the current red color point of the device."
  - name: colorPointRIntensity
    description: "A representation of the relative intensity of the red color point as defined in
      the Dimming Light Curve in the [BallastConfiguration] cluster, normalized such that the
      color point with the highest relative intensity contains the value `0xfe`. If null, this value
      is invalid."
  - name: colorTemperatureMireds
    description: "A scaled inverse of the current value of the color temperature, in mireds."
  - name: colorTempPhysicalMaxMireds
    description: "The maximum mired value supported by the device. This value must be greater than
      or equal to [colorTemperatureMireds]."
  - name: colorTempPhysicalMinMireds
    description: "The minimum mired value supported by the device. This value must be less than or
      equal to [colorTemperatureMireds]."
  - name: compensationText
    description: "A textual indication of what mechanism, if any, is in use to compensate for
      color or intensity drift over time."
  - name: coupleColorTempToLevelMinMireds
    description: "Specifies a lower bound on the value of the [colorTemperatureMireds] attribute for
      the purposes of coupling the `colorTemperatureMireds` attribute to the [currentLevel]
      attribute when the
      [coupleColorTempToLevel][LevelControlTrait.OptionsBitmap.coupleColorTempToLevel] bit
      of the `options` attribute of the [LevelControl] cluster is equal to 1."
  - name: currentHue
    description: "The current hue value of the light. The valid range of values is `0` to `254`."
  - name: currentSaturation
    description: "The current saturation value of the light. The valid range of values is `0` to
      `254`."
  - name: currentX
    description: "The current value of the normalized chromaticity value `x`, as defined in the CIE
      xyY Color Space."
  - name: currentY
    description: "The current value of the normalized chromaticity value `y`, as defined in the CIE
      xyY Color Space."
  - name: driftCompensation
    description: "The mechanism that is in use for compensation for color/intensity drift over
      time."
  - name: enhancedColorMode
    description: "The attributes that are currently determining the color of the device."
  - name: enhancedCurrentHue
    description: "Represents non-equidistant steps along the CIE 1931 color triangle."
  - name: numberOfPrimaries
    description: "The number of color primaries implemented on the device. If null, the number of
      primaries is unknown."
  - name: options
    description: "A bitmap that determines the default behavior of some cluster commands. This
      should only be changed during commissioning. A `ColorControl` command does not continue beyond
      `options` processing if all of the following are true:
      <ul><li>The `OnOff` cluster exists on the same endpoint as this cluster.</li>
        <li>The onOff attribute of the `OnOff` cluster on this endpoint is false.</li>
        <li>The value of the <code>executeIfOff</code> bit is `0`.</li></ul>
      This bitmap has the following valid bits:
      <ul><li>Bit 0 — `ExecuteIfOff`</li></ul>"
  - name: primary1X
    description: "The normalized chromaticity value `x` for this primary, as defined in the CIE xyY
      Color Space."
  - name: primary1Y
    description: "The normalized chromaticity value `y` for this primary, as defined in the CIE xyY
    Color Space."
  - name: primary1Intensity
    description: "A representation of the maximum intensity of this primary as defined in the
      Dimming Light Curve in the [BallastConfiguration] cluster, normalized such that the primary
      with the highest maximum intensity contains the value `0xfe`. If null, this primary is not
      available."
  - name: primary2X
    description: "The normalized chromaticity value `x` for this primary, as defined in the CIE xyY
    Color Space."
  - name: primary2Y
    description: "The normalized chromaticity value `y` for this primary, as defined in the CIE xyY
    Color Space."
  - name: primary2Intensity
    description: "A representation of the maximum intensity of this primary as defined in the
      Dimming Light Curve in the [BallastConfiguration] cluster, normalized such that the primary
      with the highest maximum intensity contains the value `0xfe`. If null, this primary is not
      available."
  - name: primary3X
    description: "The normalized chromaticity value `x` for this primary, as defined in the CIE xyY
    Color Space."
  - name: primary3Y
    description: "The normalized chromaticity value `y` for this primary, as defined in the CIE xyY
    Color Space."
  - name: primary3Intensity
    description: "A representation of the maximum intensity of this primary as defined in the
      Dimming Light Curve in the [BallastConfiguration] cluster, normalized such that the primary
      with the highest maximum intensity contains the value `0xfe`. If null, this primary is not
      available."
  - name: primary4X
    description: "The normalized chromaticity value `x` for this primary, as defined in the CIE xyY
    Color Space."
  - name: primary4Y
    description: "The normalized chromaticity value `y` for this primary, as defined in the CIE xyY
    Color Space."
  - name: primary4Intensity
    description: "A representation of the maximum intensity of this primary as defined in the
      Dimming Light Curve in the [BallastConfiguration] cluster, normalized such that the primary
      with the highest maximum intensity contains the value `0xfe`. If null, this primary is not
      available."
  - name: primary5X
    description: "The normalized chromaticity value `x` for this primary, as defined in the CIE xyY
    Color Space."
  - name: primary5Y
    description: "The normalized chromaticity value `y` for this primary, as defined in the CIE xyY
    Color Space."
  - name: primary5Intensity
    description: "A representation of the maximum intensity of this primary as defined in the
      Dimming Light Curve in the [BallastConfiguration] cluster, normalized such that the primary
      with the highest maximum intensity contains the value `0xfe`. If null, this primary is not
      available."
  - name: primary6X
    description: "The normalized chromaticity value `x` for this primary, as defined in the CIE xyY
    Color Space."
  - name: primary6Y
    description: "The normalized chromaticity value `y` for this primary, as defined in the CIE xyY
    Color Space."
  - name: primary6Intensity
    description: "A representation of the maximum intensity of this primary as defined in the
      Dimming Light Curve in the [BallastConfiguration] cluster, normalized such that the primary
      with the highest maximum intensity contains the value `0xfe`. If null, this primary is not
      available."
  - name: remainingTime
    description: "The time remaining (in 0.1 seconds) until the current command is complete."
  - name: startUpColorTemperatureMireds
    description: "The desired startup color temperature value when a device is supplied with power.
      The [colorTemperatureMireds] attribute is updated to this value. Setting this value to null
      sets `colorTemperatureMireds` to its previous value."
  - name: whitePointX
    description: "The normalized chromaticity value `x` for this primary, as defined in the CIE xyY
      Color Space, of the current white point of the device."
  - name: whitePointY
    description: "The normalized chromaticity value `y` for this primary, as defined in the CIE xyY
      Color Space, of the current white point of the device."

  # ColorControl commands
  commands:
  - name: ColorLoopSet
    description:
    - "Cycles the device through its range of hues."
    param:
    - name: updateFlags
      description: "The attributes to update before the color loop starts. See
        [ColorLoopUpdateFlags][ColorControlTrait.ColorLoopUpdateFlags] for the list of flags to
        use."
    - name: action
      description: "The action to take if
        [updateAction][ColorControlTrait.ColorLoopUpdateFlags.updateAction] is set in
        `updateFlags`. Must be a value from
        [ColorLoopActionEnum][ColorControlTrait.ColorLoopActionEnum]."
    - name: direction
      description: "The direction of the color loop if
        [updateDirection][ColorControlTrait.ColorLoopUpdateFlags.updateDirection] is set in
        `updateFlags`. Must be a value from
        [ColorLoopDirectionEnum][ColorControlTrait.ColorLoopDirectionEnum]."
    - name: time
      description: "The number of seconds over which to perform the full color loop if
        [updateTime][ColorControlTrait.ColorLoopUpdateFlags.updateTime] is set in
        `updateFlags`."
    - name: startHue
      description: "The starting hue to use if
        [updateStartHue][ColorControlTrait.ColorLoopUpdateFlags.updateStartHue] is set in
        `updateFlags`."
    - name: optionsMask
      description: "Determines which bits in the [options][ColorControlTrait.Attributes.options]
        attribute should be overridden by `optionsOverride`."
    - name: optionsOverride
      description: "If the corresponding bit in `optionsMask` is set to `1`, the bit set here
        overrides the corresponding bit in [options][ColorControlTrait.Attributes.options]
        attribute."
  - name: EnhancedMoveHue
    description:
    - "Change a device's enhanced hue based on a rate of movement."
    param:
    - name: moveMode
      description: "The direction in which to move the enhanced hue. This must be one of the values
        in [HueMoveMode][ColorControlTrait.HueMoveMode]."
    - name: rate
      description: "The rate (in steps per seconds) used to change the device's
        `enhancedCurrentHue`."
    - name: optionsMask
      description: "Determines which bits in the [options][ColorControlTrait.Attributes.options]
        attribute should be overridden by `optionsOverride`."
    - name: optionsOverride
      description: "If the corresponding bit in `optionsMask` is set to `1`, the bit set here
        overrides the corresponding bit in [options][ColorControlTrait.Attributes.options]
        attribute."
  - name: EnhancedMoveToHue
    description:
    - "Move a device from its current hue to the provided enhanced hue."
    param:
    - name: enhancedHue
      description: "The enhanced hue to be moved to. The valid range of values is `0` to `65534`."
    - name: direction
      description: "The direction in which to move the enhanced hue. This must be one of the values
        in [HueDirection][ColorControlTrait.HueDirection]."
    - name: transitionTime
      description: "The time (in 0.1 seconds) taken to move the device to the new hue."
    - name: optionsMask
      description: "Determines which bits in the [options][ColorControlTrait.Attributes.options]
        attribute should be overridden by `optionsOverride`."
    - name: optionsOverride
      description: "If the corresponding bit in `optionsMask` is set to `1`, the bit set here
        overrides the corresponding bit in [options][ColorControlTrait.Attributes.options]
        attribute."
  - name: EnhancedMoveToHueAndSaturation
    description:
    - "Move a device from its current enhanced hue and saturation to the provided enhanced hue and
        saturation."
    param:
    - name: enhancedHue
      description: "The enhanced hue to be moved to. The valid range of values is `0` to `65534`."
    - name: saturation
      description: "The saturation to be moved to. The valid range of values is `0` to `254`."
    - name: transitionTime
      description: "The time (in 0.1 seconds) taken to move the device to the new enhanced hue and
        saturation."
    - name: optionsMask
      description: "Determines which bits in the [options][ColorControlTrait.Attributes.options]
        attribute should be overridden by `optionsOverride`."
    - name: optionsOverride
      description: "If the corresponding bit in `optionsMask` is set to `1`, the bit set here
        overrides the corresponding bit in [options][ColorControlTrait.Attributes.options]
        attribute."
  - name: EnhancedStepHue
    description:
    - "Move a device's enhanced hue a specific amount over a period of time."
    param:
    - name: stepMode
      description: "The direction in which to move the enhanced hue. This must be one of the values
        in [HueStepMode][ColorControlTrait.HueStepMode]."
    - name: stepSize
      description: "The amount of units to move the device's
        [enhancedCurrentHue][ColorControlTrait.Attributes.enhancedCurrentHue] to."
    - name: transitionTime
      description: "The time (in 0.1 seconds) taken to move the device to the new enhanced hue."
    - name: optionsMask
      description: "Determines which bits in the [options][ColorControlTrait.Attributes.options]
        attribute should be overridden by `optionsOverride`."
    - name: optionsOverride
      description: "If the corresponding bit in `optionsMask` is set to `1`, the bit set here
        overrides the corresponding bit in [options][ColorControlTrait.Attributes.options]
        attribute."
  - name: MoveColor
    description:
    - "Move a device from its current color in a continuous fashion according to the rates
        specified."
    - "This command will continue to process until the target color for the next step cannot be
        implemented on the device."
    - "Setting both `rateX` and `rateY` to `0` stops any previously received command of the
        [ColorControl] cluster."
    param:
    - name: rateX
      description: "The rate of movement in steps per second. A step is a change of one unit to the
        [currentX][ColorControlTrait.Attributes.currentX] attribute."
    - name: rateY
      description: "The rate of movement in steps per second. A step is a change of one unit to the
        [currentY][ColorControlTrait.Attributes.currentY] attribute."
    - name: optionsMask
      description: "Determines which bits in the [options][ColorControlTrait.Attributes.options]
        attribute should be overridden by `optionsOverride`."
    - name: optionsOverride
      description: "If the corresponding bit in `optionsMask` is set to `1`, the bit set here
        overrides the corresponding bit in [options][ColorControlTrait.Attributes.options]
        attribute."
  - name: MoveColorTemperature
    description:
    - "Change a device's color temperature based on a rate of movement."
    param:
    - name: moveMode
      description: "The direction in which to move the color temperature. This must be one of the
        values in [HueMoveMode][ColorControlTrait.HueMoveMode]."
    - name: rate
      description: "The rate (in steps per seconds) used to change the device's
        `colorTemperatureMireds`."
    - name: colorTemperatureMinimumMireds
      description: "The lower bound of the
        [colorTemperatureMireds][ColorControlTrait.Attributes.colorTemperatureMireds] attribute
        for the command. This value must be between the `colorTempPhysicalMinMireds` and
        `colorTemperatureMireds` attributes. If this value is set to `0`,
        `colorTempPhysicalMinMireds` is used as the lower bound."
    - name: colorTemperatureMaximumMireds
      description: "The upper bound of the
        [colorTemperatureMireds][ColorControlTrait.Attributes.colorTemperatureMireds] attribute
        for the command. This value must be between the `colorTemperatureMireds` and
        `colorTempPhysicalMaxMireds` attributes. If this value is set to `0`,
        `colorTempPhysicalMaxMireds` is used as the upper bound."
    - name: optionsMask
      description: "Determines which bits in the [options][ColorControlTrait.Attributes.options]
        attribute should be overridden by `optionsOverride`."
    - name: optionsOverride
      description: "If the corresponding bit in `optionsMask` is set to `1`, the bit set here
        overrides the corresponding bit in [options][ColorControlTrait.Attributes.options]
        attribute."
  - name: MoveHue
    description:
    - "Change a device's hue based on a rate of movement."
    param:
    - name: moveMode
      description: "The direction in which to move the hue. This must be one of the values in
        [HueMoveMode][ColorControlTrait.HueMoveMode]."
    - name: rate
      description: "The rate (in steps per seconds) used to change the device's `currentHue`."
    - name: optionsMask
      description: "Determines which bits in the [options][ColorControlTrait.Attributes.options]
        attribute should be overridden by `optionsOverride`."
    - name: optionsOverride
      description: "If the corresponding bit in `optionsMask` is set to `1`, the bit set here
        overrides the corresponding bit in [options][ColorControlTrait.Attributes.options]
        attribute."
  - name: MoveSaturation
    description:
    - "Change a device's saturation based on a rate of movement."
    param:
    - name: moveMode
      description: "The direction in which to move the saturation. This must be one of the values in
        [SaturationMoveMode][ColorControlTrait.SaturationMoveMode]."
    - name: rate
      description: "The rate (in steps per seconds) used to change the device's
        `currentSaturation`."
    - name: optionsMask
      description: "Determines which bits in the [options][ColorControlTrait.Attributes.options]
        attribute should be overridden by `optionsOverride`."
    - name: optionsOverride
      description: "If the corresponding bit in `optionsMask` is set to `1`, the bit set here
        overrides the corresponding bit in [options][ColorControlTrait.Attributes.options]
        attribute."
  - name: MoveToColor
    description:
    - "Move a device from its current color to the color given in the `colorX` and `colorY`
        parameters."
    param:
    - name: colorX
      description: "The normalized chromaticity value `x`, as defined in the CIE xyY Color Space, to
        move the device's color to."
    - name: colorY
      description: "The normalized chromaticity value `y`, as defined in the CIE xyY Color Space, to
        move the device's color to."
    - name: transitionTime
      description: "The time (in 0.1 seconds) taken to move the device to the new color."
    - name: optionsMask
      description: "Determines which bits in the [options][ColorControlTrait.Attributes.options]
        attribute should be overridden by `optionsOverride`."
    - name: optionsOverride
      description: "If the corresponding bit in `optionsMask` is set to `1`, the bit set here
        overrides the corresponding bit in [options][ColorControlTrait.Attributes.options]
        attribute."
  - name: MoveToColorTemperature
    description:
    - "Move a device from its current color to a new color, using the scaled inverse of the color
        temperature, in mireds."
    param:
    - name: colorTemperatureMireds
      description: "The color temperature, in mireds, to move the device to."
    - name: transitionTime
      description: "The time (in 0.1 seconds) taken to move the device to the new color
        temperature."
    - name: optionsMask
      description: "Determines which bits in the [options][ColorControlTrait.Attributes.options]
        attribute should be overridden by `optionsOverride`."
    - name: optionsOverride
      description: "If the corresponding bit in `optionsMask` is set to `1`, the bit set here
        overrides the corresponding bit in [options][ColorControlTrait.Attributes.options]
        attribute."
  - name: MoveToHue
    description:
    - "Move a device from its current hue to the provided hue."
    param:
    - name: hue
      description: "The hue to be moved to. The valid range of values is `0` to `254`."
    - name: direction
      description: "The direction in which to move the hue. This must be one of the values in
        [HueDirection][ColorControlTrait.HueDirection]."
    - name: transitionTime
      description: "The time (in 0.1 seconds) taken to move the device to the new hue."
    - name: optionsMask
      description: "Determines which bits in the [options][ColorControlTrait.Attributes.options]
        attribute should be overridden by `optionsOverride`."
    - name: optionsOverride
      description: "If the corresponding bit in `optionsMask` is set to `1`, the bit set here
        overrides the corresponding bit in [options][ColorControlTrait.Attributes.options]
        attribute."
  - name: MoveToHueAndSaturation
    description:
    - "Move a device from its current hue and saturation to the provided hue and saturation."
    param:
    - name: hue
      description: "The hue to be moved to. The valid range of values is `0` to `254`."
    - name: saturation
      description: "The saturation to be moved to. The valid range of values is `0` to `254`."
    - name: transitionTime
      description: "The time (in 0.1 seconds) taken to move the device to the new hue and
        saturation."
    - name: optionsMask
      description: "Determines which bits in the [options][ColorControlTrait.Attributes.options]
        attribute should be overridden by `optionsOverride`."
    - name: optionsOverride
      description: "If the corresponding bit in `optionsMask` is set to `1`, the bit set here
        overrides the corresponding bit in [options][ColorControlTrait.Attributes.options]
        attribute."
  - name: MoveToSaturation
    description:
    - "Move a device from its current saturation to the provided saturation."
    param:
    - name: saturation
      description: "The saturation to be moved to. The valid range of values is `0` to `254`."
    - name: transitionTime
      description: "The time (in 0.1 seconds) taken to move the device to the new saturation."
    - name: optionsMask
      description: "Determines which bits in the [options][ColorControlTrait.Attributes.options]
        attribute should be overridden by `optionsOverride`."
    - name: optionsOverride
      description: "If the corresponding bit in `optionsMask` is set to `1`, the bit set here
        overrides the corresponding bit in [options][ColorControlTrait.Attributes.options]
        attribute."
  - name: StepColor
    description:
    - "Move a device from its current color by the specified color step."
    - "If the required step is larger than supported by the `stepX` and `stepY` parameters, use this
        command multiple times."
    param:
    - name: stepX
      description: "The change to be added to the device's
        [currentX][ColorControlTrait.Attributes.currentX] attribute."
    - name: stepY
      description: "The change to be added to the device's
        [currentY][ColorControlTrait.Attributes.currentY] attribute."
    - name: transitionTime
      description: "The time (in 0.1 seconds) taken to move the device to the new color."
    - name: optionsMask
      description: "Determines which bits in the [options][ColorControlTrait.Attributes.options]
        attribute should be overridden by `optionsOverride`."
    - name: optionsOverride
      description: "If the corresponding bit in `optionsMask` is set to `1`, the bit set here
        overrides the corresponding bit in [options][ColorControlTrait.Attributes.options]
        attribute."
  - name: StepColorTemperature
    description:
    - "Change a device's color temperature a specific amount over a period of time."
    param:
    - name: stepMode
      description: "The direction in which to move the color temperature. This must be one of the
        values in [HueStepMode][ColorControlTrait.HueStepMode]."
    - name: stepSize
      description: "The amount of units to move the device's
        [colorTemperatureMireds][ColorControlTrait.Attributes.colorTemperatureMireds] to."
    - name: transitionTime
      description: "The time (in 0.1 seconds) taken to move the device to the new color
        temperature."
    - name: colorTemperatureMinimumMireds
      description: "The lower bound of the
        [colorTemperatureMireds][ColorControlTrait.Attributes.colorTemperatureMireds] attribute
        for the command. This value must be between the `colorTempPhysicalMinMireds` and
        `colorTemperatureMireds` attributes. If this value is set to `0`,
        `colorTempPhysicalMinMireds` is used as the lower bound."
    - name: colorTemperatureMaximumMireds
      description: "The upper bound of the
        [colorTemperatureMireds][ColorControlTrait.Attributes.colorTemperatureMireds] attribute
        for the command. This value must be between the `colorTemperatureMireds` and
        `colorTempPhysicalMaxMireds` attributes. If this value is set to `0`,
        `colorTempPhysicalMaxMireds` is used as the upper bound."
    - name: optionsMask
      description: "Determines which bits in the [options][ColorControlTrait.Attributes.options]
        attribute should be overridden by `optionsOverride`."
    - name: optionsOverride
      description: "If the corresponding bit in `optionsMask` is set to `1`, the bit set here
        overrides the corresponding bit in [options][ColorControlTrait.Attributes.options]
        attribute."
  - name: StepHue
    description:
    - "Move a device's hue a specific amount over a period of time."
    param:
    - name: stepMode
      description: "The direction in which to move the hue. This must be one of the values in
        [HueStepMode][ColorControlTrait.HueStepMode]."
    - name: stepSize
      description: "The amount of units to move the device's
        [currentHue][ColorControlTrait.Attributes.currentHue] to."
    - name: transitionTime
      description: "The time (in 0.1 seconds) taken to move the device to the new hue."
    - name: optionsMask
      description: "Determines which bits in the [options][ColorControlTrait.Attributes.options]
        attribute should be overridden by `optionsOverride`."
    - name: optionsOverride
      description: "If the corresponding bit in `optionsMask` is set to `1`, the bit set here
        overrides the corresponding bit in [options][ColorControlTrait.Attributes.options]
        attribute."
  - name: StepSaturation
    description:
    - "Move a device's saturation a specific amount over a period of time."
    param:
    - name: stepMode
      description: "The direction in which to move the saturation. This must be one of the values in
        [SaturationStepMode][ColorControlTrait.SaturationStepMode]."
    - name: stepSize
      description: "The amount of units to move the device's
        [currentSaturation][ColorControlTrait.Attributes.currentSaturation] to."
    - name: transitionTime
      description: "The time (in 0.1 seconds) taken to move the device to the new saturation."
    - name: optionsMask
      description: "Determines which bits in the [options][ColorControlTrait.Attributes.options]
        attribute should be overridden by `optionsOverride`."
    - name: optionsOverride
      description: "If the corresponding bit in `optionsMask` is set to `1`, the bit set here
        overrides the corresponding bit in [options][ColorControlTrait.Attributes.options]
        attribute."
  - name: StopMoveStep
    description:
    - "Stop a `MoveTo`, Move, or Step command that is currently in process."
    - "The `currentHue`, `enhancedCurrentHue`, and `currentSaturation` attributes are left at their
        present value upon receipt of this command, and the `remainingTime` attribute is set to
        `0`."
    param:
    - name: optionsMask
      description: "Determines which bits in the [options][ColorControlTrait.Attributes.options]
        attribute should be overridden by `optionsOverride`."
    - name: optionsOverride
      description: "If the corresponding bit in `optionsMask` is set to `1`, the bit set here
        overrides the corresponding bit in [options][ColorControlTrait.Attributes.options]
        attribute."

  # ControlControl bitmaps
  bitmaps:
  - name: ColorCapabilitiesBitmap
    description: "The color capabilities that the device supports."
    value:
    - name: kColorLoop
      description: "Supports color loop."
    - name: kColorTemperature
      description: "Supports specification of color temperature."
    - name: kEnhancedHue
      description: "Supports enhanced hue."
    - name: kHueSaturation
      description: "Supports color specification via hue and saturation."
    - name: kXY
      description: "Supports color specification via XY."
  - name: ColorLoopUpdateFlags
    description: "Specifies which color loop attributes to update before a color loop from the
      [ColorLoopSet][ColorControlTrait.ColorLoopSetCommand.Request] command starts."
    value:
    - name: kUpdateAction
      description: "Whether the device adheres to the
        [action][ColorControlTrait.ColorLoopSetCommand.Request.action] parameter in order to
        process the command."
    - name: kUpdateDirection
      description: "Whether the device updates the
        [colorLoopDirection][ColorControlTrait.Attributes.colorLoopDirection] attribute with the
        [direction][ColorControlTrait.ColorLoopSetCommand.Request.direction] parameter value."
    - name: kUpdateStartHue
      description: "Whether the device updates the
        [colorLoopStartEnhancedHue][ColorControlTrait.Attributes.colorLoopStartEnhancedHue]
        attribute with the
        [startHue][ColorControlTrait.ColorLoopSetCommand.Request.startHue] parameter value."
    - name: kUpdateTime
      description: "Whether the device updates the
        [colorLoopTime][ColorControlTrait.Attributes.colorLoopTime] attribute with the
        [time][ColorControlTrait.ColorLoopSetCommand.Request.time] parameter value."
  - name: Feature
    description: "ColorControl cluster FeatureMap."
    value:
    - name: kColorLoop
      description: "Supports color loop."
    - name: kColorTemperature
      description: "Supports specification of color temperature."
    - name: kEnhancedHue
      description: "Supports enhanced hue."
    - name: kHueAndSaturation
      description: "Supports color specification via hue and saturation."
    - name: kXY
      description: "Supports color specification via XY."
  - name: UpdateFlagsBitmap
    description: "Values for `ColorLoopSet`."
    value:
    - name: kUpdateAction
      description: "Device adheres to the associated action field."
    - name: kUpdateDirection
      description: "Device updates the associated direction attribute."
    - name: kUpdateStartHue
      description: "Device updates the associated start hue attribute."
    - name: kUpdateTime
      description: "Device updates the associated time attribute."
  - name: OptionsBitmap
    description: "Options bitmap."
    value:
    - name: kExecuteIfOff
      description: "Indicates if this cluster server instance has a dependency with the On/Off
        cluster."

  # ColorControl enums
  enums:
  - name: ColorLoopActionEnum
    description: "The action to take for a color loop."
    value:
    - name: kActivateFromColorLoopStartEnhancedHue
      description: "Activate the color loop from the value in the
        [colorLoopStartEnhancedHue][ColorControlTrait.Attributes.colorLoopStartEnhancedHue]
        attribute."
    - name: kActivateFromEnhancedCurrentHue
      description: "Activate the color loop from the value in the
        [enhancedCurrentHue][ColorControlTrait.Attributes.enhancedCurrentHue] attribute."
    - name: kDeactivate
      description: "Deactivate the color loop."
  - name: ColorLoopDirectionEnum
    description: "The direction for an attribute on a circular scale."
    value:
    - name: kDecrement
      description: "Decrement."
    - name: kIncrement
      description: "Increment."
  - name: ColorMode
    description: "The attributes that determine the current color of the device. Used for the
      [colorMode][ColorControlTrait.Attributes.colorMode] attribute."
    value:
    - name: kColorTemperatureMireds
      description: "The current color is determined by the
        [colorTemperatureMireds][ColorControlTrait.Attributes.colorTemperatureMireds] attribute."
    - name: kCurrentHueAndCurrentSaturation
      description: "The current color is determined by the
        [currentHue][ColorControlTrait.Attributes.currentHue] and
        [currentSaturation][ColorControlTrait.Attributes.currentSaturation] attributes."
    - name: kCurrentXAndCurrentY
      description: "The current color is determined by the
        [currentX][ColorControlTrait.Attributes.currentX] and
        [currentY][ColorControlTrait.Attributes.currentY] attributes."
  - name: ColorModeEnum
    description: "The attributes that determine the current color of the device."
    value:
    - name: kCurrentHueAndCurrentSaturation
      description: "The current hue and saturation attributes determine the color."
    - name: kCurrentXAndCurrentY
      description: "The current X and Y attributes determine the color."
    - name: kColorTemperatureMireds
      description: "The color temperature attribute determines the color."
  - name: DirectionEnum
    description: "The direction in which to change an attribute whose values are arranged in a
      circle."
    value:
    - name: kLongest
      description: "Take the longest path to reach the target setting."
    - name: kShortest
      description: "Take the shortest path to reach the target setting."
    - name: kUp
      description: "Increase the value to reach the target setting."
    - name: kDown
      description: "Decrease the value to reach the target setting."
  - name: DriftCompensationEnum
    description: "How drift compensation is implemented."
    value:
    - name: kNone
      description: "There is no compensation."
    - name: kOtherOrUnknown
      description: "The compensation is based on other or unknown mechanism."
    - name: kTemperatureMonitoring
      description: "The compensation is based on temperature monitoring."
    - name: kOpticalLuminanceMonitoringAndFeedback
      description: "The compensation is based on optical luminance monitoring and feedback."
    - name: kOpticalColorMonitoringAndFeedback
      description: "The compensation is based on optical color monitoring and feedback."
  - name: EnhancedColorModeEnum
    description: "How enhanced color mode is specified."
    value:
    - name: kCurrentHueAndCurrentSaturation
      description: "The current hue and saturation attributes determine the color."
    - name: kCurrentXAndCurrentY
      description: "The current X and Y attributes determine the color."
    - name: kColorTemperatureMireds
      description: "The color temperature attribute determines the color."
    - name: kEnhancedCurrentHueAndCurrentSaturation
      description: "The enhanced current hue and saturation attributes determine the color."
  - name: MoveModeEnum
    description: "Move mode values."
    value:
    - name: kStop
      description: "Stop the movement."
    - name: kUp
      description: "Move in an upwards direction."
    - name: kDown
      description: "Move in a downwards direction."
  - name: StepModeEnum
    description: "The mode by which stepwise changes to the attribute are applied."
    value:
    - name: kUp
      description: "Step in an upwards direction."
    - name: kDown
      description: "Step in a downwards direction."

CommodityMetering:
  description: "The Commodity Metering Cluster provides the mechanism for communicating commodity
    consumption information within a premises."

  # CommodityMetering attributes
  attributes:
  - name: meteredQuantity
    description: "The most recent summed value of a commodity delivered to and consumed in the
      premises. A null value indicates that metering data is currently unavailable."
  - name: meteredQuantityTimestamp
    description: "The timestamp in UTC for when the value of the `MeteredQuantity` attribute was
      last updated. A null value indicates that metering data is currently unavailable."
  - name: tariffUnit
    description: "Indicates the unit for the Quantity field on all `MeteredQuantityStructs`
      in the `MeteredQuantity` attribute. A null value indicates that metering data is currently
      unavailable."
  - name: maximumMeteredQuantities
    description: "Indicates the maximum number of `MeteredQuantityStructs` in the `MeteredQuantity`
      attribute. A null value indicates that metering data is currently unavailable."

  # CommodityMetering enums
  enums:
  - name: TariffUnitEnum
    description: "Types of tariff units."
    value:
    - name: kKWh
      description: "Kilowatt-hour."
    - name: kKVAh
      description: "Kilovolt-ampere-hour."
  - name: MeasurementTypeEnum
    description: "The type of measurement."
    value:
    - name: kReactiveEnergy
      description: "Reactive energy in millivolt-amp-hours reactive (mVARh)."
    - name: kApparentEnergy
      description: "Apparent energy in millivolt-amp-hours (mVAh)."
    - name: kActiveCurrent
      description: "Active current in milliamps (mA)."
    - name: kActivePower
      description: "Active power in milliwatts (mW)."
    - name: kApparentCurrent
      description: "Apparent current in milliamps (mA)."
    - name: kApparentPower
      description: "Apparent power in millivolt-amps (mVA)."
    - name: kElectricalEnergy
      description: "Electrical energy in milliwatt-hours (mWh)."
    - name: kFrequency
      description: "AC frequency in millihertz (mHz)."
    - name: kNeutralCurrent
      description: "AC neutral current in milliamps (mA)."
    - name: kPowerFactor
      description: "Power factor ratio in +/- 1/100ths of a percent."
    - name: kReactiveCurrent
      description: "Reactive current in milliamps (mA)."
    - name: kReactivePower
      description: "Reactive power in millivolt-amps reactive (mVAR)."
    - name: kRMSCurrent
      description: "RMS current in milliamps (mA)."
    - name: kRMSPower
      description: "RMS power in milliwatts (mW)."
    - name: kRMSVoltage
      description: "RMS voltage in millivolts (mV)."
    - name: kUnspecified
      description: "Unspecified."
    - name: kVoltage
      description: "Voltage in millivolts (mV)."

  # CommodityMetering structs
  structs:
  - name: MeteredQuantityStruct
    description: "Provides access to the Electric Metering device’s readings."
    value:
    - name: tariffComponentIds
      description: "Indicates the specific `TariffComponentStructs` associated with the metered
        commodity."
    - name: quantity
      description: "This field indicates the amount of a commodity metered during the associated
        `TariffComponentStructs`."

CommodityPrice:
  description: "The Commodity Price Cluster provides the mechanism for communicating Gas, Energy,
    or Water pricing information within the premises."

  # CommodityPrice attributes
  attributes:
  - name: tariffUnit
    description: "Indicates the unit of measure for all pricing reported by this cluster."
  - name: currency
    description: "Indicates the currency for all pricing reported by this cluster."
  - name: currentPrice
    description: "Indicates the current price."
  - name: priceForecast
    description: "Indicates the forecast of upcoming price changes."

  # CommodityPrice commands
  commands:
  - name: GetDetailedPriceRequest
    description:
    - "Request detailed price information."
    param:
    - name: details
      description: "Specifies which fields to include in the response."
    response:
      description: "The detailed current price response."
      param:
      - name: currentPrice
        description: "The detailed current price."
  - name: GetDetailedForecastRequest
    description:
    - "Request detailed price forecast."
    param:
    - name: details
      description: "Specifies which fields to include in the forecast response."
    response:
      description: "The detailed price forecast response."
      param:
      - name: priceForecast
        description: "The detailed price forecast."

  # CommodityPrice bitmaps
  bitmaps:
  - name: CommodityPriceDetailBitmap
    description: "Bitmap indicating fields to include in detailed price or forecast."
    value:
    - name: kDescription
      description: "Include textual description of a price."
    - name: kComponents
      description: "Include breakdown of component parts of a price."
  - name: Feature
    description: "Commodity Price cluster FeatureMap."
    value:
    - name: kForecasting
      description: "Supports forecasting upcoming pricing."

  # CommodityPrice enums
  enums:
  - name: TariffUnitEnum
    description: "Types of tariff units."
    value:
    - name: kKWh
      description: "Kilowatt-hour."
    - name: kKVAh
      description: "Kilovolt-ampere-hour."
  - name: TariffPriceTypeEnum
    description: "Types of tariff prices."
    value:
    - name: kStandard
      description: "Standard price."
    - name: kCritical
      description: "Indicates a price comes from a critical peak pricing event."
    - name: kVirtual
      description: "Indicates a price comes from a virtual power plant event."
    - name: kIncentive
      description: "Indicates a price comes from an incentive event."
    - name: kIncentiveSignal
      description: "Indicates that a price is synthesized from a non-tariff source; e.g. gCO2e/kWh."

  # CommodityPrice events
  events:
  - name: PriceChange
    description: "Generated when the current price changes."
    value:
    - name: currentPrice
      description: "The new value of the `CurrentPrice` attribute."

  # CommodityPrice structs
  structs:
  - name: CurrencyStruct
    description: "Currency information."
    value:
    - name: currency
      description: "ISO 4217 currency code."
    - name: decimalPoints
      description: "Number of decimal places."
  - name: CommodityPriceComponentStruct
    description: "Represents a component of a given price."
    value:
    - name: price
      description: "The component price of the commodity per `TariffUnit`."
    - name: source
      description: "The source of the price component."
    - name: description
      description: "A description of the pricing plan."
    - name: tariffComponentID
      description: "The ID of the associated `TariffComponent`."
  - name: CommodityPriceStruct
    description: "Represents a price over a given period."
    value:
    - name: periodStart
      description: "The beginning timestamp in UTC of the period covered by the price."
    - name: periodEnd
      description: "The ending timestamp in UTC of the period covered by the price."
    - name: price
      description: "The price of the commodity per `TariffUnit`."
    - name: priceLevel
      description: "The tariff price level."
    - name: description
      description: "A description of the pricing plan."
    - name: components
      description: "A list of the components that comprise the price."

CommodityTariff:
  description: "The Commodity Tariff Cluster provides the mechanism for communicating Commodity
    Tariff information within the premises."

  # CommodityTariff attributes
  attributes:
  - name: tariffInfo
    description: "Indicates basic information about the tariff."
  - name: tariffUnit
    description: "Indicates the unit of the commodity for pricing."
  - name: startDate
    description: "Indicates a timestamp in UTC to denote the time at which the published calendar
      becomes active."
  - name: dayEntries
    description: "Indicates the list of `DayEntryStructs` included in this calendar."
  - name: dayPatterns
    description: "Indicates the list of `DayPatternStructs` used in the `CalendarPeriodStruct` in
      this calendar."
  - name: calendarPeriods
    description: "Indicates the list of `CalendarPeriodStructs` comprising this calendar."
  - name: individualDays
    description: "Indicates the list of days to overlay on this calendar."
  - name: currentDay
    description: "Indicates the current day’s day entries."
  - name: nextDay
    description: "Indicates the next day’s day entries."
  - name: currentDayEntry
    description: "Indicates the currently active `DayEntryStruct`."
  - name: currentDayEntryDate
    description: "Indicates the UTC date when the `CurrentDay`, `CurrentDayEntry`, and
      `CurrentTariffComponents` attributes were last updated."
  - name: nextDayEntry
    description: "Indicates the predicted next active `DayEntryStruct`."
  - name: nextDayEntryDate
    description: "Indicates the predicted UTC date when attributes will update to next values."
  - name: tariffComponents
    description: "Indicates a list of `TariffComponentStructs` for the tariff."
  - name: tariffPeriods
    description: "Indicates a list of `TariffPeriodStructs` for the tariff."
  - name: currentTariffComponents
    description: "Indicates a list of the currently active `TariffComponentStructs`."
  - name: nextTariffComponents
    description: "Indicates the predicted next active `TariffComponentStructs`."
  - name: defaultRandomizationOffset
    description: "Indicates a default randomization offset for `DayEntryStructs` in this tariff."
  - name: defaultRandomizationType
    description: "Indicates a default randomization type for `DayEntryStruct` in this tariff."

  # CommodityTariff commands
  commands:
  - name: GetTariffComponent
    description:
    - "Request information for a tariff component identifier."
    param:
    - name: tariffComponentID
      description: "The `TariffComponentID` of the component to be returned."
    response:
      description: "The tariff component information response."
      param:
      - name: label
        description: "A free-form label for the tariff period."
      - name: dayEntryIDs
        description: "A list of `DayEntryIDs` for the `DayEntryStructs` during which the tariff
          component is active."
      - name: tariffComponent
        description: "The `TariffComponentStruct` matching the requested ID."
  - name: GetDayEntry
    description:
    - "Request information for a calendar day entry identifier."
    param:
    - name: dayEntryID
      description: "The `DayEntryID` of the `DayEntryStruct` to be returned."
    response:
      description: "The day entry information response."
      param:
      - name: dayEntry
        description: "The `DayEntryStruct` matching the requested ID."

  # CommodityTariff bitmaps
  bitmaps:
  - name: DayPatternDayOfWeekBitmap
    description: "Bitmap indicating days of the week."
    value:
    - name: kSunday
      description: "Sunday."
    - name: kMonday
      description: "Monday."
    - name: kTuesday
      description: "Tuesday."
    - name: kWednesday
      description: "Wednesday."
    - name: kThursday
      description: "Thursday."
    - name: kFriday
      description: "Friday."
    - name: kSaturday
      description: "Saturday."
  - name: Feature
    description: "Commodity Tariff cluster FeatureMap."
    value:
    - name: kPricing
      description: "Supports information about commodity pricing."
    - name: kFriendlyCredit
      description: "Supports information about friendly credit periods."
    - name: kAuxiliaryLoad
      description: "Supports information about auxiliary loads."
    - name: kPeakPeriod
      description: "Supports information about peak periods."
    - name: kPowerThreshold
      description: "Supports information about power threshold."
    - name: kRandomization
      description: "Supports information about randomization of calendar day entries."

  # CommodityTariff enums
  enums:
  - name: PowerThresholdSourceEnum
    description: "Sources of power threshold."
    value:
    - name: kContract
      description: "Indicates the power threshold comes from a signed contract."
    - name: kRegulator
      description: "Indicates the power threshold comes from a legal regulator."
    - name: kEquipment
      description: "Indicates the power threshold comes from a certified limits of the meter."
  - name: TariffUnitEnum
    description: "Types of tariff units."
    value:
    - name: kKWh
      description: "Kilowatt-hour."
    - name: kKVAh
      description: "Kilovolt-ampere-hour."
  - name: TariffPriceTypeEnum
    description: "Types of tariff prices."
    value:
    - name: kStandard
      description: "Standard price."
    - name: kCritical
      description: "Indicates a price comes from a critical peak pricing event."
    - name: kVirtual
      description: "Indicates a price comes from a virtual power plant event."
    - name: kIncentive
      description: "Indicates a price comes from an incentive event."
    - name: kIncentiveSignal
      description: "Indicates that a price is synthesized from a non-tariff source; e.g. gCO2e/kWh."
  - name: AuxiliaryLoadSettingEnum
    description: "Indicates the required state of an auxiliary switch."
    value:
    - name: kOff
      description: "The switch should be in the OFF state."
    - name: kOn
      description: "The switch should be in the ON state."
    - name: kNone
      description: "No state is required."
  - name: DayTypeEnum
    description: "Types of days."
    value:
    - name: kStandard
      description: "Standard day."
    - name: kHoliday
      description: "Holiday."
    - name: kDynamic
      description: "Dynamic pricing day."
    - name: kEvent
      description: "Individual events day."
  - name: PeakPeriodSeverityEnum
    description: "Severity of the peak period."
    value:
    - name: kUnused
      description: "Unused."
    - name: kLow
      description: "Low severity."
    - name: kMedium
      description: "Medium severity."
    - name: kHigh
      description: "High severity."
  - name: DayEntryRandomizationTypeEnum
    description: "Types of randomization applied to day entries."
    value:
    - name: kNone
      description: "No randomization applied."
    - name: kFixed
      description: "An unchanging offset."
    - name: kRandom
      description: "A random value."
    - name: kRandomPositive
      description: "A random positive value."
    - name: kRandomNegative
      description: "A random negative value."
  - name: BlockModeEnum
    description: "Modes for metering blocks of usage."
    value:
    - name: kNoBlock
      description: "Tariff has no usage blocks."
    - name: kCombined
      description: "Usage is metered in combined blocks."
    - name: kIndividual
      description: "Usage is metered separately by tariff component."

  # CommodityTariff structs
  structs:
  - name: PowerThresholdStruct
    description: "Represents information about a power threshold."
    value:
    - name: powerThreshold
      description: "Indicates the instantaneous power demand that can be distributed to the customer
        without any risk of overload in mW provided by the contract or Distribution Network
        Operator."
    - name: apparentPowerThreshold
      description: "Indicates the instantaneous apparent power demand that can be distributed to the
        customer without any risk of overload in mW provided by the contract or Distribution Network
        Operator."
    - name: powerThresholdSource
      description: "Indicates the reason why the power threshold is set."
  - name: CurrencyStruct
    description: "Currency information."
    value:
    - name: currency
      description: "ISO 4217 currency code."
    - name: decimalPoints
      description: "Number of decimal places."
  - name: PeakPeriodStruct
    description: "Represents a peak period."
    value:
    - name: severity
      description: "Severity of the peak period."
    - name: peakPeriod
      description: "Peak period number."
  - name: AuxiliaryLoadSwitchSettingsStruct
    description: "Settings for a given auxiliary load switch."
    value:
    - name: number
      description: "Switch number."
    - name: requiredState
      description: "Required state of the switch."
  - name: TariffPriceStruct
    description: "Indicates a price or price level for a tariff component."
    value:
    - name: priceType
      description: "Type of price."
    - name: price
      description: "The tariff price."
    - name: priceLevel
      description: "The tariff price level."
  - name: TariffComponentStruct
    description: "Represents components of a tariff."
    value:
    - name: tariffComponentID
      description: "Identifier for the tariff component."
    - name: price
      description: "Price when the tariff component is active."
    - name: friendlyCredit
      description: "Indicates whether entering a friendly credit period."
    - name: auxiliaryLoad
      description: "Required state of auxiliary load switches."
    - name: peakPeriod
      description: "Indicates if the component represents a peak period."
    - name: powerThreshold
      description: "Indicates if the component represents a power threshold."
    - name: threshold
      description: "Maximum level of consumption this component applies to."
    - name: label
      description: "A free-form label for the component."
    - name: predicted
      description: "Indicates whether the component represents a price prediction."
  - name: TariffPeriodStruct
    description: "Represents the tariff components in effect for a set of day entries."
    value:
    - name: label
      description: "A free-form label for the tariff period."
    - name: dayEntryIDs
      description: "List of `DayEntryIDs` during which the components are active."
    - name: tariffComponentIds
      description: "List of `TariffComponentIds` active during the specified day entries."
  - name: CalendarPeriodStruct
    description: "Represents a sub period of a calendar."
    value:
    - name: startDate
      description: "Timestamp when the calendar period becomes active."
    - name: dayPatternIDs
      description: "List of `DayPatternIDs` in use during this period."
  - name: DayEntryStruct
    description: "Represents a day entry at a particular time of day."
    value:
    - name: dayEntryID
      description: "Identifier for the day entry."
    - name: startTime
      description: "Start time expressed as minutes elapsed since midnight."
    - name: duration
      description: "Duration of the day entry in minutes."
    - name: randomizationOffset
      description: "Randomization offset in seconds."
    - name: randomizationType
      description: "Randomization type for the day entry."
  - name: DayStruct
    description: "Represents a series of day entries for a specific date."
    value:
    - name: date
      description: "Indicates the date the associated set of `DayEntryStructs` applies to."
    - name: dayType
      description: "Indicates the type of day represented by the struct."
    - name: dayEntryIDs
      description: "Indicates the list of `DayEntryIDs` to apply during the date."
  - name: DayPatternStruct
    description: "Represents a series of day entries for a given set of days of the week."
    value:
    - name: dayPatternID
      description: "Identifier for the day pattern."
    - name: daysOfWeek
      description: "Days of the week the associated set applies to."
    - name: dayEntryIDs
      description: "List of `DayEntryIDs` to apply during these days."
  - name: TariffInformationStruct
    description: "Represents tariff price information."
    value:
    - name: tariffLabel
      description: "Indicates a label for the tariff."
    - name: providerName
      description: "Indicates the name of the tariff provider."
    - name: currency
      description: "Indicates the currency of the tariff."
    - name: blockMode
      description: "Indicates the mode for metering blocks of usage."

ConfigurationDone:
  description: "This trait provides a means for an application to track whether it has
    completed uploading the initial configuration settings."

  # ConfigurationDone attributes
  attributes:
  - name: appConfigurationComplete
    description: "Indicates whether the initial configuration has been successfully uploaded."
  - name: deviceReady
    description: "Indicates whether the device is ready for use."

ContentAppObserver:
  description: "This trait provides an interface for sending targeted commands to an Observer of a
    content app on a Video Player device such as a Streaming Media Player, Smart TV, or Smart
    Screen."

  # ContentAppObserver commands
  commands:
  - name: ContentAppMessage
    description:
    - "Send a message to the content app."
    param:
    - name: data
      description: "Content app-specific data."
    - name: encodingHint
      description: "A content app-specific hint as to the encoding of the data."
    response:
      description: "The result of the `ContentAppMessage` command."
      param:
      - name: data
        description: "Content app-specific data."
      - name: encodingHint
        description: "A content app-specific hint as to the encoding of the data."
      - name: status
        description: "The status of the command which resulted in this response."

  # ContentAppObserver enums
  enums:
  - name: StatusEnum
    description: "The status of the `ContentAppMessage`."
    value:
    - name: kSuccess
      description: "The command succeeded."
    - name: kUnexpectedData
      description: "The data field in the command was not understood by the Observer."

ContentControl:
  description: "This trait provides an interface for managing the content control, including
    parental control settings, on a media device such as a TV, or set-top box."

  # ContentControl attributes
  attributes:
  - name: enabled
    description: "If set to `true`, the content control for this device is turned on."
  - name: onDemandRatings
    description: "A list of ratings for on demand content currently valid for the media device,
      based on the rating system for the country or region where the media device was provisioned."
  - name: onDemandRatingThreshold
    description: "A threshold rating used as a content filter for on demand content. Playback is
      prevented if the content's rating exceeds or meets the threshold."
  - name: scheduledContentRatings
    description: "A list of ratings for scheduled content currently valid for the media device,
      based on the rating system for the country or region where the media device was provisioned."
  - name: scheduledContentRatingThreshold
    description: "A threshold rating used as a content filter for scheduled content. Playback is
      prevented if the content's rating exceeds or meets the threshold."
  - name: screenDailyTime
    description: "The total amount of time (in seconds) that a user is allowed to
      spend watching TV within a single day."
  - name: remainingScreenTime
    description: "The total amount of time (in seconds) remaining that a user is
      allowed to spend watching TV within a single day."
  - name: blockUnrated
    description: "If set to `true`, the playback of unrated content is blocked."
  - name: blockChannelList
    description: "The list of channels that are blocked."
  - name: blockApplicationList
    description: "The list of applications that are blocked."
  - name: blockContentTimeWindow
    description: "The list of periods of time in which all playback of content is blocked."

  # ContentControl commands
  commands:
  - name: UpdatePin
    description:
    - "Update the PIN used for protecting the configuration of the content control settings."
    param:
    - name: oldPin
      description: "The original PIN."
    - name: newPin
      description: "The new PIN."
  - name: ResetPin
    description:
    - "Reset the PIN used for protecting the configuration of the content control settings."
    response:
      description: "Contains the new PIN."
      param:
      - name: pinCode
        description: "The new PIN."
  - name: Enable
    description:
    - "Turn on the content control feature of the media device."
  - name: Disable
    description:
    - "Turn off the content control feature of the media device."
  - name: AddBonusTime
    description:
    - "Add extra screen time for the user."
    param:
    - name: bonusTime
      description: "The extra time (in seconds) to increase
        [remainingScreenTime][ContentControlTrait.Attributes.remainingScreenTime]."
    - name: pinCode
      description: "The PIN code used to gain access to this command."
  - name: SetScreenDailyTime
    description:
    - "Set the [screenDailyTime][ContentControlTrait.Attributes.screenDailyTime] attribute."
    param:
    - name: screenTime
      description: "The time (in seconds) which the user is allowed to spend watching TV on this
        media device within one day."
  - name: BlockUnratedContent
    description:
    - "Block programs with no content rating."
  - name: UnblockUnratedContent
    description:
    - "Unblock programs with no content rating."
  - name: SetOnDemandRatingThreshold
    description:
    - "Set the [onDemandRatingThreshold][ContentControlTrait.Attributes.onDemandRatingThreshold]
      attribute."
    param:
    - name: rating
      description: "The threshold rating for filtering on demand content."
  - name: SetScheduledContentRatingThreshold
    description:
    - "Set the
      [scheduledContentRatingThreshold][ContentControlTrait.Attributes.scheduledContentRatingThreshold]
      attribute."
    param:
    - name: rating
      description: "The threshold rating for filtering scheduled content."
  - name: AddBlockChannels
    description:
    - "Set the [blockChannelList][ContentControlTrait.Attributes.blockChannelList] attribute."
    param:
    - name: channels
      description: "The list of channels to block."
  - name: RemoveBlockChannels
    description:
    - "Remove channels from the [blockChannelList][ContentControlTrait.Attributes.blockChannelList]
      attribute."
    param:
    - name: channelIndexes
      description: "The list of channel indexes to unblock."
  - name: AddBlockApplications
    description:
    - "Add applications to the
      [blockApplicationList][ContentControlTrait.Attributes.blockApplicationList] attribute."
    param:
    - name: applications
      description: "The list of applications to add."
  - name: RemoveBlockApplications
    description:
    - "Remove applications from the
      [blockApplicationList][ContentControlTrait.Attributes.blockApplicationList] attribute."
    param:
    - name: applications
      description: "The list of applications to remove."
  - name: SetBlockContentTimeWindow
    description:
    - "Set the
      [blockContentTimeWindow][ContentControlTrait.Attributes.blockContentTimeWindow] attribute."
    param:
    - name: timeWindowIndex
      description: "The unique index of a specific time window."
    - name: dayOfWeek
      description: "A day of the week. Valid values are defined in
        [ContentControlTrait.DayOfWeekBitmap]."
    - name: timePeriod
      description: "A list of time periods to block."
  - name: RemoveBlockContentTimeWindow
    description:
    - "Remove the selected time windows from the
      [blockContentTimeWindow][ContentControlTrait.Attributes.blockContentTimeWindow] attribute."
    param:
    - name: timeWindowIndexes
      description: "A list of time window indexes indicating which time windows will be removed."

  # ContentControl bitmaps
  bitmaps:
  - name: Feature
    description: "ContentControl cluster FeatureMap."
    value:
    - name: kScreenTime
      description: "Supports managing screen time limits."
    - name: kPinManagement
      description: "Supports managing a PIN code which is used for restricting access to the
        configuration of this feature."
    - name: kBlockUnrated
      description: "Supports managing content controls for unrated content."
    - name: kOnDemandContentRating
      description: "Supports managing content controls based on the rating threshold for on demand
        content."
    - name: kScheduledContentRating
      description: "Supports managing content controls based on the rating threshold for scheduled
        content."
  - name: DayOfWeekBitmap
    description: "The days of the week."
    value:
    - name: kSunday
      description: "Sunday."
    - name: kMonday
      description: "Monday."
    - name: kTuesday
      description: "Tuesday."
    - name: kWednesday
      description: "Wednesday."
    - name: kThursday
      description: "Thursday."
    - name: kFriday
      description: "Friday."
    - name: kSaturday
      description: "Saturday."

  # ContentControl enums
  enums:
  - name: StatusCodeEnum
    description: "The status code of the command."
    value:
    - name: kInvalidPINCode
      description: "Provided PIN code does not match the current PIN code."
    - name: kInvalidRating
      description: "Provided rating is out of scope of the corresponding rating list."
    - name: kInvalidChannel
      description: "Provided channel is invalid."
    - name: kChannelAlreadyExist
      description: "Provided channel already exists."
    - name: kChannelNotExist
      description: "Provided channel doesn't exist in the
        [blockChannelList][ContentControlTrait.Attributes.blockChannelList] attribute."
    - name: kUnidentifiableApplication
      description: "Provided application is not identified."
    - name: kApplicationAlreadyExist
      description: "Provided application already exists."
    - name: kApplicationNotExist
      description: "Provided application doesn't exist in
        [blockApplicationList][ContentControlTrait.Attributes.blockApplicationList] attribute."
    - name: kTimeWindowAlreadyExist
      description: "Provided time window already exists in the
        [blockContentTimeWindow][ContentControlTrait.Attributes.blockContentTimeWindow] attribute."
    - name: kTimeWindowNotExist
      description: "Provided time window doesn't exist in the
        [blockContentTimeWindow][ContentControlTrait.Attributes.blockContentTimeWindow] attribute."

  # ContentControl structs
  structs:
  - name: RatingNameStruct
    description: "A rating name."
    value:
    - name: ratingName
      description: "The name of the rating level of the applied rating system for the region or
        country where the device has been provisioned."
    - name: ratingNameDesc
      description: "The human-readable, displayed description for the rating."

  # ContentControl events
  events:
  - name: RemainingScreenTimeExpired
    description: "Indicates that the
      [remainingScreenTime][ContentControlTrait.Attributes.remainingScreenTime] attribute equals 0."

Cook:
  description: "This trait belongs to devices that can cook food according to various food presets
    and supported cooking modes."

  # Cook attributes
  attributes:
  - name: supportedCookingModes
    description: "Cooking modes supported by this device. Valid values are defined in
      [CookingMode][CookTrait.CookingMode]."
  - name: foodPresets
    description: "Presets for certain types of food."
  - name: currentCookingMode
    description: "The current cooking mode set on the device."
  - name: currentFoodPreset
    description: "The current food cooking in the device."
  - name: currentFoodQuantity
    description: "Defines the current amount of food cooking using [currentFoodUnit]."
  - name: currentFoodUnit
    description: "The unit associated with the `currentFoodQuantity`. Valid values are defined in
      [Unit][CookTrait.Unit]."

  # Cook commands
  commands:
  - name: Cook
    description:
    - "Start or stop cooking."
    param:
    - name: start
      description: "If set to `true`, start cooking, if `false`, stop current cooking mode."
    - name: cookingMode
      description: "Cooking mode for the device, as indicated by the
        [currentCookingMode][CookTrait.Attributes.currentCookingMode] attribute."
    - name: foodPreset
      description: "The food preset requested by the user, as indicated by the
        [currentFoodPreset][CookTrait.Attributes.currentFoodPreset] attribute."
    - name: quantity
      description: "Quantity of the food requested by the user."
    - name: unit
      description: "Unit associated with the quantity, as indicated by the
        [currentFoodUnit][CookTrait.Attributes.currentFoodUnit] attribute."

